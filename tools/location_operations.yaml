category: location_operations

tools:
  - name: geocode_address
    descriptions:
      minimal: "Geocode address"
      short: "Convert an address to coordinates"
      medium: "Convert a street address to geographic coordinates (latitude and longitude)."
      long: "Geocode an address to get its latitude and longitude coordinates. Also returns structured address components. Example: geocode_address(address='1600 Amphitheatre Parkway, Mountain View, CA')."
      verbose: "Convert a human-readable address to geographic coordinates using geocoding. Returns: latitude, longitude, formatted address, and structured components (street, city, state, country, postal code). Supports partial addresses and place names. Example: geocode_address(address='Eiffel Tower, Paris', language='en', region_bias='fr') returns {\"lat\": 48.8584, \"lng\": 2.2945, \"formatted\": \"Eiffel Tower, Paris, France\", ...}. Note: Ambiguous addresses may return multiple results. Warning: Geocoding accuracy varies by region and address specificity."
    parameters:
      - name: address
        type: string
        description: "Address or place name to geocode"
        required: true
      - name: language
        type: string
        description: "Response language code"
        required: false
        default: "en"
      - name: region_bias
        type: string
        description: "Country code to bias results"
        required: false
      - name: bounds
        type: string
        description: "Lat/lng bounds to bias results"
        required: false
    tags: ["location", "geocode", "address", "coordinates", "maps"]
    test_prompts:
      single:
        - "Get the coordinates for 123 Main Street"
        - "What's the latitude and longitude of the Eiffel Tower?"
        - "Geocode this address"
        - "Convert the address to GPS coordinates"

  - name: reverse_geocode
    descriptions:
      minimal: "Reverse geocode"
      short: "Convert coordinates to an address"
      medium: "Convert latitude and longitude coordinates to a human-readable street address."
      long: "Reverse geocode coordinates to get the address at that location. Returns formatted address and components. Example: reverse_geocode(latitude=40.7128, longitude=-74.0060)."
      verbose: "Convert geographic coordinates to a human-readable address using reverse geocoding. Returns: formatted address, street address, city, state, country, postal code, and place name if applicable. Multiple result types available (street address, neighborhood, city, etc.). Example: reverse_geocode(latitude=51.5074, longitude=-0.1278, result_type='street_address', language='en') returns the address at those coordinates in London. Note: Coordinates in oceans or uninhabited areas may return limited results. Warning: Very precise coordinates are needed for accurate street-level results."
    parameters:
      - name: latitude
        type: number
        description: "Latitude coordinate"
        required: true
      - name: longitude
        type: number
        description: "Longitude coordinate"
        required: true
      - name: language
        type: string
        description: "Response language code"
        required: false
        default: "en"
      - name: result_type
        type: string
        description: "Type of result to return"
        required: false
        enum: ["street_address", "neighborhood", "city", "country", "any"]
    tags: ["location", "geocode", "reverse", "coordinates", "address"]
    test_prompts:
      single:
        - "What address is at these coordinates?"
        - "Convert latitude 40.7128, longitude -74.0060 to an address"
        - "Reverse geocode this location"
        - "Find the address at this GPS position"

  - name: calculate_distance
    descriptions:
      minimal: "Calculate distance"
      short: "Calculate distance between two points"
      medium: "Calculate the distance between two geographic points, optionally using road distance."
      long: "Calculate distance between two locations. Supports straight-line and driving distance. Returns distance in various units. Example: calculate_distance(origin='New York, NY', destination='Los Angeles, CA', mode='driving')."
      verbose: "Calculate the distance between two geographic points. Methods: 'straight_line' (haversine formula), 'driving' (road distance), 'walking', 'cycling', 'transit'. Returns distance in specified units with travel time for route-based methods. Example: calculate_distance(origin='San Francisco, CA', destination='Los Angeles, CA', mode='driving', units='miles', avoid=['tolls', 'highways']) returns {\"distance\": 382.5, \"duration_minutes\": 360, ...}. Note: Route-based distances require valid road networks. Warning: Traffic conditions affect duration estimates for driving mode."
    parameters:
      - name: origin
        type: string
        description: "Starting location (address or lat,lng)"
        required: true
      - name: destination
        type: string
        description: "Ending location (address or lat,lng)"
        required: true
      - name: mode
        type: string
        description: "Travel mode"
        required: false
        default: "driving"
        enum: ["straight_line", "driving", "walking", "cycling", "transit"]
      - name: units
        type: string
        description: "Distance units"
        required: false
        default: "kilometers"
        enum: ["kilometers", "miles", "meters"]
      - name: avoid
        type: array
        description: "Route features to avoid"
        required: false
    tags: ["location", "distance", "travel", "route", "maps"]
    test_prompts:
      single:
        - "How far is it from New York to Boston?"
        - "Calculate the driving distance between the two addresses"
        - "What's the distance between these coordinates?"
        - "How long would it take to drive from A to B?"

  - name: get_directions
    descriptions:
      minimal: "Get directions"
      short: "Get turn-by-turn directions between locations"
      medium: "Get detailed turn-by-turn directions between two or more locations with estimated time."
      long: "Get step-by-step directions between locations. Supports multiple waypoints and various travel modes. Example: get_directions(origin='Times Square, NY', destination='Central Park, NY', mode='walking')."
      verbose: "Get detailed turn-by-turn navigation directions between locations. Supports: multiple waypoints, alternative routes, departure/arrival time optimization, avoid options (tolls, highways, ferries). Returns: route overview, step-by-step instructions, distance, duration, and polyline for map display. Example: get_directions(origin='JFK Airport', destination='Manhattan, NY', waypoints=['Brooklyn Bridge'], mode='driving', departure_time='now', alternatives=true) returns multiple route options. Note: Transit directions include specific line/stop information. Warning: Real-time traffic requires departure_time='now'."
    parameters:
      - name: origin
        type: string
        description: "Starting location"
        required: true
      - name: destination
        type: string
        description: "Final destination"
        required: true
      - name: waypoints
        type: array
        description: "Intermediate stops"
        required: false
      - name: mode
        type: string
        description: "Travel mode"
        required: false
        default: "driving"
        enum: ["driving", "walking", "cycling", "transit"]
      - name: departure_time
        type: string
        description: "Departure time (ISO or 'now')"
        required: false
      - name: alternatives
        type: boolean
        description: "Return alternative routes"
        required: false
        default: false
      - name: avoid
        type: array
        description: "Features to avoid"
        required: false
    tags: ["location", "directions", "navigation", "route", "maps"]
    test_prompts:
      single:
        - "Get directions from the office to the airport"
        - "How do I get to Central Park from here?"
        - "Give me walking directions to the restaurant"
        - "Navigate from A to B via C"

  - name: search_places
    descriptions:
      minimal: "Search places"
      short: "Search for nearby places"
      medium: "Search for places like restaurants, hotels, or stores near a location or within an area."
      long: "Search for places by type or query near a location. Returns matching places with ratings and details. Example: search_places(query='coffee shops', location='Seattle, WA', radius=1000)."
      verbose: "Search for places of interest near a location or within an area. Search by: keyword query, place type (restaurant, hospital, park, etc.), or both. Returns: place name, address, coordinates, rating, price level, opening hours, photos, and place ID for details. Example: search_places(query='pizza', location='40.7128,-74.0060', radius=2000, type='restaurant', open_now=true, min_rating=4.0) returns highly-rated open pizza restaurants. Note: Maximum radius is typically 50km. Warning: Results are ranked by prominence; not all matching places may appear."
    parameters:
      - name: query
        type: string
        description: "Search query"
        required: false
      - name: location
        type: string
        description: "Center point (address or lat,lng)"
        required: true
      - name: radius
        type: integer
        description: "Search radius in meters"
        required: false
        default: 5000
      - name: type
        type: string
        description: "Place type filter"
        required: false
      - name: open_now
        type: boolean
        description: "Only return open places"
        required: false
        default: false
      - name: min_rating
        type: number
        description: "Minimum rating filter"
        required: false
    tags: ["location", "search", "places", "poi", "nearby"]
    test_prompts:
      single:
        - "Find coffee shops near me"
        - "Search for restaurants in the area"
        - "What hotels are near the airport?"
        - "Find pharmacies within 1km"

  - name: get_place_details
    descriptions:
      minimal: "Get place details"
      short: "Get detailed information about a place"
      medium: "Get comprehensive details about a specific place including reviews, hours, and contact info."
      long: "Get detailed information about a place using its place ID. Returns contact info, hours, reviews, and more. Example: get_place_details(place_id='ChIJN1t_tDeuEmsRUsoyG83frY4')."
      verbose: "Retrieve comprehensive information about a specific place. Returns: name, formatted address, phone number, website, opening hours (with special hours), reviews and ratings, photos, price level, attributes (wheelchair accessible, etc.), Google Maps URL, and UTC offset. Example: get_place_details(place_id='ChIJabc123', fields=['name', 'rating', 'reviews', 'opening_hours', 'website', 'photos'], reviews_sort='newest') returns all specified details. Note: Some fields may not be available for all places. Warning: Reviews content is user-generated and unmoderated."
    parameters:
      - name: place_id
        type: string
        description: "Unique place identifier"
        required: true
      - name: fields
        type: array
        description: "Fields to return"
        required: false
      - name: reviews_sort
        type: string
        description: "Review sort order"
        required: false
        enum: ["most_relevant", "newest"]
      - name: language
        type: string
        description: "Response language"
        required: false
        default: "en"
    tags: ["location", "place", "details", "info", "reviews"]
    test_prompts:
      single:
        - "Get details about this restaurant"
        - "What are the opening hours?"
        - "Show reviews for the hotel"
        - "Get contact info for the business"

  - name: get_timezone
    descriptions:
      minimal: "Get timezone"
      short: "Get timezone for a location"
      medium: "Get the timezone and current local time for a specific location or coordinates."
      long: "Get timezone information for a location. Returns timezone ID, name, and current offset. Example: get_timezone(location='Tokyo, Japan')."
      verbose: "Get timezone information for a geographic location. Returns: timezone ID (e.g., 'America/New_York'), timezone name, UTC offset (including daylight saving), current local time, and DST status. Can query for specific timestamp to get historical offset. Example: get_timezone(latitude=35.6762, longitude=139.6503, timestamp='2024-06-15T12:00:00Z') returns Tokyo timezone info with DST status for that date. Note: Some locations have complex timezone rules. Warning: Historical timezone data may not be accurate for all dates."
    parameters:
      - name: location
        type: string
        description: "Location name or address"
        required: false
      - name: latitude
        type: number
        description: "Latitude coordinate"
        required: false
      - name: longitude
        type: number
        description: "Longitude coordinate"
        required: false
      - name: timestamp
        type: string
        description: "Timestamp for offset calculation"
        required: false
    tags: ["location", "timezone", "time", "utc", "offset"]
    test_prompts:
      single:
        - "What timezone is New York in?"
        - "Get the timezone for these coordinates"
        - "What's the UTC offset for London?"
        - "Is Tokyo currently in daylight saving time?"

  - name: get_elevation
    descriptions:
      minimal: "Get elevation"
      short: "Get elevation for coordinates"
      medium: "Get the elevation above sea level for one or more geographic coordinates."
      long: "Get elevation data for locations. Supports single point or path of points. Returns elevation in meters. Example: get_elevation(locations='40.7128,-74.0060')."
      verbose: "Get elevation above sea level for geographic coordinates. Supports: single location, multiple locations, or path sampling (elevation profile along a route). Returns elevation in meters with resolution indicating data accuracy. Example: get_elevation(locations=['48.8584,2.2945', '51.5074,-0.1278'], resolution='high') returns elevation for Eiffel Tower and London with accuracy info. Note: Ocean locations return negative elevations or null. Warning: Resolution varies by location; remote areas may have lower accuracy."
    parameters:
      - name: locations
        type: string
        description: "Coordinates (lat,lng or array)"
        required: true
      - name: path
        type: boolean
        description: "Treat as path and sample elevations"
        required: false
        default: false
      - name: samples
        type: integer
        description: "Number of samples along path"
        required: false
        default: 100
      - name: resolution
        type: string
        description: "Data resolution preference"
        required: false
        enum: ["low", "medium", "high"]
    tags: ["location", "elevation", "altitude", "terrain", "geography"]
    test_prompts:
      single:
        - "What's the elevation at these coordinates?"
        - "Get the altitude of Mount Everest base camp"
        - "Find the elevation profile along this route"
        - "How high is this location above sea level?"

  - name: validate_address
    descriptions:
      minimal: "Validate address"
      short: "Validate and standardize an address"
      medium: "Validate an address exists and return the standardized, properly formatted version."
      long: "Validate and standardize an address. Checks if address is real and returns corrected/formatted version. Example: validate_address(address='123 Main St, NYC')."
      verbose: "Validate that an address exists and is deliverable, with standardization to postal service formats. Returns: validation status, standardized address, parsed components, delivery point validation (for US), and suggested corrections for partial matches. Example: validate_address(address='123 Main Street Apt 4B, New York, NY', country='US', include_parsed=true) returns {\"valid\": true, \"standardized\": \"123 MAIN ST APT 4B, NEW YORK, NY 10001-1234\", \"components\": {...}}. Note: Validation depth varies by country. Warning: Valid address doesn't guarantee current occupancy."
    parameters:
      - name: address
        type: string
        description: "Address to validate"
        required: true
      - name: country
        type: string
        description: "Country code (ISO 3166-1)"
        required: false
      - name: include_parsed
        type: boolean
        description: "Include parsed components"
        required: false
        default: true
      - name: require_unit
        type: boolean
        description: "Require unit/apt if applicable"
        required: false
        default: false
    tags: ["location", "address", "validate", "verify", "postal"]
    test_prompts:
      single:
        - "Is this address valid?"
        - "Validate and format the shipping address"
        - "Check if this is a real address"
        - "Standardize the address format"

  - name: get_weather
    descriptions:
      minimal: "Get weather"
      short: "Get current weather for a location"
      medium: "Get current weather conditions and forecast for a specific location."
      long: "Get current weather and forecast for a location. Returns temperature, conditions, humidity, wind, and more. Example: get_weather(location='San Francisco, CA')."
      verbose: "Get current weather conditions and forecast for a location. Returns: temperature (with feels-like), conditions, humidity, pressure, visibility, wind speed/direction, UV index, precipitation, sunrise/sunset. Forecast options: hourly (48 hours) or daily (7 days). Example: get_weather(location='Paris, France', units='metric', forecast='daily', days=5, include=['temperature', 'precipitation', 'wind']) returns 5-day forecast with specified details. Note: Forecasts become less accurate further out. Warning: Severe weather alerts should be checked separately for safety-critical applications."
    parameters:
      - name: location
        type: string
        description: "Location (city, address, or coordinates)"
        required: true
      - name: units
        type: string
        description: "Temperature units"
        required: false
        default: "metric"
        enum: ["metric", "imperial"]
      - name: forecast
        type: string
        description: "Forecast type"
        required: false
        enum: ["current", "hourly", "daily"]
      - name: days
        type: integer
        description: "Forecast days (for daily)"
        required: false
        default: 7
      - name: include
        type: array
        description: "Data to include"
        required: false
    tags: ["location", "weather", "forecast", "temperature", "climate"]
    test_prompts:
      single:
        - "What's the weather in London?"
        - "Get the 5-day forecast for New York"
        - "What's the temperature right now?"
        - "Will it rain tomorrow in Seattle?"
  - name: optimize_route
    descriptions:
      minimal: "Optimize route"
      short: "Optimize multi-stop route"
      medium: "Find the optimal order for visiting multiple locations."
      long: "Optimize a route with multiple stops to minimize distance or time. Example: optimize_route(origin='office', destinations='[\"client1\", \"client2\", \"client3\"]', optimize_for='time')."
      verbose: "Route optimization for deliveries and field services. Algorithm: traveling salesman (TSP), vehicle routing (VRP). Constraints: time windows, capacity, priority. Example: optimize_route(origin='warehouse', destinations='[{\"address\": \"123 Main St\", \"window\": [\"09:00\", \"12:00\"]}, {\"address\": \"456 Oak Ave\", \"priority\": \"high\"}]', optimize_for='time', traffic='predictive', vehicle_capacity=50). Returns: optimized order, total distance/time, per-leg details. Note: Results vary with traffic conditions. Warning: Very large route sets may take longer to compute."
    parameters:
      - name: origin
        type: string
        description: "Starting location"
        required: true
      - name: destinations
        type: string
        description: "JSON array of destinations"
        required: true
      - name: optimize_for
        type: string
        description: "Optimization target"
        required: false
        default: "time"
        enum: ["time", "distance", "fuel"]
      - name: return_to_origin
        type: boolean
        description: "Return to start point"
        required: false
        default: false
      - name: traffic
        type: string
        description: "Traffic model"
        required: false
        default: "live"
        enum: ["none", "live", "predictive"]
      - name: constraints
        type: string
        description: "JSON routing constraints"
        required: false
    tags: ["location", "route", "optimization", "delivery", "tsp"]
    test_prompts:
      single:
        - "Find best order for deliveries"
        - "Optimize delivery route"
        - "Plan efficient multi-stop trip"
        - "Order these stops optimally"

  - name: create_geofence
    descriptions:
      minimal: "Create geofence"
      short: "Create a geofence area"
      medium: "Create a geographic boundary to trigger location-based events."
      long: "Define a geofence area. Trigger events when devices enter or exit. Example: create_geofence(name='office', center='40.7128,-74.0060', radius=100, events='[\"enter\", \"exit\"]')."
      verbose: "Create geofences for location-based automation. Shapes: circle (center + radius), polygon (points). Events: enter, exit, dwell. Example: create_geofence(name='Store Location', shape='circle', center='40.7128,-74.0060', radius=150, events='[\"enter\", \"exit\"]', dwell_time=300, notify_url='https://api.example.com/geofence', metadata='{\"store_id\": \"123\"}'). Note: Accuracy depends on device GPS quality. Warning: Very small geofences may trigger unreliably."
    parameters:
      - name: name
        type: string
        description: "Geofence name"
        required: true
      - name: shape
        type: string
        description: "Geofence shape"
        required: true
        enum: ["circle", "polygon"]
      - name: center
        type: string
        description: "Center point (lat,lng)"
        required: false
      - name: radius
        type: integer
        description: "Radius in meters"
        required: false
      - name: points
        type: string
        description: "JSON polygon points"
        required: false
      - name: events
        type: string
        description: "JSON events to trigger"
        required: true
      - name: notify_url
        type: string
        description: "Webhook URL for events"
        required: false
    tags: ["location", "geofence", "boundary", "trigger", "automation"]
    test_prompts:
      single:
        - "Create geofence around office"
        - "Set up location trigger"
        - "Define geo boundary"
        - "Alert when user enters area"

  - name: search_places_nearby
    descriptions:
      minimal: "Search nearby"
      short: "Search places nearby"
      medium: "Find places of a specific type near a location."
      long: "Search for places (restaurants, gas stations, etc.) near a location. Example: search_places_nearby(location='40.7128,-74.0060', type='restaurant', radius=1000)."
      verbose: "Search for nearby points of interest. Categories: restaurant, cafe, gas_station, hospital, pharmacy, atm, parking, hotel. Filters: open now, rating, price level. Example: search_places_nearby(location='Times Square, NY', type='restaurant', radius=500, keyword='pizza', open_now=true, min_rating=4.0, max_results=20). Returns: place list with name, address, rating, hours, distance. Note: Results limited by API quotas. Warning: Business hours and ratings change frequently."
    parameters:
      - name: location
        type: string
        description: "Center location (address or lat,lng)"
        required: true
      - name: type
        type: string
        description: "Place type"
        required: true
      - name: radius
        type: integer
        description: "Search radius in meters"
        required: false
        default: 1000
      - name: keyword
        type: string
        description: "Additional keyword filter"
        required: false
      - name: open_now
        type: boolean
        description: "Only open places"
        required: false
        default: false
      - name: min_rating
        type: number
        description: "Minimum rating filter"
        required: false
      - name: max_results
        type: integer
        description: "Maximum results"
        required: false
        default: 20
    tags: ["location", "places", "nearby", "search", "poi"]
    test_prompts:
      single:
        - "Find restaurants nearby"
        - "Search for gas stations"
        - "Find ATMs near me"
        - "Coffee shops within 500m"

  - name: get_place_details
    descriptions:
      minimal: "Get place details"
      short: "Get place information"
      medium: "Get detailed information about a specific place."
      long: "Retrieve detailed information about a place. Get hours, reviews, photos, etc. Example: get_place_details(place_id='ChIJN1t_tDeuEmsRUsoyG83frY4', fields='[\"name\", \"hours\", \"reviews\"]')."
      verbose: "Get comprehensive place information. Available fields: name, address, phone, website, hours, rating, reviews, photos, price_level, types, accessibility. Example: get_place_details(place_id='ChIJN1t_tDeuEmsRUsoyG83frY4', fields='[\"name\", \"formatted_address\", \"opening_hours\", \"reviews\", \"photos\"]', language='en', reviews_sort='newest'). Returns: requested place details. Note: Some fields incur additional API costs. Warning: Review data is user-generated and may be outdated."
    parameters:
      - name: place_id
        type: string
        description: "Unique place identifier"
        required: true
      - name: fields
        type: string
        description: "JSON array of fields to return"
        required: false
      - name: language
        type: string
        description: "Response language"
        required: false
        default: "en"
      - name: reviews_sort
        type: string
        description: "Review sort order"
        required: false
        enum: ["relevance", "newest"]
    tags: ["location", "places", "details", "business", "info"]
    test_prompts:
      single:
        - "Get restaurant details"
        - "Show place information"
        - "Get business hours"
        - "Show reviews for place"

  - name: calculate_isochrone
    descriptions:
      minimal: "Calculate isochrone"
      short: "Calculate travel time area"
      medium: "Calculate the area reachable within a given travel time from a location."
      long: "Generate an isochrone showing areas reachable in a given time. Example: calculate_isochrone(origin='office', time_minutes=30, mode='driving')."
      verbose: "Generate isochrone polygons for reachability analysis. Use cases: site selection, coverage analysis, service areas. Example: calculate_isochrone(origin='downtown station', time_minutes=15, mode='transit', departure_time='2024-01-15T08:00:00', intervals='[5, 10, 15]'). Returns: GeoJSON polygons for each time interval. Note: Transit isochrones depend on schedule. Warning: Large time values create very large polygons."
    parameters:
      - name: origin
        type: string
        description: "Starting location"
        required: true
      - name: time_minutes
        type: integer
        description: "Travel time in minutes"
        required: true
      - name: mode
        type: string
        description: "Travel mode"
        required: false
        default: "driving"
        enum: ["driving", "walking", "cycling", "transit"]
      - name: intervals
        type: string
        description: "JSON array of time intervals"
        required: false
      - name: departure_time
        type: string
        description: "Departure time (ISO 8601)"
        required: false
    tags: ["location", "isochrone", "travel", "reachability", "analysis"]
    test_prompts:
      single:
        - "Show 30 minute driving radius"
        - "Calculate reachable area"
        - "Where can I drive in 15 minutes"
        - "Generate isochrone map"

  - name: validate_address
    descriptions:
      minimal: "Validate address"
      short: "Validate and format address"
      medium: "Validate and standardize an address for accuracy."
      long: "Validate address accuracy and standardize format. Returns corrected address. Example: validate_address(address='123 main st, NYC')."
      verbose: "Address validation and standardization. Features: spelling correction, format standardization (USPS, postal), missing component detection, deliverability check. Example: validate_address(address='123 main st apt 4, new york', country='US', format='usps', include_metadata=true). Returns: standardized address, validity score, corrections made, components. Note: Validation accuracy varies by country. Warning: Some valid addresses may not geocode correctly."
    parameters:
      - name: address
        type: string
        description: "Address to validate"
        required: true
      - name: country
        type: string
        description: "Country code (ISO 3166-1)"
        required: false
      - name: format
        type: string
        description: "Output format standard"
        required: false
        enum: ["usps", "postal", "local"]
      - name: include_metadata
        type: boolean
        description: "Include address metadata"
        required: false
        default: false
    tags: ["location", "address", "validate", "format", "standardize"]
    test_prompts:
      single:
        - "Validate this address"
        - "Check if address is correct"
        - "Format address properly"
        - "Standardize shipping address"

  - name: batch_geocode
    descriptions:
      minimal: "Batch geocode"
      short: "Geocode multiple addresses"
      medium: "Geocode a list of addresses in a single batch request."
