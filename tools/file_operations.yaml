category: file_operations

tools:
  - name: read_file
    descriptions:
      minimal: "Read a file"
      short: "Read the contents of a file from disk"
      medium: "Read the contents of a file from the filesystem. Specify the file path and optionally the encoding."
      long: "Read the contents of a file from the filesystem. Supports text files with various encodings. Returns the file content as a string. Example: read_file(path='/etc/config.json') returns the JSON content."
      verbose: "Read the contents of a file from the filesystem. This tool opens a file in read mode and returns its contents as a string. Supports various text encodings including UTF-8, ASCII, and Latin-1. The file must exist and be readable. Example usage: read_file(path='config.json', encoding='utf-8'). Note: Binary files should use read_binary_file instead. Warning: Large files may consume significant memory."
    parameters:
      - name: file_path
        type: string
        description: "The path to the file to read"
        required: true
      - name: encoding
        type: string
        description: "The file encoding (default: utf-8)"
        required: false
        default: "utf-8"
    tags: ["file", "read", "io", "filesystem"]
    test_prompts:
      single:
        - "Read the contents of config.json"
        - "Show me what's in the README.md file"
        - "Open and display the content of /var/log/app.log"
        - "Get the text from document.txt"
      single_clear:
        - "I need to read and display the text contents of a file from the filesystem. Read the contents of config.json"
        - "I need to read and display the text contents of a file from the filesystem. Show me what's in the README.md file"
        - "I need to read and display the text contents of a file from the filesystem. Open and display the content of /var/log/app.log"
        - "I need to read and display the text contents of a file from the filesystem. Get the text from document.txt"
      multi:
        - prompt: "Read config.json and then write its contents to backup.json"
          required_tools: ["read_file", "write_file"]

  - name: write_file
    descriptions:
      minimal: "Write to a file"
      short: "Write content to a file on disk"
      medium: "Write content to a file on the filesystem. Creates the file if it doesn't exist. Can optionally append instead of overwrite."
      long: "Write content to a file on the filesystem. Creates the file if it doesn't exist, or overwrites existing content by default. Use append mode to add content to the end of existing files. Example: write_file(path='output.txt', content='Hello World')."
      verbose: "Write content to a file on the filesystem. This tool creates a new file or modifies an existing one. By default, it overwrites existing content, but setting append=true adds content to the end instead. The parent directory must exist. Example: write_file(path='log.txt', content='New entry', append=true). Note: Creates the file if it doesn't exist. Warning: Overwrites existing content unless append mode is enabled."
    parameters:
      - name: file_path
        type: string
        description: "The path to the file to write"
        required: true
      - name: content
        type: string
        description: "The content to write to the file"
        required: true
      - name: append
        type: boolean
        description: "If true, append to file instead of overwriting"
        required: false
        default: false
    tags: ["file", "write", "io", "filesystem"]
    test_prompts:
      single:
        - "Write 'Hello World' to output.txt"
        - "Save the text 'Configuration updated' to config.log"
        - "Create a file called notes.txt with the content 'Meeting at 3pm'"
        - "Append 'New line' to the end of log.txt"
      single_clear:
        - "Please write text content to a file on the filesystem, creating it if it doesn't exist. Write 'Hello World' to output.txt"
        - "Please write text content to a file on the filesystem, creating it if it doesn't exist. Save the text 'Configuration updated' to config.log"
        - "Please write text content to a file on the filesystem, creating it if it doesn't exist. Create a file called notes.txt with the content 'Meeting at 3pm'"
        - "Please write text content to a file on the filesystem, creating it if it doesn't exist. Append 'New line' to the end of log.txt"

  - name: delete_file
    descriptions:
      minimal: "Delete a file"
      short: "Delete a file from the filesystem"
      medium: "Delete a file from the filesystem permanently. The file must exist. Use force option to skip confirmation."
      long: "Delete a file from the filesystem permanently. The file path must point to an existing file (not a directory). By default, asks for confirmation. Use force=true to delete without confirmation. Example: delete_file(path='temp.txt', force=true)."
      verbose: "Delete a file from the filesystem permanently. This operation cannot be undone - the file is permanently removed, not moved to trash. The path must point to a file, not a directory. Use force=true to bypass confirmation prompts. Example: delete_file(path='/tmp/cache.dat', force=true). Note: Does not work on directories, use delete_directory instead. Warning: This action is irreversible."
    parameters:
      - name: file_path
        type: string
        description: "The path to the file to delete"
        required: true
      - name: force
        type: boolean
        description: "If true, delete without confirmation"
        required: false
        default: false
    tags: ["file", "delete", "io", "filesystem", "destructive"]
    test_prompts:
      single:
        - "Delete the file temp.txt"
        - "Remove the old backup file backup.old"
        - "Delete cache.dat without asking for confirmation"
      single_clear:
        - "I need to permanently delete a file from the filesystem. Delete the file temp.txt"
        - "I need to permanently delete a file from the filesystem. Remove the old backup file backup.old"
        - "I need to permanently delete a file from the filesystem. Delete cache.dat without asking for confirmation"

  - name: copy_file
    descriptions:
      minimal: "Copy a file"
      short: "Copy a file to a new location"
      medium: "Copy a file from one location to another. The source file must exist. Optionally overwrite if destination exists."
      long: "Copy a file from a source path to a destination path. The source file must exist and be readable. If the destination already exists, use overwrite=true to replace it. Example: copy_file(source='data.csv', destination='backup/data.csv')."
      verbose: "Copy a file from a source path to a destination path. Creates an exact duplicate of the source file at the destination. The source must be an existing file. If the destination exists, the operation fails unless overwrite=true is set. The destination directory must exist. Example: copy_file(source='report.pdf', destination='archive/report_2024.pdf', overwrite=false). Note: Does not copy directories, use copy_directory instead. Warning: With overwrite=true, existing destination files are permanently replaced."
    parameters:
      - name: source_path
        type: string
        description: "The path to the source file"
        required: true
      - name: destination_path
        type: string
        description: "The path to the destination file"
        required: true
      - name: overwrite
        type: boolean
        description: "If true, overwrite destination if it exists"
        required: false
        default: false
    tags: ["file", "copy", "io", "filesystem"]
    test_prompts:
      single:
        - "Copy config.json to config.backup.json"
        - "Make a copy of report.pdf in the archive folder"
        - "Duplicate the data.csv file to backup/data.csv"
      single_clear:
        - "Please copy a file to a new location while keeping the original intact. Copy config.json to config.backup.json"
        - "Please copy a file to a new location while keeping the original intact. Make a copy of report.pdf in the archive folder"
        - "Please copy a file to a new location while keeping the original intact. Duplicate the data.csv file to backup/data.csv"

  - name: move_file
    descriptions:
      minimal: "Move a file"
      short: "Move a file to a new location"
      medium: "Move a file from one location to another. This removes the original file. Can also be used to rename files."
      long: "Move a file from a source path to a destination path, removing it from the original location. Can also be used to rename files within the same directory. Example: move_file(source='old_name.txt', destination='new_name.txt')."
      verbose: "Move a file from a source path to a destination path. The source file is removed after being copied to the destination. This can be used for both moving files between directories and renaming files. If the destination exists, set overwrite=true to replace it. Example: move_file(source='downloads/file.zip', destination='archive/file.zip'). Note: Atomic operation when on same filesystem. Warning: Source file is deleted after successful move."
    parameters:
      - name: source_path
        type: string
        description: "The current path of the file"
        required: true
      - name: destination_path
        type: string
        description: "The new path for the file"
        required: true
      - name: overwrite
        type: boolean
        description: "If true, overwrite destination if it exists"
        required: false
        default: false
    tags: ["file", "move", "rename", "io", "filesystem"]
    test_prompts:
      single:
        - "Move report.pdf to the archive folder"
        - "Rename old_config.json to new_config.json"
        - "Move the downloaded file from downloads to documents"
      single_clear:
        - "I need to move or rename a file to a different location. Move report.pdf to the archive folder"
        - "I need to move or rename a file to a different location. Rename old_config.json to new_config.json"
        - "I need to move or rename a file to a different location. Move the downloaded file from downloads to documents"

  - name: list_directory
    descriptions:
      minimal: "List directory contents"
      short: "List all files and folders in a directory"
      medium: "List the contents of a directory, showing all files and subdirectories. Can optionally list recursively and filter by pattern."
      long: "List the contents of a directory. Returns names of all files and subdirectories. Use recursive=true to include contents of subdirectories. Use pattern to filter results (e.g., '*.txt'). Example: list_directory(path='./src', pattern='*.py')."
      verbose: "List the contents of a directory. Returns a list of file and subdirectory names. By default, only lists immediate children. Set recursive=true to traverse all subdirectories. Use pattern for glob-style filtering (e.g., '*.log', 'test_*'). Example: list_directory(path='/var/log', recursive=false, pattern='*.log'). Note: Hidden files (starting with .) are included by default. Warning: Recursive listing on large directories may be slow."
    parameters:
      - name: directory_path
        type: string
        description: "The path to the directory to list"
        required: true
      - name: recursive
        type: boolean
        description: "If true, list contents recursively"
        required: false
        default: false
      - name: pattern
        type: string
        description: "Glob pattern to filter results (e.g., '*.txt')"
        required: false
    tags: ["file", "directory", "list", "io", "filesystem"]
    test_prompts:
      single:
        - "Show me all files in the src folder"
        - "List the contents of the current directory"
        - "Find all Python files in the project directory"
        - "What files are in /var/log?"
      single_clear:
        - "Please list all the files and subdirectories in a directory. Show me all files in the src folder"
        - "Please list all the files and subdirectories in a directory. List the contents of the current directory"
        - "Please list all the files and subdirectories in a directory. Find all Python files in the project directory"
        - "Please list all the files and subdirectories in a directory. What files are in /var/log?"

  - name: create_directory
    descriptions:
      minimal: "Create a directory"
      short: "Create a new directory on the filesystem"
      medium: "Create a new directory at the specified path. Can create parent directories if they don't exist."
      long: "Create a new directory at the specified path. If parents=true, creates all necessary parent directories (like mkdir -p). Example: create_directory(path='project/src/utils', parents=true)."
      verbose: "Create a new directory at the specified path. By default, fails if parent directories don't exist. Set parents=true to create the entire directory tree. If the directory already exists and exist_ok=true, no error is raised. Example: create_directory(path='/app/data/cache', parents=true, exist_ok=true). Note: Created with default permissions. Warning: Setting exist_ok=false will raise an error if directory exists."
    parameters:
      - name: directory_path
        type: string
        description: "The path of the directory to create"
        required: true
      - name: parents
        type: boolean
        description: "If true, create parent directories as needed"
        required: false
        default: false
      - name: exist_ok
        type: boolean
        description: "If true, don't error if directory exists"
        required: false
        default: false
    tags: ["file", "directory", "create", "io", "filesystem"]
    test_prompts:
      single:
        - "Create a new folder called 'backup'"
        - "Make a directory at project/src/components"
        - "Create the output directory if it doesn't exist"
      single_clear:
        - "I need to create a new directory/folder on the filesystem. Create a new folder called 'backup'"
        - "I need to create a new directory/folder on the filesystem. Make a directory at project/src/components"
        - "I need to create a new directory/folder on the filesystem. Create the output directory if it doesn't exist"

  - name: get_file_info
    descriptions:
      minimal: "Get file information"
      short: "Get metadata about a file"
      medium: "Get metadata about a file including size, creation date, modification date, and permissions."
      long: "Get detailed metadata about a file. Returns information including file size in bytes, creation timestamp, last modification timestamp, and file permissions. Example: get_file_info(path='document.pdf')."
      verbose: "Get comprehensive metadata about a file. Returns a detailed object containing: size (in bytes), created_at (timestamp), modified_at (timestamp), accessed_at (timestamp), permissions (octal), owner, group, and file type. Example: get_file_info(path='/etc/passwd') returns {size: 2834, permissions: '0644', ...}. Note: Some fields may not be available on all operating systems. Warning: Accessing certain system files may require elevated permissions."
    parameters:
      - name: file_path
        type: string
        description: "The path to the file"
        required: true
    tags: ["file", "info", "metadata", "io", "filesystem"]
    test_prompts:
      single:
        - "What is the size of report.pdf?"
        - "When was config.json last modified?"
        - "Get information about the log file"
        - "Show me the metadata for document.docx"
      single_clear:
        - "Please get detailed metadata about a file including size, dates, and permissions. What is the size of report.pdf?"
        - "Please get detailed metadata about a file including size, dates, and permissions. When was config.json last modified?"
        - "Please get detailed metadata about a file including size, dates, and permissions. Get information about the log file"
        - "Please get detailed metadata about a file including size, dates, and permissions. Show me the metadata for document.docx"

  - name: search_files
    descriptions:
      minimal: "Search for files"
      short: "Search for files matching a pattern"
      medium: "Search for files in a directory that match a name pattern. Can search recursively through subdirectories."
      long: "Search for files matching a pattern within a directory. Uses glob patterns for matching (e.g., '*.py', 'test_*'). Set recursive=true to search in subdirectories. Example: search_files(directory='.', pattern='*.log', recursive=true)."
      verbose: "Search for files matching a pattern within a directory tree. Supports glob patterns including wildcards (* matches any characters, ? matches single character). By default searches only the specified directory. Set recursive=true to search all subdirectories. Returns a list of matching file paths. Example: search_files(directory='/var/log', pattern='error*.log', recursive=true). Note: Pattern is case-sensitive on Unix systems. Warning: Searching large directory trees recursively may be slow."
    parameters:
      - name: directory
        type: string
        description: "The directory to search in"
        required: true
      - name: pattern
        type: string
        description: "The glob pattern to match (e.g., '*.txt')"
        required: true
      - name: recursive
        type: boolean
        description: "If true, search in subdirectories"
        required: false
        default: false
    tags: ["file", "search", "find", "io", "filesystem"]
    test_prompts:
      single:
        - "Find all .log files in the logs directory"
        - "Search for Python files in the project"
        - "Find all files named 'config' in the system"
        - "Look for any JSON files in the data folder"
      single_clear:
        - "I need to search for files matching a pattern in a directory. Find all .log files in the logs directory"
        - "I need to search for files matching a pattern in a directory. Search for Python files in the project"
        - "I need to search for files matching a pattern in a directory. Find all files named 'config' in the system"
        - "I need to search for files matching a pattern in a directory. Look for any JSON files in the data folder"

  - name: compress_files
    descriptions:
      minimal: "Compress files"
      short: "Compress files into an archive"
      medium: "Compress one or more files into a zip, tar, or gzip archive."
      long: "Compress files or directories into an archive file. Supports zip, tar.gz, tar.bz2, and 7z formats. Example: compress_files(files='[\"doc1.txt\", \"doc2.txt\"]', output='archive.zip', format='zip')."
      verbose: "Compress multiple files or directories into an archive. Supports formats: 'zip' (widely compatible), 'tar.gz' (Unix standard, gzip compression), 'tar.bz2' (better compression), '7z' (best compression). Can include or exclude files by pattern. Preserves directory structure optionally. Example: compress_files(files='[\"src/\", \"docs/\"]', output='project_backup.tar.gz', format='tar.gz', compression_level=9). Note: Compression level ranges 1-9. Warning: Large directories may take significant time to compress."
    parameters:
      - name: files
        type: string
        description: "JSON array of file/directory paths to compress"
        required: true
      - name: output
        type: string
        description: "Output archive path"
        required: true
      - name: format
        type: string
        description: "Archive format"
        required: false
        default: "zip"
        enum: ["zip", "tar.gz", "tar.bz2", "7z"]
      - name: compression_level
        type: integer
        description: "Compression level (1-9)"
        required: false
        default: 6
    tags: ["file", "compress", "archive", "zip", "tar", "backup"]
    test_prompts:
      single:
        - "Compress the src folder into a zip file"
        - "Create a tar.gz archive of the logs directory"
        - "Zip up all the document files"
        - "Make a backup archive of the project"
      single_clear:
        - "Please compress files or directories into an archive. Compress the src folder into a zip file"
        - "Please compress files or directories into an archive. Create a tar.gz archive of the logs directory"
        - "Please compress files or directories into an archive. Zip up all the document files"
        - "Please compress files or directories into an archive. Make a backup archive of the project"

  - name: extract_archive
    descriptions:
      minimal: "Extract archive"
      short: "Extract files from an archive"
      medium: "Extract files from a zip, tar, or other archive format to a destination directory."
      long: "Extract files from an archive to a specified destination. Supports zip, tar, tar.gz, tar.bz2, and 7z formats. Example: extract_archive(archive='backup.zip', destination='./restored/')."
      verbose: "Extract files from various archive formats to a destination directory. Auto-detects format from extension. Can extract specific files using a pattern. Options to overwrite existing files or preserve directory structure. Example: extract_archive(archive='data.tar.gz', destination='./extracted/', pattern='*.csv', overwrite=true). Note: Creates destination directory if it doesn't exist. Warning: Be cautious with archives from untrusted sources (zip bombs, path traversal)."
    parameters:
      - name: archive
        type: string
        description: "Path to the archive file"
        required: true
      - name: destination
        type: string
        description: "Directory to extract to"
        required: true
      - name: pattern
        type: string
        description: "Only extract files matching this pattern"
        required: false
      - name: overwrite
        type: boolean
        description: "Overwrite existing files"
        required: false
        default: false
    tags: ["file", "extract", "archive", "unzip", "decompress"]
    test_prompts:
      single:
        - "Extract the zip file to the downloads folder"
        - "Unzip the archive to the current directory"
        - "Extract only the CSV files from the archive"
        - "Decompress the tar.gz backup file"
      single_clear:
        - "I need to extract files from a compressed archive. Extract the zip file to the downloads folder"
        - "I need to extract files from a compressed archive. Unzip the archive to the current directory"
        - "I need to extract files from a compressed archive. Extract only the CSV files from the archive"
        - "I need to extract files from a compressed archive. Decompress the tar.gz backup file"

  - name: rename_files_batch
    descriptions:
      minimal: "Batch rename files"
      short: "Rename multiple files at once"
      medium: "Rename multiple files using patterns, find-replace, or numbering schemes."
      long: "Batch rename files in a directory using various strategies: pattern replacement, sequential numbering, or custom templates. Example: rename_files_batch(directory='./photos', pattern='IMG_*.jpg', template='vacation_{n:04d}.jpg')."
      verbose: "Rename multiple files in a directory using flexible renaming strategies. Strategies: 'replace' (find/replace in names), 'template' (use template with variables like {n}, {name}, {ext}, {date}), 'regex' (regex substitution). Example: rename_files_batch(directory='./images', pattern='*.PNG', strategy='replace', find='.PNG', replace='.png'). Note: Preview mode shows changes without applying. Warning: Renaming is not atomic; partial failures may leave some files renamed."
    parameters:
      - name: directory
        type: string
        description: "Directory containing files to rename"
        required: true
      - name: pattern
        type: string
        description: "Glob pattern to match files"
        required: true
      - name: strategy
        type: string
        description: "Renaming strategy"
        required: true
        enum: ["replace", "template", "regex"]
      - name: find
        type: string
        description: "String to find (for replace/regex)"
        required: false
      - name: replace
        type: string
        description: "Replacement string"
        required: false
      - name: template
        type: string
        description: "Name template with placeholders"
        required: false
      - name: preview
        type: boolean
        description: "Preview changes without applying"
        required: false
        default: true
    tags: ["file", "rename", "batch", "bulk", "organize"]
    test_prompts:
      single:
        - "Rename all jpg files with sequential numbers"
        - "Replace spaces with underscores in all filenames"
        - "Batch rename the photos with a date prefix"
        - "Change all file extensions from .txt to .md"
      single_clear:
        - "I need to batch rename multiple files at once using patterns or numbering. Rename all jpg files with sequential numbers"
        - "I need to batch rename multiple files at once using patterns or numbering. Replace spaces with underscores in all filenames"
        - "I need to batch rename multiple files at once using patterns or numbering. Batch rename the photos with a date prefix"
        - "I need to batch rename multiple files at once using patterns or numbering. Change all file extensions from .txt to .md"

  - name: watch_directory
    descriptions:
      minimal: "Watch directory"
      short: "Monitor a directory for changes"
      medium: "Watch a directory for file changes and trigger notifications for create, modify, or delete events."
      long: "Monitor a directory for file system changes. Detects file creation, modification, deletion, and moves. Can filter by file pattern. Example: watch_directory(directory='./uploads', events='[\"created\", \"modified\"]', pattern='*.csv')."
      verbose: "Set up a file system watcher on a directory to detect changes in real-time. Events: 'created' (new files), 'modified' (content changes), 'deleted' (removals), 'moved' (renames or moves). Can watch recursively and filter by file pattern. Returns a watcher ID for later management. Example: watch_directory(directory='/var/log/app', events='[\"created\", \"modified\"]', pattern='*.log', recursive=true). Note: High-change directories may generate many events. Warning: System limits on file watchers may apply."
    parameters:
      - name: directory
        type: string
        description: "Directory to watch"
        required: true
      - name: events
        type: string
        description: "JSON array of events to watch"
        required: false
        default: "[\"created\", \"modified\", \"deleted\"]"
      - name: pattern
        type: string
        description: "Filter files by pattern"
        required: false
      - name: recursive
        type: boolean
        description: "Watch subdirectories too"
        required: false
        default: false
    tags: ["file", "watch", "monitor", "events", "realtime"]
    test_prompts:
      single:
        - "Watch the uploads folder for new files"
        - "Monitor the config directory for changes"
        - "Set up a watcher for log file modifications"
        - "Alert me when files are deleted from the temp folder"
      single_clear:
        - "I need to monitor a directory for file changes in real-time. Watch the uploads folder for new files"
        - "I need to monitor a directory for file changes in real-time. Monitor the config directory for changes"
        - "I need to monitor a directory for file changes in real-time. Set up a watcher for log file modifications"
        - "I need to monitor a directory for file changes in real-time. Alert me when files are deleted from the temp folder"

  - name: calculate_checksum
    descriptions:
      minimal: "Calculate checksum"
      short: "Calculate file checksum"
      medium: "Calculate the checksum of a file using MD5, SHA1, SHA256, or other hash algorithms."
      long: "Calculate the checksum/hash of a file for integrity verification. Supports MD5, SHA1, SHA256, SHA512. Example: calculate_checksum(file_path='download.iso', algorithm='sha256')."
      verbose: "Calculate a cryptographic checksum of a file for integrity verification. Common use cases: verifying downloads, detecting file changes, creating manifests. Algorithms: 'md5' (fast, not cryptographically secure), 'sha1' (deprecated for security), 'sha256' (recommended), 'sha512' (most secure). Example: calculate_checksum(file_path='ubuntu.iso', algorithm='sha256'). Note: Large files are processed in chunks for memory efficiency. Warning: MD5/SHA1 should only be used for integrity, not security."
    parameters:
      - name: file_path
        type: string
        description: "Path to the file"
        required: true
      - name: algorithm
        type: string
        description: "Hash algorithm to use"
        required: false
        default: "sha256"
        enum: ["md5", "sha1", "sha256", "sha512"]
    tags: ["file", "checksum", "hash", "verify", "integrity"]
    test_prompts:
      single:
        - "Calculate the SHA256 checksum of the downloaded file"
        - "Get the MD5 hash of the ISO image"
        - "Verify the file checksum"
        - "Generate a checksum for the backup file"
      single_clear:
        - "I need to calculate a cryptographic hash/checksum of a file for integrity verification. Calculate the SHA256 checksum of the downloaded file"
        - "I need to calculate a cryptographic hash/checksum of a file for integrity verification. Get the MD5 hash of the ISO image"
        - "I need to calculate a cryptographic hash/checksum of a file for integrity verification. Verify the file checksum"
        - "I need to calculate a cryptographic hash/checksum of a file for integrity verification. Generate a checksum for the backup file"

  - name: sync_directories
    descriptions:
      minimal: "Sync directories"
      short: "Synchronize two directories"
      medium: "Synchronize the contents of two directories, copying new and modified files."
      long: "Synchronize files between a source and destination directory. Can mirror, update only newer files, or perform bidirectional sync. Example: sync_directories(source='/data', destination='/backup', mode='mirror')."
      verbose: "Synchronize files between directories with multiple strategies. Modes: 'mirror' (destination matches source exactly, deletes extra files), 'update' (copy newer files only), 'merge' (copy from both, keep newest), 'backup' (one-way copy, never delete). Options for handling conflicts and preserving attributes. Example: sync_directories(source='./local', destination='./remote', mode='update', delete_extra=false, dry_run=true). Note: Dry run shows what would change without modifying files. Warning: Mirror mode will delete files from destination."
    parameters:
      - name: source
        type: string
        description: "Source directory path"
        required: true
      - name: destination
        type: string
        description: "Destination directory path"
        required: true
