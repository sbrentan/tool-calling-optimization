  - name: get_disk_usage
    descriptions:
      minimal: "Get disk usage"
      short: "Get disk usage for a path"
      medium: "Calculate the total disk space used by a file or directory."
      long: "Calculate disk usage for a file or directory tree. Returns total size, file count, and breakdown. Example: get_disk_usage(path='/home/user', depth=2)."
      verbose: "Calculate disk space usage for files and directories. Returns: total size, file count, directory count, and optionally size breakdown by subdirectory or file type. Example: get_disk_usage(path='/var/log', depth=1, breakdown_by='directory', human_readable=true, exclude=['*.tmp']) returns usage summary with per-subdirectory breakdown. Note: Hardlinked files may be counted multiple times. Warning: Scanning large directories may take time."
    parameters:
      - name: path
        type: string
        description: "File or directory path"
        required: true
      - name: depth
        type: integer
        description: "Depth for breakdown (0=total only)"
        required: false
        default: 0
      - name: breakdown_by
        type: string
        description: "How to break down usage"
        required: false
        enum: ["none", "directory", "extension", "size_range"]
      - name: human_readable
        type: boolean
        description: "Format sizes for readability"
        required: false
        default: true
      - name: exclude
        type: array
        description: "Patterns to exclude"
        required: false
    tags: ["file", "disk", "usage", "size", "space", "du"]
    test_prompts:
      single:
        - "How much space is the folder using?"
        - "Get disk usage for /var/log"
        - "Calculate the size of this directory"
        - "Show disk usage breakdown by folder"
      single_clear:
        - "I need to get disk space usage statistics for a file or directory. How much space is the folder using?"
        - "I need to get disk space usage statistics for a file or directory. Get disk usage for /var/log"
        - "I need to get disk space usage statistics for a file or directory. Calculate the size of this directory"
        - "I need to get disk space usage statistics for a file or directory. Show disk usage breakdown by folder"

  - name: search_file_content
    descriptions:
      minimal: "Search in files"
      short: "Search for text within files"
      medium: "Search for a pattern or text string within files, similar to grep."
      long: "Search for text patterns within files. Supports regex, case sensitivity options, and context lines. Example: search_file_content(path='/var/log', pattern='error', recursive=true)."
      verbose: "Search for text or regex patterns within files (like grep). Returns matching lines with file paths and line numbers. Options: regex support, case sensitivity, context lines before/after, file type filtering. Example: search_file_content(path='/project/src', pattern='TODO:|FIXME:', regex=true, include=['*.py', '*.js'], context=2, max_matches=100) finds all TODO/FIXME comments with context. Note: Binary files are typically skipped. Warning: Searching large directories with broad patterns may be slow."
    parameters:
      - name: path
        type: string
        description: "Directory or file to search"
        required: true
      - name: pattern
        type: string
        description: "Search pattern"
        required: true
      - name: regex
        type: boolean
        description: "Treat pattern as regex"
        required: false
        default: false
      - name: case_sensitive
        type: boolean
        description: "Case-sensitive matching"
        required: false
        default: true
      - name: recursive
        type: boolean
        description: "Search subdirectories"
        required: false
        default: true
      - name: include
        type: array
        description: "File patterns to include"
        required: false
      - name: context
        type: integer
        description: "Context lines before/after match"
        required: false
        default: 0
      - name: max_matches
        type: integer
        description: "Maximum matches to return"
        required: false
    tags: ["file", "search", "grep", "find", "content", "text"]
    test_prompts:
      single:
        - "Search for 'error' in the log files"
        - "Find all files containing 'TODO'"
        - "Grep for the pattern in the source code"
        - "Search for this text in the directory"
      single_clear:
        - "I need to search for text or patterns within files, similar to grep. Search for 'error' in the log files"
        - "I need to search for text or patterns within files, similar to grep. Find all files containing 'TODO'"
        - "I need to search for text or patterns within files, similar to grep. Grep for the pattern in the source code"
        - "I need to search for text or patterns within files, similar to grep. Search for this text in the directory"

  - name: tail_file
    descriptions:
      minimal: "Tail file"
      short: "Show the last lines of a file"
      medium: "Display the last N lines of a file, optionally following for new content."
      long: "Read the last lines of a file, like the Unix tail command. Can follow the file for real-time updates. Example: tail_file(path='/var/log/app.log', lines=100, follow=true)."
      verbose: "Display the last portion of a file. Modes: 'lines' (last N lines), 'bytes' (last N bytes). Follow mode watches for new content appended to the file (useful for logs). Example: tail_file(path='/var/log/syslog', lines=50, follow=true, filter='error|warning', timeout=60) shows last 50 lines then follows, filtering for errors/warnings. Note: Follow mode continues until timeout or manual stop. Warning: Very long lines may consume significant memory."
    parameters:
      - name: path
        type: string
        description: "Path to the file"
        required: true
      - name: lines
        type: integer
        description: "Number of lines to show"
        required: false
        default: 10
      - name: bytes
        type: integer
        description: "Number of bytes (alternative to lines)"
        required: false
      - name: follow
        type: boolean
        description: "Follow file for new content"
        required: false
        default: false
      - name: filter
        type: string
        description: "Regex filter for lines"
        required: false
      - name: timeout
        type: integer
        description: "Follow timeout in seconds"
        required: false
    tags: ["file", "tail", "log", "read", "follow", "stream"]
    test_prompts:
      single:
        - "Show the last 100 lines of the log"
        - "Tail the log file"
        - "Follow the application log"
        - "Watch the log file for new entries"
      single_clear:
        - "I need to display the last lines of a file, optionally following for new content. Show the last 100 lines of the log"
        - "I need to display the last lines of a file, optionally following for new content. Tail the log file"
        - "I need to display the last lines of a file, optionally following for new content. Follow the application log"
        - "I need to display the last lines of a file, optionally following for new content. Watch the log file for new entries"
