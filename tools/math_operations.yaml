      long: "Calculate integrals of functions. Supports definite integrals (with limits) and indefinite integrals for common functions. Example: integral(function='x^2', lower=0, upper=1) returns 0.333."
      verbose: "Calculate integrals of mathematical functions. For definite integrals, specify lower and upper bounds. Indefinite integrals return antiderivatives for common functions. Numerical integration uses adaptive quadrature for accuracy. Example: integral(function='sin(x)', lower=0, upper='pi', method='adaptive') integrates sin(x) from 0 to π. Methods: 'adaptive' (accurate), 'simpson' (fast), 'trapezoidal' (simple). Note: Symbolic integration limited to common functions. Warning: Improper integrals may not converge."
