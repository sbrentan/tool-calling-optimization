      verbose: "Calculate derivatives of mathematical functions. Supports numerical differentiation at a point and symbolic derivatives for polynomial, trigonometric, exponential, and logarithmic functions. Can compute nth derivatives. Example: derivative(function='sin(x) * x^2', variable='x', order=2, symbolic=true) returns the second derivative symbolically. Note: Numerical derivatives use finite difference approximation. Warning: Symbolic differentiation has limited function support."
