  - name: prime_factorization
    descriptions:
      minimal: "Factor number"
      short: "Find prime factors"
      medium: "Find the prime factorization of an integer."
      long: "Find the prime factorization of a positive integer, expressing it as a product of prime powers. Example: prime_factorization(number=60) returns {2: 2, 3: 1, 5: 1}."
      verbose: "Find the unique prime factorization of a positive integer (Fundamental Theorem of Arithmetic). Returns prime factors with their exponents. Also computes: number of divisors, sum of divisors, Euler's totient, and list of all divisors. Example: prime_factorization(number=360, include_divisors=true) returns {factors: {2: 3, 3: 2, 5: 1}, divisor_count: 24, divisor_sum: 1170, totient: 96, divisors: [1, 2, 3, ...]}. Note: Every positive integer > 1 has a unique factorization. Warning: Large numbers with large prime factors are computationally expensive to factor."
    parameters:
      - name: number
        type: integer
        description: "Number to factorize"
        required: true
      - name: include_divisors
        type: boolean
        description: "Include list of all divisors"
        required: false
        default: false
      - name: include_totient
        type: boolean
        description: "Include Euler's totient"
        required: false
        default: false
    tags: ["math", "prime", "factor", "number_theory", "divisor"]
    test_prompts:
      single:
        - "Find the prime factors of 360"
        - "Factorize 1000"
        - "What are the prime factors of 84?"
        - "Get the prime factorization of 2310"

