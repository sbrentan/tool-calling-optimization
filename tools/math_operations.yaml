  - name: numerical_integration
    descriptions:
      minimal: "Integrate"
      short: "Numerical integration"
      medium: "Compute definite integrals numerically using various methods."
      long: "Compute definite integrals numerically. Supports various quadrature methods. Example: numerical_integration(expression='x^2', lower=0, upper=1) returns ~0.333."
      verbose: "Compute definite integrals numerically (approximate area under curve). Methods: 'trapezoidal', 'simpson' (more accurate for smooth functions), 'romberg', 'adaptive' (adjusts precision automatically). Example: numerical_integration(expression='sin(x)/x', lower=0.001, upper=10, method='adaptive', tolerance=1e-8) returns numerical approximation of Si(10). Note: Improper integrals (infinite bounds) require special handling. Warning: Functions with singularities may require splitting the interval."
    parameters:
      - name: expression
        type: string
        description: "Mathematical expression (function of x)"
        required: true
      - name: lower
