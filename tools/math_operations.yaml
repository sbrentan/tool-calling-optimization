      verbose: "Perform operations on complex numbers. Operations: 'add', 'subtract', 'multiply', 'divide', 'magnitude' (|z|), 'conjugate', 'argument' (angle), 'to_polar', 'to_rectangular', 'power', 'sqrt', 'exp'. Input format: '3+4i' or [3, 4]. Example: complex_number(a='3+4i', operation='to_polar') returns {r: 5, theta: 0.927}. Note: Argument is in radians by default. Warning: Complex logarithm and roots have multiple values (branches)."
