      medium: "Perform operations on polynomials including evaluation, roots, and arithmetic."
      long: "Work with polynomials: evaluate, add, multiply, divide, find roots, and differentiate. Polynomials given as coefficient arrays. Example: polynomial_operations(coefficients='[1, -5, 6]', operation='roots')."
      verbose: "Perform polynomial operations. Input as coefficient array [a_n, a_{n-1}, ..., a_1, a_0] representing a_n*x^n + ... + a_0. Operations: 'evaluate' (at point x), 'add', 'subtract', 'multiply', 'divide' (with remainder), 'roots', 'derivative', 'integral', 'gcd'. Example: polynomial_operations(coefficients='[1, -5, 6]', operation='roots') returns [2, 3] for x²-5x+6. Note: Coefficients from highest to lowest degree. Warning: Finding roots of high-degree polynomials may be numerically unstable."
