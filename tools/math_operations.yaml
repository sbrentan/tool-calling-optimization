      verbose: "Calculate permutations (P) or combinations (C). Permutation: ordered arrangements, P(n,r) = n!/(n-r)!. Combination: unordered selections, C(n,r) = n!/[r!(n-r)!]. Also supports permutations with repetition (n^r) and combinations with repetition. Example: permutation_combination(n=52, r=5, type='combination') returns 2598960 (poker hands). Note: C(n,r) = C(n, n-r). Warning: Results can be extremely large for big n."
    parameters:
      - name: n
        type: integer
        description: "Total items"
        required: true
      - name: r
