  - name: solve_system
    descriptions:
      minimal: "Solve equations"
      short: "Solve system of linear equations"
      medium: "Solve a system of linear equations with multiple variables."
      long: "Solve systems of linear equations using various methods. Input as augmented matrix or coefficient matrix with constants. Example: solve_system(equations='[[2,1,10],[1,3,15]]')."
      verbose: "Solve systems of linear equations (Ax = b). Input formats: augmented matrix, separate coefficient matrix and constants, or equation strings. Methods: Gaussian elimination, LU decomposition, Cramer's rule. Returns: solution vector, or indicates if no solution/infinite solutions exist. Example: solve_system(equations='2x + y = 10, x + 3y = 15', format='string') returns {x: 3, y: 4}. Note: Unique solution exists when determinant ≠ 0. Warning: Ill-conditioned matrices may have numerical precision issues."
