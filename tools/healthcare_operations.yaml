category: healthcare_operations
description: Healthcare and medical record operations

tools:
  - name: create_patient_record
    descriptions:
      minimal: "Create patient record"
      short: "Create a new patient record"
      medium: "Create a new patient record in the electronic health records system."
      long: "Create a patient record with demographics, contact information, and medical history. Example: create_patient_record(first_name='John', last_name='Doe', dob='1985-03-15', ssn='***-**-1234')."
      verbose: "Create a new patient record in the EHR system. Fields: demographics (name, DOB, gender, SSN), contact (address, phone, email, emergency contact), insurance, medical history, allergies, primary care physician. Example: create_patient_record(first_name='Jane', last_name='Smith', dob='1990-07-22', gender='F', address='{\"street\": \"123 Main St\", \"city\": \"Boston\", \"state\": \"MA\", \"zip\": \"02101\"}', insurance_id='INS-12345', allergies='[\"penicillin\", \"shellfish\"]'). Note: HIPAA compliance required for all PHI. Warning: Verify patient identity to prevent duplicate records."
    parameters:
      - name: first_name
        type: string
        description: "Patient first name"
        required: true
      - name: last_name
        type: string
        description: "Patient last name"
        required: true
      - name: dob
        type: string
        description: "Date of birth (YYYY-MM-DD)"
        required: true
      - name: gender
        type: string
        description: "Patient gender"
        required: false
        enum: ["M", "F", "O", "U"]
      - name: ssn
        type: string
        description: "Social security number"
        required: false
      - name: address
        type: string
        description: "JSON address object"
        required: false
      - name: insurance_id
        type: string
        description: "Insurance policy ID"
        required: false
      - name: allergies
        type: string
        description: "JSON array of allergies"
        required: false
    tags: ["healthcare", "patient", "record", "create", "ehr"]
    test_prompts:
      single:
        - "Create a new patient record"
        - "Register a new patient"
        - "Add patient to the system"
        - "Set up new patient file"
      single_clear:
        - "I need to create a new patient record in the EHR system. Create a new patient record"
        - "I need to create a new patient record in the EHR system. Register a new patient"
        - "I need to create a new patient record in the EHR system. Add patient to the system"
        - "I need to create a new patient record in the EHR system. Set up new patient file"

  - name: schedule_appointment
    descriptions:
      minimal: "Schedule appointment"
      short: "Schedule a medical appointment"
      medium: "Schedule a medical appointment for a patient with a healthcare provider."
      long: "Schedule an appointment with a doctor, specialist, or facility. Check availability and book time slots. Example: schedule_appointment(patient_id='P12345', provider_id='DR-001', date='2024-02-15', time='10:30', type='follow-up')."
      verbose: "Schedule medical appointments in the practice management system. Features: provider availability, patient preferences, appointment types, recurring visits, reminders. Types: new patient, follow-up, annual physical, specialist referral, procedure, telehealth. Example: schedule_appointment(patient_id='P-789', provider_id='DR-Smith', date='2024-02-20', time='14:00', type='follow_up', duration=30, reason='Blood pressure check', send_reminder=true, reminder_method='sms'). Note: Some appointment types require referrals. Warning: Check patient insurance coverage for specialist visits."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: provider_id
        type: string
        description: "Healthcare provider ID"
        required: true
      - name: date
        type: string
        description: "Appointment date"
        required: true
      - name: time
        type: string
        description: "Appointment time"
        required: true
      - name: type
        type: string
        description: "Appointment type"
        required: true
        enum: ["new_patient", "follow_up", "annual_physical", "specialist", "procedure", "telehealth", "urgent"]
      - name: duration
        type: integer
        description: "Duration in minutes"
        required: false
        default: 30
      - name: reason
        type: string
        description: "Reason for visit"
        required: false
      - name: send_reminder
        type: boolean
        description: "Send appointment reminder"
        required: false
        default: true
    tags: ["healthcare", "appointment", "schedule", "booking", "provider"]
    test_prompts:
      single:
        - "Schedule a doctor's appointment"
        - "Book a follow-up visit"
        - "Set up telehealth appointment"
        - "Schedule patient with specialist"
      single_clear:
        - "Please schedule a patient appointment. Schedule a doctor's appointment"
        - "Please schedule a patient appointment. Book a follow-up visit"
        - "Please schedule a patient appointment. Set up telehealth appointment"
        - "Please schedule a patient appointment. Schedule patient with specialist"

  - name: record_vital_signs
    descriptions:
      minimal: "Record vitals"
      short: "Record patient vital signs"
      medium: "Record vital signs measurements for a patient encounter."
      long: "Record patient vital signs including blood pressure, heart rate, temperature, and more. Example: record_vital_signs(patient_id='P12345', encounter_id='ENC-001', blood_pressure='120/80', heart_rate=72)."
      verbose: "Record vital signs during patient encounters. Measurements: blood pressure (systolic/diastolic), heart rate (BPM), temperature (F/C), respiratory rate, oxygen saturation (SpO2), weight, height, BMI (calculated), pain level (0-10). Example: record_vital_signs(patient_id='P-789', encounter_id='ENC-456', blood_pressure='135/88', heart_rate=78, temperature=98.6, temp_unit='F', respiratory_rate=16, spo2=98, weight=175, weight_unit='lb', pain_level=2). Note: Abnormal values may trigger clinical alerts. Warning: Verify measurements before saving to permanent record."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: encounter_id
        type: string
        description: "Encounter/visit ID"
        required: true
      - name: blood_pressure
        type: string
        description: "Blood pressure (systolic/diastolic)"
        required: false
      - name: heart_rate
        type: integer
        description: "Heart rate (BPM)"
        required: false
      - name: temperature
        type: number
        description: "Body temperature"
        required: false
      - name: temp_unit
        type: string
        description: "Temperature unit"
        required: false
        default: "F"
        enum: ["F", "C"]
      - name: respiratory_rate
        type: integer
        description: "Breaths per minute"
        required: false
      - name: spo2
        type: integer
        description: "Oxygen saturation %"
        required: false
      - name: weight
        type: number
        description: "Patient weight"
        required: false
      - name: pain_level
        type: integer
        description: "Pain level (0-10)"
        required: false
    tags: ["healthcare", "vitals", "record", "encounter", "measurement"]
    test_prompts:
      single:
        - "Record patient vital signs"
        - "Enter blood pressure reading"
        - "Log patient vitals"
        - "Add vital signs to chart"
      single_clear:
        - "I need to document patient vital sign measurements. Record patient vital signs"
        - "I need to document patient vital sign measurements. Enter blood pressure reading"
        - "I need to document patient vital sign measurements. Log patient vitals"
        - "I need to document patient vital sign measurements. Add vital signs to chart"

  - name: prescribe_medication
    descriptions:
      minimal: "Prescribe medication"
      short: "Create a prescription"
      medium: "Prescribe medication for a patient with dosage and instructions."
      long: "Create a prescription for a patient. Includes drug interaction checking and pharmacy routing. Example: prescribe_medication(patient_id='P12345', medication='Lisinopril', dosage='10mg', frequency='once daily')."
      verbose: "Create electronic prescriptions with clinical decision support. Features: drug interaction alerts, allergy checking, formulary verification, electronic transmission to pharmacy. Fields: medication, strength, dosage, frequency, duration, quantity, refills, instructions, pharmacy. Example: prescribe_medication(patient_id='P-789', medication='Metformin', strength='500mg', dosage='1 tablet', frequency='twice daily', duration=90, quantity=180, refills=3, instructions='Take with meals', pharmacy_id='CVS-12345', check_interactions=true). Note: Controlled substances require DEA number. Warning: Always review drug interactions and patient allergies."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: medication
        type: string
        description: "Medication name"
        required: true
      - name: strength
        type: string
        description: "Medication strength"
        required: true
      - name: dosage
        type: string
        description: "Dosage instructions"
        required: true
      - name: frequency
        type: string
        description: "Dosing frequency"
        required: true
      - name: duration
        type: integer
        description: "Duration in days"
        required: false
      - name: quantity
        type: integer
        description: "Quantity to dispense"
        required: true
      - name: refills
        type: integer
        description: "Number of refills"
        required: false
        default: 0
      - name: pharmacy_id
        type: string
        description: "Pharmacy ID for e-prescribing"
        required: false
      - name: check_interactions
        type: boolean
        description: "Check drug interactions"
        required: false
        default: true
    tags: ["healthcare", "prescription", "medication", "pharmacy", "rx"]
    test_prompts:
      single:
        - "Prescribe medication for patient"
        - "Create a new prescription"
        - "Write Rx for blood pressure medication"
        - "Send prescription to pharmacy"
      single_clear:
        - "I need to prescribe medication for a patient. Prescribe medication for patient"
        - "I need to prescribe medication for a patient. Create a new prescription"
        - "I need to prescribe medication for a patient. Write Rx for blood pressure medication"
        - "I need to prescribe medication for a patient. Send prescription to pharmacy"

  - name: order_lab_test
    descriptions:
      minimal: "Order lab test"
      short: "Order a laboratory test"
      medium: "Order laboratory tests for a patient with collection instructions."
      long: "Order lab tests with specimen collection instructions. Track orders and receive results. Example: order_lab_test(patient_id='P12345', tests='[\"CBC\", \"BMP\"]', priority='routine')."
      verbose: "Order laboratory tests through lab information system integration. Features: test catalog search, standing orders, ABN generation, specimen collection instructions, result routing. Test categories: chemistry, hematology, microbiology, pathology, genetics. Example: order_lab_test(patient_id='P-789', tests='[\"CBC\", \"CMP\", \"Lipid Panel\", \"HbA1c\"]', priority='routine', fasting_required=true, diagnosis_codes='[\"E11.9\", \"I10\"]', lab_id='LabCorp', special_instructions='Patient prefers morning draw'). Note: Some tests require fasting or special preparation. Warning: Verify insurance coverage for specialized tests."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: tests
        type: string
        description: "JSON array of test codes/names"
        required: true
      - name: priority
        type: string
        description: "Order priority"
        required: false
        default: "routine"
        enum: ["stat", "urgent", "routine"]
      - name: fasting_required
        type: boolean
        description: "Fasting required"
        required: false
        default: false
      - name: diagnosis_codes
        type: string
        description: "JSON array of ICD-10 codes"
        required: false
      - name: lab_id
        type: string
        description: "Destination laboratory"
        required: false
      - name: special_instructions
        type: string
        description: "Special collection instructions"
        required: false
    tags: ["healthcare", "lab", "test", "order", "diagnostic"]
    test_prompts:
      single:
        - "Order blood work for patient"
        - "Request lab tests"
        - "Order CBC and metabolic panel"
        - "Send lab order to LabCorp"
      single_clear:
        - "I need to order laboratory tests for a patient. Order blood work for patient"
        - "I need to order laboratory tests for a patient. Request lab tests"
        - "I need to order laboratory tests for a patient. Order CBC and metabolic panel"
        - "I need to order laboratory tests for a patient. Send lab order to LabCorp"

  - name: document_clinical_note
    descriptions:
      minimal: "Document note"
      short: "Document a clinical note"
      medium: "Document clinical notes for a patient encounter."
      long: "Create clinical documentation including progress notes, history, and assessments. Example: document_clinical_note(patient_id='P12345', encounter_id='ENC-001', type='progress', content='...')."
      verbose: "Create clinical documentation in the EHR. Note types: progress note, H&P (history and physical), consultation, procedure note, discharge summary, telephone encounter. Templates: SOAP (Subjective, Objective, Assessment, Plan), narrative, problem-focused. Example: document_clinical_note(patient_id='P-789', encounter_id='ENC-456', type='progress', template='soap', subjective='Patient reports improved energy...', objective='BP 128/82, HR 72...', assessment='Type 2 DM - well controlled', plan='Continue current medications...', sign=true). Note: Notes become part of legal medical record. Warning: Ensure documentation is complete before signing."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: encounter_id
        type: string
        description: "Encounter ID"
        required: true
      - name: type
        type: string
        description: "Note type"
        required: true
        enum: ["progress", "hp", "consultation", "procedure", "discharge", "telephone"]
      - name: template
        type: string
        description: "Documentation template"
        required: false
        default: "soap"
        enum: ["soap", "narrative", "problem_focused"]
      - name: subjective
        type: string
        description: "Subjective findings"
        required: false
      - name: objective
        type: string
        description: "Objective findings"
        required: false
      - name: assessment
        type: string
        description: "Clinical assessment"
        required: false
      - name: plan
        type: string
        description: "Treatment plan"
        required: false
      - name: content
        type: string
        description: "Free-text content"
        required: false
      - name: sign
        type: boolean
        description: "Electronically sign note"
        required: false
        default: false
    tags: ["healthcare", "documentation", "note", "clinical", "encounter"]
    test_prompts:
      single:
        - "Document the patient visit"
        - "Write a progress note"
        - "Create clinical documentation"
        - "Add SOAP note to chart"
      single_clear:
        - "I need to document clinical notes for a patient encounter. Document the patient visit"
        - "I need to document clinical notes for a patient encounter. Write a progress note"
        - "I need to document clinical notes for a patient encounter. Create clinical documentation"
        - "I need to document clinical notes for a patient encounter. Add SOAP note to chart"

  - name: submit_insurance_claim
    descriptions:
      minimal: "Submit claim"
      short: "Submit an insurance claim"
      medium: "Submit a medical insurance claim for services rendered."
      long: "Submit insurance claims electronically. Include diagnosis codes, procedure codes, and charges. Example: submit_insurance_claim(patient_id='P12345', encounter_id='ENC-001', insurance_id='INS-789')."
      verbose: "Submit electronic medical claims (837P/837I). Components: patient demographics, insurance info, provider NPI, diagnosis codes (ICD-10), procedure codes (CPT/HCPCS), charges, modifiers, place of service. Features: eligibility verification, claim scrubbing, ERA processing. Example: submit_insurance_claim(patient_id='P-789', encounter_id='ENC-456', payer_id='BCBS', diagnosis_codes='[\"E11.9\", \"I10\"]', procedures='[{\"code\": \"99213\", \"charge\": 150.00}, {\"code\": \"36415\", \"charge\": 25.00}]', verify_eligibility=true). Note: Claims must be submitted within payer deadlines. Warning: Incorrect coding may result in denials or audits."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: encounter_id
        type: string
        description: "Encounter ID"
        required: true
      - name: payer_id
        type: string
        description: "Insurance payer ID"
        required: true
      - name: diagnosis_codes
        type: string
        description: "JSON array of ICD-10 codes"
        required: true
      - name: procedures
        type: string
        description: "JSON array of procedure codes and charges"
        required: true
      - name: place_of_service
        type: string
        description: "Place of service code"
        required: false
        default: "11"
      - name: verify_eligibility
        type: boolean
        description: "Verify insurance eligibility first"
        required: false
        default: true
    tags: ["healthcare", "claim", "insurance", "billing", "revenue"]
    test_prompts:
      single:
        - "Submit insurance claim"
        - "Bill the patient's insurance"
        - "Process medical claim"
        - "Send claim to payer"
      single_clear:
        - "I need to submit a medical insurance claim for services rendered. Submit insurance claim"
        - "I need to submit a medical insurance claim for services rendered. Bill the patient's insurance"
        - "I need to submit a medical insurance claim for services rendered. Process medical claim"
        - "I need to submit a medical insurance claim for services rendered. Send claim to payer"

  - name: request_referral
    descriptions:
      minimal: "Request referral"
      short: "Request a patient referral"
      medium: "Request a referral to a specialist or facility for a patient."
      long: "Create a referral request to a specialist or healthcare facility. Include clinical reason and relevant records. Example: request_referral(patient_id='P12345', to_provider='DR-CARDIO-001', reason='Chest pain evaluation')."
      verbose: "Create and manage patient referrals. Referral types: specialist consultation, diagnostic procedure, therapy, second opinion. Components: referring provider, receiving provider, clinical indication, urgency, relevant documents/records, authorization requirements. Example: request_referral(patient_id='P-789', to_provider_id='DR-JONES', specialty='Cardiology', reason='Evaluate chest pain and dyspnea on exertion', urgency='urgent', include_records='[\"recent_labs\", \"ecg\", \"progress_notes\"]', obtain_auth=true). Note: Some insurances require pre-authorization. Warning: Include all relevant clinical information for appropriate triage."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: to_provider_id
        type: string
        description: "Receiving provider ID"
        required: true
      - name: specialty
        type: string
        description: "Specialist type"
        required: true
      - name: reason
        type: string
        description: "Clinical reason for referral"
        required: true
      - name: urgency
        type: string
        description: "Referral urgency"
        required: false
        default: "routine"
        enum: ["routine", "urgent", "emergent"]
      - name: include_records
        type: string
        description: "JSON array of records to include"
        required: false
      - name: obtain_auth
        type: boolean
        description: "Request insurance authorization"
        required: false
        default: false
    tags: ["healthcare", "referral", "specialist", "coordination", "care"]
    test_prompts:
      single:
        - "Refer patient to cardiologist"
        - "Request specialist consultation"
        - "Create a referral for the patient"
        - "Send patient to orthopedics"
      single_clear:
        - "I need to request a referral to a specialist. Refer patient to cardiologist"
        - "I need to request a referral to a specialist. Request specialist consultation"
        - "I need to request a referral to a specialist. Create a referral for the patient"
        - "I need to request a referral to a specialist. Send patient to orthopedics"

  - name: retrieve_medical_history
    descriptions:
      minimal: "Get medical history"
      short: "Retrieve patient medical history"
      medium: "Retrieve comprehensive medical history for a patient."
      long: "Retrieve patient's complete or filtered medical history. Include conditions, surgeries, medications, and allergies. Example: retrieve_medical_history(patient_id='P12345', sections='[\"conditions\", \"medications\"]')."
      verbose: "Retrieve patient medical history from EHR. Sections: conditions (problem list), medications (active/historical), allergies, surgical history, family history, social history, immunizations, lab results, vital trends. Filters: date range, section, category. Example: retrieve_medical_history(patient_id='P-789', sections='[\"conditions\", \"medications\", \"allergies\", \"labs\"]', date_from='2023-01-01', include_resolved=false, format='summary'). Note: Access logged for HIPAA compliance. Warning: Verify patient identity before disclosing PHI."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: sections
        type: string
        description: "JSON array of sections to retrieve"
        required: false
      - name: date_from
        type: string
        description: "Start date filter"
        required: false
      - name: date_to
        type: string
        description: "End date filter"
        required: false
      - name: include_resolved
        type: boolean
        description: "Include resolved conditions"
        required: false
        default: false
      - name: format
        type: string
        description: "Output format"
        required: false
        default: "full"
        enum: ["full", "summary", "ccd"]
    tags: ["healthcare", "history", "medical", "patient", "records"]
    test_prompts:
      single:
        - "Get patient's medical history"
        - "Show medication history"
        - "Retrieve patient records"
        - "Pull up the patient's chart"
      single_clear:
        - "I need to retrieve a patient's medical record. Get patient's medical history"
        - "I need to retrieve a patient's medical record. Show medication history"
        - "I need to retrieve a patient's medical record. Retrieve patient records"
        - "I need to retrieve a patient's medical record. Pull up the patient's chart"

  - name: check_drug_interaction
    descriptions:
      minimal: "Check drug interactions"
      short: "Check for drug interactions"
      medium: "Check for potential drug interactions between medications."
      long: "Check drug-drug interactions between a list of medications. Returns severity and recommendations. Example: check_drug_interaction(medications='[\"Warfarin\", \"Aspirin\", \"Lisinopril\"]')."
      verbose: "Comprehensive drug interaction checking. Interaction types: drug-drug, drug-food, drug-condition, drug-allergy. Severity levels: contraindicated, severe, moderate, mild. Returns: interacting pairs, mechanism, clinical effects, recommendations, references. Example: check_drug_interaction(medications='[\"Warfarin 5mg\", \"Aspirin 81mg\", \"Metoprolol 25mg\"]', patient_id='P-789', include_allergies=true, include_conditions=true). Note: Clinical judgment should guide final decisions. Warning: Not all interactions are in databases; monitor patients clinically."
    parameters:
      - name: medications
        type: string
        description: "JSON array of medication names"
        required: true
      - name: patient_id
        type: string
        description: "Patient ID (for allergy/condition check)"
        required: false
      - name: include_allergies
        type: boolean
        description: "Check against patient allergies"
        required: false
        default: true
      - name: include_conditions
        type: boolean
        description: "Check against patient conditions"
        required: false
        default: true
      - name: severity_filter
        type: string
        description: "Minimum severity to report"
        required: false
        default: "moderate"
        enum: ["mild", "moderate", "severe", "contraindicated"]
    tags: ["healthcare", "drug", "interaction", "medication", "safety"]
    test_prompts:
      single:
        - "Check for drug interactions"
        - "Are these medications safe together?"
        - "Screen medications for interactions"
        - "Check if Warfarin interacts with other meds"
      single_clear:
        - "I need to check for potential drug interactions. Check for drug interactions"
        - "I need to check for potential drug interactions. Are these medications safe together?"
        - "I need to check for potential drug interactions. Screen medications for interactions"
        - "I need to check for potential drug interactions. Check if Warfarin interacts with other meds"

  - name: order_imaging_study
    descriptions:
      minimal: "Order imaging"
      short: "Order a diagnostic imaging study"
      medium: "Order diagnostic imaging studies such as X-ray, CT, MRI, or ultrasound."
      long: "Order diagnostic imaging studies with clinical indication and protocol specifications. Example: order_imaging_study(patient_id='P12345', modality='MRI', body_part='brain', indication='Headache evaluation')."
      verbose: "Order diagnostic imaging through radiology information system. Modalities: X-ray, CT, MRI, ultrasound, PET, mammography, fluoroscopy, nuclear medicine. Features: clinical decision support, protocol selection, contrast requirements, scheduling integration. Example: order_imaging_study(patient_id='P-789', modality='CT', body_part='abdomen_pelvis', indication='Abdominal pain, rule out appendicitis', contrast=true, priority='urgent', pregnancy_status='negative', diagnosis_codes='[\"R10.9\"]'). Note: Some studies require pre-authorization. Warning: Verify pregnancy status before ordering studies with radiation."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: modality
        type: string
        description: "Imaging modality"
        required: true
        enum: ["xray", "ct", "mri", "ultrasound", "pet", "mammography", "fluoroscopy", "nuclear"]
      - name: body_part
        type: string
        description: "Body part to image"
        required: true
      - name: indication
        type: string
        description: "Clinical indication"
        required: true
      - name: contrast
        type: boolean
        description: "Contrast required"
        required: false
        default: false
      - name: priority
        type: string
        description: "Order priority"
        required: false
        default: "routine"
        enum: ["stat", "urgent", "routine"]
      - name: pregnancy_status
        type: string
        description: "Pregnancy status for radiation studies"
        required: false
        enum: ["positive", "negative", "unknown", "na"]
      - name: diagnosis_codes
        type: string
        description: "JSON array of ICD-10 codes"
        required: false
    tags: ["healthcare", "imaging", "radiology", "diagnostic", "order"]
    test_prompts:
      single:
        - "Order an MRI for the patient"
        - "Schedule a CT scan"
        - "Request chest X-ray"
        - "Order diagnostic imaging"
      single_clear:
        - "I need to order a diagnostic imaging study. Order an MRI for the patient"
        - "I need to order a diagnostic imaging study. Schedule a CT scan"
        - "I need to order a diagnostic imaging study. Request chest X-ray"
        - "I need to order a diagnostic imaging study. Order diagnostic imaging"

  - name: update_allergy_list
    descriptions:
      minimal: "Update allergies"
      short: "Update patient allergy list"
      medium: "Add, modify, or remove allergies from a patient's allergy list."
      long: "Manage patient allergy documentation including drug, food, and environmental allergies. Example: update_allergy_list(patient_id='P12345', action='add', allergen='Penicillin', reaction='Hives')."
      verbose: "Maintain accurate allergy documentation in the EHR. Allergy types: drug, food, environmental, latex. Reaction types: anaphylaxis, hives, rash, GI upset, angioedema. Severity: mild, moderate, severe, life-threatening. Example: update_allergy_list(patient_id='P-789', action='add', allergen='Penicillin', allergy_type='drug', reaction='Anaphylaxis', severity='life_threatening', onset_date='2020-03-15', verified=true). Note: Drug allergies trigger prescribing alerts. Warning: Verify allergy history; document source of information."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: action
        type: string
