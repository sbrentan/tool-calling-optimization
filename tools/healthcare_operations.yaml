  - name: calculate_clinical_score
    descriptions:
      minimal: "Calculate clinical score"
      short: "Calculate a clinical risk score"
      medium: "Calculate clinical risk scores and assessment tools for a patient."
      long: "Calculate standardized clinical scores like CHADS2-VASc, Wells, MELD, etc. Example: calculate_clinical_score(patient_id='P12345', score_type='chads2_vasc')."
      verbose: "Calculate evidence-based clinical risk scores. Scores supported: cardiovascular (CHADS2-VASc, HEART, Framingham), bleeding (HAS-BLED), hepatic (MELD, Child-Pugh), pulmonary (Wells PE/DVT, CURB-65), renal (CKD-EPI eGFR), surgical (ASA, Caprini), psychiatric (PHQ-9, GAD-7). Example: calculate_clinical_score(patient_id='P-789', score_type='chads2_vasc', parameters='{\"age\": 72, \"sex\": \"F\", \"chf\": true, \"hypertension\": true, \"diabetes\": false, \"stroke_tia\": false, \"vascular\": true}'). Note: Scores guide but don't replace clinical judgment. Warning: Ensure all required parameters are accurate for valid calculation."
    parameters:
      - name: patient_id
        type: string
        description: "Patient ID"
        required: true
      - name: score_type
        type: string
        description: "Clinical score to calculate"
        required: true
        enum: ["chads2_vasc", "has_bled", "heart", "wells_pe", "wells_dvt", "meld", "child_pugh", "curb65", "ckd_epi", "phq9", "gad7", "framingham", "ascvd"]
      - name: parameters
        type: string
        description: "JSON object of score parameters"
        required: false
      - name: use_patient_data
        type: boolean
        description: "Auto-populate from patient record"
        required: false
