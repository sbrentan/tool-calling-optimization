      short: "Perform medication reconciliation"
      medium: "Reconcile patient medications across care settings and sources."
      long: "Compare and reconcile medication lists from multiple sources. Identify discrepancies and update active list. Example: reconcile_medications(patient_id='P12345', sources='[\"ehr\", \"pharmacy\", \"patient_reported\"]')."
      verbose: "Perform comprehensive medication reconciliation for patient safety. Sources: EHR active list, pharmacy claims, patient/family reported, hospital discharge, specialist records. Process: compare lists, identify discrepancies (new, discontinued, changed doses), verify with patient, update EHR. Example: reconcile_medications(patient_id='P-789', sources='[\"ehr\", \"pharmacy\", \"hospital_discharge\"]', encounter_type='admission', verify_with_patient=true, include_otc=true, include_supplements=true). Note: Required at transitions of care (TJC NPSG). Warning: Reconciliation errors are a leading cause of adverse drug events."
