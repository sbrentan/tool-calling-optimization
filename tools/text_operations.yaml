      verbose: "Encode text using various encoding schemes. Encodings: 'base64' (binary-to-text), 'url' (percent-encoding for URLs), 'html' (HTML entities), 'unicode_escape' (\\uXXXX format), 'hex' (hexadecimal), 'rot13' (Caesar cipher). Example: encode_text(text='Hello <World> & Friends', encoding='html') returns 'Hello &lt;World&gt; &amp; Friends'. Note: Some encodings increase text length. Warning: Encoding is not encryption; do not use for sensitive data."
    parameters:
      - name: text
        type: string
        description: "Text to encode"
        required: true
      - name: encoding
        type: string
        description: "Encoding format"
        required: true
        enum: ["base64", "url", "html", "unicode_escape", "hex", "rot13"]
