  - name: compare_texts
    descriptions:
      minimal: "Compare texts"
      short: "Compare two texts and find differences"
      medium: "Compare two text versions and highlight additions, deletions, and modifications."
      long: "Compare two texts and produce a diff showing changes. Returns line-by-line or word-by-word comparison. Example: compare_texts(text1='Hello world', text2='Hello there world')."
      verbose: "Compare two text versions and identify differences. Modes: 'line' (line-by-line diff), 'word' (word-level changes), 'character' (character-by-character). Output formats: 'unified' (git-style), 'side_by_side', 'inline' (highlighted changes). Returns changes with type (added, removed, modified). Example: compare_texts(text1='The quick brown fox', text2='The slow brown dog', mode='word', output_format='inline', ignore_whitespace=true) highlights changed words. Note: Large texts may produce extensive diffs. Warning: Binary files are not supported."
    parameters:
      - name: text1
        type: string
        description: "Original text"
        required: true
      - name: text2
        type: string
        description: "Modified text"
        required: true
      - name: mode
        type: string
        description: "Comparison mode"
        required: false
        default: "line"
        enum: ["line", "word", "character"]
      - name: output_format
        type: string
        description: "Diff output format"
        required: false
        default: "unified"
        enum: ["unified", "side_by_side", "inline"]
      - name: ignore_whitespace
        type: boolean
        description: "Ignore whitespace changes"
        required: false
        default: false
    tags: ["text", "compare", "diff", "changes", "version"]
    test_prompts:
