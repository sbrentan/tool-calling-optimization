      verbose: "Decode encoded text back to its original form. Supported encodings: 'base64', 'url' (percent-decoding), 'html' (HTML entities like &amp;), 'unicode_escape' (\\uXXXX sequences), 'hex' (hexadecimal), 'rot13'. Example: decode_text(text='Hello%20World%21', encoding='url') returns 'Hello World!'. Note: Invalid encoded strings will produce errors. Warning: Malformed input may produce unexpected results."
