        - "Download query results"
        - "Export database data"
        - "Save table to JSON"

  - name: clone_database
    descriptions:
      minimal: "Clone database"
      short: "Clone a database"
      medium: "Create a copy of a database for testing or development."
      long: "Clone an entire database including schema and data. Useful for creating test environments. Example: clone_database(source='production', target='staging', exclude_tables='[\"logs\"]')."
      verbose: "Clone databases for dev/test environments. Options: full clone, schema only, with data transformation, exclude tables, subset data. Example: clone_database(source='postgres://prod/app', target='postgres://dev/app_copy', mode='full', exclude_tables='[\"audit_log\", \"sessions\"]', anonymize='[{\"table\": \"users\", \"columns\": {\"email\": \"fake_email\", \"phone\": \"null\"}}]'). Note: Cloning large databases takes time. Warning: Anonymize sensitive data for non-production clones."
    parameters:
      - name: source
        type: string
        description: "Source database connection"
        required: true
      - name: target
        type: string
        description: "Target database connection"
        required: true
      - name: mode
        type: string
        description: "Clone mode"
        required: false
        default: "full"
        enum: ["full", "schema_only", "data_only"]
      - name: exclude_tables
        type: string
        description: "JSON tables to exclude"
        required: false
      - name: anonymize
        type: string
        description: "JSON anonymization rules"
        required: false
      - name: parallel
        type: integer
        description: "Parallel copy workers"
        required: false
        default: 4
    tags: ["database", "clone", "copy", "test", "development"]
    test_prompts:
      single:
        - "Clone production to staging"
        - "Copy database for testing"
        - "Create database copy"
        - "Clone with anonymized data"

  - name: manage_database_schema
    descriptions:
      minimal: "Manage schema"
      short: "Manage database schema"
      medium: "View, compare, or sync database schemas."
      long: "Manage database schemas. Compare versions, generate diffs, sync between databases. Example: manage_database_schema(action='diff', source='dev', target='prod')."
      verbose: "Database schema management operations. Actions: 'view' (show schema), 'diff' (compare schemas), 'sync' (apply changes), 'generate' (create DDL), 'validate' (check consistency). Example: manage_database_schema(action='diff', source='postgres://dev/app', target='postgres://prod/app', include='[\"tables\", \"indexes\", \"constraints\"]', generate_migration=true). Returns: schema diff, migration script. Note: Always review diffs before sync. Warning: Schema sync can cause downtime."
    parameters:
      - name: action
        type: string
        description: "Schema action"
        required: true
        enum: ["view", "diff", "sync", "generate", "validate"]
      - name: source
        type: string
        description: "Source database/schema"
        required: true
      - name: target
        type: string
        description: "Target database (for diff/sync)"
        required: false
      - name: include
        type: string
        description: "JSON object types to include"
        required: false
      - name: generate_migration
        type: boolean
        description: "Generate migration script"
        required: false
        default: false
    tags: ["database", "schema", "migration", "diff", "ddl"]
    test_prompts:
      single:
        - "Compare database schemas"
        - "Show schema differences"
        - "Sync schema changes"
        - "Generate migration script"

  - name: query_explain
    descriptions:
      minimal: "Explain query"
      short: "Explain query execution plan"
      medium: "Analyze query execution plan for optimization."
      long: "Get the execution plan for a SQL query. Identify performance bottlenecks. Example: query_explain(database='mydb', query='SELECT * FROM orders WHERE status = \\'pending\\'', analyze=true)."
      verbose: "Analyze SQL query execution plans. Options: basic plan, ANALYZE (actually execute), BUFFERS (I/O stats), FORMAT (text, JSON, YAML). Identifies: full table scans, missing indexes, inefficient joins, cost estimates. Example: query_explain(database='postgres://localhost/app', query='SELECT o.*, c.name FROM orders o JOIN customers c ON o.customer_id = c.id WHERE o.total > 1000', analyze=true, buffers=true, format='json'). Note: ANALYZE actually runs the query. Warning: Don't use ANALYZE on data-modifying queries in production."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: query
        type: string
        description: "SQL query to explain"
        required: true
      - name: analyze
        type: boolean
        description: "Actually execute query"
        required: false
        default: false
      - name: buffers
        type: boolean
        description: "Include buffer usage"
        required: false
        default: false
      - name: format
        type: string
        description: "Output format"
        required: false
        default: "text"
        enum: ["text", "json", "yaml", "xml"]
    tags: ["database", "explain", "query", "performance", "optimization"]
    test_prompts:
      single:
        - "Explain this query"
        - "Show query execution plan"
        - "Analyze slow query"

  - name: manage_database_replication
    descriptions:
      minimal: "Manage replication"
      short: "Manage database replication"
      medium: "Configure and manage database replication for high availability."
      long: "Set up primary-replica replication with automatic failover. Example: manage_database_replication(action='setup', primary='db-primary', replicas='[\"db-replica-1\"]')."
      verbose: "Database replication management for HA and read scaling. Types: synchronous, asynchronous, semi-synchronous. Features: automatic failover, read replicas, lag monitoring. Example: manage_database_replication(action='setup', connection=CONNECTION_STRING, config='{\"type\": \"async\", \"replicas\": [\"replica-1\", \"replica-2\"], \"auto_failover\": true, \"max_lag_seconds\": 30}'). Failover: manage_database_replication(action='failover', new_primary='replica-1', reason='planned_maintenance'). Monitor: manage_database_replication(action='status'). Note: Sync replication impacts write latency. Warning: Test failover procedures regularly."
    parameters:
      - name: action
        type: string
        description: "Replication action"
        required: true
        enum: ["setup", "status", "failover", "add_replica", "remove_replica", "pause", "resume"]
      - name: connection
        type: string
        description: "Primary database connection string"
        required: false
      - name: config
        type: string
        description: "JSON replication configuration"
        required: false
      - name: replica_id
        type: string
        description: "Specific replica identifier"
        required: false
      - name: new_primary
        type: string
        description: "New primary for failover"
        required: false
      - name: reason
        type: string
        description: "Failover reason"
        required: false
    tags: ["database", "replication", "ha", "failover", "replica"]
    test_prompts:
      single:
        - "Set up database replication"
        - "Check replication status"
        - "Failover to replica"
        - "Add read replica"

  - name: manage_database_partitions
    descriptions:
      minimal: "Manage partitions"
      short: "Manage table partitions"
      medium: "Create and manage table partitions for large datasets."
      long: "Set up partitioning by range, list, or hash for performance. Example: manage_database_partitions(action='create', table='events', partition_by='range', column='created_at')."
      verbose: "Table partitioning for performance and maintenance. Types: range (dates, numbers), list (categories), hash (distribution). Features: automatic creation, pruning, archival. Example: manage_database_partitions(action='create', connection=CONNECTION_STRING, table='order_history', type='range', column='order_date', config='{\"interval\": \"monthly\", \"retention_months\": 24, \"auto_create\": true}'). Maintain: manage_database_partitions(action='maintain', table='order_history', operation='archive', older_than='2y'). Note: Partition key must be in primary key. Warning: Adding partitioning requires table recreation."
    parameters:
      - name: action
        type: string
        description: "Partition action"
        required: true
        enum: ["create", "drop", "list", "maintain", "attach", "detach", "analyze"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: table
        type: string
        description: "Table name"
        required: true
      - name: type
        type: string
        description: "Partition type"
        required: false
        enum: ["range", "list", "hash"]
      - name: column
        type: string
        description: "Partition column"
        required: false
      - name: config
        type: string
        description: "JSON partition configuration"
        required: false
      - name: operation
        type: string
        description: "Maintenance operation"
        required: false
    tags: ["database", "partition", "performance", "large_tables", "maintenance"]
    test_prompts:
      single:
        - "Create table partition"
        - "List partitions"
        - "Archive old partitions"
        - "Set up monthly partitioning"

  - name: manage_database_connections
    descriptions:
      minimal: "Manage connections"
      short: "Manage database connections"
      medium: "Monitor and manage database connection pools."
      long: "Control connection pools, kill sessions, and monitor usage. Example: manage_database_connections(action='list') or manage_database_connections(action='kill', session_id='123')."
      verbose: "Database connection and session management. Features: pool sizing, idle timeout, connection limits, session monitoring. Example: manage_database_connections(action='configure', connection=CONNECTION_STRING, pool='{\"min\": 5, \"max\": 100, \"idle_timeout\": 300, \"max_lifetime\": 3600}'). Monitor: manage_database_connections(action='list', include_queries=true). Kill: manage_database_connections(action='kill', session_id='12345', reason='blocking_queries'). Pool stats: manage_database_connections(action='stats'). Note: Pool sizing affects memory. Warning: Killing sessions may leave transactions incomplete."
    parameters:
      - name: action
        type: string
        description: "Connection action"
        required: true
        enum: ["list", "kill", "configure", "stats", "reset", "limit"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: session_id
        type: string
        description: "Session ID to kill"
        required: false
      - name: pool
        type: string
        description: "JSON pool configuration"
        required: false
      - name: include_queries
        type: boolean
        description: "Include active queries"
        required: false
        default: false
      - name: reason
        type: string
        description: "Kill reason for audit"
        required: false
    tags: ["database", "connections", "pool", "sessions", "monitoring"]
    test_prompts:
      single:
        - "List database connections"
        - "Kill blocking session"
        - "Configure connection pool"
        - "Show connection stats"

  - name: manage_database_locks
    descriptions:
      minimal: "Manage locks"
      short: "Manage database locks"
      medium: "Monitor and manage database locks and deadlocks."
      long: "View lock waits, detect deadlocks, and resolve blocking issues. Example: manage_database_locks(action='list') or manage_database_locks(action='kill', lock_id='abc')."
      verbose: "Database lock monitoring and management. Features: lock wait analysis, deadlock detection, blocking tree, auto-kill. Example: manage_database_locks(action='analyze', connection=CONNECTION_STRING, threshold_seconds=30, include_sql=true). Blocking tree: manage_database_locks(action='tree', root_session='12345'). Auto-resolve: manage_database_locks(action='configure', config='{\"deadlock_detection\": true, \"auto_kill_after_seconds\": 60, \"priority\": \"youngest\"}'). Note: Killing locks may rollback transactions. Warning: Be careful with production lock termination."
    parameters:
      - name: action
        type: string
        description: "Lock action"
        required: true
        enum: ["list", "analyze", "tree", "kill", "configure", "history"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: session_id
        type: string
        description: "Session holding/waiting lock"
        required: false
      - name: lock_id
        type: string
        description: "Lock identifier"
        required: false
      - name: threshold_seconds
        type: integer
        description: "Minimum wait time to show"
        required: false
        default: 5
      - name: include_sql
        type: boolean
        description: "Include SQL statements"
        required: false
        default: true
    tags: ["database", "locks", "deadlock", "blocking", "performance"]
    test_prompts:
      single:
        - "Show database locks"
        - "Find blocking queries"
        - "Detect deadlocks"
        - "Kill blocking lock"

  - name: manage_database_schema_changes
    descriptions:
      minimal: "Manage schema"
      short: "Manage schema changes"
      medium: "Execute and track database schema migrations."
      long: "Apply schema changes with version tracking and rollback. Example: manage_database_schema_changes(action='apply', migration='add_user_email_index')."
      verbose: "Database schema migration management. Features: version control, up/down migrations, dependency tracking, dry run. Example: manage_database_schema_changes(action='apply', connection=CONNECTION_STRING, migration='V003__add_orders_index', options='{\"dry_run\": false, \"lock_timeout\": 5000, \"statement_timeout\": 60000}'). Rollback: manage_database_schema_changes(action='rollback', steps=1). Status: manage_database_schema_changes(action='status'). Generate: manage_database_schema_changes(action='generate', name='add_user_preferences', type='create_table'). Note: Always test migrations in staging. Warning: Some changes may lock tables."
    parameters:
      - name: action
        type: string
        description: "Migration action"
        required: true
        enum: ["apply", "rollback", "status", "validate", "generate", "repair", "baseline"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: migration
        type: string
        description: "Migration name/version"
        required: false
      - name: steps
        type: integer
        description: "Number of steps for rollback"
        required: false
        default: 1
      - name: options
        type: string
        description: "JSON migration options"
        required: false
      - name: type
        type: string
        description: "Migration type for generate"
        required: false
    tags: ["database", "schema", "migration", "version", "ddl"]
    test_prompts:
      single:
        - "Apply database migration"
        - "Rollback schema change"
        - "Check migration status"
        - "Generate new migration"

  - name: manage_database_audit
    descriptions:
      minimal: "Manage audit"
      short: "Manage database audit"
      medium: "Configure and query database audit logs."
      long: "Enable audit logging for compliance and security tracking. Example: manage_database_audit(action='enable', level='all', tables='[\"users\", \"transactions\"]')."
      verbose: "Database audit configuration and querying. Audit types: DML (insert/update/delete), DDL (create/alter/drop), login/logout, privilege changes. Example: manage_database_audit(action='configure', connection=CONNECTION_STRING, config='{\"level\": \"statement\", \"log_reads\": false, \"log_writes\": true, \"tables\": [\"sensitive_data\", \"user_accounts\"], \"excluded_users\": [\"backup_user\"]}'). Query: manage_database_audit(action='query', filters='{\"table\": \"users\", \"operation\": \"UPDATE\", \"from\": \"2024-01-01\", \"to\": \"2024-01-31\"}'). Note: Audit logging adds overhead. Warning: Ensure audit logs are secured and retained per policy."
    parameters:
      - name: action
        type: string
        description: "Audit action"
        required: true
        enum: ["configure", "enable", "disable", "query", "export", "status"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: config
        type: string
        description: "JSON audit configuration"
        required: false
      - name: filters
        type: string
        description: "JSON query filters"
        required: false
      - name: format
        type: string
        description: "Export format"
        required: false
        default: "json"
        enum: ["json", "csv", "parquet"]
      - name: destination
        type: string
        description: "Export destination"
        required: false
    tags: ["database", "audit", "compliance", "security", "logging"]
    test_prompts:
      single:
        - "Enable database auditing"
        - "Query audit logs"
        - "Export audit data"
        - "Configure audit settings"

  - name: manage_database_triggers
    descriptions:
      minimal: "Manage triggers"
      short: "Manage database triggers"
      medium: "Create and manage database triggers for automated actions."
      long: "Set up triggers for insert, update, delete events. Example: manage_database_triggers(action='create', name='audit_changes', table='users', event='after_update')."
      verbose: "Database trigger management for automation. Events: before/after insert/update/delete, truncate. Features: row-level, statement-level, conditional firing. Example: manage_database_triggers(action='create', connection=CONNECTION_STRING, name='orders_audit_trigger', table='orders', event='after_update', function='log_order_changes', condition='OLD.status IS DISTINCT FROM NEW.status'). Manage: manage_database_triggers(action='disable', name='audit_trigger', table='orders'). List: manage_database_triggers(action='list', table='orders'). Note: Triggers add overhead to DML. Warning: Recursive triggers can cause infinite loops."
    parameters:
      - name: action
        type: string
        description: "Trigger action"
        required: true
        enum: ["create", "drop", "enable", "disable", "list", "describe"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: name
        type: string
        description: "Trigger name"
        required: false
      - name: table
        type: string
        description: "Table name"
        required: false
      - name: event
        type: string
        description: "Trigger event"
        required: false
        enum: ["before_insert", "after_insert", "before_update", "after_update", "before_delete", "after_delete"]
      - name: function
        type: string
        description: "Function to execute"
        required: false
      - name: condition
        type: string
        description: "Conditional expression"
        required: false
    tags: ["database", "triggers", "automation", "events", "dml"]
    test_prompts:
      single:
        - "Create database trigger"
        - "List table triggers"
        - "Disable trigger"
        - "Set up audit trigger"

  - name: analyze_database_performance
    descriptions:
      minimal: "Analyze performance"
      short: "Analyze database performance"
      medium: "Analyze database performance metrics and identify issues."
      long: "Generate performance reports with recommendations. Example: analyze_database_performance(report='full') or analyze_database_performance(focus='queries')."
      verbose: "Comprehensive database performance analysis. Areas: query performance, index usage, table bloat, cache hit ratio, I/O stats. Example: analyze_database_performance(connection=CONNECTION_STRING, report='comprehensive', period='24h', include_recommendations=true). Focus: analyze_database_performance(focus='slow_queries', threshold_ms=1000, top_n=20). Index analysis: analyze_database_performance(focus='indexes', include_unused=true, include_missing=true). Note: Performance analysis queries add load. Warning: Run comprehensive analysis during low-traffic periods."
    parameters:
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: report
        type: string
        description: "Report type"
        required: false
        default: "summary"
        enum: ["summary", "comprehensive", "queries", "indexes", "tables"]
      - name: focus
        type: string
        description: "Focus area"
        required: false
        enum: ["slow_queries", "indexes", "locks", "connections", "io", "memory"]
      - name: period
        type: string
        description: "Analysis period"
        required: false
        default: "1h"
      - name: threshold_ms
        type: integer
        description: "Slow query threshold"
        required: false
        default: 100
      - name: include_recommendations
        type: boolean
        description: "Include recommendations"
        required: false
        default: true
    tags: ["database", "performance", "analysis", "optimization", "tuning"]
    test_prompts:
      single:
        - "Analyze database performance"
        - "Find slow queries"
        - "Check index usage"
        - "Generate performance report"

  - name: manage_database_encryption
    descriptions:
      minimal: "Manage encryption"
      short: "Manage database encryption"
      medium: "Configure data encryption at rest and in transit."
      long: "Enable TDE, column encryption, and TLS connections. Example: manage_database_encryption(action='enable_tde', key_id='cmk-123')."
      verbose: "Database encryption for security compliance. Types: TDE (transparent data encryption), column-level, connection TLS. Features: key rotation, bring your own key (BYOK). Example: manage_database_encryption(action='enable_tde', connection=CONNECTION_STRING, config='{\"key_type\": \"customer_managed\", \"key_id\": \"arn:aws:kms:...\", \"algorithm\": \"AES-256\"}'). Column: manage_database_encryption(action='encrypt_column', table='users', column='ssn', key='pii-key'). TLS: manage_database_encryption(action='configure_tls', mode='require', min_version='1.2'). Note: Encryption adds CPU overhead. Warning: Test encryption thoroughly before production."
    parameters:
      - name: action
        type: string
        description: "Encryption action"
        required: true
        enum: ["enable_tde", "disable_tde", "encrypt_column", "rotate_key", "configure_tls", "status"]
      - name: connection
        type: string
        description: "Database connection string"
        required: false
      - name: config
        type: string
        description: "JSON encryption configuration"
        required: false
      - name: table
        type: string
        description: "Table for column encryption"
        required: false
      - name: column
        type: string
        description: "Column to encrypt"
        required: false
      - name: key_id
        type: string
        description: "Encryption key identifier"
        required: false
      - name: mode
        type: string
        description: "TLS mode"
        required: false
        enum: ["prefer", "require", "verify_ca", "verify_full"]
    tags: ["database", "encryption", "security", "tde", "tls"]
    test_prompts:
      single:
        - "Enable database encryption"
        - "Rotate encryption key"
        - "Configure TLS"
        - "Encrypt sensitive column"
        - "Get query plan with timing"