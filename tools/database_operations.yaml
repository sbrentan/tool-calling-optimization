category: database_operations
description: Database management and query operations
tools:
  - name: execute_query
    descriptions:
      minimal: "Execute SQL query"
      short: "Execute a SQL query on a database"
      medium: "Execute a SQL query against a database and return results."
      long: "Execute a SQL query on a connected database. Supports SELECT, INSERT, UPDATE, DELETE. Example: execute_query(query='SELECT * FROM users', database='mydb')."
      verbose: "Execute SQL queries against databases. Supports: SELECT (returns rows), INSERT/UPDATE/DELETE (returns affected count), DDL statements. Connection: specify connection string or use named connection. Features: parameterized queries, transaction control, timeout. Example: execute_query(query='SELECT * FROM users WHERE age > ?', params='[18]', database='postgres://localhost/mydb', timeout=30) returns query results. Note: Use parameterized queries to prevent SQL injection. Warning: DDL operations may lock tables."
    parameters:
      - name: query
        type: string
        description: "SQL query to execute"
        required: true
      - name: database
        type: string
        description: "Database connection string or name"
        required: true
      - name: params
        type: string
        description: "JSON array of query parameters"
        required: false
      - name: timeout
        type: integer
        description: "Query timeout in seconds"
        required: false
        default: 30
      - name: fetch_size
        type: integer
        description: "Number of rows to fetch"
        required: false
        default: 1000
    tags: ["database", "sql", "query", "execute", "select"]
    test_prompts:
      single:
        - "Run this SQL query"
        - "Execute SELECT * FROM users"
        - "Query the database"
        - "Run an INSERT statement"

  - name: create_table
    descriptions:
      minimal: "Create table"
      short: "Create a database table"
      medium: "Create a new table in a database with specified columns and constraints."
      long: "Create a new database table. Define columns with types, constraints, and keys. Example: create_table(name='users', columns='[{\"name\": \"id\", \"type\": \"INT\", \"primary_key\": true}]', database='mydb')."
      verbose: "Create database tables with full schema definition. Column properties: name, type, nullable, default, primary_key, unique, foreign_key. Table options: engine (MySQL), partitioning, indexes. Example: create_table(name='orders', columns='[{\"name\": \"id\", \"type\": \"SERIAL\", \"primary_key\": true}, {\"name\": \"user_id\", \"type\": \"INT\", \"foreign_key\": \"users(id)\"}]', database='postgres://localhost/shop'). Note: Types vary by database. Warning: IF NOT EXISTS prevents errors on existing tables."
    parameters:
      - name: name
        type: string
        description: "Table name"
        required: true
      - name: columns
        type: string
        description: "JSON array of column definitions"
        required: true
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: if_not_exists
        type: boolean
        description: "Only create if not exists"
        required: false
        default: true
      - name: primary_key
        type: string
        description: "Primary key column(s)"
        required: false
    tags: ["database", "table", "create", "ddl", "schema"]
    test_prompts:
      single:
        - "Create a users table"
        - "Define a new table with these columns"
        - "Create the orders table"
        - "Set up a new database table"

  - name: backup_database
    descriptions:
      minimal: "Backup database"
      short: "Create a database backup"
      medium: "Create a backup of a database or specific tables."
      long: "Create a backup/dump of a database. Options for full or partial backup, compression, and format. Example: backup_database(database='mydb', output='backup.sql')."
      verbose: "Create database backups. Types: 'full' (all data and schema), 'schema' (structure only), 'data' (data only), 'incremental' (changes since last backup). Formats: SQL dump, binary, archive. Options: compression (gzip, bzip2), specific tables, exclude patterns. Example: backup_database(database='postgres://localhost/prod', type='full', format='sql', compress=true, output='prod_backup.sql.gz'). Note: Large databases should use streaming backup. Warning: Backups may lock tables; schedule during low usage."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: output
        type: string
        description: "Output file path"
        required: true
      - name: type
        type: string
        description: "Backup type"
        required: false
        default: "full"
        enum: ["full", "schema", "data", "incremental"]
      - name: format
        type: string
        description: "Backup format"
        required: false
        default: "sql"
        enum: ["sql", "binary", "archive"]
      - name: compress
        type: boolean
        description: "Compress output"
        required: false
        default: false
      - name: tables
        type: string
        description: "JSON array of specific tables"
        required: false
    tags: ["database", "backup", "dump", "export", "disaster_recovery"]
    test_prompts:
      single:
        - "Backup the database"
        - "Create a database dump"
        - "Export the database to SQL"
        - "Make a backup of the users table"

  - name: restore_database
    descriptions:
      minimal: "Restore database"
      short: "Restore a database from backup"
      medium: "Restore a database from a backup file."
      long: "Restore a database from a backup dump file. Supports SQL dumps and binary formats. Example: restore_database(backup='backup.sql', database='mydb')."
      verbose: "Restore databases from backup files. Options: drop existing database, create new database, restore specific tables, skip errors. Formats: SQL dump, pg_dump binary, mysqldump. Example: restore_database(backup='prod_backup.sql.gz', database='postgres://localhost/test', drop_existing=true, decompress=true). Note: Ensure database user has sufficient privileges. Warning: drop_existing destroys all current data; verify target carefully."
    parameters:
      - name: backup
        type: string
        description: "Backup file path"
        required: true
      - name: database
        type: string
        description: "Target database connection"
        required: true
      - name: drop_existing
        type: boolean
        description: "Drop existing database first"
        required: false
        default: false
      - name: decompress
        type: boolean
        description: "Decompress backup file"
        required: false
        default: false
      - name: tables
        type: string
        description: "JSON array of specific tables to restore"
        required: false
    tags: ["database", "restore", "import", "recovery", "backup"]
    test_prompts:
      single:
        - "Restore the database from backup"
        - "Import the SQL dump"
        - "Restore from this backup file"
        - "Recover the database"

  - name: create_index
    descriptions:
      minimal: "Create index"
      short: "Create a database index"
      medium: "Create an index on a database table to improve query performance."
      long: "Create an index on table columns for faster queries. Supports unique, partial, and composite indexes. Example: create_index(table='users', columns='[\"email\"]', name='idx_users_email')."
      verbose: "Create database indexes for query optimization. Types: 'btree' (default, range queries), 'hash' (equality), 'gin' (full-text), 'gist' (geometric). Options: unique, partial (WHERE clause), include columns, concurrent creation. Example: create_index(table='orders', columns='[\"user_id\", \"created_at\"]', type='btree', name='idx_orders_user_date', where='status = \"active\"', database='postgres://localhost/shop'). Note: Indexes speed reads but slow writes. Warning: Creating indexes on large tables can take time and lock writes."
    parameters:
      - name: table
        type: string
        description: "Table name"
        required: true
      - name: columns
        type: string
        description: "JSON array of column names"
        required: true
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: name
        type: string
        description: "Index name"
        required: false
      - name: type
        type: string
        description: "Index type"
        required: false
        default: "btree"
        enum: ["btree", "hash", "gin", "gist"]
      - name: unique
        type: boolean
        description: "Create unique index"
        required: false
        default: false
      - name: concurrent
        type: boolean
        description: "Create concurrently (no locks)"
        required: false
        default: false
    tags: ["database", "index", "create", "performance", "optimization"]
    test_prompts:
      single:
        - "Create an index on the email column"
        - "Add an index to the users table"
        - "Create a composite index"
        - "Add a unique index"

  - name: analyze_query
    descriptions:
      minimal: "Analyze query"
      short: "Analyze SQL query performance"
      medium: "Analyze a SQL query's execution plan and performance characteristics."
      long: "Get the execution plan for a SQL query. Shows how the database will execute the query and estimated costs. Example: analyze_query(query='SELECT * FROM users WHERE email = ?', database='mydb')."
      verbose: "Analyze SQL query execution plans for performance optimization. Returns: execution plan, estimated rows, actual time (if executed), index usage, join methods, sequential scans. Modes: 'explain' (plan only), 'analyze' (execute and measure). Example: analyze_query(query='SELECT * FROM orders o JOIN users u ON o.user_id = u.id', mode='analyze', format='json', database='postgres://localhost/shop'). Note: ANALYZE actually executes the query. Warning: Use EXPLAIN only for data-modifying queries unless you want them to execute."
    parameters:
      - name: query
        type: string
        description: "SQL query to analyze"
        required: true
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: mode
        type: string
        description: "Analysis mode"
        required: false
        default: "explain"
        enum: ["explain", "analyze"]
      - name: format
        type: string
        description: "Output format"
        required: false
        default: "text"
        enum: ["text", "json", "yaml"]
      - name: params
        type: string
        description: "Query parameters"
        required: false
    tags: ["database", "query", "analyze", "performance", "explain"]
    test_prompts:
      single:
        - "Explain this query"
        - "Analyze the query performance"
        - "Show the execution plan"
        - "Why is this query slow?"

  - name: manage_connection_pool
    descriptions:
      minimal: "Manage pool"
      short: "Manage database connection pool"
      medium: "Configure and manage database connection pooling settings."
      long: "Manage database connection pool. Set min/max connections, timeouts, and view pool statistics. Example: manage_connection_pool(database='mydb', action='stats')."
      verbose: "Manage database connection pools for optimal performance. Actions: 'create' (initialize pool), 'stats' (view statistics), 'resize' (change limits), 'drain' (close connections), 'refresh' (cycle connections). Settings: min/max connections, idle timeout, max lifetime, connection timeout. Example: manage_connection_pool(database='postgres://localhost/app', action='create', min_size=5, max_size=20, idle_timeout=300). Note: Pool size should match expected concurrency. Warning: Draining pool affects active queries."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: action
        type: string
        description: "Pool action"
        required: true
        enum: ["create", "stats", "resize", "drain", "refresh"]
      - name: min_size
        type: integer
        description: "Minimum pool size"
        required: false
        default: 5
      - name: max_size
        type: integer
        description: "Maximum pool size"
        required: false
        default: 20
      - name: idle_timeout
        type: integer
        description: "Idle connection timeout (seconds)"
        required: false
        default: 300
    tags: ["database", "connection", "pool", "performance", "manage"]
    test_prompts:
      single:
        - "Show connection pool stats"
        - "Resize the connection pool"
        - "Create a connection pool"
        - "Drain idle connections"

  - name: migrate_database
    descriptions:
      minimal: "Migrate database"
      short: "Run database migrations"
      medium: "Run database schema migrations to update the database structure."
      long: "Run database migrations. Apply pending migrations, rollback, or check migration status. Example: migrate_database(action='up', database='mydb')."
      verbose: "Manage database schema migrations. Actions: 'up' (apply pending), 'down' (rollback last), 'status' (show pending/applied), 'create' (generate migration file), 'redo' (rollback and reapply last). Migration files contain up/down SQL. Example: migrate_database(action='up', count=5, database='postgres://localhost/app', migrations_dir='./migrations'). Note: Always backup before migrating production. Warning: Down migrations may lose data; test thoroughly."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: action
        type: string
        description: "Migration action"
        required: true
        enum: ["up", "down", "status", "create", "redo"]
      - name: count
        type: integer
        description: "Number of migrations to apply/rollback"
        required: false
        default: 1
      - name: migrations_dir
        type: string
        description: "Directory containing migrations"
        required: false
        default: "./migrations"
      - name: name
        type: string
        description: "Migration name (for create)"
        required: false
    tags: ["database", "migration", "schema", "ddl", "versioning"]
    test_prompts:
      single:
        - "Run pending migrations"
        - "Rollback the last migration"
        - "Check migration status"
        - "Create a new migration"

  - name: replicate_database
    descriptions:
      minimal: "Replicate database"
      short: "Set up database replication"
      medium: "Configure database replication between primary and replica servers."
      long: "Set up and manage database replication. Configure primary-replica relationships and sync status. Example: replicate_database(primary='db1', replica='db2', action='setup')."
      verbose: "Configure and manage database replication. Modes: 'sync' (synchronous), 'async' (asynchronous), 'logical' (selective tables). Actions: 'setup' (initialize replication), 'status' (check lag/health), 'promote' (make replica primary), 'pause'/'resume' replication. Example: replicate_database(primary='postgres://primary:5432/db', replica='postgres://replica:5432/db', mode='async', action='setup'). Note: Synchronous replication ensures durability but adds latency. Warning: Promotion is irreversible; ensure failover is intentional."
    parameters:
      - name: primary
        type: string
        description: "Primary database connection"
        required: true
      - name: replica
        type: string
        description: "Replica database connection"
        required: true
      - name: action
        type: string
        description: "Replication action"
        required: true
        enum: ["setup", "status", "promote", "pause", "resume"]
      - name: mode
        type: string
        description: "Replication mode"
        required: false
        default: "async"
        enum: ["sync", "async", "logical"]
      - name: tables
        type: string
        description: "Tables to replicate (for logical)"
        required: false
    tags: ["database", "replication", "replica", "sync", "high_availability"]
    test_prompts:
      single:
        - "Set up database replication"
        - "Check replication status"
        - "Promote the replica to primary"
        - "Configure master-slave replication"

  - name: vacuum_database
    descriptions:
      minimal: "Vacuum database"
      short: "Vacuum and optimize database"
      medium: "Vacuum, analyze, or optimize database tables to reclaim space and update statistics."
      long: "Perform database maintenance: vacuum (reclaim space), analyze (update statistics), optimize. Example: vacuum_database(database='mydb', table='users', action='vacuum')."
      verbose: "Perform database maintenance operations. Actions: 'vacuum' (reclaim dead row space), 'analyze' (update query planner statistics), 'vacuum_analyze' (both), 'reindex' (rebuild indexes), 'optimize' (database-specific optimization). Options: full vacuum (reclaims more space, locks table), verbose output. Example: vacuum_database(database='postgres://localhost/app', table='orders', action='vacuum_analyze', full=false, verbose=true). Note: Regular maintenance improves performance. Warning: VACUUM FULL locks the table; schedule during maintenance windows."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: action
        type: string
        description: "Maintenance action"
        required: true
        enum: ["vacuum", "analyze", "vacuum_analyze", "reindex", "optimize"]
      - name: table
        type: string
        description: "Specific table (all if omitted)"
        required: false
      - name: full
        type: boolean
        description: "Full vacuum (locks table)"
        required: false
        default: false
      - name: verbose
        type: boolean
        description: "Verbose output"
        required: false
        default: false
    tags: ["database", "vacuum", "maintenance", "optimize", "performance"]
    test_prompts:
      single:
        - "Vacuum the database"
        - "Update table statistics"
        - "Optimize the users table"
        - "Run database maintenance"
  - name: execute_transaction
    descriptions:
      minimal: "Execute transaction"
      short: "Execute database transaction"
      medium: "Execute multiple SQL statements within a single atomic transaction."
      long: "Execute multiple statements as an atomic transaction. Either all succeed or all are rolled back. Example: execute_transaction(database='mydb', statements='[\"INSERT INTO...\", \"UPDATE...\"]')."
      verbose: "Execute SQL statements within a transaction for atomicity. Features: multiple statements, savepoints, isolation levels, automatic rollback on error. Example: execute_transaction(database='postgres://localhost/app', statements='[\"INSERT INTO orders (customer_id, total) VALUES (1, 100.00)\", \"UPDATE inventory SET quantity = quantity - 1 WHERE product_id = 5\"]', isolation_level='serializable', timeout=30). Returns: commit status, rows affected per statement. Note: Long transactions can cause lock contention. Warning: Ensure proper error handling for rollbacks."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: statements
        type: string
        description: "JSON array of SQL statements"
        required: true
      - name: isolation_level
        type: string
        description: "Transaction isolation level"
        required: false
        default: "read_committed"
        enum: ["read_uncommitted", "read_committed", "repeatable_read", "serializable"]
      - name: timeout
        type: integer
        description: "Transaction timeout (seconds)"
        required: false
        default: 30
      - name: dry_run
        type: boolean
        description: "Rollback after execution"
        required: false
        default: false
    tags: ["database", "transaction", "atomic", "sql", "acid"]
    test_prompts:
      single:
        - "Execute statements in a transaction"
        - "Run atomic database operation"
        - "Process transfer as transaction"
        - "Execute SQL with rollback on error"

  - name: create_database_user
    descriptions:
      minimal: "Create DB user"
      short: "Create a database user"
      medium: "Create a new database user with specified roles and permissions."
      long: "Create a database user with password and role assignments. Configure access privileges. Example: create_database_user(database='mydb', username='app_user', password='...', roles='[\"readonly\"]')."
      verbose: "Create database users with fine-grained permissions. Configuration: username, password (or external auth), roles, database access, schema access, table-level grants. Example: create_database_user(database='postgres://localhost/app', username='reporting_user', password='secure123', roles='[\"readonly\"]', databases='[\"analytics\"]', grant_select='[\"public.*\"]', valid_until='2025-12-31'). Note: Use principle of least privilege. Warning: Never create users with superuser access for applications."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: username
        type: string
        description: "New username"
        required: true
      - name: password
        type: string
        description: "User password"
        required: true
      - name: roles
        type: string
        description: "JSON array of roles"
        required: false
      - name: databases
        type: string
        description: "JSON array of accessible databases"
        required: false
      - name: grant_select
        type: string
        description: "Tables to grant SELECT"
        required: false
      - name: valid_until
        type: string
        description: "Password expiration date"
        required: false
    tags: ["database", "user", "security", "permissions", "create"]
    test_prompts:
      single:
        - "Create a database user"
        - "Add a read-only user"
        - "Set up application database user"
        - "Create user with limited permissions"

  - name: monitor_database_performance
    descriptions:
      minimal: "Monitor performance"
      short: "Monitor database performance"
      medium: "Get database performance metrics and identify slow queries."
      long: "Monitor database performance metrics. View active queries, slow queries, locks, and resource usage. Example: monitor_database_performance(database='mydb', metrics='[\"slow_queries\", \"locks\"]')."
      verbose: "Comprehensive database performance monitoring. Metrics: active connections, slow queries (with plans), lock waits, table/index bloat, cache hit ratio, replication lag, disk I/O, query statistics. Example: monitor_database_performance(database='postgres://localhost/app', metrics='[\"active_queries\", \"slow_queries\", \"locks\", \"cache_ratio\"]', slow_threshold_ms=1000, limit=50). Note: Some metrics require pg_stat_statements or similar extensions. Warning: Frequent monitoring queries can impact performance."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: metrics
        type: string
        description: "JSON array of metrics to collect"
        required: true
      - name: slow_threshold_ms
        type: integer
        description: "Slow query threshold (ms)"
        required: false
        default: 1000
      - name: limit
        type: integer
        description: "Max results per metric"
        required: false
        default: 20
      - name: include_query_plans
        type: boolean
        description: "Include EXPLAIN for slow queries"
        required: false
        default: false
    tags: ["database", "monitoring", "performance", "metrics", "slow_queries"]
    test_prompts:
      single:
        - "Show slow database queries"
        - "Check database performance"
        - "Monitor active connections"
        - "Get database metrics"

  - name: manage_database_connection_pool
    descriptions:
      minimal: "Manage connection pool"
      short: "Manage database connection pool"
      medium: "Configure and monitor database connection pool settings."
      long: "Manage database connection pooling. Configure pool size, timeouts, and monitor usage. Example: manage_database_connection_pool(action='configure', min_connections=5, max_connections=50)."
      verbose: "Manage database connection pools for performance. Actions: 'configure' (set parameters), 'status' (current state), 'reset' (clear connections), 'scale' (adjust size). Parameters: min/max connections, idle timeout, connection lifetime, queue timeout. Example: manage_database_connection_pool(database='postgres://localhost/app', action='configure', min_connections=10, max_connections=100, idle_timeout=300, max_lifetime=1800). Note: Pool size should match database max_connections. Warning: Too many connections can overwhelm the database."
    parameters:
      - name: database
        type: string
        description: "Database identifier"
        required: true
      - name: action
        type: string
        description: "Pool action"
        required: true
        enum: ["configure", "status", "reset", "scale"]
      - name: min_connections
        type: integer
        description: "Minimum pool size"
        required: false
      - name: max_connections
        type: integer
        description: "Maximum pool size"
        required: false
      - name: idle_timeout
        type: integer
        description: "Idle connection timeout (seconds)"
        required: false
      - name: max_lifetime
        type: integer
        description: "Max connection lifetime (seconds)"
        required: false
    tags: ["database", "connection", "pool", "performance", "scaling"]
    test_prompts:
      single:
        - "Configure connection pool"
        - "Check pool status"
        - "Increase max connections"
        - "Reset connection pool"

  - name: import_data
    descriptions:
      minimal: "Import data"
      short: "Import data into database"
      medium: "Import data from files into database tables."
      long: "Bulk import data from CSV, JSON, or other formats into database tables. Example: import_data(database='mydb', table='users', source='users.csv', format='csv')."
      verbose: "Bulk data import from files to database tables. Formats: CSV, JSON, Parquet, SQL dump. Options: column mapping, skip rows, batch size, conflict handling, transaction control. Example: import_data(database='postgres://localhost/app', table='products', source='s3://bucket/products.csv', format='csv', column_mapping='{\"sku\": \"product_id\", \"name\": \"product_name\"}', on_conflict='update', batch_size=1000, skip_rows=1). Note: Large imports should be batched. Warning: Validate data before import to avoid constraint violations."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: table
        type: string
        description: "Target table"
        required: true
      - name: source
        type: string
        description: "Source file path or URL"
        required: true
      - name: format
        type: string
        description: "Source format"
        required: true
        enum: ["csv", "json", "parquet", "sql"]
      - name: column_mapping
        type: string
        description: "JSON column name mapping"
        required: false
      - name: on_conflict
        type: string
        description: "Conflict handling"
        required: false
        enum: ["skip", "update", "error"]
      - name: batch_size
        type: integer
        description: "Rows per batch"
        required: false
        default: 1000
    tags: ["database", "import", "bulk", "etl", "data"]
    test_prompts:
      single:
        - "Import CSV into database"
        - "Load data from file"
        - "Bulk import products"
        - "Import JSON data"

  - name: export_data
    descriptions:
      minimal: "Export data"
      short: "Export data from database"
      medium: "Export data from database tables to files."
      long: "Export query results or table data to CSV, JSON, or other formats. Example: export_data(database='mydb', query='SELECT * FROM users', format='csv', output='users.csv')."
      verbose: "Export database data to files. Formats: CSV, JSON, Parquet, SQL. Options: full table, query results, filtered, with schema. Example: export_data(database='postgres://localhost/app', query='SELECT * FROM orders WHERE created_at > NOW() - INTERVAL \\'7 days\\'', format='csv', output='s3://bucket/weekly_orders.csv', include_headers=true, compression='gzip'). Note: Large exports may need streaming. Warning: Be mindful of sensitive data in exports."
    parameters:
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: query
        type: string
        description: "SQL query to export"
        required: false
      - name: table
        type: string
        description: "Table to export (alternative)"
        required: false
      - name: format
        type: string
        description: "Output format"
        required: true
        enum: ["csv", "json", "parquet", "sql"]
      - name: output
        type: string
        description: "Output file path"
        required: true
      - name: compression
        type: string
        description: "Compression type"
        required: false
        enum: ["none", "gzip", "zip"]
      - name: include_headers
        type: boolean
        description: "Include column headers"
        required: false
        default: true
    tags: ["database", "export", "backup", "csv", "data"]
    test_prompts:
