category: image_operations

tools:
  - name: resize_image
    descriptions:
      minimal: "Resize image"
      short: "Resize an image to new dimensions"
      medium: "Resize an image to specified width and height, with options for maintaining aspect ratio."
      long: "Resize an image to new dimensions. Can maintain aspect ratio or force exact dimensions. Supports various resampling algorithms. Example: resize_image(input='photo.jpg', width=800, height=600, keep_aspect=true)."
      verbose: "Resize an image to specified dimensions with flexible options. Methods: 'fit' (fit within bounds, maintain aspect), 'fill' (cover bounds, may crop), 'exact' (stretch to exact dimensions). Resampling algorithms: 'lanczos' (best quality), 'bilinear' (good quality), 'bicubic' (smooth), 'nearest' (fastest, pixelated). Example: resize_image(input='photo.jpg', width=1920, height=1080, method='fit', resampling='lanczos', output='photo_resized.jpg'). Note: Upscaling may reduce quality. Warning: Very large images may require significant memory."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: width
        type: integer
        description: "Target width in pixels"
        required: true
      - name: height
        type: integer
        description: "Target height in pixels"
        required: true
      - name: method
        type: string
        description: "Resize method"
        required: false
        default: "fit"
        enum: ["fit", "fill", "exact"]
      - name: resampling
        type: string
        description: "Resampling algorithm"
        required: false
        default: "lanczos"
        enum: ["lanczos", "bilinear", "bicubic", "nearest"]
    tags: ["image", "resize", "scale", "dimensions", "transform"]
    test_prompts:
      single:
        - "Resize the image to 800x600"
        - "Scale down the photo to fit within 1920x1080"
        - "Make the image 50% smaller"
        - "Resize the picture while keeping aspect ratio"
      single_clear:
        - "I need to resize an image to different dimensions. Resize the image to 800x600"
        - "I need to resize an image to different dimensions. Scale down the photo to fit within 1920x1080"
        - "I need to resize an image to different dimensions. Make the image 50% smaller"
        - "I need to resize an image to different dimensions. Resize the picture while keeping aspect ratio"

  - name: crop_image
    descriptions:
      minimal: "Crop image"
      short: "Crop an image to a specific region"
      medium: "Crop an image to a rectangular region defined by coordinates or aspect ratio."
      long: "Crop an image to a specific rectangular region. Define by coordinates or by aspect ratio with optional alignment. Example: crop_image(input='photo.jpg', x=100, y=100, width=500, height=500)."
      verbose: "Crop an image to a rectangular region. Methods: 'coordinates' (exact x, y, width, height), 'aspect_ratio' (crop to ratio with alignment), 'center' (crop to size from center). Can auto-detect subject and smart crop. Example: crop_image(input='photo.jpg', aspect_ratio='16:9', gravity='center', smart_crop=true). Note: Coordinates are in pixels from top-left. Warning: Cropping removes image data permanently."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: x
        type: integer
        description: "X coordinate of top-left corner"
        required: false
      - name: y
        type: integer
        description: "Y coordinate of top-left corner"
        required: false
      - name: width
        type: integer
        description: "Width of crop region"
        required: false
      - name: height
        type: integer
        description: "Height of crop region"
        required: false
      - name: aspect_ratio
        type: string
        description: "Aspect ratio (e.g., '16:9')"
        required: false
      - name: gravity
        type: string
        description: "Alignment for aspect ratio crop"
        required: false
        default: "center"
        enum: ["center", "north", "south", "east", "west", "smart"]
    tags: ["image", "crop", "cut", "region", "transform"]
    test_prompts:
      single:
        - "Crop the image to a 1:1 square"
        - "Cut out the center 500x500 pixels"
        - "Crop the photo to 16:9 aspect ratio"
        - "Remove the edges of the image"
      single_clear:
        - "Please crop an image to specific bounds. Crop the image to a 1:1 square"
        - "Please crop an image to specific bounds. Cut out the center 500x500 pixels"
        - "Please crop an image to specific bounds. Crop the photo to 16:9 aspect ratio"
        - "Please crop an image to specific bounds. Remove the edges of the image"

  - name: rotate_image
    descriptions:
      minimal: "Rotate image"
      short: "Rotate an image by a specified angle"
      medium: "Rotate an image by degrees, with options for background fill and auto-cropping."
      long: "Rotate an image by a specified angle. Can expand canvas to fit or crop to original size. Example: rotate_image(input='photo.jpg', angle=90)."
      verbose: "Rotate an image by any angle. Options: expand canvas to fit rotated image, crop to original dimensions, fill background color. Positive angles rotate counter-clockwise. Example: rotate_image(input='photo.jpg', angle=45, expand=true, background='#FFFFFF', output='photo_rotated.jpg'). Note: Rotation by angles not divisible by 90° may introduce interpolation artifacts. Warning: Auto-rotating based on EXIF data may give unexpected results."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: angle
        type: number
        description: "Rotation angle in degrees"
        required: true
      - name: expand
        type: boolean
        description: "Expand canvas to fit rotated image"
        required: false
        default: false
      - name: background
        type: string
        description: "Background color for expanded areas"
        required: false
        default: "#FFFFFF"
    tags: ["image", "rotate", "turn", "angle", "transform"]
    test_prompts:
      single:
        - "Rotate the image 90 degrees clockwise"
        - "Turn the photo 45 degrees"
        - "Flip the image upside down (rotate 180)"
        - "Rotate the image by 15 degrees"
      single_clear:
        - "I need to rotate an image by a certain angle. Rotate the image 90 degrees clockwise"
        - "I need to rotate an image by a certain angle. Turn the photo 45 degrees"
        - "I need to rotate an image by a certain angle. Flip the image upside down (rotate 180)"
        - "I need to rotate an image by a certain angle. Rotate the image by 15 degrees"

  - name: flip_image
    descriptions:
      minimal: "Flip image"
      short: "Flip an image horizontally or vertically"
      medium: "Mirror an image horizontally (left-right) or vertically (top-bottom)."
      long: "Flip an image along an axis. Horizontal flip creates a mirror image, vertical flip creates an upside-down mirror. Example: flip_image(input='photo.jpg', direction='horizontal')."
      verbose: "Flip (mirror) an image along an axis. Directions: 'horizontal' (left becomes right), 'vertical' (top becomes bottom), 'both' (180° rotation equivalent). Common uses: correcting selfie cameras, creating mirror effects. Example: flip_image(input='selfie.jpg', direction='horizontal', output='selfie_fixed.jpg'). Note: Flipping text in images makes it unreadable. Warning: Flipping may break visual coherence in some images."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: direction
        type: string
        description: "Flip direction"
        required: true
        enum: ["horizontal", "vertical", "both"]
    tags: ["image", "flip", "mirror", "transform"]
    test_prompts:
      single:
        - "Flip the image horizontally"
        - "Mirror the photo"
        - "Flip the image upside down"
        - "Create a mirror image"
      single_clear:
        - "I want to flip or mirror an image. Flip the image horizontally"
        - "I want to flip or mirror an image. Mirror the photo"
        - "I want to flip or mirror an image. Flip the image upside down"
        - "I want to flip or mirror an image. Create a mirror image"

  - name: convert_image_format
    descriptions:
      minimal: "Convert image format"
      short: "Convert an image to a different format"
      medium: "Convert an image from one format to another (PNG, JPEG, WebP, GIF, etc.)."
      long: "Convert an image to a different file format. Supports PNG, JPEG, WebP, GIF, BMP, TIFF, and more. Can adjust quality for lossy formats. Example: convert_image_format(input='photo.png', format='jpeg', quality=85)."
      verbose: "Convert images between formats with optimization options. Formats: 'png' (lossless, transparency), 'jpeg' (lossy, smaller), 'webp' (modern, best compression), 'gif' (animation, limited colors), 'bmp' (uncompressed), 'tiff' (high quality). Quality (1-100) applies to lossy formats. Example: convert_image_format(input='photo.png', format='webp', quality=80, optimize=true). Note: Converting from lossy to lossless doesn't restore quality. Warning: Transparency is lost when converting to JPEG."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: format
        type: string
        description: "Target format"
        required: true
        enum: ["png", "jpeg", "webp", "gif", "bmp", "tiff"]
      - name: quality
        type: integer
        description: "Quality for lossy formats (1-100)"
        required: false
        default: 85
      - name: optimize
        type: boolean
        description: "Optimize output file size"
        required: false
        default: true
    tags: ["image", "convert", "format", "jpeg", "png", "webp"]
    test_prompts:
      single:
        - "Convert the PNG to JPEG"
        - "Change the image format to WebP"
        - "Save the image as a GIF"
        - "Convert the photo to PNG format"
      single_clear:
        - "Please convert an image to a different format. Convert the PNG to JPEG"
        - "Please convert an image to a different format. Change the image format to WebP"
        - "Please convert an image to a different format. Save the image as a GIF"
        - "Please convert an image to a different format. Convert the photo to PNG format"

  - name: compress_image
    descriptions:
      minimal: "Compress image"
      short: "Compress an image to reduce file size"
      medium: "Compress an image to reduce file size while maintaining acceptable quality."
      long: "Compress an image to reduce file size. Adjusts quality, removes metadata, and optimizes encoding. Example: compress_image(input='photo.jpg', quality=70, output='photo_compressed.jpg')."
      verbose: "Compress images to reduce file size for web or storage. Methods include quality reduction, chroma subsampling, progressive encoding, and metadata stripping. Can target a specific file size or compression ratio. Example: compress_image(input='photo.jpg', target_size='500KB', strip_metadata=true, progressive=true). Note: Higher compression = lower quality. Warning: Very high compression causes visible artifacts."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: quality
        type: integer
        description: "Compression quality (1-100)"
        required: false
        default: 80
      - name: target_size
        type: string
        description: "Target file size (e.g., '500KB')"
        required: false
      - name: strip_metadata
        type: boolean
        description: "Remove EXIF and other metadata"
        required: false
        default: true
      - name: progressive
        type: boolean
        description: "Use progressive encoding"
        required: false
        default: true
    tags: ["image", "compress", "optimize", "reduce", "size"]
    test_prompts:
      single:
        - "Compress the image to reduce file size"
        - "Optimize the photo for web"
        - "Reduce the image size to under 500KB"
        - "Compress all images in the folder"
      single_clear:
        - "I need to compress an image to reduce its file size. Compress the image to reduce file size"
        - "I need to compress an image to reduce its file size. Optimize the photo for web"
        - "I need to compress an image to reduce its file size. Reduce the image size to under 500KB"
        - "I need to compress an image to reduce its file size. Compress all images in the folder"

  - name: apply_filter
    descriptions:
      minimal: "Apply filter"
      short: "Apply a filter or effect to an image"
      medium: "Apply visual filters like blur, sharpen, grayscale, sepia, or artistic effects."
      long: "Apply visual filters and effects to an image. Includes blur, sharpen, grayscale, sepia, brightness, contrast, saturation adjustments. Example: apply_filter(input='photo.jpg', filter='grayscale')."
      verbose: "Apply visual filters and adjustments to images. Filters: 'blur', 'sharpen', 'grayscale', 'sepia', 'negative', 'emboss', 'edge_detect'. Adjustments (with intensity): 'brightness', 'contrast', 'saturation', 'hue', 'gamma'. Can chain multiple filters. Example: apply_filter(input='photo.jpg', filter='sharpen', intensity=1.5, adjustments='{\"brightness\": 10, \"contrast\": 20}'). Note: Filter order matters when chaining. Warning: Some filters are computationally intensive on large images."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: filter
        type: string
        description: "Filter to apply"
        required: true
        enum: ["blur", "sharpen", "grayscale", "sepia", "negative", "emboss", "edge_detect"]
      - name: intensity
        type: number
        description: "Filter intensity (0.0-3.0)"
        required: false
        default: 1.0
      - name: adjustments
        type: string
        description: "JSON object of additional adjustments"
        required: false
    tags: ["image", "filter", "effect", "adjust", "enhance"]
    test_prompts:
      single:
        - "Convert the image to grayscale"
        - "Apply a sepia filter to the photo"
        - "Blur the image slightly"
        - "Sharpen the photo"
      single_clear:
        - "I want to apply a visual filter to an image. Convert the image to grayscale"
        - "I want to apply a visual filter to an image. Apply a sepia filter to the photo"
        - "I want to apply a visual filter to an image. Blur the image slightly"
        - "I want to apply a visual filter to an image. Sharpen the photo"

  - name: add_watermark
    descriptions:
      minimal: "Add watermark"
      short: "Add a watermark to an image"
      medium: "Add a text or image watermark to a photo with position and opacity controls."
      long: "Add a watermark to an image. Supports text watermarks with customizable font, or image watermarks. Control position, opacity, and size. Example: add_watermark(input='photo.jpg', text='© 2024', position='bottom-right', opacity=0.5)."
      verbose: "Add text or image watermarks to protect or brand images. Text options: font, size, color, shadow. Image watermark options: scale, blend mode. Positions: 'center', 'top-left', 'top-right', 'bottom-left', 'bottom-right', 'tile' (repeat across image). Example: add_watermark(input='photo.jpg', text='CONFIDENTIAL', font_size=48, color='#FF0000', position='center', opacity=0.3, angle=45). Note: Tile mode covers entire image with repeating watermark. Warning: Watermarks can be removed; not a substitute for DRM."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: text
        type: string
        description: "Watermark text"
        required: false
      - name: watermark_image
        type: string
        description: "Path to watermark image"
        required: false
      - name: position
        type: string
        description: "Watermark position"
        required: false
        default: "bottom-right"
        enum: ["center", "top-left", "top-right", "bottom-left", "bottom-right", "tile"]
      - name: opacity
        type: number
        description: "Watermark opacity (0.0-1.0)"
        required: false
        default: 0.5
      - name: font_size
        type: integer
        description: "Font size for text watermark"
        required: false
        default: 24
      - name: color
        type: string
        description: "Text color (hex)"
        required: false
        default: "#FFFFFF"
      - name: angle
        type: number
        description: "Rotation angle for watermark"
        required: false
        default: 0
    tags: ["image", "watermark", "text", "brand", "protect"]
    test_prompts:
      single:
        - "Add a copyright watermark to the photo"
        - "Put my logo on the image"
        - "Add 'DRAFT' watermark to the document image"
        - "Watermark the image with my website"
      single_clear:
        - "I need to add a watermark to an image. Add a copyright watermark to the photo"
        - "I need to add a watermark to an image. Put my logo on the image"
        - "I need to add a watermark to an image. Add 'DRAFT' watermark to the document image"
        - "I need to add a watermark to an image. Watermark the image with my website"

  - name: get_image_info
    descriptions:
      minimal: "Get image info"
      short: "Get metadata and properties of an image"
      medium: "Retrieve image metadata including dimensions, format, color mode, and EXIF data."
      long: "Get detailed information about an image file. Returns dimensions, format, color mode, file size, and EXIF metadata. Example: get_image_info(input='photo.jpg') returns {width: 1920, height: 1080, format: 'JPEG', ...}."
      verbose: "Retrieve comprehensive metadata about an image. Properties: dimensions (width, height), format, color mode (RGB, RGBA, CMYK), bit depth, file size, DPI. EXIF data includes: camera model, date taken, exposure settings, GPS coordinates. Example: get_image_info(input='photo.jpg', include_exif=true, include_histogram=true). Note: EXIF data may not be present in all images. Warning: EXIF may contain sensitive location information."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: include_exif
        type: boolean
        description: "Include EXIF metadata"
        required: false
        default: true
      - name: include_histogram
        type: boolean
        description: "Include color histogram data"
        required: false
        default: false
    tags: ["image", "info", "metadata", "exif", "properties"]
    test_prompts:
      single:
        - "Get the dimensions of the image"
        - "What format is this image?"
        - "Show me the EXIF data for the photo"
        - "Get the image resolution and color mode"
      single_clear:
        - "I need to get information about an image. Get the dimensions of the image"
        - "I need to get information about an image. What format is this image?"
        - "I need to get information about an image. Show me the EXIF data for the photo"
        - "I need to get information about an image. Get the image resolution and color mode"

  - name: create_thumbnail
    descriptions:
      minimal: "Create thumbnail"
      short: "Create a thumbnail of an image"
      medium: "Generate a small thumbnail preview of an image with consistent sizing."
      long: "Create a thumbnail of an image. Generates a small preview maintaining aspect ratio, optionally with exact dimensions using cropping. Example: create_thumbnail(input='photo.jpg', size=150)."
      verbose: "Generate thumbnail images for previews and galleries. Modes: 'contain' (fit within size, maintain aspect), 'cover' (fill size, crop excess), 'stretch' (exact size, may distort). Quality options for file size optimization. Example: create_thumbnail(input='photo.jpg', size=200, mode='cover', quality=80, output='photo_thumb.jpg'). Note: Square thumbnails use cover mode by default. Warning: Very small thumbnails lose significant detail."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: output
        type: string
        description: "Path for thumbnail"
        required: false
      - name: size
        type: integer
        description: "Thumbnail size in pixels"
        required: false
        default: 150
      - name: mode
        type: string
        description: "Thumbnail generation mode"
        required: false
        default: "contain"
        enum: ["contain", "cover", "stretch"]
      - name: quality
        type: integer
        description: "Output quality (1-100)"
        required: false
        default: 85
    tags: ["image", "thumbnail", "preview", "resize", "gallery"]
    test_prompts:
      single:
        - "Create a thumbnail of the photo"
        - "Generate 150px thumbnails for all images"
        - "Make a small preview image"
        - "Create a square thumbnail for the gallery"
      single_clear:
        - "I want to create a thumbnail from an image. Create a thumbnail of the photo"
        - "I want to create a thumbnail from an image. Generate 150px thumbnails for all images"
        - "I want to create a thumbnail from an image. Make a small preview image"
        - "I want to create a thumbnail from an image. Create a square thumbnail for the gallery"

  - name: overlay_images
    descriptions:
      minimal: "Overlay images"
      short: "Overlay one image on top of another"
      medium: "Composite multiple images by overlaying them with position and blend mode controls."
      long: "Overlay one image on top of another (compositing). Control position, opacity, and blending mode. Example: overlay_images(base='background.jpg', overlay='logo.png', position='center', opacity=0.8)."
      verbose: "Composite images by overlaying one on another. Blend modes: 'normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten', 'difference'. Position can be coordinates or named positions. Scale overlay relative to base. Example: overlay_images(base='photo.jpg', overlay='frame.png', position='center', blend_mode='overlay', scale=1.0, opacity=1.0). Note: Overlay images with transparency work best in PNG format. Warning: Large overlays may significantly impact performance."
    parameters:
      - name: base
        type: string
        description: "Path to base image"
        required: true
      - name: overlay
        type: string
        description: "Path to overlay image"
        required: true
      - name: output
        type: string
        description: "Path for output image"
        required: false
      - name: position
        type: string
        description: "Position (e.g., 'center', '100,50')"
        required: false
        default: "center"
      - name: opacity
        type: number
        description: "Overlay opacity (0.0-1.0)"
        required: false
        default: 1.0
      - name: blend_mode
        type: string
        description: "Blending mode"
        required: false
        default: "normal"
        enum: ["normal", "multiply", "screen", "overlay", "darken", "lighten", "difference"]
      - name: scale
        type: number
        description: "Scale factor for overlay"
        required: false
        default: 1.0
    tags: ["image", "overlay", "composite", "blend", "combine"]
    test_prompts:
      single:
        - "Put the logo on top of the photo"
        - "Overlay the frame on the image"
        - "Combine the two images"
        - "Add the overlay with 50% opacity"
      single_clear:
        - "I need to overlay one image on top of another. Put the logo on top of the photo"
        - "I need to overlay one image on top of another. Overlay the frame on the image"
        - "I need to overlay one image on top of another. Combine the two images"
        - "I need to overlay one image on top of another. Add the overlay with 50% opacity"

  - name: extract_colors
    descriptions:
      minimal: "Extract colors"
      short: "Extract dominant colors from an image"
      medium: "Analyze an image and extract the most dominant colors, returning their hex values."
      long: "Extract the dominant colors from an image. Uses clustering algorithms to identify the main colors. Returns hex values and percentages. Example: extract_colors(input='photo.jpg', count=5)."
      verbose: "Extract dominant colors from an image using color quantization. Returns colors as hex codes with their percentage of the image and optional names. Algorithms: 'kmeans' (accurate), 'median_cut' (fast), 'octree' (memory efficient). Can exclude background or specific color ranges. Example: extract_colors(input='product.jpg', count=5, algorithm='kmeans', exclude_white=true). Note: Results may vary slightly between runs with kmeans. Warning: Complex images may not have clearly dominant colors."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: count
        type: integer
        description: "Number of colors to extract"
        required: false
        default: 5
      - name: algorithm
        type: string
        description: "Color extraction algorithm"
        required: false
        default: "kmeans"
        enum: ["kmeans", "median_cut", "octree"]
      - name: exclude_white
        type: boolean
        description: "Exclude near-white colors"
        required: false
        default: false
      - name: exclude_black
        type: boolean
        description: "Exclude near-black colors"
        required: false
        default: false
    tags: ["image", "color", "extract", "palette", "analyze"]
    test_prompts:
      single:
        - "Get the main colors from the image"
        - "Extract the color palette from the photo"
        - "What are the dominant colors in this image?"
        - "Find the 5 most common colors"
      single_clear:
        - "I want to extract the dominant colors from an image. Get the main colors from the image"
        - "I want to extract the dominant colors from an image. Extract the color palette from the photo"
        - "I want to extract the dominant colors from an image. What are the dominant colors in this image?"
        - "I want to extract the dominant colors from an image. Find the 5 most common colors"

  - name: ocr_image
    descriptions:
      minimal: "OCR image"
      short: "Extract text from an image using OCR"
      medium: "Use Optical Character Recognition to extract text content from an image."
      long: "Perform OCR to extract text from images. Supports multiple languages and outputs plain text or structured data with positions. Example: ocr_image(input='document.jpg', language='en')."
      verbose: "Extract text from images using Optical Character Recognition. Supports 100+ languages and scripts. Output formats: 'text' (plain text), 'words' (with positions), 'lines', 'paragraphs'. Can detect language automatically. Pre-processing options for better accuracy. Example: ocr_image(input='receipt.jpg', language='en', output_format='lines', preprocess=true, dpi=300). Note: Accuracy depends on image quality and font clarity. Warning: Handwritten text recognition is less accurate."
    parameters:
      - name: input
        type: string
        description: "Path to input image"
        required: true
      - name: language
        type: string
        description: "Language code(s), comma-separated"
        required: false
        default: "en"
      - name: output_format
        type: string
        description: "Output format"
        required: false
        default: "text"
        enum: ["text", "words", "lines", "paragraphs"]
      - name: preprocess
        type: boolean
        description: "Apply preprocessing for better accuracy"
        required: false
        default: true
      - name: dpi
        type: integer
        description: "DPI for processing (affects accuracy)"
        required: false
        default: 300
