      long: "Detect objects in images using AI. Returns object labels, bounding boxes, and confidence scores. Example: detect_objects(image='street_scene.jpg')."
      verbose: "Detect and classify objects in images using deep learning. Returns: object labels, bounding boxes, confidence scores, segmentation masks (optional). Models: 'general' (80+ common objects), 'traffic' (vehicles, signs), 'retail' (products), 'custom' (user-trained). Example: detect_objects(image='parking.jpg', model='traffic', min_confidence=0.6, include_masks=true) returns detected vehicles with pixel-level masks. Note: Confidence threshold affects detection sensitivity. Warning: Small or occluded objects may have lower detection rates."
    parameters:
      - name: image
        type: string
        description: "Path to input image"
        required: true
      - name: model
        type: string
        description: "Detection model"
        required: false
        default: "general"
        enum: ["general", "traffic", "retail", "custom"]
      - name: min_confidence
        type: number
        description: "Minimum confidence threshold"
        required: false
        default: 0.5
      - name: include_masks
        type: boolean
        description: "Include segmentation masks"
        required: false
        default: false
      - name: max_objects
        type: integer
        description: "Maximum objects to detect"
        required: false
        default: 100
    tags: ["image", "object", "detect", "ai", "recognition", "yolo"]
    test_prompts:
      single:
        - "What objects are in this image?"
        - "Detect all objects in the photo"
        - "Find and label the objects"
        - "Identify items in this picture"
      single_clear:
        - "I need to detect and identify objects in an image. What objects are in this image?"
        - "I need to detect and identify objects in an image. Detect all objects in the photo"
        - "I need to detect and identify objects in an image. Find and label the objects"
        - "I need to detect and identify objects in an image. Identify items in this picture"
