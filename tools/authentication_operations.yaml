  - name: sync_directory
    descriptions:
      minimal: "Sync directory"
      short: "Sync user directory"
      medium: "Synchronize users and groups from external directories like LDAP or Azure AD."
      long: "Sync user directory from LDAP, Active Directory, or cloud providers. Example: sync_directory(source='azure_ad', action='sync', groups='[\"employees\", \"contractors\"]')."
      verbose: "Directory synchronization with identity providers. Sources: LDAP, Active Directory, Azure AD, Google Workspace, Okta. Sync modes: full, incremental, real-time (SCIM). Options: attribute mapping, group filtering, conflict resolution. Example: sync_directory(source='ldap', connection='{\"host\": \"ldap.company.com\", \"base_dn\": \"dc=company,dc=com\"}', action='sync', mode='incremental', group_filter='(memberOf=cn=employees,ou=groups)', attribute_map='{\"mail\": \"email\", \"cn\": \"name\"}', sync_groups=true). Note: Large directories may take time to sync. Warning: Test in staging to avoid accidental user deprovisioning."
    parameters:
      - name: source
        type: string
        description: "Directory source"
        required: true
        enum: ["ldap", "active_directory", "azure_ad", "google", "okta", "scim"]
      - name: connection
        type: string
        description: "JSON connection configuration"
        required: true
      - name: action
        type: string
        description: "Sync action"
        required: true
        enum: ["sync", "preview", "validate", "status"]
      - name: mode
        type: string
        description: "Sync mode"
        required: false
        default: "incremental"
        enum: ["full", "incremental", "realtime"]
      - name: group_filter
        type: string
        description: "Group filter expression"
        required: false
      - name: attribute_map
        type: string
        description: "JSON attribute mapping"
        required: false
      - name: sync_groups
        type: boolean
        description: "Sync group memberships"
        required: false
        default: true
    tags: ["auth", "directory", "sync", "ldap", "provisioning"]
