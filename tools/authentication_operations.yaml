      verbose: "Manage OAuth 2.0 scopes for API authorization. Actions: list, create, update, delete, assign. Scope patterns: resource:action (e.g., 'users:write'), hierarchical (e.g., 'admin.users.delete'). Features: scope dependencies, consent requirements, admin-only scopes. Example: manage_api_scopes(action='create', scope='orders:write', description='Create and modify orders', requires_consent=true, dependencies='[\"orders:read\"]', admin_only=false). Note: Scope changes affect all API clients using them. Warning: Removing scopes may break existing integrations."
