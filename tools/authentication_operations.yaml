      short: "Disable multi-factor authentication"
      medium: "Disable MFA for a user account after identity verification."
      long: "Remove MFA from a user account. Requires current password or admin privileges. Example: disable_mfa(user_id='u123', method='totp', password='***')."
      verbose: "Disable multi-factor authentication for user accounts. Security: requires password confirmation or admin override with reason. Options: disable specific method or all methods, keep backup codes. Example: disable_mfa(user_id='u123', method='all', password='***', reason='Switching to new device'). Audit: logs who disabled, when, and why. Note: Consider requiring MFA re-enrollment period after disable. Warning: Disabling MFA reduces account security; ensure legitimate request."
    parameters:
      - name: user_id
        type: string
        description: "User ID to disable MFA for"
        required: true
      - name: method
        type: string
        description: "MFA method to disable"
        required: false
        default: "all"
        enum: ["totp", "sms", "email", "webauthn", "push", "all"]
      - name: password
        type: string
