      verbose: "Emergency access and break-glass procedures. Features: trusted contacts, waiting period, admin override, offline codes. Actions: configure, trigger, approve, revoke. Security: notification to account holder, audit logging, waiting period. Example: manage_emergency_access(user_id='user-456', action='configure', contacts='[\"spouse@email.com\"]', waiting_period='48h', notify_methods='[\"email\", \"sms\"]', require_approval=true, offline_codes=5). Note: Emergency access should be difficult to abuse. Warning: Emergency access bypasses normal security; log all usage."
