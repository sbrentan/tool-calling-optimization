        description: "Time window (e.g., '15m', '1h')"
        required: true
      - name: action
        type: string
        description: "Action when limit exceeded"
        required: false
        default: "block"
        enum: ["block", "captcha", "delay", "alert"]
      - name: escalation
        type: string
        description: "JSON escalation rules"
        required: false
      - name: whitelist
        type: string
        description: "JSON array of whitelisted IPs"
        required: false
