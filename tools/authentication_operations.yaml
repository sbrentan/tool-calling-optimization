      - name: token
        type: string
        description: "Reset token"
        required: false
      - name: new_password
        type: string
        description: "New password"
        required: false
      - name: user_id
        type: string
        description: "User ID (for admin reset)"
        required: false
      - name: force_logout
        type: boolean
        description: "Revoke all sessions"
        required: false
        default: true
