      verbose: "Create service accounts for non-human authentication. Use cases: CI/CD pipelines, microservices, scheduled jobs, external integrations. Configuration: name, description, roles/permissions, credential type (API key, JWT, certificate). Example: create_service_account(name='payment-processor', roles='[\"payment:process\", \"payment:refund\"]', credential_type='jwt', key_expiry=86400). Returns: service_account_id, credentials, created_at. Note: Apply principle of least privilege. Warning: Rotate service account credentials regularly; monitor for anomalous usage."
    parameters:
      - name: name
        type: string
        description: "Service account name"
        required: true
      - name: description
        type: string
        description: "Purpose description"
        required: false
      - name: roles
        type: string
        description: "JSON array of roles/permissions"
        required: true
      - name: credential_type
        type: string
        description: "Type of credentials to generate"
        required: false
        default: "api_key"
        enum: ["api_key", "jwt", "certificate", "oauth_client"]
      - name: key_expiry
        type: integer
        description: "Credential expiry in seconds"
        required: false
    tags: ["auth", "service", "account", "machine", "automation"]
    test_prompts:
