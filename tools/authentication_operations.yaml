  - name: enable_mfa
    descriptions:
      minimal: "Enable MFA"
      short: "Enable multi-factor authentication"
      medium: "Enable multi-factor authentication for a user account using TOTP, SMS, or hardware keys."
      long: "Setup MFA for enhanced security. Supports TOTP apps, SMS codes, email codes, and hardware security keys. Example: enable_mfa(user_id='u123', method='totp')."
      verbose: "Enable multi-factor authentication for user accounts. Methods: 'totp' (Google Authenticator, Authy), 'sms' (text message), 'email' (email codes), 'webauthn' (hardware keys like YubiKey), 'push' (mobile app push). Setup flow: generate secret/register device, verify with test code, save backup codes. Example: enable_mfa(user_id='u123', method='totp', phone='+1234567890'). Returns: secret (for TOTP QR), backup_codes, setup_complete. Note: Require backup codes download before enabling. Warning: Lost MFA access requires admin recovery process."
    parameters:
      - name: user_id
        type: string
        description: "User ID to enable MFA for"
        required: true
      - name: method
        type: string
        description: "MFA method"
        required: true
        enum: ["totp", "sms", "email", "webauthn", "push"]
      - name: phone
        type: string
        description: "Phone number (for SMS)"
        required: false
      - name: verification_code
        type: string
        description: "Code to verify setup"
        required: false
    tags: ["auth", "mfa", "2fa", "security", "totp"]
    test_prompts:
