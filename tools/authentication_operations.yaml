      short: "Configure single sign-on"
      medium: "Configure single sign-on (SSO) with identity providers."
      long: "Set up SSO integration with providers like Okta, Azure AD, or Google. Example: configure_sso(provider='okta', domain='company.okta.com', client_id='abc123')."
      verbose: "Configure enterprise SSO integration. Providers: Okta, Azure AD, Google Workspace, OneLogin, Auth0, PingIdentity, custom SAML/OIDC. Protocols: SAML 2.0, OpenID Connect, OAuth 2.0. Features: attribute mapping, JIT provisioning, group sync. Example: configure_sso(provider='azure_ad', tenant_id='xxx', client_id='yyy', client_secret='zzz', protocol='oidc', attribute_mapping='{\"email\": \"upn\", \"name\": \"displayName\", \"groups\": \"groups\"}', jit_provisioning=true). Note: Test SSO configuration in staging before production. Warning: Incorrect configuration can lock out all users."
    parameters:
      - name: provider
        type: string
        description: "Identity provider"
        required: true
        enum: ["okta", "azure_ad", "google", "onelogin", "auth0", "ping", "custom_saml", "custom_oidc"]
      - name: tenant_id
        type: string
        description: "Provider tenant/domain ID"
        required: true
      - name: client_id
        type: string
        description: "OAuth client ID"
        required: true
      - name: client_secret
        type: string
        description: "OAuth client secret"
        required: true
      - name: protocol
        type: string
        description: "SSO protocol"
        required: false
        default: "oidc"
        enum: ["saml", "oidc", "oauth2"]
      - name: attribute_mapping
        type: string
        description: "JSON attribute mapping"
        required: false
      - name: jit_provisioning
        type: boolean
