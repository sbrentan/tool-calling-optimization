      verbose: "Session policy configuration. Settings: max duration, idle timeout, concurrent session limit, session binding (IP, device), refresh behavior. Features: sliding vs absolute expiry, geographic restrictions, privilege escalation timeout. Example: configure_session_policy(max_duration='8h', idle_timeout='30m', max_concurrent=3, concurrent_action='oldest', bind_to='[\"ip\", \"device\"]', require_reauth_for='[\"billing\", \"security\"]', sliding_expiry=true). Note: Strict policies improve security but reduce convenience. Warning: Policy changes may invalidate existing sessions."
