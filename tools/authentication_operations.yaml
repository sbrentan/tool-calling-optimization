category: authentication_operations
description: Authentication and identity management operations
tools:
  - name: authenticate_user
    descriptions:
      minimal: "Authenticate user"
      short: "Authenticate a user"
      medium: "Authenticate a user with credentials and return tokens."
      long: "Authenticate a user with username/password or other credentials. Returns access and refresh tokens. Example: authenticate_user(username='john@example.com', password='***', method='password')."
      verbose: "Authenticate users against identity provider. Methods: 'password', 'mfa', 'sso', 'oauth', 'certificate', 'biometric'. Returns: access token, refresh token, user info, expiration. Example: authenticate_user(username='john@example.com', password='***', method='password', mfa_code='123456', device_info='{\"device_id\": \"browser-123\", \"ip\": \"1.2.3.4\"}'). Note: Failed attempts should trigger lockout policies. Warning: Never log credentials; use secure channels."
    parameters:
      - name: username
        type: string
        description: "Username or email"
        required: true
      - name: password
        type: string
        description: "User password"
        required: false
      - name: method
        type: string
        description: "Authentication method"
        required: false
        default: "password"
        enum: ["password", "mfa", "sso", "oauth", "certificate", "biometric"]
      - name: mfa_code
        type: string
        description: "MFA/2FA code"
        required: false
      - name: device_info
        type: string
        description: "JSON device information"
        required: false
    tags: ["auth", "login", "authenticate", "user", "credentials"]
    test_prompts:
      single:
        - "Log in the user"
        - "Authenticate with password"
        - "Verify user credentials"
        - "User login with MFA"
      single_clear:
        - "I need to authenticate a user with credentials. Log in the user"
        - "I need to authenticate a user with credentials. Authenticate with password"
        - "I need to authenticate a user with credentials. Verify user credentials"
        - "I need to authenticate a user with credentials. User login with MFA"

  - name: create_user
    descriptions:
      minimal: "Create user"
      short: "Create a new user account"
      medium: "Create a new user account in the identity system."
      long: "Create a user account with profile information. Example: create_user(email='jane@example.com', password='***', name='Jane Doe', role='user')."
      verbose: "Create user accounts in identity system. Required: email/username, password (meeting policy). Optional: profile data, roles, groups, metadata. Features: email verification, welcome email, initial password change. Example: create_user(email='jane@example.com', password='***', profile='{\"first_name\": \"Jane\", \"last_name\": \"Doe\", \"phone\": \"+1234567890\"}', roles='[\"user\", \"beta_tester\"]', require_verification=true). Note: Password must meet complexity requirements. Warning: Verify email ownership before granting access."
    parameters:
      - name: email
        type: string
        description: "User email address"
        required: true
      - name: password
        type: string
        description: "Initial password"
        required: true
      - name: profile
        type: string
        description: "JSON profile data"
        required: false
      - name: roles
        type: string
        description: "JSON array of roles"
        required: false
      - name: require_verification
        type: boolean
        description: "Require email verification"
        required: false
        default: true
    tags: ["auth", "user", "create", "register", "account"]
    test_prompts:
      single:
        - "Create a new user account"
        - "Register a new user"
        - "Add user to the system"
        - "Set up user account"
      single_clear:
        - "I need to register a new user account. Create a new user account"
        - "I need to register a new user account. Register a new user"
        - "I need to register a new user account. Add user to the system"
        - "I need to register a new user account. Set up user account"

  - name: manage_session
    descriptions:
      minimal: "Manage session"
      short: "Manage user session"
      medium: "Create, validate, or terminate user sessions."
      long: "Manage user sessions. Create, validate, refresh, or revoke sessions. Example: manage_session(action='validate', token='eyJ...')."
      verbose: "User session management operations. Actions: 'create' (new session), 'validate' (check token), 'refresh' (extend session), 'revoke' (logout), 'list' (user's sessions), 'revoke_all' (logout everywhere). Example: manage_session(action='validate', token='eyJ...', check_ip=true, check_device=true). Note: Sessions should have reasonable timeouts. Warning: Revoking all sessions forces re-authentication on all devices."
    parameters:
      - name: action
        type: string
        description: "Session action"
        required: true
        enum: ["create", "validate", "refresh", "revoke", "list", "revoke_all"]
      - name: token
        type: string
        description: "Session token"
        required: false
      - name: user_id
        type: string
        description: "User ID (for list/revoke_all)"
        required: false
      - name: check_ip
        type: boolean
        description: "Validate client IP"
        required: false
        default: false
      - name: check_device
        type: boolean
        description: "Validate device fingerprint"
        required: false
        default: false
    tags: ["auth", "session", "token", "logout", "validate"]
    test_prompts:
      single:
        - "Validate the session token"
        - "Log out the user"
        - "Refresh the access token"
        - "List active sessions"
      single_clear:
        - "I need to manage the user session. Validate the session token"
        - "Please log out the current user session. Log out the user"
        - "I need to manage the user session. Refresh the access token"
        - "I need to manage the user session. List active sessions"

  - name: reset_password
    descriptions:
      minimal: "Reset password"
      short: "Reset user password"
      medium: "Initiate or complete a password reset for a user."
      long: "Password reset flow. Send reset email or set new password with token. Example: reset_password(action='initiate', email='user@example.com')."
      verbose: "Password reset operations. Actions: 'initiate' (send reset email), 'validate' (check reset token), 'complete' (set new password). Security: token expiration, rate limiting, notification to user. Example: reset_password(action='complete', token='abc123', new_password='NewSecure#Pass1', notify_user=true). Note: Reset tokens should expire within hours. Warning: Notify users of password changes for security."
    parameters:
      - name: action
        type: string
        description: "Reset action"
        required: true
        enum: ["initiate", "validate", "complete"]
      - name: email
        type: string
        description: "User email (for initiate)"
        required: false
      - name: token
        type: string
        description: "Reset token"
        required: false
      - name: new_password
        type: string
        description: "New password (for complete)"
        required: false
      - name: notify_user
        type: boolean
        description: "Send confirmation notification"
        required: false
        default: true
    tags: ["auth", "password", "reset", "recovery", "forgot"]
    test_prompts:
      single:
        - "Reset the user's password"
        - "Send password reset email"
        - "I forgot my password"
        - "Complete password reset"
      single_clear:
        - "Please initiate a password reset. Reset the user's password"
        - "Please initiate a password reset. Send password reset email"
        - "Please initiate a password reset. I forgot my password"
        - "Please initiate a password reset. Complete password reset"

  - name: manage_mfa
    descriptions:
      minimal: "Manage MFA"
      short: "Manage multi-factor authentication"
      medium: "Enable, disable, or configure MFA for user accounts."
      long: "Manage multi-factor authentication settings. Set up TOTP, SMS, or push authentication. Example: manage_mfa(user_id='user123', action='enable', method='totp')."
      verbose: "Multi-factor authentication management. Actions: 'enable', 'disable', 'setup' (get QR code), 'verify' (confirm setup), 'list' (enrolled methods). Methods: 'totp' (authenticator app), 'sms', 'email', 'push', 'webauthn'. Example: manage_mfa(user_id='user123', action='setup', method='totp') returns {\"qr_code\": \"data:image/png;...\", \"secret\": \"JBSWY3DPEHPK3PXP\"}. Note: Backup codes should be provided during setup. Warning: Lost MFA access requires recovery process."
    parameters:
      - name: user_id
        type: string
        description: "User identifier"
        required: true
      - name: action
        type: string
        description: "MFA action"
        required: true
        enum: ["enable", "disable", "setup", "verify", "list"]
      - name: method
        type: string
        description: "MFA method"
        required: false
        enum: ["totp", "sms", "email", "push", "webauthn"]
      - name: code
        type: string
        description: "Verification code (for verify)"
        required: false
    tags: ["auth", "mfa", "2fa", "totp", "security"]
    test_prompts:
      single:
        - "Enable two-factor authentication"
        - "Set up authenticator app"
        - "Disable MFA for user"
        - "Verify MFA setup"
      single_clear:
        - "I need to configure multi-factor authentication. Enable two-factor authentication"
        - "I need to configure multi-factor authentication. Set up authenticator app"
        - "I need to configure multi-factor authentication. Disable MFA for user"
        - "I need to configure multi-factor authentication. Verify MFA setup"

  - name: manage_roles
    descriptions:
      minimal: "Manage roles"
      short: "Manage user roles"
      medium: "Assign, remove, or list roles for users."
      long: "Role-based access control management. Assign or revoke roles from users. Example: manage_roles(user_id='user123', action='assign', roles='[\"admin\", \"editor\"]')."
      verbose: "RBAC role management operations. Actions: 'assign' (grant roles), 'revoke' (remove roles), 'list' (user's roles), 'check' (verify role). Scope: roles can be global or resource-specific. Example: manage_roles(user_id='user123', action='assign', roles='[\"project_admin\"]', resource_type='project', resource_id='proj-456'). Note: Role changes take effect immediately. Warning: Removing admin role may lock out user from management."
    parameters:
      - name: user_id
        type: string
        description: "User identifier"
        required: true
      - name: action
        type: string
        description: "Role action"
        required: true
        enum: ["assign", "revoke", "list", "check"]
      - name: roles
        type: string
        description: "JSON array of roles"
        required: false
      - name: resource_type
        type: string
        description: "Resource type for scoped roles"
        required: false
      - name: resource_id
        type: string
        description: "Resource ID for scoped roles"
        required: false
    tags: ["auth", "roles", "rbac", "permissions", "access"]
    test_prompts:
      single:
        - "Assign admin role to user"
        - "Remove editor role"
        - "List user's roles"
        - "Check if user has permission"
      single_clear:
        - "I need to manage user roles and permissions. Assign admin role to user"
        - "I need to manage user roles and permissions. Remove editor role"
        - "I need to manage user roles and permissions. List user's roles"
        - "I need to manage user roles and permissions. Check if user has permission"

  - name: create_api_key
    descriptions:
      minimal: "Create API key"
      short: "Create an API key"
      medium: "Generate an API key for programmatic access."
      long: "Create API keys for service authentication. Set permissions and expiration. Example: create_api_key(name='backend-service', scopes='[\"read\", \"write\"]', expires='2024-12-31')."
      verbose: "Generate API keys for programmatic access. Features: custom name, scopes/permissions, expiration, IP whitelist, rate limits. Example: create_api_key(name='analytics-service', scopes='[\"read:events\", \"read:users\"]', expires='2024-12-31', ip_whitelist='[\"10.0.0.0/8\"]', rate_limit=1000). Note: API key is shown only once at creation. Warning: Store API keys securely; treat as passwords."
    parameters:
      - name: name
        type: string
        description: "API key name/description"
        required: true
      - name: scopes
        type: string
        description: "JSON array of permission scopes"
        required: true
      - name: expires
        type: string
        description: "Expiration date (ISO format)"
        required: false
      - name: ip_whitelist
        type: string
        description: "JSON array of allowed IPs/CIDRs"
        required: false
      - name: rate_limit
        type: integer
        description: "Requests per hour limit"
        required: false
    tags: ["auth", "api", "key", "token", "service"]
    test_prompts:
      single:
        - "Create an API key"
        - "Generate service token"
        - "Create access credentials"
        - "Set up API authentication"
      single_clear:
        - "I need to generate API credentials for programmatic access. Create an API key"
        - "I need to generate API credentials for programmatic access. Generate service token"
        - "I need to generate API credentials for programmatic access. Create access credentials"
        - "I need to generate API credentials for programmatic access. Set up API authentication"

  - name: manage_oauth
    descriptions:
      minimal: "Manage OAuth"
      short: "Manage OAuth applications"
      medium: "Create, update, or manage OAuth client applications."
      long: "Manage OAuth 2.0 client applications. Register, update, or revoke OAuth clients. Example: manage_oauth(action='create', name='My App', redirect_uris='[\"https://app.example.com/callback\"]')."
      verbose: "OAuth 2.0 application management. Actions: 'create' (register app), 'update', 'delete', 'list', 'rotate_secret'. Settings: name, redirect URIs, allowed scopes, grant types. Example: manage_oauth(action='create', name='Mobile App', redirect_uris='[\"myapp://callback\"]', scopes='[\"openid\", \"profile\", \"email\"]', grant_types='[\"authorization_code\", \"refresh_token\"]'). Note: Client secrets should be rotated regularly. Warning: Deleting OAuth app revokes all user authorizations."
    parameters:
      - name: action
        type: string
        description: "OAuth action"
        required: true
        enum: ["create", "update", "delete", "list", "rotate_secret"]
      - name: client_id
        type: string
        description: "OAuth client ID"
        required: false
      - name: name
        type: string
        description: "Application name"
        required: false
      - name: redirect_uris
        type: string
        description: "JSON array of redirect URIs"
        required: false
      - name: scopes
        type: string
        description: "JSON array of allowed scopes"
        required: false
      - name: grant_types
        type: string
        description: "JSON array of grant types"
        required: false
    tags: ["auth", "oauth", "application", "client", "sso"]
    test_prompts:
      single:
        - "Register an OAuth application"
        - "Create OAuth client"
        - "Rotate client secret"
        - "List OAuth applications"
      single_clear:
        - "I need to manage OAuth client applications. Register an OAuth application"
        - "I need to manage OAuth client applications. Create OAuth client"
        - "I need to manage OAuth client applications. Rotate client secret"
        - "I need to manage OAuth client applications. List OAuth applications"

  - name: audit_auth_events
    descriptions:
      minimal: "Audit events"
      short: "Audit authentication events"
      medium: "Query authentication and security audit logs."
      long: "Query authentication audit logs. Track logins, failures, and security events. Example: audit_auth_events(user_id='user123', event_types='[\"login\", \"login_failed\"]', period='7d')."
      verbose: "Authentication audit log queries. Events: 'login', 'logout', 'login_failed', 'password_changed', 'mfa_enabled', 'role_changed', 'api_key_created'. Filters: user, IP, time range, event type, outcome. Example: audit_auth_events(event_types='[\"login_failed\"]', period='24h', group_by='ip', min_count=5). Note: Audit logs should be retained per compliance requirements. Warning: PII in logs requires appropriate handling."
    parameters:
      - name: user_id
        type: string
        description: "Filter by user ID"
        required: false
      - name: event_types
        type: string
        description: "JSON array of event types"
        required: false
      - name: period
        type: string
        description: "Time period"
        required: false
        default: "24h"
      - name: ip_address
        type: string
        description: "Filter by IP address"
        required: false
      - name: outcome
        type: string
        description: "Filter by outcome"
        required: false
        enum: ["success", "failure", "all"]
    tags: ["auth", "audit", "logs", "security", "events"]
    test_prompts:
      single:
        - "Show failed login attempts"
        - "Audit user authentication history"
        - "Check security events"
        - "Get login audit logs"
      single_clear:
        - "I need to query authentication audit logs. Show failed login attempts"
        - "I need to query authentication audit logs. Audit user authentication history"
        - "I need to query authentication audit logs. Check security events"
        - "I need to query authentication audit logs. Get login audit logs"

  - name: configure_auth_policy
    descriptions:
      minimal: "Configure policy"
      short: "Configure authentication policy"
      medium: "Set authentication policies like password rules and lockout settings."
      long: "Configure authentication policies. Set password requirements, lockout rules, session timeouts. Example: configure_auth_policy(password_min_length=12, lockout_attempts=5)."
      verbose: "Authentication policy configuration. Settings: password complexity (length, characters, history), account lockout (attempts, duration), session (timeout, concurrent), MFA requirements. Example: configure_auth_policy(password_min_length=12, password_require_special=true, password_history=5, lockout_attempts=5, lockout_duration=900, session_timeout=3600, require_mfa='admin'). Note: Policy changes apply to new authentications. Warning: Strict policies may increase support requests."
    parameters:
      - name: password_min_length
        type: integer
        description: "Minimum password length"
        required: false
      - name: password_require_special
        type: boolean
        description: "Require special characters"
        required: false
      - name: password_history
        type: integer
        description: "Password history count"
        required: false
      - name: lockout_attempts
        type: integer
        description: "Failed attempts before lockout"
        required: false
      - name: lockout_duration
        type: integer
        description: "Lockout duration (seconds)"
        required: false
      - name: session_timeout
        type: integer
        description: "Session timeout (seconds)"
        required: false
      - name: require_mfa
        type: string
        description: "Roles requiring MFA"
        required: false
    tags: ["auth", "policy", "password", "security", "config"]
    test_prompts:
      single:
        - "Set password policy"
        - "Configure lockout settings"
        - "Require MFA for admins"
        - "Update authentication policy"
      single_clear:
        - "I need to configure authentication policies. Set password policy"
        - "I need to configure authentication policies. Configure lockout settings"
        - "I need to configure authentication policies. Require MFA for admins"
        - "I need to configure authentication policies. Update authentication policy"
  - name: generate_api_key
    descriptions:
      minimal: "Generate API key"
      short: "Generate a new API key for authentication"
      medium: "Generate a new API key for programmatic access. Specify permissions and expiration."
      long: "Generate an API key for service-to-service authentication. Configure scopes, rate limits, and expiration. Example: generate_api_key(name='Production API', scopes='[\"read\", \"write\"]', expires_in=86400)."
      verbose: "Generate API keys for programmatic authentication. Features: custom scopes/permissions, rate limiting, expiration, IP restrictions, usage tracking. Example: generate_api_key(name='CI Pipeline Key', scopes='[\"deploy\", \"read\"]', expires_in=604800, rate_limit=1000, allowed_ips='[\"10.0.0.0/8\"]'). Returns: api_key (show once), key_id, created_at, expires_at. Note: Store keys securely; they cannot be retrieved after creation. Warning: Treat API keys as passwords; rotate regularly."
    parameters:
      - name: name
        type: string
        description: "Descriptive name for the API key"
        required: true
      - name: scopes
        type: string
        description: "JSON array of permission scopes"
        required: false
      - name: expires_in
        type: integer
        description: "Expiration time in seconds"
        required: false
        default: 31536000
      - name: rate_limit
        type: integer
        description: "Requests per hour limit"
        required: false
      - name: allowed_ips
        type: string
        description: "JSON array of allowed IP ranges"
        required: false
    tags: ["auth", "api", "key", "token", "programmatic"]
    test_prompts:
      single:
        - "Generate a new API key"
        - "Create an API key for the production service"
        - "Issue a read-only API key"
        - "Generate API credentials with rate limiting"
      single_clear:
        - "I need to generate a new API key for programmatic access. Generate a new API key"
        - "I need to generate a new API key for programmatic access. Create an API key for the production service"
        - "I need to generate a new API key for programmatic access. Issue a read-only API key"
        - "I need to generate a new API key for programmatic access. Generate API credentials with rate limiting"

  - name: revoke_api_key
    descriptions:
      minimal: "Revoke API key"
      short: "Revoke an existing API key"
      medium: "Revoke an API key to immediately disable its access."
      long: "Revoke an API key by ID or prefix. Immediately disables all access using that key. Example: revoke_api_key(key_id='ak_12345')."
      verbose: "Revoke API keys to disable access. Supports: single key revocation, bulk revocation by user/service, revocation by prefix. Revocation is immediate and irreversible. Example: revoke_api_key(key_id='ak_12345', reason='Suspected compromise'). Options: notify_owner (email alert), log_audit (audit trail). Note: Revoked keys cannot be restored; generate new ones. Warning: Ensure dependent services have new keys before revoking."
    parameters:
      - name: key_id
        type: string
        description: "API key ID to revoke"
        required: true
      - name: reason
        type: string
        description: "Reason for revocation"
        required: false
      - name: notify_owner
        type: boolean
        description: "Send notification to key owner"
        required: false
        default: true
    tags: ["auth", "api", "key", "revoke", "security"]
    test_prompts:
      single:
        - "Revoke the compromised API key"
        - "Disable API key ak_12345"
        - "Cancel the old API credentials"
        - "Invalidate the API key immediately"
      single_clear:
        - "I need to revoke an API key to disable access. Revoke the compromised API key"
        - "I need to revoke an API key to disable access. Disable API key ak_12345"
        - "I need to revoke an API key to disable access. Cancel the old API credentials"
        - "I need to revoke an API key to disable access. Invalidate the API key immediately"

  - name: setup_oauth_provider
    descriptions:
      minimal: "Setup OAuth provider"
      short: "Configure an OAuth identity provider"
      medium: "Configure an OAuth 2.0 identity provider for social login or SSO."
      long: "Setup OAuth provider integration (Google, GitHub, Azure AD, etc.). Configure client ID, secret, scopes, and callback URLs. Example: setup_oauth_provider(provider='google', client_id='xxx', client_secret='yyy', scopes='[\"email\", \"profile\"]')."
      verbose: "Configure OAuth 2.0/OpenID Connect identity providers. Supported: Google, GitHub, Microsoft, Apple, Facebook, Twitter, LinkedIn, Okta, Auth0, custom OIDC. Configuration: client credentials, scopes, callback URLs, token endpoints, user info mapping. Example: setup_oauth_provider(provider='azure_ad', client_id='xxx', client_secret='yyy', tenant_id='zzz', scopes='[\"openid\", \"email\", \"profile\"]', callback_url='https://app.com/auth/callback'). Note: Test in sandbox before production. Warning: Securely store client secrets; never expose in frontend code."
    parameters:
      - name: provider
        type: string
        description: "OAuth provider name"
        required: true
        enum: ["google", "github", "microsoft", "apple", "facebook", "twitter", "linkedin", "okta", "auth0", "custom"]
      - name: client_id
        type: string
        description: "OAuth client ID"
        required: true
      - name: client_secret
        type: string
        description: "OAuth client secret"
        required: true
      - name: scopes
        type: string
        description: "JSON array of OAuth scopes"
        required: false
      - name: callback_url
        type: string
        description: "OAuth callback URL"
        required: true
      - name: tenant_id
        type: string
        description: "Tenant ID (for Azure AD)"
        required: false
    tags: ["auth", "oauth", "sso", "provider", "social"]
    test_prompts:
      single:
        - "Setup Google OAuth login"
        - "Configure GitHub authentication"
        - "Add Microsoft SSO integration"
        - "Enable social login with Facebook"
      single_clear:
        - "I need to configure an OAuth identity provider. Setup Google OAuth login"
        - "I need to configure an OAuth identity provider. Configure GitHub authentication"
        - "I need to configure an OAuth identity provider. Add Microsoft SSO integration"
        - "I need to configure an OAuth identity provider. Enable social login with Facebook"

  - name: verify_email
    descriptions:
      minimal: "Verify email"
      short: "Verify a user's email address"
      medium: "Verify a user's email address using a verification token or code."
      long: "Verify email ownership using a token sent to the user. Marks the email as verified in the user profile. Example: verify_email(token='abc123def456')."
      verbose: "Email verification for user accounts. Methods: token link (email contains URL), code entry (6-digit code), magic link (passwordless). Example: verify_email(token='eyJ...', method='token'). Actions: verify email, resend verification, check status. Response: verified (bool), verified_at, user_id. Note: Tokens typically expire in 24-48 hours. Warning: Rate limit verification attempts to prevent abuse."
    parameters:
      - name: token
        type: string
        description: "Email verification token"
        required: false
      - name: code
        type: string
        description: "Verification code (6 digits)"
        required: false
      - name: email
        type: string
        description: "Email to verify or resend"
        required: false
      - name: action
        type: string
        description: "Verification action"
        required: false
        default: "verify"
        enum: ["verify", "resend", "check_status"]
    tags: ["auth", "email", "verify", "confirmation", "user"]
    test_prompts:
      single:
        - "Verify the user's email address"
        - "Confirm email with verification code"
        - "Resend verification email"
        - "Check if email is verified"
      single_clear:
        - "I need to verify a user's email address. Verify the user's email address"
        - "I need to verify a user's email address. Confirm email with verification code"
        - "I need to verify a user's email address. Resend verification email"
        - "I need to verify a user's email address. Check if email is verified"

  - name: reset_password
    descriptions:
      minimal: "Reset password"
      short: "Reset a user's password"
      medium: "Initiate or complete a password reset flow for a user account."
      long: "Handle password reset: request reset email, validate token, set new password. Example: reset_password(action='request', email='user@example.com')."
      verbose: "Password reset workflow management. Actions: 'request' (send reset email), 'validate' (check token validity), 'complete' (set new password), 'admin_reset' (force reset by admin). Example: reset_password(action='complete', token='rst_...', new_password='***'). Security: tokens expire in 1 hour, single use, invalidate on password change. Options: force_logout (revoke all sessions), notify_user (confirmation email). Note: Enforce password policy on new passwords. Warning: Log all reset attempts for security monitoring."
    parameters:
      - name: action
        type: string
