      short: "Configure authentication rate limiting"
      medium: "Configure rate limiting for authentication endpoints to prevent abuse."
      long: "Set up rate limits for login, registration, and password reset. Example: configure_rate_limiting(endpoint='login', limit=5, window='15m', action='block')."
      verbose: "Authentication rate limiting configuration. Endpoints: login, register, password_reset, mfa, token_refresh, api. Limit types: per IP, per user, per endpoint. Actions: block, captcha, delay, alert. Example: configure_rate_limiting(endpoint='login', limit=5, window='15m', action='captcha', escalation='[{\"attempts\": 10, \"action\": \"block\", \"duration\": \"1h\"}]', whitelist='[\"10.0.0.0/8\"]', alert_threshold=100). Note: Rate limits should balance security and user experience. Warning: Aggressive limits may affect legitimate users with shared IPs."
    parameters:
      - name: endpoint
        type: string
        description: "Endpoint to rate limit"
        required: true
        enum: ["login", "register", "password_reset", "mfa", "token_refresh", "api", "all"]
      - name: limit
