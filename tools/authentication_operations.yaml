  - name: audit_auth_logs
    descriptions:
      minimal: "Audit auth logs"
      short: "Query authentication audit logs"
      medium: "Search and filter authentication events for security auditing and compliance."
      long: "Query authentication audit logs. Filter by user, event type, date range, IP, and outcome. Example: audit_auth_logs(user_id='u123', event_type='login_failed', days=7)."
      verbose: "Search authentication audit logs for security analysis and compliance. Event types: login_success, login_failed, logout, password_change, mfa_setup, token_refresh, session_revoked, api_key_used, permission_denied. Filters: user_id, event_type, date_range, ip_address, device, outcome. Example: audit_auth_logs(event_type='login_failed', ip_address='1.2.3.4', days=30, limit=1000). Returns: events with timestamps, user info, IP, device, outcome, metadata. Note: Logs retained per compliance requirements. Warning: Large queries may be slow; use filters and pagination."
    parameters:
      - name: user_id
        type: string
        description: "Filter by user ID"
        required: false
      - name: event_type
        type: string
        description: "Filter by event type"
        required: false
        enum: ["login_success", "login_failed", "logout", "password_change", "mfa_setup", "token_refresh", "session_revoked", "api_key_used", "permission_denied"]
      - name: ip_address
        type: string
        description: "Filter by IP address"
        required: false
      - name: days
        type: integer
        description: "Number of days to search"
        required: false
        default: 7
      - name: limit
        type: integer
        description: "Maximum events to return"
        required: false
        default: 100
    tags: ["auth", "audit", "logs", "security", "compliance"]
    test_prompts:
