      verbose: "Ingest feature data for model training and serving. Modes: batch (large datasets), streaming (real-time). Example: ingest_features(feature_group='customer-signals', data_source='s3://data/customer-features/', event_time_column='event_timestamp', record_identifier='customer_id', mode='batch', target_stores='[\"online\", \"offline\"]'). Note: Event time is critical for point-in-time correctness. Warning: Large ingestions may take time; monitor progress."
