      short: "Deploy ML model to production"
      medium: "Deploy a trained model for real-time or batch predictions."
      long: "Deploy ML model to production environment. Supports various deployment targets. Example: deploy_model(model='classifier_v3', target='kubernetes', replicas=3)."
      verbose: "Deploy models to production serving infrastructure. Targets: REST API, serverless, Kubernetes, edge. Features: auto-scaling, A/B testing, canary deployment, model versioning. Example: deploy_model(model='fraud_detector_v2', target='kubernetes', replicas=3, min_replicas=1, max_replicas=10, cpu_limit='2', memory_limit='4Gi', canary_percent=10). Returns: endpoint URL, deployment status, health checks. Note: Monitor model performance in production. Warning: Ensure model artifacts and dependencies are properly packaged."
    parameters:
      - name: model
        type: string
        description: "Model ID or path"
        required: true
      - name: target
        type: string
        description: "Deployment target"
        required: true
        enum: ["api", "serverless", "kubernetes", "edge"]
      - name: replicas
        type: integer
        description: "Number of replicas"
        required: false
