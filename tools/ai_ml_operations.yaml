      verbose: "Retrieve features for inference or training. Online: real-time low-latency. Offline: point-in-time for training. Example: get_features(feature_group='customer-signals', entity_ids='[\"cust_001\", \"cust_002\"]', features='[\"lifetime_value\", \"churn_risk\", \"last_purchase_days\"]', mode='online'). For training: get_features(..., mode='offline', as_of='2024-01-01T00:00:00Z'). Note: Online store has fresher data. Warning: Missing features return null; handle gracefully."
