      verbose: "Create centralized feature store for ML features. Features: online (low-latency) and offline (batch) serving, versioning, lineage tracking. Example: create_feature_store(name='customer-features', description='Customer behavior features', online_enabled=true, offline_enabled=true, storage_type='s3', encryption_key='alias/feature-store', tags='{\"team\": \"ml\", \"domain\": \"customer\"}'). Note: Plan storage for feature volume. Warning: Feature consistency between online/offline is critical."
