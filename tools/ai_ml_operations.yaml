        - "Deploy with auto-scaling"

  - name: run_ab_test
    descriptions:
      minimal: "Run A/B test"
      short: "Run ML model A/B test"
      medium: "Run A/B tests to compare model performance in production."
      long: "A/B test between model versions to measure real-world performance. Example: run_ab_test(control='model_v1', treatment='model_v2', traffic_split=50, metric='conversion')."
      verbose: "Production A/B testing for model comparison. Features: traffic splitting, statistical significance, multi-armed bandit, guardrail metrics. Example: run_ab_test(control='recommender_v1', treatment='recommender_v2', traffic_split=50, primary_metric='click_rate', guardrails='[{\"metric\": \"latency_p99\", \"threshold\": 100}]', min_sample_size=10000, confidence=0.95). Returns: test status, current results, significance. Note: Run until statistical significance. Warning: Monitor guardrail metrics to prevent degradation."
    parameters:
      - name: control
        type: string
        description: "Control model ID"
        required: true
      - name: treatment
        type: string
        description: "Treatment model ID"
        required: true
      - name: traffic_split
        type: integer
        description: "Treatment traffic percentage"
        required: false
        default: 50
      - name: primary_metric
        type: string
        description: "Primary success metric"
        required: true
      - name: guardrails
        type: string
        description: "JSON guardrail metrics"
        required: false
      - name: min_sample_size
        type: integer
        description: "Minimum samples per variant"
        required: false
        default: 1000
      - name: confidence
        type: number
        description: "Required confidence level"
        required: false
        default: 0.95
    tags: ["ai", "ml", "ab_test", "experimentation", "comparison"]
    test_prompts:
      single:
        - "A/B test model versions"
        - "Compare models in production"
        - "Run model experiment"
        - "Test new model against baseline"

  - name: detect_data_drift
    descriptions:
      minimal: "Detect drift"
      short: "Detect data drift"
      medium: "Monitor for data drift that may degrade model performance."
      long: "Detect distribution shifts between training and production data. Example: detect_data_drift(reference='training.csv', current='production_data.csv', features='[\"age\", \"income\"]')."
      verbose: "Monitor data drift to maintain model quality. Drift types: feature drift (input distribution), concept drift (target relationship), prediction drift. Methods: KS test, PSI, chi-squared, embedding distance. Example: detect_data_drift(reference='training_data.parquet', current='last_week_production.parquet', features='[\"user_age\", \"device_type\", \"session_length\"]', methods='[\"ks\", \"psi\"]', threshold=0.1). Returns: drift scores, alerts, visualizations. Note: Regular drift monitoring prevents silent model degradation. Warning: Significant drift may require model retraining."
    parameters:
      - name: reference
        type: string
        description: "Reference/training data path"
        required: true
      - name: current
        type: string
        description: "Current/production data path"
        required: true
      - name: features
        type: string
        description: "JSON array of features to monitor"
        required: true
      - name: methods
        type: string
        description: "JSON array of drift detection methods"
        required: false
        default: "[\"psi\", \"ks\"]"
      - name: threshold
        type: number
        description: "Alert threshold"
        required: false
        default: 0.1
    tags: ["ai", "ml", "drift", "monitoring", "data_quality"]
    test_prompts:
      single:
        - "Check for data drift"
        - "Monitor model input distribution"
        - "Detect feature drift"
        - "Compare training vs production data"

