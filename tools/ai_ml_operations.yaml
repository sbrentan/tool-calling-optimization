category: ai_ml_operations

tools:
  - name: generate_text
    descriptions:
      minimal: "Generate text"
      short: "Generate text using an AI language model"
      medium: "Generate text completion or response using a large language model with configurable parameters."
      long: "Generate text using an AI language model. Provide a prompt and configure temperature, max tokens, and other parameters. Example: generate_text(prompt='Write a poem about the ocean', max_tokens=200)."
      verbose: "Generate text using large language models like GPT, Claude, or open-source alternatives. Parameters: prompt, system message, temperature (creativity), max_tokens (length), top_p/top_k (sampling), stop sequences, presence/frequency penalty. Example: generate_text(prompt='Explain quantum computing', model='gpt-4', temperature=0.7, max_tokens=500, system_message='You are a helpful science teacher') returns educational explanation. Note: Higher temperature = more creative/random. Warning: Generated content should be reviewed; may contain inaccuracies."
    parameters:
      - name: prompt
        type: string
        description: "The input prompt"
        required: true
      - name: model
        type: string
        description: "Model to use"
        required: false
        default: "gpt-4"
      - name: temperature
        type: number
        description: "Randomness (0-2)"
        required: false
        default: 0.7
      - name: max_tokens
        type: integer
        description: "Maximum tokens to generate"
        required: false
        default: 256
      - name: system_message
        type: string
        description: "System/context message"
        required: false
      - name: stop_sequences
        type: array
        description: "Sequences that stop generation"
        required: false
    tags: ["ai", "llm", "generate", "text", "gpt", "completion"]
    test_prompts:
      single:
        - "Generate a product description"
        - "Write a short story about robots"
        - "Complete this sentence with AI"
        - "Generate marketing copy for the product"

  - name: classify_text
    descriptions:
      minimal: "Classify text"
      short: "Classify text into categories"
      medium: "Classify text into predefined categories using a machine learning model."
      long: "Classify text into one or more categories. Use predefined labels or zero-shot classification. Returns categories with confidence scores. Example: classify_text(text='Great product!', labels=['positive', 'negative', 'neutral'])."
      verbose: "Classify text into categories using ML models. Modes: 'multi_class' (single best label), 'multi_label' (multiple applicable labels), 'zero_shot' (classify without training). Returns labels with confidence scores. Example: classify_text(text='The service was okay but the food was amazing', labels=['food_quality', 'service', 'ambiance', 'value'], mode='multi_label', threshold=0.5) returns {'food_quality': 0.92, 'service': 0.65}. Note: Zero-shot works without custom training but may be less accurate. Warning: Confidence scores are model-dependent; calibrate thresholds accordingly."
    parameters:
      - name: text
        type: string
        description: "Text to classify"
        required: true
      - name: labels
        type: array
        description: "Possible categories"
        required: true
      - name: mode
        type: string
        description: "Classification mode"
        required: false
        default: "multi_class"
        enum: ["multi_class", "multi_label", "zero_shot"]
      - name: threshold
        type: number
        description: "Confidence threshold"
        required: false
        default: 0.5
      - name: model
        type: string
        description: "Model to use"
        required: false
    tags: ["ai", "classify", "nlp", "categorize", "label"]
    test_prompts:
      single:
        - "Classify this review as positive or negative"
        - "Categorize the support ticket"
        - "What topic is this article about?"
        - "Classify the customer feedback"

  - name: generate_embeddings
    descriptions:
      minimal: "Generate embeddings"
      short: "Generate vector embeddings for text"
      medium: "Convert text into numerical vector embeddings for similarity search and clustering."
      long: "Generate vector embeddings that represent text meaning. Use for similarity search, clustering, or ML features. Example: generate_embeddings(text='Machine learning is fascinating', model='text-embedding-ada-002')."
      verbose: "Generate dense vector embeddings representing the semantic meaning of text. Embeddings enable: similarity search, clustering, recommendations, and ML feature extraction. Models vary in dimension size and capabilities. Example: generate_embeddings(texts=['AI is transforming business', 'Machine learning applications'], model='text-embedding-3-large', normalize=true, encoding_format='float') returns [[0.012, -0.034, ...], [...]]. Note: Longer texts may be truncated; use chunking for documents. Warning: Different models produce incompatible embeddings; use same model for comparisons."
    parameters:
      - name: text
        type: string
        description: "Single text to embed"
        required: false
      - name: texts
        type: array
        description: "Multiple texts to embed"
        required: false
      - name: model
        type: string
        description: "Embedding model"
        required: false
        default: "text-embedding-ada-002"
      - name: normalize
        type: boolean
        description: "Normalize vectors"
        required: false
        default: true
      - name: encoding_format
        type: string
        description: "Output format"
        required: false
        default: "float"
        enum: ["float", "base64"]
    tags: ["ai", "embeddings", "vector", "semantic", "nlp"]
    test_prompts:
      single:
        - "Generate embeddings for the document"
        - "Get vector representation of this text"
        - "Create embeddings for similarity search"
        - "Embed these sentences"

  - name: semantic_search
    descriptions:
      minimal: "Semantic search"
      short: "Search by meaning using AI"
      medium: "Search for relevant documents or text by semantic meaning rather than exact keyword match."
      long: "Search for semantically similar content using embeddings. Returns results ranked by relevance. Example: semantic_search(query='renewable energy solutions', collection='documents', top_k=10)."
      verbose: "Search for content by meaning using vector embeddings. Unlike keyword search, semantic search understands intent and context. Searches a pre-indexed collection of embedded documents. Returns ranked results with similarity scores. Example: semantic_search(query='How to reduce carbon emissions', collection='knowledge_base', top_k=5, threshold=0.7, filters='{\"category\": \"environment\"}', include_metadata=true). Note: Collection must be pre-indexed with embeddings. Warning: Very short queries may have lower precision."
    parameters:
      - name: query
        type: string
        description: "Search query"
        required: true
      - name: collection
        type: string
        description: "Collection to search"
        required: true
      - name: top_k
        type: integer
        description: "Number of results"
        required: false
        default: 10
      - name: threshold
        type: number
        description: "Minimum similarity score"
        required: false
      - name: filters
        type: string
        description: "Metadata filters (JSON)"
        required: false
      - name: include_metadata
        type: boolean
        description: "Include document metadata"
        required: false
        default: true
    tags: ["ai", "search", "semantic", "vector", "similarity"]
    test_prompts:
      single:
        - "Find documents about climate change"
        - "Search for similar articles"
        - "Find relevant FAQs for this question"
        - "Semantic search the knowledge base"

  - name: generate_image
    descriptions:
      minimal: "Generate image"
      short: "Generate an image from text description"
      medium: "Generate an image from a text prompt using AI image generation models like DALL-E or Stable Diffusion."
      long: "Create images from text descriptions. Configure size, style, and quality. Example: generate_image(prompt='A sunset over mountains, oil painting style', size='1024x1024')."
      verbose: "Generate images from text prompts using AI models (DALL-E 3, Stable Diffusion, Midjourney). Options: size, quality, style (vivid/natural), negative prompts (what to avoid), seed (reproducibility). Example: generate_image(prompt='Professional headshot of a business executive, studio lighting, neutral background', model='dall-e-3', size='1024x1024', quality='hd', style='natural', n=1). Note: Generated images are unique but not always perfect. Warning: Ensure compliance with usage policies; avoid generating copyrighted or inappropriate content."
    parameters:
      - name: prompt
        type: string
        description: "Image description"
        required: true
      - name: model
        type: string
        description: "Generation model"
        required: false
        default: "dall-e-3"
      - name: size
        type: string
        description: "Image dimensions"
        required: false
        default: "1024x1024"
        enum: ["256x256", "512x512", "1024x1024", "1792x1024", "1024x1792"]
      - name: quality
        type: string
        description: "Image quality"
        required: false
        default: "standard"
        enum: ["standard", "hd"]
      - name: style
        type: string
        description: "Image style"
        required: false
        enum: ["vivid", "natural"]
      - name: n
        type: integer
        description: "Number of images"
        required: false
        default: 1
    tags: ["ai", "image", "generate", "dall-e", "creative"]
    test_prompts:
      single:
        - "Generate an image of a futuristic city"
        - "Create a logo for a coffee shop"
        - "Generate product mockup images"
        - "Make an illustration of a robot"

  - name: transcribe_audio
    descriptions:
      minimal: "Transcribe audio"
      short: "Convert audio to text"
      medium: "Transcribe spoken audio to text using AI speech recognition models."
      long: "Convert audio files to text transcription. Supports multiple languages and speaker diarization. Example: transcribe_audio(file='meeting.mp3', language='en')."
      verbose: "Transcribe audio to text using AI speech recognition (Whisper, Google Speech, AWS Transcribe). Features: automatic language detection, timestamps, speaker identification, punctuation, word-level confidence. Example: transcribe_audio(file='interview.wav', language='en', timestamps='word', speaker_labels=true, vocabulary=['AI', 'GPT', 'LLM']) returns detailed transcription with speakers and timing. Note: Accuracy depends on audio quality and accents. Warning: Long files may take significant processing time."
    parameters:
      - name: file
        type: string
        description: "Path to audio file"
        required: true
      - name: language
        type: string
        description: "Language code or 'auto'"
        required: false
        default: "auto"
      - name: timestamps
        type: string
        description: "Timestamp granularity"
        required: false
        enum: ["none", "segment", "word"]
      - name: speaker_labels
        type: boolean
        description: "Identify different speakers"
        required: false
        default: false
      - name: vocabulary
        type: array
        description: "Custom vocabulary/terms"
        required: false
      - name: model
        type: string
        description: "Transcription model"
        required: false
    tags: ["ai", "audio", "transcribe", "speech", "stt"]
    test_prompts:
      single:
        - "Transcribe this audio recording"
        - "Convert the podcast to text"
        - "Get the transcript of the meeting"
        - "Speech to text for this file"

  - name: text_to_speech
    descriptions:
      minimal: "Text to speech"
      short: "Convert text to spoken audio"
      medium: "Convert written text to natural-sounding speech audio using AI voice synthesis."
      long: "Convert text to audio speech. Choose from various voices and adjust speed. Example: text_to_speech(text='Hello and welcome to our podcast', voice='nova', output_file='intro.mp3')."
      verbose: "Convert text to natural-sounding speech using AI voice synthesis. Options: multiple voice personas, languages, speaking speed, pitch, output format. Example: text_to_speech(text='Welcome to our AI assistant', voice='alloy', speed=1.0, output_format='mp3', model='tts-1-hd', output_file='welcome.mp3'). Note: HD model produces higher quality but costs more. Warning: Very long texts may have pauses; consider chunking."
    parameters:
      - name: text
        type: string
        description: "Text to convert"
        required: true
      - name: voice
        type: string
        description: "Voice persona"
        required: false
        default: "alloy"
        enum: ["alloy", "echo", "fable", "onyx", "nova", "shimmer"]
      - name: speed
        type: number
        description: "Speaking speed (0.25-4.0)"
        required: false
        default: 1.0
      - name: output_format
        type: string
        description: "Audio format"
        required: false
        default: "mp3"
        enum: ["mp3", "wav", "flac", "opus"]
      - name: model
        type: string
        description: "TTS model"
        required: false
        default: "tts-1"
        enum: ["tts-1", "tts-1-hd"]
      - name: output_file
        type: string
        description: "Output file path"
        required: false
    tags: ["ai", "tts", "speech", "voice", "audio"]
    test_prompts:
      single:
        - "Read this text aloud"
        - "Generate audio from the script"
        - "Convert the article to speech"
        - "Create voiceover for the video"

  - name: analyze_image
    descriptions:
      minimal: "Analyze image"
      short: "Analyze image content with AI"
      medium: "Analyze an image using AI vision to describe content, detect objects, or extract text."
      long: "Analyze image content using AI vision models. Describe scenes, identify objects, read text (OCR), detect faces. Example: analyze_image(image='photo.jpg', tasks=['describe', 'objects'])."
      verbose: "Analyze image content using AI vision models (GPT-4 Vision, Google Vision, AWS Rekognition). Tasks: 'describe' (caption/summary), 'objects' (object detection with bounding boxes), 'text' (OCR), 'faces' (face detection), 'labels' (content labels), 'colors' (dominant colors), 'safe_search' (content moderation). Example: analyze_image(image='product.jpg', tasks=['describe', 'objects', 'text'], model='gpt-4-vision', detail='high') returns detailed analysis. Note: Processing time varies by image size and tasks. Warning: Face detection results should be used responsibly."
    parameters:
      - name: image
        type: string
        description: "Image path or URL"
        required: true
      - name: tasks
        type: array
        description: "Analysis tasks to perform"
        required: false
        default: ["describe"]
      - name: model
        type: string
        description: "Vision model"
        required: false
      - name: detail
        type: string
        description: "Analysis detail level"
        required: false
        default: "auto"
        enum: ["low", "high", "auto"]
      - name: max_tokens
        type: integer
        description: "Max tokens for description"
        required: false
        default: 300
    tags: ["ai", "vision", "image", "analyze", "ocr"]
    test_prompts:
      single:
        - "What's in this image?"
        - "Describe the photo"
        - "Extract text from the image"
        - "Detect objects in the picture"

  - name: moderate_content
    descriptions:
      minimal: "Moderate content"
      short: "Check content for policy violations"
      medium: "Check text or image content for violations of content policies using AI moderation."
      long: "Moderate content for policy violations. Checks for harassment, hate speech, violence, adult content, etc. Example: moderate_content(text='user comment here', categories=['harassment', 'hate'])."
      verbose: "Check content against safety policies using AI moderation models. Categories: 'hate' (hate speech), 'harassment', 'self_harm', 'sexual', 'violence', 'spam', 'misinformation'. Returns category scores and flagged status. Example: moderate_content(text='user generated content', categories=['hate', 'harassment', 'violence', 'sexual'], threshold=0.5, return_scores=true) returns {\"flagged\": false, \"scores\": {\"hate\": 0.001, ...}}. Note: Thresholds should be tuned for use case. Warning: No moderation system is perfect; human review may still be needed."
    parameters:
      - name: text
        type: string
        description: "Text to moderate"
        required: false
      - name: image
        type: string
        description: "Image path to moderate"
        required: false
      - name: categories
        type: array
        description: "Categories to check"
        required: false
      - name: threshold
        type: number
        description: "Flagging threshold"
        required: false
        default: 0.5
      - name: return_scores
        type: boolean
        description: "Return category scores"
        required: false
        default: true
    tags: ["ai", "moderation", "safety", "content", "filter"]
    test_prompts:
      single:
        - "Check if this comment is appropriate"
        - "Moderate the user's post"
        - "Is this content safe?"
        - "Flag inappropriate content"

  - name: train_model
    descriptions:
      minimal: "Train model"
      short: "Train a custom ML model"
      medium: "Train or fine-tune a machine learning model on custom data for specific tasks."
      long: "Train a custom ML model on your data. Supports classification, regression, and fine-tuning. Example: train_model(data='training_data.csv', task='classification', target='label')."
      verbose: "Train or fine-tune machine learning models on custom data. Tasks: 'classification' (predict categories), 'regression' (predict numbers), 'fine_tune' (adapt pre-trained LLM). Options: model selection, hyperparameters, validation split, early stopping. Example: train_model(data='reviews.jsonl', task='fine_tune', base_model='gpt-3.5-turbo', epochs=3, validation_split=0.1, suffix='review-classifier'). Note: Training time depends on data size and model complexity. Warning: Ensure training data is clean and representative; biased data produces biased models."
    parameters:
      - name: data
        type: string
        description: "Path to training data"
        required: true
      - name: task
        type: string
        description: "Training task type"
        required: true
        enum: ["classification", "regression", "fine_tune", "embedding"]
      - name: target
        type: string
        description: "Target column name"
        required: false
      - name: base_model
        type: string
        description: "Base model for fine-tuning"
        required: false
      - name: epochs
        type: integer
        description: "Training epochs"
        required: false
        default: 3
      - name: validation_split
        type: number
        description: "Validation data fraction"
        required: false
        default: 0.2
      - name: hyperparameters
        type: string
        description: "Custom hyperparameters (JSON)"
        required: false
    tags: ["ai", "ml", "train", "model", "fine-tune"]
    test_prompts:
      single:
        - "Train a model on my data"
        - "Fine-tune GPT on our FAQs"
        - "Create a custom classifier"
        - "Train a sentiment model"
  - name: detect_anomaly
    descriptions:
      minimal: "Detect anomalies"
      short: "Detect anomalies in data"
      medium: "Use ML to detect anomalies and outliers in time series or tabular data."
      long: "Detect anomalies in data using machine learning. Works with time series or multivariate data. Example: detect_anomaly(data='metrics.csv', columns='[\"cpu\", \"memory\"]', sensitivity=0.95)."
      verbose: "ML-powered anomaly detection for monitoring and data quality. Methods: isolation forest, autoencoder, statistical, prophet (time series). Example: detect_anomaly(data='server_metrics.csv', columns='[\"cpu_usage\", \"memory_usage\", \"request_latency\"]', method='isolation_forest', sensitivity=0.95, window='1h', return_scores=true). Returns: anomaly flags, scores, timestamps. Note: Tune sensitivity to balance false positives/negatives. Warning: Train on normal data periods for best results."
    parameters:
      - name: data
        type: string
        description: "Data source path or connection"
        required: true
      - name: columns
        type: string
        description: "JSON array of columns to analyze"
        required: true
      - name: method
        type: string
        description: "Detection method"
        required: false
        default: "isolation_forest"
        enum: ["isolation_forest", "autoencoder", "statistical", "prophet"]
      - name: sensitivity
        type: number
        description: "Detection sensitivity (0-1)"
        required: false
        default: 0.95
      - name: window
        type: string
        description: "Time window for analysis"
        required: false
      - name: return_scores
        type: boolean
        description: "Return anomaly scores"
        required: false
        default: true
    tags: ["ai", "ml", "anomaly", "detection", "monitoring"]
    test_prompts:
      single:
        - "Find anomalies in server metrics"
        - "Detect unusual patterns"
        - "Check for outliers in data"
        - "Identify anomalous behavior"

  - name: predict_time_series
    descriptions:
      minimal: "Forecast data"
      short: "Predict time series values"
      medium: "Forecast future values using time series prediction models."
      long: "Predict future values in time series data. Supports multiple forecasting models. Example: predict_time_series(data='sales.csv', target='revenue', horizon=30)."
      verbose: "Time series forecasting using statistical and ML models. Models: ARIMA, Prophet, LSTM, XGBoost. Features: seasonality detection, trend analysis, confidence intervals, external regressors. Example: predict_time_series(data='sales_history.csv', target='daily_sales', horizon=30, model='prophet', seasonality='[\"weekly\", \"yearly\"]', confidence=0.95). Returns: predictions, confidence intervals, feature importance. Note: More historical data improves accuracy. Warning: Predictions degrade for longer horizons."
    parameters:
      - name: data
        type: string
        description: "Historical data path"
        required: true
      - name: target
        type: string
        description: "Target column to predict"
        required: true
      - name: horizon
        type: integer
        description: "Prediction horizon (periods)"
        required: true
      - name: model
        type: string
        description: "Forecasting model"
        required: false
        default: "prophet"
        enum: ["arima", "prophet", "lstm", "xgboost"]
      - name: seasonality
        type: string
        description: "JSON array of seasonality types"
        required: false
      - name: confidence
        type: number
        description: "Confidence interval level"
        required: false
        default: 0.95
    tags: ["ai", "ml", "forecasting", "prediction", "time_series"]
    test_prompts:
      single:
        - "Forecast next month sales"
        - "Predict future demand"
        - "Forecast website traffic"
        - "Predict stock levels"

  - name: cluster_data
    descriptions:
      minimal: "Cluster data"
      short: "Cluster data into groups"
      medium: "Group similar data points together using clustering algorithms."
      long: "Cluster data into groups based on similarity. Supports various algorithms. Example: cluster_data(data='customers.csv', features='[\"age\", \"spend\"]', n_clusters=5)."
      verbose: "Unsupervised clustering to discover data patterns. Algorithms: K-means, DBSCAN, hierarchical, GMM. Features: automatic k selection, silhouette scoring, cluster profiling. Example: cluster_data(data='customer_data.csv', features='[\"age\", \"total_purchases\", \"avg_order_value\", \"days_since_last_order\"]', algorithm='kmeans', n_clusters='auto', max_clusters=10). Returns: cluster assignments, centroids, quality metrics, profiles. Note: Normalize features for distance-based methods. Warning: High-dimensional data may need dimensionality reduction first."
    parameters:
      - name: data
        type: string
        description: "Data source path"
        required: true
      - name: features
        type: string
        description: "JSON array of feature columns"
        required: true
      - name: algorithm
        type: string
        description: "Clustering algorithm"
        required: false
        default: "kmeans"
        enum: ["kmeans", "dbscan", "hierarchical", "gmm"]
      - name: n_clusters
        type: string
        description: "Number of clusters or 'auto'"
        required: false
        default: "auto"
      - name: max_clusters
        type: integer
        description: "Max clusters for auto selection"
        required: false
        default: 10
    tags: ["ai", "ml", "clustering", "segmentation", "unsupervised"]
    test_prompts:
      single:
        - "Segment customers into groups"
        - "Cluster similar products"
        - "Find data patterns"
        - "Group users by behavior"

  - name: extract_features
    descriptions:
      minimal: "Extract features"
      short: "Extract ML features from data"
      medium: "Automatically extract and engineer features for machine learning."
      long: "Extract and engineer features from raw data. Creates ML-ready feature sets. Example: extract_features(data='orders.csv', target='churn', methods='[\"aggregations\", \"interactions\"]')."
      verbose: "Automated feature engineering for ML pipelines. Methods: aggregations (sum, mean, count), interactions (multiply, divide), time-based (recency, frequency), text (TF-IDF, embeddings), categorical (one-hot, target encoding). Example: extract_features(data='user_activity.csv', target='converted', methods='[\"aggregations\", \"time_based\", \"interactions\"]', time_column='timestamp', entity_column='user_id'). Returns: feature matrix, feature importance, correlation analysis. Note: Feature engineering often improves model performance more than algorithm tuning."
    parameters:
      - name: data
        type: string
        description: "Data source path"
        required: true
      - name: target
        type: string
        description: "Target column for supervised features"
        required: false
      - name: methods
        type: string
        description: "JSON array of feature methods"
        required: true
      - name: time_column
        type: string
        description: "Timestamp column"
        required: false
      - name: entity_column
        type: string
        description: "Entity/group column"
        required: false
      - name: max_features
        type: integer
        description: "Maximum features to generate"
        required: false
        default: 100
    tags: ["ai", "ml", "features", "engineering", "preprocessing"]
    test_prompts:
      single:
        - "Extract features from user data"
        - "Engineer ML features"
        - "Create feature matrix"
        - "Generate predictive features"

  - name: explain_prediction
    descriptions:
      minimal: "Explain prediction"
      short: "Explain model prediction"
      medium: "Get human-readable explanations for model predictions."
      long: "Generate explanations for ML model predictions. Shows feature contributions. Example: explain_prediction(model='churn_model', input='{\"age\": 25, \"tenure\": 12}')."
      verbose: "Explainable AI for model interpretability. Methods: SHAP (Shapley values), LIME (local explanations), feature importance, attention weights. Example: explain_prediction(model='customer_churn_v2', input='{\"age\": 35, \"monthly_charges\": 85.50, \"tenure_months\": 6, \"contract\": \"month-to-month\"}', method='shap', include_visualization=true). Returns: feature contributions, explanation text, visualization. Note: Essential for regulated industries requiring explainability. Warning: Some methods are computationally expensive."
    parameters:
      - name: model
        type: string
        description: "Model ID or path"
        required: true
      - name: input
        type: string
        description: "JSON input data"
        required: true
      - name: method
        type: string
        description: "Explanation method"
        required: false
        default: "shap"
        enum: ["shap", "lime", "feature_importance", "attention"]
      - name: include_visualization
        type: boolean
        description: "Include visual explanation"
        required: false
        default: false
      - name: top_features
        type: integer
        description: "Number of top features to show"
        required: false
        default: 10
    tags: ["ai", "ml", "explainability", "xai", "interpretability"]
    test_prompts:
      single:
        - "Explain why this was predicted"
        - "What drove this prediction?"
        - "Show feature contributions"
        - "Interpret model decision"

  - name: evaluate_model
    descriptions:
      minimal: "Evaluate model"
      short: "Evaluate model performance"
      medium: "Compute comprehensive metrics to evaluate ML model performance."
      long: "Evaluate model performance with various metrics. Compare against baselines. Example: evaluate_model(model='sentiment_v2', test_data='test.csv', metrics='[\"accuracy\", \"f1\"]')."
      verbose: "Comprehensive model evaluation and benchmarking. Metrics: classification (accuracy, precision, recall, F1, AUC-ROC), regression (MAE, RMSE, R²), ranking (NDCG, MAP). Features: confusion matrix, error analysis, slice evaluation, A/B comparison. Example: evaluate_model(model='product_recommender', test_data='holdout.csv', metrics='[\"ndcg@10\", \"map\", \"coverage\"]', slices='[{\"column\": \"user_segment\", \"values\": [\"new\", \"returning\"]}]'). Returns: metric scores, visualizations, error examples. Note: Evaluate on representative test data. Warning: Good metrics don't guarantee real-world performance."
    parameters:
      - name: model
        type: string
        description: "Model ID or path"
        required: true
      - name: test_data
        type: string
        description: "Test data path"
        required: true
      - name: metrics
        type: string
        description: "JSON array of metrics"
        required: true
      - name: slices
        type: string
        description: "JSON slice definitions for segment analysis"
        required: false
      - name: baseline_model
        type: string
        description: "Baseline model to compare"
        required: false
    tags: ["ai", "ml", "evaluation", "metrics", "testing"]
    test_prompts:
      single:
