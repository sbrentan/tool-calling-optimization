      verbose: "Create automated ML pipelines. Steps: data processing, training, evaluation, deployment. Features: caching, parallelism, conditional execution. Example: create_pipeline(name='model-retraining', steps='[{\"name\": \"preprocess\", \"script\": \"preprocess.py\", \"instance_type\": \"ml.c5.xlarge\"}, {\"name\": \"train\", \"script\": \"train.py\", \"instance_type\": \"ml.p3.2xlarge\"}, {\"name\": \"evaluate\", \"script\": \"evaluate.py\"}, {\"name\": \"deploy\", \"condition\": \"metrics.accuracy > 0.9\"}]', schedule='0 2 * * 0'). Note: Test pipelines before scheduling. Warning: Long pipelines increase debugging complexity."
