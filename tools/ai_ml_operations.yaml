    descriptions:
      minimal: "Tune hyperparameters"
      short: "Tune model hyperparameters"
      medium: "Automatically tune model hyperparameters for optimal performance."
      long: "Hyperparameter optimization. Example: tune_hyperparameters(script='train.py', parameters='{\"learning_rate\": [0.001, 0.1]}')."
      verbose: "Automated hyperparameter tuning for ML models. Strategies: random search, grid search, Bayesian optimization. Example: tune_hyperparameters(training_script='train.py', hyperparameter_ranges='{\"learning_rate\": {\"type\": \"continuous\", \"min\": 0.0001, \"max\": 0.1, \"scaling\": \"log\"}, \"batch_size\": {\"type\": \"categorical\", \"values\": [32, 64, 128]}}', objective_metric='validation_accuracy', objective_type='maximize', max_jobs=50, max_parallel=5, strategy='bayesian'). Note: More jobs improve results but cost more. Warning: Early stopping can save resources."
