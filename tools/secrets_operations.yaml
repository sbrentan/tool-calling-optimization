category: secrets_operations
description: "Secrets management, vault operations, and credential handling"

tools:
  - name: create_secret
    descriptions:
      minimal: "Create secret"
      short: "Create a new secret"
      medium: "Create a new secret in the secrets vault."
      long: "Store secret in vault. Example: create_secret(name='db-password', value='secret123', tags='{\"env\": \"prod\"}')."
      verbose: "Create secrets in secure vault storage. Features: encryption at rest, versioning, rotation policies. Example: create_secret(name='database/prod/password', value='s3cr3t!', description='Production DB password', tags='{\"environment\": \"production\", \"service\": \"api\"}', kms_key='alias/secrets', rotation_days=90). Note: Use descriptive names with path hierarchy. Warning: Never log secret values."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: value
        type: string
        description: "Secret value"
        required: true
      - name: description
        type: string
        description: "Secret description"
        required: false
      - name: tags
        type: string
        description: "Tags as JSON object"
        required: false
      - name: kms_key
        type: string
        description: "KMS key for encryption"
        required: false
      - name: rotation_days
        type: integer
        description: "Rotation period in days"
        required: false
    tags: ["secrets", "create", "vault", "store", "credential"]
    test_prompts:
      single:
        - "Create new secret"
        - "Store password in vault"
        - "Add secret to vault"
        - "Save API key securely"

  - name: get_secret
    descriptions:
      minimal: "Get secret"
      short: "Retrieve a secret"
      medium: "Retrieve a secret value from the vault."
      long: "Fetch secret from vault. Example: get_secret(name='db-password', version='latest')."
      verbose: "Retrieve secrets securely. Options: specific version, latest, or previous. Example: get_secret(name='database/prod/password', version='latest', include_metadata=true). Returns secret value and metadata (created date, version, rotation status). Note: Access is logged for audit. Warning: Minimize secret exposure in memory; clear after use."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: version
        type: string
        description: "Version (ID, 'latest', or 'previous')"
        required: false
        default: "latest"
      - name: include_metadata
        type: boolean
        description: "Include metadata"
        required: false
        default: false
    tags: ["secrets", "get", "retrieve", "vault", "fetch"]
    test_prompts:
      single:
        - "Get secret value"
        - "Retrieve password"
        - "Fetch API key"
        - "Get credential from vault"

  - name: update_secret
    descriptions:
      minimal: "Update secret"
      short: "Update secret value"
      medium: "Update an existing secret with a new value."
      long: "Update secret in vault. Example: update_secret(name='db-password', value='newSecret456')."
      verbose: "Update secret value creating new version. Previous versions retained per policy. Example: update_secret(name='database/prod/password', value='n3wS3cr3t!', description='Updated for Q1 rotation'). Returns new version ID. Note: Old versions remain accessible until deleted. Warning: Update downstream services to use new version."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: value
        type: string
        description: "New secret value"
        required: true
      - name: description
        type: string
        description: "Update description"
        required: false
    tags: ["secrets", "update", "rotate", "vault", "change"]
    test_prompts:
      single:
        - "Update secret"
        - "Change password in vault"
        - "Rotate secret value"
        - "Update API key"

  - name: delete_secret
    descriptions:
      minimal: "Delete secret"
      short: "Delete a secret"
      medium: "Delete a secret from the vault."
      long: "Remove secret from vault. Example: delete_secret(name='old-api-key', force=false)."
      verbose: "Delete secrets with recovery period. Default: scheduled deletion (recoverable). Force: immediate permanent deletion. Example: delete_secret(name='deprecated/service-key', recovery_days=7, force=false). Note: Scheduled deletion allows recovery window. Warning: Force delete is irreversible."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: force
        type: boolean
        description: "Immediate permanent deletion"
        required: false
        default: false
      - name: recovery_days
        type: integer
        description: "Recovery window (days)"
        required: false
        default: 30
    tags: ["secrets", "delete", "remove", "vault", "cleanup"]
    test_prompts:
      single:
        - "Delete secret"
        - "Remove old password"
        - "Delete API key from vault"
        - "Clean up unused secrets"

  - name: rotate_secret
    descriptions:
      minimal: "Rotate secret"
      short: "Rotate secret automatically"
      medium: "Trigger automatic rotation of a secret."
      long: "Rotate secret using rotation function. Example: rotate_secret(name='db-password', rotation_lambda='arn:aws:lambda:...')."
      verbose: "Automatic secret rotation with lambda function. Steps: create new secret, update service, test, commit/rollback. Example: rotate_secret(name='database/prod/password', rotation_lambda='arn:aws:lambda:us-east-1:123:function:db-rotator', rotate_immediately=true). Note: Rotation function must handle all steps. Warning: Test rotation in non-production first."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: rotation_lambda
        type: string
        description: "Rotation function ARN"
        required: true
      - name: rotate_immediately
        type: boolean
        description: "Rotate now"
        required: false
        default: false
      - name: rotation_days
        type: integer
        description: "Rotation interval (days)"
        required: false
        default: 30
    tags: ["secrets", "rotate", "automatic", "lambda", "security"]
    test_prompts:
      single:
        - "Rotate secret"
        - "Auto-rotate password"
        - "Trigger rotation"
        - "Rotate credentials"

  - name: list_secrets
    descriptions:
      minimal: "List secrets"
      short: "List all secrets"
      medium: "List secrets in the vault with optional filtering."
      long: "List vault secrets. Example: list_secrets(prefix='database/', include_metadata=true)."
      verbose: "List secrets with filtering and metadata. Filters: prefix, tags, creation date. Example: list_secrets(prefix='production/', tags='{\"service\": \"api\"}', sort_by='created_date', order='desc', max_results=100). Returns names, not values. Note: Use pagination for large lists. Warning: List access should be restricted."
    parameters:
      - name: prefix
        type: string
        description: "Name prefix filter"
        required: false
      - name: tags
        type: string
        description: "Filter by tags (JSON)"
        required: false
      - name: include_metadata
        type: boolean
        description: "Include secret metadata"
        required: false
        default: false
      - name: max_results
        type: integer
        description: "Maximum results"
        required: false
        default: 100
      - name: next_token
        type: string
        description: "Pagination token"
        required: false
    tags: ["secrets", "list", "enumerate", "vault", "browse"]
    test_prompts:
      single:
        - "List all secrets"
        - "Show vault contents"
        - "List database secrets"
        - "Find secrets by tag"

  - name: get_secret_versions
    descriptions:
      minimal: "Get versions"
      short: "Get secret versions"
      medium: "List all versions of a secret."
      long: "List secret version history. Example: get_secret_versions(name='db-password', include_deprecated=true)."
      verbose: "Retrieve secret version history. Each rotation/update creates new version. Example: get_secret_versions(name='database/prod/password', include_deprecated=true, max_results=50). Returns version IDs, creation dates, staging labels. Note: Versions marked for deletion are deprecated. Warning: Old versions may still be in use by services."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: include_deprecated
        type: boolean
        description: "Include deprecated versions"
        required: false
        default: false
      - name: max_results
        type: integer
        description: "Maximum results"
        required: false
        default: 20
    tags: ["secrets", "versions", "history", "vault", "list"]
    test_prompts:
      single:
        - "Get secret versions"
        - "Show version history"
        - "List password versions"
        - "What versions exist"

  - name: set_secret_policy
    descriptions:
      minimal: "Set policy"
      short: "Set secret access policy"
      medium: "Configure access control policy for a secret."
      long: "Set secret IAM policy. Example: set_secret_policy(name='api-key', policy='{\"Version\": \"2012-10-17\", ...}')."
      verbose: "Configure resource-based access policy. Policy elements: principals, actions, conditions. Example: set_secret_policy(name='database/prod/password', policy='{\"Version\": \"2012-10-17\", \"Statement\": [{\"Effect\": \"Allow\", \"Principal\": {\"AWS\": \"arn:aws:iam::123:role/app-role\"}, \"Action\": [\"secretsmanager:GetSecretValue\"], \"Resource\": \"*\"}]}'). Note: Policy is in addition to IAM policies. Warning: Incorrect policies can block all access."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
      - name: policy
        type: string
        description: "JSON policy document"
        required: true
    tags: ["secrets", "policy", "access", "permissions", "iam"]
    test_prompts:
      single:
        - "Set secret policy"
        - "Grant access to secret"
        - "Configure secret permissions"
        - "Allow role to read secret"

  - name: restore_secret
    descriptions:
      minimal: "Restore secret"
      short: "Restore deleted secret"
      medium: "Restore a secret that was scheduled for deletion."
      long: "Cancel secret deletion. Example: restore_secret(name='accidentally-deleted')."
      verbose: "Restore secret scheduled for deletion (within recovery window). Example: restore_secret(name='database/prod/password'). Cancels scheduled deletion and restores to active state. Note: Only works during recovery window. Warning: Force-deleted secrets cannot be restored."
    parameters:
      - name: name
        type: string
        description: "Secret name/path"
        required: true
    tags: ["secrets", "restore", "recover", "undelete", "vault"]
    test_prompts:
      single:
        - "Restore deleted secret"
        - "Recover secret"
        - "Cancel secret deletion"
        - "Undelete password"

  - name: generate_password
    descriptions:
      minimal: "Generate password"
      short: "Generate secure password"
      medium: "Generate a cryptographically secure password."
      long: "Generate random password. Example: generate_password(length=32, include_symbols=true)."
      verbose: "Generate cryptographically secure passwords. Configurable: length, character sets, exclusions. Example: generate_password(length=32, include_uppercase=true, include_lowercase=true, include_numbers=true, include_symbols=true, exclude_characters='\"@/\\', require_each_type=true). Note: Use for new secrets, not retrieval. Warning: Password is only returned once; store immediately."
    parameters:
      - name: length
        type: integer
        description: "Password length"
        required: false
        default: 32
      - name: include_uppercase
        type: boolean
        description: "Include uppercase letters"
        required: false
        default: true
      - name: include_lowercase
        type: boolean
        description: "Include lowercase letters"
        required: false
        default: true
      - name: include_numbers
        type: boolean
        description: "Include numbers"
        required: false
        default: true
      - name: include_symbols
        type: boolean
        description: "Include symbols"
        required: false
        default: true
      - name: exclude_characters
        type: string
        description: "Characters to exclude"
        required: false
      - name: require_each_type
        type: boolean
        description: "Require at least one of each type"
        required: false
        default: true
    tags: ["secrets", "password", "generate", "random", "secure"]
    test_prompts:
      single:
        - "Generate secure password"
        - "Create random password"
        - "Generate API key"
        - "Make strong password"
