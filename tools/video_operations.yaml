category: video_operations
description: Video processing and editing operations
tools:
  - name: convert_video
    descriptions:
      minimal: "Convert video"
      short: "Convert video format"
      medium: "Convert a video file to a different format or codec."
      long: "Convert video between formats (MP4, WebM, AVI, MOV, etc.) with codec and quality options. Example: convert_video(input='video.avi', output='video.mp4', codec='h264')."
      verbose: "Convert video files between formats and codecs. Formats: MP4, WebM, AVI, MOV, MKV, FLV, WMV. Codecs: 'h264' (most compatible), 'h265/hevc' (better compression), 'vp9' (web), 'av1' (newest). Options: quality (CRF), bitrate, resolution, frame rate, audio codec. Example: convert_video(input='raw.mov', output='web.mp4', codec='h264', quality=23, audio_codec='aac', resolution='1920x1080'). Note: H.264 offers best compatibility. Warning: High-quality encoding is CPU-intensive and time-consuming."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: codec
        type: string
        description: "Video codec"
        required: false
        default: "h264"
        enum: ["h264", "h265", "vp9", "av1", "copy"]
      - name: quality
        type: integer
        description: "Quality (CRF, lower=better)"
        required: false
        default: 23
      - name: resolution
        type: string
        description: "Output resolution (e.g., 1920x1080)"
        required: false
      - name: fps
        type: number
        description: "Frame rate"
        required: false
      - name: audio_codec
        type: string
        description: "Audio codec"
        required: false
        default: "aac"
        enum: ["aac", "mp3", "opus", "copy", "none"]
    tags: ["video", "convert", "format", "codec", "transcode"]
    test_prompts:
      single:
        - "Convert this video to MP4"
        - "Change the video format to WebM"
        - "Transcode the video to H.265"
        - "Convert AVI to MP4"

  - name: trim_video
    descriptions:
      minimal: "Trim video"
      short: "Trim video to specific duration"
      medium: "Trim a video to a specific start and end time."
      long: "Trim video to keep only a portion. Specify start and end times or duration. Example: trim_video(input='video.mp4', start='00:01:30', end='00:05:00', output='clip.mp4')."
      verbose: "Trim video files to extract specific portions. Time formats: 'HH:MM:SS', 'MM:SS', or seconds (e.g., '90.5'). Options: start time, end time, or duration. Mode: 'fast' (uses keyframes, may be imprecise), 'accurate' (re-encodes for exact timing). Example: trim_video(input='long_video.mp4', start='00:10:30', duration='00:02:00', mode='accurate', output='highlight.mp4'). Note: Fast mode is instant but may include extra frames. Warning: Accurate mode requires full re-encoding."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: start
        type: string
        description: "Start time"
        required: true
      - name: end
        type: string
        description: "End time"
        required: false
      - name: duration
        type: string
        description: "Duration (alternative to end)"
        required: false
      - name: mode
        type: string
        description: "Trimming mode"
        required: false
        default: "fast"
        enum: ["fast", "accurate"]
    tags: ["video", "trim", "cut", "clip", "extract"]
    test_prompts:
      single:
        - "Trim the video from 1:30 to 5:00"
        - "Cut the first 30 seconds"
        - "Extract a 2-minute clip"
        - "Trim the video to the highlight"

  - name: merge_videos
    descriptions:
      minimal: "Merge videos"
      short: "Merge multiple videos"
      medium: "Concatenate multiple video files into a single video."
      long: "Merge multiple videos into one. Videos are concatenated in order. Example: merge_videos(inputs='[\"part1.mp4\", \"part2.mp4\"]', output='full.mp4')."
      verbose: "Concatenate multiple video files into a single video. Modes: 'concat' (same codec, fast), 'reencode' (different formats, slower). Options: transition between clips (fade, dissolve), crossfade duration, output format. Example: merge_videos(inputs='[\"intro.mp4\", \"main.mp4\", \"outro.mp4\"]', transition='crossfade', transition_duration=1.0, output='final.mp4'). Note: Same-codec videos can be merged quickly without re-encoding. Warning: Different resolutions/framerates require re-encoding."
    parameters:
      - name: inputs
        type: string
        description: "JSON array of video paths"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: mode
        type: string
        description: "Merge mode"
        required: false
        default: "concat"
        enum: ["concat", "reencode"]
      - name: transition
        type: string
        description: "Transition effect"
        required: false
        enum: ["none", "fade", "crossfade", "dissolve"]
      - name: transition_duration
        type: number
        description: "Transition duration in seconds"
        required: false
        default: 0.5
    tags: ["video", "merge", "concat", "join", "combine"]
    test_prompts:
      single:
        - "Merge these video files"
        - "Concatenate the video parts"
        - "Join the clips together"
        - "Combine videos with a crossfade"

  - name: add_subtitles
    descriptions:
      minimal: "Add subtitles"
      short: "Add subtitles to video"
      medium: "Add subtitles to a video from an SRT, VTT, or ASS file."
      long: "Burn subtitles into video or add as a selectable track. Supports SRT, VTT, ASS formats. Example: add_subtitles(video='movie.mp4', subtitles='subs.srt', output='movie_subbed.mp4')."
      verbose: "Add subtitles to video files. Modes: 'burn' (permanent, hardcoded), 'soft' (selectable track). Formats: SRT, VTT, ASS/SSA. Styling (for burn mode): font, size, color, position, outline, shadow. Example: add_subtitles(video='interview.mp4', subtitles='captions.srt', mode='burn', font='Arial', font_size=24, color='#FFFFFF', outline=2, position='bottom', output='captioned.mp4'). Note: Burned subtitles cannot be removed. Warning: Soft subtitles require player support."
    parameters:
      - name: video
        type: string
        description: "Input video file path"
        required: true
      - name: subtitles
        type: string
        description: "Subtitles file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: mode
        type: string
        description: "Subtitle mode"
        required: false
        default: "burn"
        enum: ["burn", "soft"]
      - name: font
        type: string
        description: "Font name (for burn mode)"
        required: false
        default: "Arial"
      - name: font_size
        type: integer
        description: "Font size"
        required: false
        default: 24
      - name: color
        type: string
        description: "Subtitle color (hex)"
        required: false
        default: "#FFFFFF"
      - name: position
        type: string
        description: "Subtitle position"
        required: false
        default: "bottom"
        enum: ["top", "center", "bottom"]
    tags: ["video", "subtitles", "captions", "srt", "text"]
    test_prompts:
      single:
        - "Add subtitles to the video"
        - "Burn these captions into the video"
        - "Add SRT subtitles"
        - "Put subtitles on the movie"

  - name: extract_frames
    descriptions:
      minimal: "Extract frames"
      short: "Extract frames from video"
      medium: "Extract still images/frames from a video at specified intervals."
      long: "Extract frames from video as images. Extract at intervals, specific times, or all frames. Example: extract_frames(video='clip.mp4', interval=1.0, output_dir='./frames/')."
      verbose: "Extract still frames from video files. Modes: 'interval' (every N seconds), 'count' (N evenly spaced frames), 'times' (specific timestamps), 'all' (every frame). Output formats: JPEG, PNG, BMP, WebP. Example: extract_frames(video='timelapse.mp4', mode='count', count=100, format='png', quality=95, output_dir='./frames/', naming='frame_%04d.png'). Note: 'all' mode creates many files (fps × duration). Warning: High-resolution videos produce large image files."
    parameters:
      - name: video
        type: string
        description: "Video file path"
        required: true
      - name: output_dir
        type: string
        description: "Output directory for frames"
        required: true
      - name: mode
        type: string
        description: "Extraction mode"
        required: false
        default: "interval"
        enum: ["interval", "count", "times", "all"]
      - name: interval
        type: number
        description: "Interval in seconds (for interval mode)"
        required: false
        default: 1.0
      - name: count
        type: integer
        description: "Number of frames (for count mode)"
        required: false
      - name: times
        type: string
        description: "JSON array of timestamps (for times mode)"
        required: false
      - name: format
        type: string
        description: "Output image format"
        required: false
        default: "jpg"
        enum: ["jpg", "png", "webp", "bmp"]
      - name: quality
        type: integer
        description: "Image quality (1-100)"
        required: false
        default: 90
    tags: ["video", "frames", "extract", "images", "screenshots"]
    test_prompts:
      single:
        - "Extract frames every 5 seconds"
        - "Get 10 frames from the video"
        - "Extract a frame at 1:30"
        - "Save all frames as images"

  - name: add_watermark
    descriptions:
      minimal: "Add watermark"
      short: "Add watermark to video"
      medium: "Add an image or text watermark to a video."
      long: "Add a watermark (image or text) to video. Control position, opacity, and size. Example: add_watermark(video='content.mp4', watermark='logo.png', position='bottom-right', output='branded.mp4')."
      verbose: "Add image or text watermarks to videos. Types: 'image' (PNG with transparency), 'text' (rendered text). Options: position (corners, center), opacity, scale, margin, animation. Example: add_watermark(video='tutorial.mp4', type='image', watermark='logo.png', position='bottom-right', opacity=0.7, scale=0.15, margin=20, output='tutorial_branded.mp4'). Note: PNG watermarks preserve transparency. Warning: Watermarks affect entire video; use trim first for partial watermarking."
    parameters:
      - name: video
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: type
        type: string
        description: "Watermark type"
        required: false
        default: "image"
        enum: ["image", "text"]
      - name: watermark
        type: string
        description: "Image path or text content"
        required: true
      - name: position
        type: string
        description: "Watermark position"
        required: false
        default: "bottom-right"
        enum: ["top-left", "top-right", "bottom-left", "bottom-right", "center"]
      - name: opacity
        type: number
        description: "Opacity (0.0 to 1.0)"
        required: false
        default: 0.8
      - name: scale
        type: number
        description: "Scale relative to video width"
        required: false
        default: 0.1
      - name: margin
        type: integer
        description: "Margin from edge in pixels"
        required: false
        default: 10
    tags: ["video", "watermark", "logo", "branding", "overlay"]
    test_prompts:
      single:
        - "Add my logo to the video"
        - "Put a watermark on the video"
        - "Add branding to the corner"
        - "Watermark with my company logo"

  - name: resize_video
    descriptions:
      minimal: "Resize video"
      short: "Resize video resolution"
      medium: "Resize a video to a different resolution."
      long: "Resize video to new dimensions. Maintains aspect ratio by default. Example: resize_video(input='4k.mp4', width=1920, output='1080p.mp4')."
      verbose: "Resize video to different resolutions. Modes: 'fit' (maintain aspect ratio, fit within dimensions), 'fill' (crop to fill dimensions), 'stretch' (distort to exact size), 'width' (scale by width), 'height' (scale by height). Presets: '4k', '1080p', '720p', '480p'. Example: resize_video(input='source.mp4', preset='1080p', mode='fit', output='hd.mp4') or resize_video(input='source.mp4', width=1280, height=720, mode='fit', output='720p.mp4'). Note: Upscaling doesn't improve quality. Warning: Non-standard aspect ratios may cause letterboxing."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: width
        type: integer
        description: "Target width in pixels"
        required: false
      - name: height
        type: integer
        description: "Target height in pixels"
        required: false
      - name: preset
        type: string
        description: "Resolution preset"
        required: false
        enum: ["4k", "1080p", "720p", "480p", "360p"]
      - name: mode
        type: string
        description: "Resize mode"
        required: false
        default: "fit"
        enum: ["fit", "fill", "stretch"]
    tags: ["video", "resize", "scale", "resolution", "dimensions"]
    test_prompts:
      single:
        - "Resize the video to 720p"
        - "Scale down to 1080p"
        - "Make the video smaller"
        - "Convert to HD resolution"

  - name: adjust_video_speed
    descriptions:
      minimal: "Adjust speed"
      short: "Change video playback speed"
      medium: "Speed up or slow down video playback."
      long: "Adjust video playback speed. Create slow-motion or timelapse effects. Example: adjust_video_speed(input='clip.mp4', speed=2.0, output='fast.mp4')."
      verbose: "Adjust video playback speed for slow-motion or timelapse effects. Speed factor: 0.25 (4x slower) to 10.0 (10x faster). Audio options: 'preserve' (pitch-corrected), 'adjust' (chipmunk/slow), 'remove'. Frame interpolation available for smooth slow-motion. Example: adjust_video_speed(input='action.mp4', speed=0.5, audio='preserve', interpolate=true, output='slowmo.mp4'). Note: Extreme slow-motion benefits from high-fps source. Warning: Speed changes affect total duration and file size."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: speed
        type: number
        description: "Speed multiplier (0.25 to 10.0)"
        required: true
      - name: audio
        type: string
        description: "Audio handling"
        required: false
        default: "preserve"
        enum: ["preserve", "adjust", "remove"]
      - name: interpolate
        type: boolean
        description: "Frame interpolation for smooth slow-mo"
        required: false
        default: false
    tags: ["video", "speed", "slowmo", "timelapse", "tempo"]
    test_prompts:
      single:
        - "Speed up the video 2x"
        - "Create slow motion"
        - "Make a timelapse"
        - "Slow down the video"

  - name: rotate_video
    descriptions:
      minimal: "Rotate video"
      short: "Rotate video orientation"
      medium: "Rotate a video by 90, 180, or 270 degrees."
      long: "Rotate video by specified degrees. Also supports horizontal and vertical flipping. Example: rotate_video(input='sideways.mp4', rotation=90, output='upright.mp4')."
      verbose: "Rotate and flip videos. Rotations: 90 (clockwise), 180, 270 (or -90 counterclockwise). Flip: 'horizontal' (mirror), 'vertical'. Mode: 'metadata' (fast, only sets flag), 'reencode' (actual rotation). Example: rotate_video(input='phone_video.mp4', rotation=90, mode='metadata', output='corrected.mp4'). Note: Metadata rotation requires player support. Warning: Some players ignore rotation metadata; use reencode for compatibility."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: rotation
        type: integer
        description: "Rotation in degrees"
        required: false
        enum: [90, 180, 270]
      - name: flip
        type: string
        description: "Flip direction"
        required: false
        enum: ["horizontal", "vertical"]
      - name: mode
        type: string
        description: "Rotation mode"
        required: false
        default: "metadata"
        enum: ["metadata", "reencode"]
    tags: ["video", "rotate", "flip", "orientation", "transform"]
    test_prompts:
      single:
        - "Rotate the video 90 degrees"
        - "Flip the video horizontally"
        - "Fix the video orientation"
        - "Turn the video upside down"

  - name: compress_video
    descriptions:
      minimal: "Compress video"
      short: "Compress video file size"
      medium: "Compress a video to reduce file size while maintaining quality."
      long: "Compress video to reduce file size. Balance between size and quality. Example: compress_video(input='raw.mp4', target_size='100MB', output='compressed.mp4')."
      verbose: "Compress video files for smaller size. Methods: 'target_size' (aim for specific file size), 'target_bitrate' (specify bitrate), 'crf' (constant quality). Two-pass encoding for better quality at target size. Options: audio bitrate, resolution downscale. Example: compress_video(input='presentation.mp4', method='target_size', target='50MB', two_pass=true, output='small.mp4'). Note: Two-pass is slower but more accurate for size targets. Warning: Aggressive compression causes visible quality loss."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: method
        type: string
        description: "Compression method"
        required: false
        default: "crf"
        enum: ["target_size", "target_bitrate", "crf"]
      - name: target
        type: string
        description: "Target size (e.g., '100MB') or bitrate (e.g., '2M')"
        required: false
      - name: crf
        type: integer
        description: "CRF value (18-28, lower=better)"
        required: false
        default: 23
      - name: two_pass
        type: boolean
        description: "Use two-pass encoding"
        required: false
        default: false
      - name: audio_bitrate
        type: string
        description: "Audio bitrate (e.g., '128k')"
        required: false
        default: "128k"
    tags: ["video", "compress", "reduce", "size", "optimize"]
    test_prompts:
      single:
        - "Compress this video to under 100MB"
        - "Reduce the video file size"
        - "Make the video smaller for sharing"
        - "Optimize the video for web"
  - name: add_video_overlay
    descriptions:
      minimal: "Add overlay"
      short: "Add overlay to video"
      medium: "Add image, logo, or video overlay on top of a video."
      long: "Add overlay elements to video. Position logos, watermarks, or picture-in-picture. Example: add_video_overlay(input='video.mp4', overlay='logo.png', position='top-right')."
      verbose: "Add overlays to videos. Types: image (logo, watermark), video (picture-in-picture). Positioning: corner presets, custom coordinates, animated motion. Example: add_video_overlay(input='tutorial.mp4', overlay='company_logo.png', position='bottom-right', margin=20, opacity=0.8, start_time=0, end_time=null, output='branded.mp4'). Note: Use PNG with transparency for logos. Warning: Large overlays may obscure important content."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: overlay
        type: string
        description: "Overlay image or video path"
        required: true
      - name: position
        type: string
        description: "Overlay position"
        required: false
        default: "bottom-right"
        enum: ["top-left", "top-right", "bottom-left", "bottom-right", "center", "custom"]
      - name: margin
        type: integer
        description: "Margin from edge (pixels)"
        required: false
        default: 10
      - name: opacity
        type: number
        description: "Overlay opacity (0-1)"
        required: false
        default: 1.0
      - name: start_time
        type: number
        description: "Overlay start time (seconds)"
        required: false
      - name: end_time
        type: number
        description: "Overlay end time (seconds)"
        required: false
    tags: ["video", "overlay", "watermark", "logo", "pip"]
    test_prompts:
      single:
        - "Add logo to video"
        - "Watermark the video"
        - "Add picture-in-picture"
        - "Overlay image on video"

  - name: create_video_montage
    descriptions:
      minimal: "Create montage"
      short: "Create video montage"
      medium: "Combine multiple videos or images into a grid montage."
      long: "Create a grid montage from multiple videos or images. Split-screen layouts. Example: create_video_montage(inputs='[\"vid1.mp4\", \"vid2.mp4\"]', layout='2x1', output='montage.mp4')."
      verbose: "Create video montages and split-screen layouts. Layouts: grid (2x2, 3x3), side-by-side (2x1), stacked (1x2), custom. Example: create_video_montage(inputs='[\"interview.mp4\", \"broll.mp4\", \"slides.mp4\", \"reaction.mp4\"]', layout='2x2', gap=2, background='#000000', output='quad_view.mp4'). Note: All videos should have same duration for best results. Warning: Complex layouts may require significant processing time."
    parameters:
      - name: inputs
        type: string
        description: "JSON array of input file paths"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: layout
        type: string
        description: "Grid layout"
        required: true
        enum: ["2x1", "1x2", "2x2", "3x3", "custom"]
      - name: gap
        type: integer
        description: "Gap between videos (pixels)"
        required: false
        default: 0
      - name: background
        type: string
        description: "Background color"
        required: false
        default: "#000000"
      - name: resolution
        type: string
        description: "Output resolution"
        required: false
        default: "1920x1080"
    tags: ["video", "montage", "grid", "split-screen", "combine"]
    test_prompts:
      single:
        - "Create split-screen video"
        - "Make video montage"
        - "Combine videos in grid"
        - "Create 2x2 video layout"

  - name: stabilize_video
    descriptions:
      minimal: "Stabilize video"
      short: "Stabilize shaky video"
      medium: "Apply video stabilization to reduce camera shake."
      long: "Stabilize shaky video footage. Smooths camera movement. Example: stabilize_video(input='handheld.mp4', strength='medium', output='stable.mp4')."
      verbose: "Video stabilization for smoother footage. Algorithms: 2D (translation/rotation), 3D (perspective). Settings: 'light' (subtle), 'medium' (balanced), 'strong' (aggressive). Example: stabilize_video(input='action_cam.mp4', strength='medium', smoothing=10, crop='auto', tripod=false, output='stabilized.mp4'). Note: Strong stabilization may crop edges. Warning: Very shaky footage may not be fully correctable."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: strength
        type: string
        description: "Stabilization strength"
        required: false
        default: "medium"
        enum: ["light", "medium", "strong"]
      - name: smoothing
        type: integer
        description: "Smoothing factor (1-30)"
        required: false
        default: 10
      - name: crop
        type: string
        description: "Edge crop handling"
        required: false
        default: "auto"
        enum: ["auto", "keep", "black"]
      - name: tripod
        type: boolean
        description: "Tripod mode (removes all motion)"
        required: false
        default: false
    tags: ["video", "stabilize", "shake", "smooth", "deshake"]
    test_prompts:
      single:
        - "Stabilize shaky footage"
        - "Fix camera shake"
        - "Smooth out video"
        - "Remove video shake"

  - name: generate_video_chapters
    descriptions:
      minimal: "Add chapters"
      short: "Generate video chapters"
      medium: "Add chapters and navigation points to a video."
      long: "Add chapter markers for video navigation. Useful for long videos. Example: generate_video_chapters(input='lecture.mp4', chapters='[{\"time\": 0, \"title\": \"Intro\"}]')."
      verbose: "Add chapter markers for video navigation. Sources: manual (provide timestamps), auto (detect scene changes), transcript (from subtitles). Example: generate_video_chapters(input='tutorial.mp4', mode='manual', chapters='[{\"time\": 0, \"title\": \"Introduction\"}, {\"time\": 300, \"title\": \"Setup\"}, {\"time\": 900, \"title\": \"Main Content\"}]', output='chaptered.mp4'). Note: Chapters supported in MP4, WebM, MKV. Warning: Some players don't display chapters."
    parameters:
      - name: input
        type: string
        description: "Input video file path"
        required: true
      - name: output
        type: string
        description: "Output video file path"
        required: true
      - name: mode
        type: string
        description: "Chapter generation mode"
        required: false
        default: "manual"
        enum: ["manual", "auto", "transcript"]
      - name: chapters
        type: string
        description: "JSON array of chapters"
        required: false
      - name: min_chapter_length
        type: integer
        description: "Min chapter length (seconds)"
        required: false
        default: 60
    tags: ["video", "chapters", "navigation", "segments", "markers"]
    test_prompts:
      single:
        - "Add chapters to video"
        - "Create video navigation"
        - "Mark video sections"
