      verbose: "Encrypt files for secure storage or transfer. Uses authenticated encryption (AES-GCM) by default. Large files are processed in chunks for memory efficiency. Can embed filename and metadata in encrypted container. Example: encrypt_file(input='sensitive.xlsx', output='sensitive.xlsx.enc', password='strongP@ssword!', algorithm='aes-256-gcm', embed_filename=true). Note: Original file is not deleted automatically. Warning: Losing the password means permanent data loss."
