      long: "Check SSL/TLS certificate status for a domain or file. Returns validity, expiration, issuer, and security grade. Example: check_ssl_certificate(domain='example.com')."
      verbose: "Analyze SSL/TLS certificates for security issues. Checks: validity period, expiration warning, certificate chain, issuer, subject, SANs, key size, signature algorithm, protocol support, vulnerabilities (Heartbleed, etc.). Example: check_ssl_certificate(domain='api.example.com', port=443, warn_days=30) returns {valid: true, expires: '2025-01-01', days_left: 180, grade: 'A', issues: []}. Note: Includes OCSP/CRL revocation check. Warning: Self-signed certs will show as untrusted chain."
    parameters:
      - name: domain
        type: string
        description: "Domain to check"
        required: false
      - name: file
        type: string
        description: "Path to certificate file"
        required: false
      - name: port
        type: integer
        description: "Port to connect (for domain)"
        required: false
        default: 443
      - name: warn_days
        type: integer
        description: "Days before expiry to warn"
        required: false
        default: 30
      - name: check_chain
        type: boolean
        description: "Verify certificate chain"
        required: false
        default: true
    tags: ["security", "ssl", "tls", "certificate", "check"]
    test_prompts:
      single:
        - "Check SSL certificate for example.com"
        - "When does the certificate expire?"
        - "Is the SSL certificate valid?"
        - "Analyze the TLS configuration"
      single_clear:
        - "I need to check an SSL certificate. Check SSL certificate for example.com"
        - "I need to check an SSL certificate. When does the certificate expire?"
        - "I need to check an SSL certificate. Is the SSL certificate valid?"
        - "I need to check an SSL certificate. Analyze the TLS configuration"

  - name: generate_otp
    descriptions:
      minimal: "Generate OTP"
      short: "Generate one-time password"
      medium: "Generate a time-based (TOTP) or counter-based (HOTP) one-time password."
      long: "Generate OTP for two-factor authentication. Supports TOTP (time-based) and HOTP (counter-based). Example: generate_otp(secret='JBSWY3DPEHPK3PXP', type='totp')."
      verbose: "Generate one-time passwords for 2FA. Types: 'totp' (time-based, RFC 6238), 'hotp' (counter-based, RFC 4226). Compatible with Google Authenticator, Authy, etc. Example: generate_otp(secret='JBSWY3DPEHPK3PXP', type='totp', digits=6, period=30) returns {code: '123456', valid_for: 15, next_code: '789012'}. Note: Secret should be base32 encoded. Warning: Time sync is critical for TOTP; clock skew causes failures."
    parameters:
      - name: secret
        type: string
        description: "Base32-encoded secret key"
        required: true
      - name: type
        type: string
        description: "OTP type"
        required: false
        default: "totp"
        enum: ["totp", "hotp"]
      - name: digits
        type: integer
        description: "Number of digits"
        required: false
        default: 6
      - name: period
        type: integer
        description: "Time period in seconds (for TOTP)"
        required: false
        default: 30
      - name: counter
        type: integer
        description: "Counter value (for HOTP)"
        required: false
    tags: ["security", "otp", "2fa", "totp", "authentication"]
    test_prompts:
      single:
        - "Generate a TOTP code"
        - "Get the current OTP"
        - "Generate 2FA code"
        - "What's the current authenticator code?"
      single_clear:
        - "I need to generate a one-time password. Generate a TOTP code"
        - "I need to generate a one-time password. Get the current OTP"
        - "I need to generate a one-time password. Generate 2FA code"
        - "I need to generate a one-time password. What's the current authenticator code?"

  - name: verify_otp
    descriptions:
      minimal: "Verify OTP"
      short: "Verify one-time password"
      medium: "Verify a TOTP or HOTP code against a secret."
      long: "Verify an OTP code for two-factor authentication. Supports window for clock drift. Example: verify_otp(secret='JBSWY3DPEHPK3PXP', code='123456')."
      verbose: "Verify one-time passwords for 2FA. Validates code against secret with optional time window to account for clock drift. Example: verify_otp(secret='JBSWY3DPEHPK3PXP', code='123456', type='totp', window=1) returns {valid: true, drift: 0}. Window of 1 checks current and adjacent time periods. Note: HOTP verification should increment counter on success. Warning: Limit verification attempts to prevent brute force."
    parameters:
      - name: secret
        type: string
        description: "Base32-encoded secret key"
        required: true
      - name: code
        type: string
        description: "OTP code to verify"
        required: true
      - name: type
        type: string
        description: "OTP type"
        required: false
        default: "totp"
        enum: ["totp", "hotp"]
      - name: window
        type: integer
        description: "Verification window (periods)"
        required: false
        default: 1
      - name: counter
        type: integer
        description: "Expected counter (for HOTP)"
        required: false
    tags: ["security", "otp", "verify", "2fa", "authentication"]
    test_prompts:
      single:
        - "Verify this OTP code"
        - "Is this 2FA code valid?"
        - "Check if the TOTP is correct"
        - "Validate the authenticator code"
      single_clear:
        - "I need to verify a one-time password. Verify this OTP code"
        - "I need to verify a one-time password. Is this 2FA code valid?"
        - "I need to verify a one-time password. Check if the TOTP is correct"
        - "I need to verify a one-time password. Validate the authenticator code"

  - name: audit_permissions
    descriptions:
      minimal: "Audit permissions"
      short: "Audit file or user permissions"
      medium: "Audit file permissions, ACLs, or user access rights for security issues."
      long: "Audit permissions on files, directories, or user accounts. Identifies overly permissive access. Example: audit_permissions(path='/var/www', recursive=true)."
      verbose: "Audit permissions and access controls. Checks: world-writable files, SUID/SGID binaries, insecure ownership, weak ACLs, excessive user privileges. Targets: filesystem paths, user accounts, database roles. Example: audit_permissions(path='/opt/app', recursive=true, check_suid=true, report='./audit_report.json') identifies security issues. Note: Some findings may be intentional. Warning: Requires appropriate privileges to read all permission data."
    parameters:
      - name: path
        type: string
        description: "Path to audit"
        required: true
      - name: recursive
        type: boolean
        description: "Recurse into subdirectories"
        required: false
        default: false
      - name: check_suid
        type: boolean
        description: "Check for SUID/SGID"
        required: false
        default: true
      - name: check_world_writable
        type: boolean
        description: "Check for world-writable"
        required: false
        default: true
      - name: report
        type: string
        description: "Path for audit report"
        required: false
    tags: ["security", "permissions", "audit", "acl", "access"]
    test_prompts:
      single:
        - "Audit permissions on /var/www"
        - "Check for insecure file permissions"
        - "Find world-writable files"
        - "Audit access controls"
      single_clear:
        - "I need to audit file permissions. Audit permissions on /var/www"
        - "I need to audit file permissions. Check for insecure file permissions"
        - "I need to audit file permissions. Find world-writable files"
        - "I need to audit file permissions. Audit access controls"

  - name: secrets_scan
    descriptions:
      minimal: "Scan secrets"
      short: "Scan for exposed secrets"
      medium: "Scan code or files for accidentally committed secrets like API keys and passwords."
      long: "Scan repositories or files for exposed secrets like API keys, passwords, tokens. Example: secrets_scan(path='./src', output='secrets_report.json')."
      verbose: "Scan for accidentally exposed secrets in code and files. Detects: API keys, passwords, tokens, private keys, credentials in URLs, AWS/GCP/Azure credentials. Methods: pattern matching, entropy analysis, known provider formats. Example: secrets_scan(path='./repo', include_git_history=true, exclude='[\"*.test.js\", \"node_modules\"]', output='report.json'). Note: False positives possible for high-entropy strings. Warning: Detected secrets should be rotated immediately."
    parameters:
      - name: path
        type: string
        description: "Path to scan"
        required: true
      - name: include_git_history
        type: boolean
        description: "Scan git history"
        required: false
        default: false
      - name: exclude
        type: string
        description: "JSON array of patterns to exclude"
        required: false
      - name: output
        type: string
        description: "Report output path"
        required: false
      - name: verify
        type: boolean
        description: "Attempt to verify secrets are active"
        required: false
        default: false
    tags: ["security", "secrets", "scan", "credentials", "leak"]
    test_prompts:
      single:
        - "Scan for exposed API keys"
        - "Find secrets in the codebase"
        - "Check for leaked credentials"
        - "Scan git history for secrets"
      single_clear:
        - "I need to scan for exposed secrets. Scan for exposed API keys"
        - "I need to scan for exposed secrets. Find secrets in the codebase"
        - "I need to scan for exposed secrets. Check for leaked credentials"
        - "I need to scan for exposed secrets. Scan git history for secrets"
