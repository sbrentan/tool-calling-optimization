category: security_operations

tools:
  - name: encrypt_data
    descriptions:
      minimal: "Encrypt data"
      short: "Encrypt data using a cryptographic algorithm"
      medium: "Encrypt text or data using symmetric encryption algorithms like AES with a password or key."
      long: "Encrypt data using symmetric encryption. Supports AES-256, ChaCha20, and other algorithms. Provide a password (key will be derived) or raw key. Example: encrypt_data(data='secret message', password='my_password', algorithm='aes-256-gcm')."
      verbose: "Encrypt data using symmetric encryption algorithms. Algorithms: 'aes-256-gcm' (recommended, authenticated), 'aes-256-cbc', 'chacha20-poly1305' (fast, modern). Key can be derived from password using PBKDF2, scrypt, or Argon2, or provided directly. Returns ciphertext with IV/nonce. Example: encrypt_data(data='sensitive info', password='strongP@ssw0rd!', algorithm='aes-256-gcm', kdf='argon2', output_format='base64'). Note: GCM and Poly1305 modes provide authentication. Warning: Store encryption keys securely; losing them means losing data access."
    parameters:
      - name: data
        type: string
        description: "Data to encrypt"
        required: true
      - name: password
        type: string
        description: "Password for key derivation"
        required: false
      - name: key
        type: string
        description: "Encryption key (hex or base64)"
        required: false
      - name: algorithm
        type: string
        description: "Encryption algorithm"
        required: false
        default: "aes-256-gcm"
        enum: ["aes-256-gcm", "aes-256-cbc", "aes-128-gcm", "chacha20-poly1305"]
      - name: kdf
        type: string
        description: "Key derivation function"
        required: false
        default: "pbkdf2"
        enum: ["pbkdf2", "scrypt", "argon2"]
      - name: output_format
        type: string
        description: "Output format"
        required: false
        default: "base64"
        enum: ["base64", "hex"]
    tags: ["security", "encrypt", "aes", "crypto", "cipher"]
    test_prompts:
      single:
        - "Encrypt this message with a password"
        - "Encrypt the sensitive data using AES"
        - "Secure the text with encryption"
        - "Encrypt the file contents"
      single_clear:
        - "Please encrypt data securely. Encrypt this message with a password"
        - "Please encrypt data securely. Encrypt the sensitive data using AES"
        - "Please encrypt data securely. Secure the text with encryption"
        - "Please encrypt data securely. Encrypt the file contents"

  - name: decrypt_data
    descriptions:
      minimal: "Decrypt data"
      short: "Decrypt encrypted data"
      medium: "Decrypt data that was encrypted with symmetric encryption using the corresponding password or key."
      long: "Decrypt symmetrically encrypted data. Provide the same password/key and algorithm used for encryption. Example: decrypt_data(data='encrypted_base64', password='my_password', algorithm='aes-256-gcm')."
      verbose: "Decrypt data encrypted with symmetric encryption. Must use the same algorithm, key (or password with same KDF settings), and provide the IV/nonce. Authenticated modes (GCM, Poly1305) verify integrity automatically. Example: decrypt_data(data='base64_ciphertext', password='strongP@ssw0rd!', algorithm='aes-256-gcm', kdf='argon2', input_format='base64'). Note: Decryption fails if password or key is incorrect. Warning: Authentication failure in GCM mode indicates tampering."
    parameters:
      - name: data
        type: string
        description: "Encrypted data"
        required: true
      - name: password
        type: string
        description: "Password for key derivation"
        required: false
      - name: key
        type: string
        description: "Decryption key (hex or base64)"
        required: false
      - name: algorithm
        type: string
        description: "Encryption algorithm used"
        required: false
        default: "aes-256-gcm"
        enum: ["aes-256-gcm", "aes-256-cbc", "aes-128-gcm", "chacha20-poly1305"]
      - name: kdf
        type: string
        description: "Key derivation function used"
        required: false
        default: "pbkdf2"
        enum: ["pbkdf2", "scrypt", "argon2"]
      - name: input_format
        type: string
        description: "Input format"
        required: false
        default: "base64"
        enum: ["base64", "hex"]
    tags: ["security", "decrypt", "aes", "crypto", "cipher"]
    test_prompts:
      single:
        - "Decrypt this encrypted message"
        - "Decrypt the data with the password"
        - "Decode the encrypted content"
        - "Unlock the encrypted file"
      single_clear:
        - "I need to decrypt encrypted data. Decrypt this encrypted message"
        - "I need to decrypt encrypted data. Decrypt the data with the password"
        - "I need to decrypt encrypted data. Decode the encrypted content"
        - "I need to decrypt encrypted data. Unlock the encrypted file"

  - name: generate_keypair
    descriptions:
      minimal: "Generate key pair"
      short: "Generate a cryptographic key pair"
      medium: "Generate a public/private key pair for asymmetric encryption or digital signatures."
      long: "Generate an asymmetric key pair for encryption or signing. Supports RSA, ECDSA, and Ed25519. Example: generate_keypair(algorithm='rsa', key_size=4096, output_format='pem')."
      verbose: "Generate cryptographic key pairs for asymmetric operations. Algorithms: 'rsa' (widely compatible, larger keys), 'ecdsa' (smaller keys, fast), 'ed25519' (modern, fast, recommended for signatures). RSA key sizes: 2048, 3072, 4096. ECDSA curves: P-256, P-384, P-521. Output formats: 'pem' (text), 'der' (binary), 'jwk' (JSON Web Key). Example: generate_keypair(algorithm='ed25519', output_format='pem', passphrase='protect_private_key'). Note: Ed25519 keys are always 256 bits. Warning: Protect private keys; compromise allows impersonation."
    parameters:
      - name: algorithm
        type: string
        description: "Key algorithm"
        required: true
        enum: ["rsa", "ecdsa", "ed25519", "x25519"]
      - name: key_size
        type: integer
        description: "Key size for RSA"
        required: false
        default: 4096
      - name: curve
        type: string
        description: "Curve for ECDSA"
        required: false
        default: "P-256"
        enum: ["P-256", "P-384", "P-521"]
      - name: output_format
        type: string
        description: "Key format"
        required: false
        default: "pem"
        enum: ["pem", "der", "jwk"]
      - name: passphrase
        type: string
        description: "Passphrase to protect private key"
        required: false
      - name: output_private
        type: string
        description: "File path for private key"
        required: false
      - name: output_public
        type: string
        description: "File path for public key"
        required: false
    tags: ["security", "keypair", "rsa", "ecdsa", "asymmetric", "crypto"]
    test_prompts:
      single:
        - "Generate an RSA key pair"
        - "Create a new SSH key pair"
        - "Generate an Ed25519 key pair"
        - "Create public and private keys"
      single_clear:
        - "I want to generate a cryptographic key pair. Generate an RSA key pair"
        - "I want to generate a cryptographic key pair. Create a new SSH key pair"
        - "I want to generate a cryptographic key pair. Generate an Ed25519 key pair"
        - "I want to generate a cryptographic key pair. Create public and private keys"

  - name: sign_data
    descriptions:
      minimal: "Sign data"
      short: "Create a digital signature"
      medium: "Create a cryptographic signature for data using a private key to verify authenticity."
      long: "Sign data with a private key to create a verifiable signature. Others can verify the signature using the corresponding public key. Example: sign_data(data='message to sign', private_key_file='private.pem', algorithm='rsa-sha256')."
      verbose: "Create a digital signature to prove data authenticity and integrity. Sign algorithms: 'rsa-sha256', 'rsa-sha384', 'rsa-sha512', 'ecdsa-sha256', 'ed25519'. The signature can be verified with the public key without revealing the private key. Example: sign_data(data='important document', private_key='-----BEGIN PRIVATE KEY-----...', algorithm='ed25519', output_format='base64'). Note: Ed25519 signatures are always 64 bytes. Warning: Never share your private key."
    parameters:
      - name: data
        type: string
        description: "Data to sign"
        required: true
      - name: private_key
        type: string
        description: "Private key (PEM format)"
        required: false
      - name: private_key_file
        type: string
        description: "Path to private key file"
        required: false
      - name: passphrase
        type: string
        description: "Private key passphrase if encrypted"
        required: false
      - name: algorithm
        type: string
        description: "Signature algorithm"
        required: false
        default: "rsa-sha256"
        enum: ["rsa-sha256", "rsa-sha384", "rsa-sha512", "ecdsa-sha256", "ed25519"]
      - name: output_format
        type: string
        description: "Signature format"
        required: false
        default: "base64"
        enum: ["base64", "hex"]
    tags: ["security", "sign", "signature", "crypto", "verify"]
    test_prompts:
      single:
        - "Sign this document with my private key"
        - "Create a digital signature for the data"
        - "Sign the message for verification"
        - "Generate a signature for the file"
      single_clear:
        - "I need to create a digital signature. Sign this document with my private key"
        - "I need to create a digital signature. Create a digital signature for the data"
        - "I need to create a digital signature. Sign the message for verification"
        - "I need to create a digital signature. Generate a signature for the file"

  - name: verify_signature
    descriptions:
      minimal: "Verify signature"
      short: "Verify a digital signature"
      medium: "Verify that a digital signature is valid for the given data and public key."
      long: "Verify a digital signature using the signer's public key. Confirms data hasn't been tampered with and was signed by the private key holder. Example: verify_signature(data='original message', signature='base64_sig', public_key_file='public.pem')."
      verbose: "Verify a digital signature to confirm data integrity and authenticity. Returns true if valid, false if invalid. A valid signature proves: 1) data hasn't changed since signing, 2) signature was created with the corresponding private key. Example: verify_signature(data='important document', signature='base64_signature', public_key='-----BEGIN PUBLIC KEY-----...', algorithm='ed25519'). Note: Verification doesn't require the private key. Warning: Invalid signature may indicate tampering or wrong key."
    parameters:
      - name: data
        type: string
        description: "Original signed data"
        required: true
      - name: signature
        type: string
        description: "Signature to verify"
        required: true
      - name: public_key
        type: string
        description: "Public key (PEM format)"
        required: false
      - name: public_key_file
        type: string
        description: "Path to public key file"
        required: false
      - name: algorithm
        type: string
        description: "Signature algorithm"
        required: false
        default: "rsa-sha256"
        enum: ["rsa-sha256", "rsa-sha384", "rsa-sha512", "ecdsa-sha256", "ed25519"]
      - name: signature_format
        type: string
        description: "Signature format"
        required: false
        default: "base64"
        enum: ["base64", "hex"]
    tags: ["security", "verify", "signature", "crypto", "authenticate"]
    test_prompts:
      single:
        - "Verify the signature on this document"
        - "Check if the signature is valid"
        - "Validate the digital signature"
        - "Verify the message authenticity"
      single_clear:
        - "I want to verify a digital signature. Verify the signature on this document"
        - "I want to verify a digital signature. Check if the signature is valid"
        - "I want to verify a digital signature. Validate the digital signature"
        - "I want to verify a digital signature. Verify the message authenticity"

  - name: generate_password
    descriptions:
      minimal: "Generate password"
      short: "Generate a secure random password"
      medium: "Generate a cryptographically secure random password with customizable length and character sets."
      long: "Generate a secure random password. Customize length, character types, and excluded characters. Example: generate_password(length=20, uppercase=true, lowercase=true, numbers=true, symbols=true)."
      verbose: "Generate cryptographically secure random passwords using secure random number generators. Options for character sets: uppercase, lowercase, numbers, symbols. Can exclude ambiguous characters (0/O, 1/l/I). Can require at least one character from each selected set. Example: generate_password(length=24, uppercase=true, lowercase=true, numbers=true, symbols=true, exclude_ambiguous=true, require_each=true). Note: Longer passwords are exponentially harder to crack. Warning: Default system RNG may not be suitable for high-security applications."
    parameters:
      - name: length
        type: integer
        description: "Password length"
        required: false
        default: 16
      - name: uppercase
        type: boolean
        description: "Include uppercase letters (A-Z)"
        required: false
        default: true
      - name: lowercase
        type: boolean
        description: "Include lowercase letters (a-z)"
        required: false
        default: true
      - name: numbers
        type: boolean
        description: "Include numbers (0-9)"
        required: false
        default: true
      - name: symbols
        type: boolean
        description: "Include symbols (!@#$%^&*...)"
        required: false
        default: true
      - name: exclude_ambiguous
        type: boolean
        description: "Exclude ambiguous characters (0O1lI)"
        required: false
        default: false
      - name: require_each
        type: boolean
        description: "Require at least one of each selected type"
        required: false
        default: false
      - name: exclude_chars
        type: string
        description: "Specific characters to exclude"
        required: false
    tags: ["security", "password", "generate", "random", "secret"]
    test_prompts:
      single:
        - "Generate a strong password"
        - "Create a 20 character random password"
        - "Generate a password without special characters"
        - "Make a secure password for my account"
      single_clear:
        - "I need to generate a secure password. Generate a strong password"
        - "I need to generate a secure password. Create a 20 character random password"
        - "I need to generate a secure password. Generate a password without special characters"
        - "I need to generate a secure password. Make a secure password for my account"

  - name: check_password_strength
    descriptions:
      minimal: "Check password strength"
      short: "Analyze password strength"
      medium: "Analyze a password to determine its strength, including entropy and estimated crack time."
      long: "Evaluate password strength. Returns score, entropy, estimated crack time, and improvement suggestions. Example: check_password_strength(password='MyP@ssw0rd123')."
      verbose: "Analyze password strength using multiple metrics. Evaluates: length, character diversity, common patterns, dictionary words, keyboard sequences. Returns: strength score (0-100), entropy bits, estimated crack times (online/offline), specific weaknesses, and suggestions. Uses zxcvbn-style analysis. Example: check_password_strength(password='MyP@ssw0rd123', check_breached=true). Note: 'Breached' check queries haveibeenpwned API. Warning: Common passwords like 'password123' are considered weak despite meeting complexity requirements."
    parameters:
      - name: password
        type: string
        description: "Password to analyze"
        required: true
      - name: check_breached
        type: boolean
        description: "Check against known breach databases"
        required: false
        default: false
      - name: user_inputs
        type: string
        description: "JSON array of user-related strings to penalize"
        required: false
    tags: ["security", "password", "strength", "analyze", "check"]
    test_prompts:
      single:
        - "Check how strong this password is"
        - "Analyze the password strength"
        - "Is this a secure password?"
        - "Rate the strength of my password"
      single_clear:
        - "I need to analyze password strength. Check how strong this password is"
        - "I need to analyze password strength. Analyze the password strength"
        - "I need to analyze password strength. Is this a secure password?"
        - "I need to analyze password strength. Rate the strength of my password"

  - name: hash_password
    descriptions:
      minimal: "Hash password"
      short: "Hash a password for secure storage"
      medium: "Hash a password using a secure password hashing algorithm suitable for storage."
      long: "Hash a password using algorithms designed for password storage. Includes salt and is designed to be slow to resist brute force. Example: hash_password(password='user_password', algorithm='argon2')."
      verbose: "Hash passwords securely for database storage. Algorithms: 'argon2id' (recommended, memory-hard), 'bcrypt' (widely supported, good), 'scrypt' (memory-hard), 'pbkdf2' (compatible, needs high iterations). Each algorithm has tunable cost parameters. Returns hash including algorithm, salt, and parameters. Example: hash_password(password='userP@ss', algorithm='argon2id', memory_cost=65536, time_cost=3). Note: Password hashing is intentionally slow. Warning: Never use fast hashes like MD5/SHA for passwords."
    parameters:
      - name: password
        type: string
        description: "Password to hash"
        required: true
      - name: algorithm
        type: string
        description: "Hashing algorithm"
        required: false
        default: "argon2id"
        enum: ["argon2id", "argon2i", "bcrypt", "scrypt", "pbkdf2"]
      - name: memory_cost
        type: integer
        description: "Memory cost for Argon2 (KB)"
        required: false
        default: 65536
      - name: time_cost
        type: integer
        description: "Time cost/iterations"
        required: false
        default: 3
      - name: parallelism
        type: integer
        description: "Parallelism for Argon2"
        required: false
        default: 4
    tags: ["security", "password", "hash", "bcrypt", "argon2"]
    test_prompts:
      single:
        - "Hash this password for storage"
        - "Create a bcrypt hash of the password"
        - "Hash the password using Argon2"
        - "Securely hash the user's password"
      single_clear:
        - "I need to securely hash a password. Hash this password for storage"
        - "I need to securely hash a password. Create a bcrypt hash of the password"
        - "I need to securely hash a password. Hash the password using Argon2"
        - "I need to securely hash a password. Securely hash the user's password"

  - name: verify_password_hash
    descriptions:
      minimal: "Verify password hash"
      short: "Verify a password against a hash"
      medium: "Verify that a password matches a previously created password hash."
      long: "Verify a password against a stored hash. Returns true if the password matches. Example: verify_password_hash(password='user_input', hash='$argon2id$...')."
      verbose: "Verify a password against its stored hash for authentication. The hash includes the algorithm and parameters used, so no additional configuration needed. Uses constant-time comparison to prevent timing attacks. Example: verify_password_hash(password='userInputPassword', hash='$argon2id$v=19$m=65536,t=3,p=4$...'). Note: Verification is as slow as hashing (by design). Warning: Return only 'valid' or 'invalid'; don't reveal which part failed."
    parameters:
      - name: password
        type: string
        description: "Password to verify"
        required: true
      - name: hash
        type: string
        description: "Password hash to verify against"
        required: true
    tags: ["security", "password", "verify", "hash", "authenticate"]
    test_prompts:
      single:
        - "Check if the password matches the hash"
        - "Verify the user's password"
        - "Validate the password against the stored hash"
        - "Does this password match?"
      single_clear:
        - "I need to verify a password hash. Check if the password matches the hash"
        - "I need to verify a password hash. Verify the user's password"
        - "I need to verify a password hash. Validate the password against the stored hash"
        - "I need to verify a password hash. Does this password match?"

  - name: generate_api_key
    descriptions:
      minimal: "Generate API key"
      short: "Generate a random API key"
      medium: "Generate a secure random API key with optional prefix and configurable format."
      long: "Generate a cryptographically secure API key. Customize format, length, prefix, and character set. Example: generate_api_key(length=32, prefix='sk_live_', format='base62')."
      verbose: "Generate secure API keys for authentication. Formats: 'hex' (0-9a-f), 'base62' (0-9a-zA-Z), 'base64' (includes +/), 'base64url' (URL-safe). Can add prefix (like 'sk_live_', 'pk_test_'), checksum for validation, and timestamp. Example: generate_api_key(length=32, prefix='api_', format='base62', add_checksum=true). Note: Keys should be stored hashed, not plaintext. Warning: Treat API keys like passwords; rotate if compromised."
    parameters:
      - name: length
        type: integer
        description: "Key length in characters"
        required: false
        default: 32
      - name: prefix
        type: string
        description: "Key prefix (e.g., 'sk_live_')"
        required: false
      - name: format
        type: string
        description: "Character format"
        required: false
        default: "base62"
        enum: ["hex", "base62", "base64", "base64url"]
      - name: add_checksum
        type: boolean
        description: "Add checksum suffix"
        required: false
        default: false
    tags: ["security", "api", "key", "generate", "token"]
    test_prompts:
      single:
        - "Generate a new API key"
        - "Create a secret key for the API"
        - "Generate an API token with a prefix"
        - "Make a new authentication key"
      single_clear:
        - "I need to generate an API key. Generate a new API key"
        - "I need to generate an API key. Create a secret key for the API"
        - "I need to generate an API key. Generate an API token with a prefix"
        - "I need to generate an API key. Make a new authentication key"

  - name: generate_totp_secret
    descriptions:
      minimal: "Generate TOTP secret"
      short: "Generate a TOTP secret for 2FA"
      medium: "Generate a secret key for Time-based One-Time Passwords (TOTP/2FA) with optional QR code."
      long: "Generate a TOTP secret for two-factor authentication. Compatible with Google Authenticator and similar apps. Can generate provisioning URI and QR code. Example: generate_totp_secret(issuer='MyApp', account='user@example.com')."
      verbose: "Generate TOTP secrets for two-factor authentication. Creates secret compatible with RFC 6238 and major authenticator apps. Returns: secret key (base32), provisioning URI for QR codes, optional QR code image. Parameters: algorithm (SHA1/SHA256/SHA512), digits (6 or 8), period (default 30s). Example: generate_totp_secret(issuer='MyService', account='john@example.com', algorithm='SHA256', digits=6, period=30, generate_qr=true). Note: SHA1 with 6 digits and 30s period is most compatible. Warning: Store secrets securely; they allow account access bypass."
    parameters:
      - name: issuer
        type: string
        description: "Service name (appears in authenticator app)"
        required: true
      - name: account
        type: string
        description: "User identifier (usually email)"
        required: true
      - name: algorithm
        type: string
        description: "HMAC algorithm"
        required: false
        default: "SHA1"
        enum: ["SHA1", "SHA256", "SHA512"]
      - name: digits
        type: integer
        description: "Number of digits in OTP"
        required: false
        default: "6"
        enum: ["6", "8"]
      - name: period
        type: integer
        description: "Time period in seconds"
        required: false
        default: 30
      - name: generate_qr
        type: boolean
        description: "Generate QR code image"
        required: false
        default: true
      - name: qr_output
        type: string
        description: "Path for QR code image"
        required: false
    tags: ["security", "totp", "2fa", "mfa", "otp"]
    test_prompts:
      single:
        - "Generate a 2FA secret for my app"
        - "Create a TOTP secret for the user"
        - "Set up two-factor authentication"
        - "Generate an authenticator app secret"
      single_clear:
        - "I need to set up two-factor authentication. Generate a 2FA secret for my app"
        - "I need to set up two-factor authentication. Create a TOTP secret for the user"
        - "I need to set up two-factor authentication. Set up two-factor authentication"
        - "I need to set up two-factor authentication. Generate an authenticator app secret"

  - name: verify_totp
    descriptions:
      minimal: "Verify TOTP"
      short: "Verify a TOTP code"
      medium: "Verify a TOTP code entered by a user against their secret key."
      long: "Verify a TOTP code for two-factor authentication. Allows for clock drift with configurable window. Example: verify_totp(secret='BASE32SECRET', code='123456')."
      verbose: "Verify a Time-based One-Time Password for 2FA authentication. Compares the user-entered code against the expected code for the current time window. Window parameter allows for clock drift (1 = check ±1 period). Returns valid/invalid and optionally the matching time offset. Example: verify_totp(secret='JBSWY3DPEHPK3PXP', code='123456', window=1, algorithm='SHA1'). Note: Each code should only be accepted once (implement replay prevention). Warning: Server time must be accurate for TOTP to work."
    parameters:
      - name: secret
        type: string
        description: "TOTP secret (base32)"
        required: true
      - name: code
        type: string
        description: "TOTP code to verify"
        required: true
      - name: window
        type: integer
        description: "Time window tolerance (periods)"
        required: false
        default: 1
      - name: algorithm
        type: string
        description: "HMAC algorithm"
        required: false
        default: "SHA1"
        enum: ["SHA1", "SHA256", "SHA512"]
      - name: digits
        type: integer
        description: "Expected number of digits"
        required: false
        default: 6
      - name: period
        type: integer
        description: "Time period in seconds"
        required: false
        default: 30
    tags: ["security", "totp", "2fa", "verify", "otp"]
    test_prompts:
      single:
        - "Verify the 2FA code"
        - "Check if the TOTP code is valid"
        - "Validate the authenticator code"
        - "Verify the one-time password"
      single_clear:
        - "I need to verify a two-factor authentication code. Verify the 2FA code"
        - "I need to verify a two-factor authentication code. Check if the TOTP code is valid"
        - "I need to verify a two-factor authentication code. Validate the authenticator code"
        - "I need to verify a two-factor authentication code. Verify the one-time password"

  - name: generate_jwt
    descriptions:
      minimal: "Generate JWT"
      short: "Generate a JSON Web Token"
      medium: "Create a JSON Web Token (JWT) with custom claims and signature."
      long: "Generate a signed JWT for authentication or authorization. Include custom claims, expiration, and choose signing algorithm. Example: generate_jwt(payload='{\"user_id\": 123}', secret='my_secret', algorithm='HS256', expires_in=3600)."
