category: document_operations
description: Document processing and conversion operations
tools:
  - name: convert_document
    descriptions:
      minimal: "Convert document"
      short: "Convert document format"
      medium: "Convert documents between formats like PDF, DOCX, HTML, and Markdown."
      long: "Convert documents between formats. Supports PDF, DOCX, ODT, HTML, Markdown, TXT, and more. Example: convert_document(input='report.docx', output='report.pdf')."
      verbose: "Convert documents between various formats. Input formats: DOCX, ODT, RTF, HTML, Markdown, LaTeX, EPUB, TXT. Output formats: PDF, DOCX, HTML, Markdown, TXT, EPUB. Options: page size, margins, fonts, table of contents. Example: convert_document(input='thesis.md', output='thesis.pdf', page_size='A4', toc=true, template='academic'). Note: Complex formatting may not survive all conversions. Warning: PDF to editable format conversion may lose layout fidelity."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output
        type: string
        description: "Output document path"
        required: true
      - name: page_size
        type: string
        description: "Page size for PDF output"
        required: false
        default: "letter"
        enum: ["letter", "A4", "legal", "A3"]
      - name: toc
        type: boolean
        description: "Generate table of contents"
        required: false
        default: false
      - name: template
        type: string
        description: "Document template"
        required: false
    tags: ["document", "convert", "pdf", "docx", "format"]
    test_prompts:
      single:
        - "Convert this Word document to PDF"
        - "Change the document format"
        - "Convert Markdown to HTML"
        - "Export as PDF"

  - name: merge_documents
    descriptions:
      minimal: "Merge documents"
      short: "Merge multiple documents"
      medium: "Combine multiple documents into a single file."
      long: "Merge multiple documents into one. Supports PDFs and Word documents. Example: merge_documents(inputs='[\"doc1.pdf\", \"doc2.pdf\"]', output='combined.pdf')."
      verbose: "Combine multiple documents into a single file. Document types: PDFs (concatenate pages), DOCX (merge content with section breaks). Options: page numbers, section breaks, bookmarks from source files. Example: merge_documents(inputs='[\"cover.pdf\", \"chapter1.pdf\", \"chapter2.pdf\", \"appendix.pdf\"]', output='book.pdf', add_bookmarks=true, add_page_numbers=true). Note: Mixed formats require conversion first. Warning: Large merged documents may have memory issues."
    parameters:
      - name: inputs
        type: string
        description: "JSON array of document paths"
        required: true
      - name: output
        type: string
        description: "Output document path"
        required: true
      - name: add_bookmarks
        type: boolean
        description: "Add bookmarks from source files"
        required: false
        default: false
      - name: add_page_numbers
        type: boolean
        description: "Add page numbers"
        required: false
        default: false
      - name: section_break
        type: boolean
        description: "Add section breaks between docs"
        required: false
        default: true
    tags: ["document", "merge", "combine", "pdf", "docx"]
    test_prompts:
      single:
        - "Merge these PDF files"
        - "Combine the documents"
        - "Join the Word documents"
        - "Create one PDF from these files"

  - name: split_document
    descriptions:
      minimal: "Split document"
      short: "Split document into parts"
      medium: "Split a document into multiple files by pages or sections."
      long: "Split a document into multiple files. Split by page ranges, every N pages, or by bookmarks/headings. Example: split_document(input='book.pdf', mode='pages', pages='[[1,10], [11,20]]', output_dir='./chapters/')."
      verbose: "Split documents into multiple files. Modes: 'pages' (specific page ranges), 'every' (every N pages), 'bookmarks' (at PDF bookmarks), 'headings' (at heading levels for DOCX). Example: split_document(input='manual.pdf', mode='every', every=10, output_dir='./sections/', naming='section_{n}.pdf'). Note: Bookmark splitting requires properly structured PDF. Warning: Splitting by headings may not work with inconsistent formatting."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output_dir
        type: string
        description: "Output directory"
        required: true
      - name: mode
        type: string
        description: "Split mode"
        required: true
        enum: ["pages", "every", "bookmarks", "headings"]
      - name: pages
        type: string
        description: "Page ranges as JSON (for pages mode)"
        required: false
      - name: every
        type: integer
        description: "Split every N pages (for every mode)"
        required: false
      - name: naming
        type: string
        description: "Output naming pattern"
        required: false
        default: "part_{n}"
    tags: ["document", "split", "divide", "pages", "extract"]
    test_prompts:
      single:
        - "Split this PDF into chapters"
        - "Extract pages 1-10"
        - "Split every 5 pages"
        - "Divide the document by bookmarks"

  - name: extract_text
    descriptions:
      minimal: "Extract text"
      short: "Extract text from document"
      medium: "Extract plain text content from a document."
      long: "Extract text from documents including PDFs, DOCX, and images (OCR). Example: extract_text(input='scan.pdf', ocr=true)."
      verbose: "Extract text content from documents. Supports: PDF (native or OCR), DOCX, ODT, PPTX, images (OCR). OCR options: language, DPI, preprocessing. Output: plain text, with or without layout preservation. Example: extract_text(input='scanned_contract.pdf', ocr=true, language='eng', preserve_layout=true, output='contract.txt'). Note: OCR accuracy depends on image quality. Warning: Complex layouts may not preserve structure."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output
        type: string
        description: "Output text file path"
        required: false
      - name: ocr
        type: boolean
        description: "Use OCR for scanned documents"
        required: false
        default: false
      - name: language
        type: string
        description: "OCR language code"
        required: false
        default: "eng"
      - name: preserve_layout
        type: boolean
        description: "Preserve original layout"
        required: false
        default: false
      - name: pages
        type: string
        description: "Specific pages to extract"
        required: false
    tags: ["document", "extract", "text", "ocr", "content"]
    test_prompts:
      single:
        - "Extract text from this PDF"
        - "Get the text content"
        - "OCR this scanned document"
        - "Pull text from the Word file"

  - name: add_page_numbers
    descriptions:
      minimal: "Add page numbers"
      short: "Add page numbers to document"
      medium: "Add page numbers to a PDF document."
      long: "Add page numbers to PDF pages. Customize position, format, and starting number. Example: add_page_numbers(input='thesis.pdf', position='bottom-center', output='thesis_numbered.pdf')."
      verbose: "Add page numbers to PDF documents. Position: top/bottom, left/center/right. Formats: '1', '1/N', 'Page 1', 'Page 1 of N', Roman numerals. Options: starting number, skip pages, font, size, color, margins. Example: add_page_numbers(input='report.pdf', position='bottom-center', format='Page {n} of {total}', start=1, skip_pages=[0], font='Helvetica', size=10, output='numbered.pdf'). Note: Skip pages are 0-indexed. Warning: Existing page numbers will not be replaced."
    parameters:
      - name: input
        type: string
        description: "Input PDF path"
        required: true
      - name: output
        type: string
        description: "Output PDF path"
        required: true
      - name: position
        type: string
        description: "Page number position"
        required: false
        default: "bottom-center"
        enum: ["top-left", "top-center", "top-right", "bottom-left", "bottom-center", "bottom-right"]
      - name: format
        type: string
        description: "Number format (use {n} and {total})"
        required: false
        default: "{n}"
      - name: start
        type: integer
        description: "Starting page number"
        required: false
        default: 1
      - name: font_size
        type: integer
        description: "Font size"
        required: false
        default: 12
    tags: ["document", "pdf", "pages", "numbers", "format"]
    test_prompts:
      single:
        - "Add page numbers to this PDF"
        - "Number the pages"
        - "Put page numbers at the bottom"
        - "Add 'Page X of Y' to each page"

  - name: add_watermark
    descriptions:
      minimal: "Add watermark"
      short: "Add watermark to document"
      medium: "Add a text or image watermark to document pages."
      long: "Add watermark to PDF pages. Supports text or image watermarks with opacity and rotation. Example: add_watermark(input='contract.pdf', text='CONFIDENTIAL', output='marked.pdf')."
      verbose: "Add watermarks to PDF documents. Types: text (with font, size, color), image (PNG/JPEG). Properties: opacity, rotation, position, scale. Can apply to all pages or specific pages. Example: add_watermark(input='document.pdf', type='text', text='DRAFT', opacity=0.3, rotation=45, color='#FF0000', font_size=72, output='draft.pdf'). Note: Watermarks are added as overlay; may cover content. Warning: Watermarks can be removed by PDF editing tools."
    parameters:
      - name: input
        type: string
        description: "Input PDF path"
        required: true
      - name: output
        type: string
        description: "Output PDF path"
        required: true
      - name: type
        type: string
        description: "Watermark type"
        required: false
        default: "text"
        enum: ["text", "image"]
      - name: text
        type: string
        description: "Watermark text"
        required: false
      - name: image
        type: string
        description: "Watermark image path"
        required: false
      - name: opacity
        type: number
        description: "Opacity (0.0 to 1.0)"
        required: false
        default: 0.3
      - name: rotation
        type: integer
        description: "Rotation in degrees"
        required: false
        default: 45
      - name: pages
        type: string
        description: "Pages to watermark (all if omitted)"
        required: false
    tags: ["document", "pdf", "watermark", "stamp", "overlay"]
    test_prompts:
      single:
        - "Add a 'CONFIDENTIAL' watermark"
        - "Stamp the document as DRAFT"
        - "Add my logo as watermark"
        - "Put a watermark on every page"

  - name: fill_form
    descriptions:
      minimal: "Fill form"
      short: "Fill PDF form fields"
      medium: "Fill in the fields of a PDF form."
      long: "Fill PDF form fields programmatically. Supports text, checkboxes, radio buttons, and dropdowns. Example: fill_form(input='application.pdf', data='{\"name\": \"John\", \"email\": \"john@example.com\"}', output='filled.pdf')."
      verbose: "Fill PDF form fields with data. Field types: text, checkbox, radio, dropdown, date. Input: JSON object mapping field names to values. Options: flatten (make fields uneditable), list fields (get available field names). Example: fill_form(input='tax_form.pdf', data='{\"first_name\": \"John\", \"ssn\": \"XXX-XX-1234\", \"married\": true}', flatten=true, output='completed_tax.pdf'). Note: Use list_fields=true first to get field names. Warning: Flattening is irreversible."
    parameters:
      - name: input
        type: string
        description: "Input PDF form path"
        required: true
      - name: output
        type: string
        description: "Output PDF path"
        required: true
      - name: data
        type: string
        description: "JSON object with field values"
        required: true
      - name: flatten
        type: boolean
        description: "Flatten form (make uneditable)"
        required: false
        default: false
      - name: list_fields
        type: boolean
        description: "List available fields instead of filling"
        required: false
        default: false
    tags: ["document", "pdf", "form", "fill", "fields"]
    test_prompts:
      single:
        - "Fill out this PDF form"
        - "Complete the form with this data"
        - "What fields are in this form?"
        - "Fill the application form"

  - name: sign_document
    descriptions:
      minimal: "Sign document"
      short: "Digitally sign a document"
      medium: "Add a digital signature to a PDF document."
      long: "Digitally sign a PDF with a certificate or image signature. Example: sign_document(input='contract.pdf', certificate='my_cert.p12', password='secret', output='signed.pdf')."
      verbose: "Add digital signatures to PDF documents. Types: 'certificate' (cryptographic PKI signature), 'image' (visual signature image), 'both'. Certificate formats: P12/PFX, PEM. Signature fields: appearance, reason, location, contact. Example: sign_document(input='agreement.pdf', type='certificate', certificate='signer.p12', password='pass', reason='Contract approval', location='New York', appearance='John Doe', output='signed_agreement.pdf'). Note: Certificate signatures are legally binding in many jurisdictions. Warning: Signed documents should not be modified."
    parameters:
      - name: input
        type: string
        description: "Input PDF path"
        required: true
      - name: output
        type: string
        description: "Output PDF path"
        required: true
      - name: type
        type: string
        description: "Signature type"
        required: false
        default: "certificate"
        enum: ["certificate", "image", "both"]
      - name: certificate
        type: string
        description: "Path to certificate file"
        required: false
      - name: password
        type: string
        description: "Certificate password"
        required: false
      - name: image
        type: string
        description: "Signature image path"
        required: false
      - name: reason
        type: string
        description: "Signing reason"
        required: false
      - name: location
        type: string
        description: "Signing location"
        required: false
    tags: ["document", "pdf", "sign", "signature", "certificate"]
    test_prompts:
      single:
        - "Sign this document"
        - "Add my digital signature"
        - "Sign the contract with my certificate"
        - "Put a signature on the PDF"

  - name: compress_document
    descriptions:
      minimal: "Compress document"
      short: "Compress document file size"
      medium: "Compress a PDF or document to reduce file size."
      long: "Compress PDF to reduce file size. Optimize images, remove metadata, and more. Example: compress_document(input='large.pdf', quality='medium', output='small.pdf')."
      verbose: "Compress PDF documents to reduce file size. Optimization levels: 'low' (minimal compression), 'medium' (balanced), 'high' (maximum compression). Options: image compression, downsampling, remove duplicate objects, linearize for web. Example: compress_document(input='photos.pdf', quality='high', image_quality=75, max_image_dpi=150, output='optimized.pdf'). Note: High compression may affect image quality. Warning: Extremely compressed PDFs may not print well."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output
        type: string
        description: "Output document path"
        required: true
      - name: quality
        type: string
        description: "Compression level"
        required: false
        default: "medium"
        enum: ["low", "medium", "high"]
      - name: image_quality
        type: integer
        description: "JPEG quality for images (1-100)"
        required: false
        default: 85
      - name: max_image_dpi
        type: integer
        description: "Max image DPI"
        required: false
        default: 150
      - name: remove_metadata
        type: boolean
        description: "Remove document metadata"
        required: false
        default: false
    tags: ["document", "pdf", "compress", "optimize", "size"]
    test_prompts:
      single:
        - "Compress this PDF"
        - "Reduce the file size"
        - "Optimize the document"
        - "Make this PDF smaller"

  - name: protect_document
    descriptions:
      minimal: "Protect document"
      short: "Password protect a document"
      medium: "Add password protection and permissions to a PDF document."
      long: "Protect PDF with password and set permissions. Control printing, copying, and editing. Example: protect_document(input='sensitive.pdf', password='secret123', output='protected.pdf')."
      verbose: "Add security to PDF documents. Password types: 'user' (required to open), 'owner' (required to change permissions). Permissions: print, copy, modify, annotate, fill forms, extract. Encryption: 128-bit AES, 256-bit AES. Example: protect_document(input='confidential.pdf', user_password='viewonly', owner_password='admin123', allow_print=true, allow_copy=false, encryption='256-AES', output='secured.pdf'). Note: Some PDF readers may not respect permissions. Warning: Password protection is not foolproof security."
    parameters:
      - name: input
        type: string
        description: "Input PDF path"
        required: true
      - name: output
        type: string
        description: "Output PDF path"
        required: true
      - name: user_password
        type: string
        description: "Password to open document"
        required: false
      - name: owner_password
        type: string
        description: "Password for full access"
        required: true
      - name: allow_print
        type: boolean
        description: "Allow printing"
        required: false
        default: true
      - name: allow_copy
        type: boolean
        description: "Allow copying text"
        required: false
        default: true
      - name: allow_modify
        type: boolean
        description: "Allow modifications"
        required: false
        default: false
      - name: encryption
        type: string
        description: "Encryption strength"
        required: false
        default: "256-AES"
        enum: ["128-AES", "256-AES"]
    tags: ["document", "pdf", "protect", "password", "security"]
    test_prompts:
      single:
        - "Password protect this PDF"
        - "Add security to the document"
        - "Protect this file with a password"
        - "Lock the PDF from editing"
  - name: redact_document
    descriptions:
      minimal: "Redact content"
      short: "Redact sensitive content"
      medium: "Permanently remove sensitive information from a document."
      long: "Redact sensitive content from PDFs. Permanently removes text, images, or metadata. Example: redact_document(input='contract.pdf', patterns='[\"SSN\", \"credit_card\"]')."
      verbose: "Permanently remove sensitive information from documents. Redaction types: text patterns (regex), areas (coordinates), metadata, annotations. Built-in patterns: SSN, credit card, phone, email. Example: redact_document(input='application.pdf', patterns='[\"\\\\d{3}-\\\\d{2}-\\\\d{4}\", \"credit_card\"]', areas='[{\"page\": 1, \"x\": 100, \"y\": 200, \"width\": 150, \"height\": 20}]', redact_metadata=true, output='redacted.pdf'). Note: Redaction is permanent and cannot be undone. Warning: Always verify redacted content before sharing."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output
        type: string
        description: "Output document path"
        required: true
      - name: patterns
        type: string
        description: "JSON array of text patterns or regex"
        required: false
      - name: areas
        type: string
        description: "JSON array of area coordinates"
        required: false
      - name: redact_metadata
        type: boolean
        description: "Also redact metadata"
        required: false
        default: true
      - name: redaction_color
        type: string
        description: "Color of redaction boxes"
        required: false
        default: "black"
    tags: ["document", "pdf", "redact", "security", "privacy"]
    test_prompts:
      single:
        - "Redact SSN from document"
        - "Remove sensitive information"
        - "Black out personal data"
        - "Redact credit card numbers"

  - name: add_watermark
    descriptions:
      minimal: "Add watermark"
      short: "Add watermark to document"
      medium: "Add a text or image watermark to document pages."
      long: "Add watermarks to PDF pages. Supports text or image watermarks. Example: add_watermark(input='report.pdf', text='CONFIDENTIAL', opacity=0.3)."
      verbose: "Add watermarks for branding or security. Types: text (with font, size, rotation), image (logo, stamp). Placement: center, diagonal, header/footer, all pages or specific. Example: add_watermark(input='proposal.pdf', text='DRAFT', font_size=72, rotation=45, opacity=0.2, color='#FF0000', pages='all', output='watermarked.pdf'). Note: Watermarks appear behind content. Warning: Watermarks can be removed from unprotected PDFs."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output
        type: string
        description: "Output document path"
        required: true
      - name: text
        type: string
        description: "Watermark text"
        required: false
      - name: image
        type: string
        description: "Watermark image path"
        required: false
      - name: opacity
        type: number
        description: "Watermark opacity (0-1)"
        required: false
        default: 0.3
      - name: rotation
        type: integer
        description: "Rotation angle in degrees"
        required: false
        default: 45
      - name: pages
        type: string
        description: "Pages to watermark"
        required: false
        default: "all"
    tags: ["document", "pdf", "watermark", "branding", "security"]
    test_prompts:
      single:
        - "Add watermark to PDF"
        - "Stamp document as confidential"
        - "Add company logo watermark"
        - "Mark pages as draft"

  - name: flatten_form_fields
    descriptions:
      minimal: "Flatten forms"
      short: "Flatten PDF form fields"
      medium: "Convert form fields to static content in a PDF."
      long: "Flatten PDF forms to make them non-editable. Converts fields to static content. Example: flatten_form_fields(input='filled_form.pdf', output='flat.pdf')."
      verbose: "Flatten PDF form fields to prevent further editing. Converts interactive fields to static content while preserving appearance. Options: flatten all or specific field types. Example: flatten_form_fields(input='completed_application.pdf', flatten_types='[\"text\", \"checkbox\", \"signature\"]', preserve_appearance=true, output='finalized.pdf'). Note: Flattening is irreversible. Warning: Some accessibility features may be lost after flattening."
    parameters:
      - name: input
        type: string
        description: "Input PDF path"
        required: true
      - name: output
        type: string
        description: "Output PDF path"
        required: true
      - name: flatten_types
        type: string
        description: "JSON array of field types to flatten"
        required: false
      - name: preserve_appearance
        type: boolean
        description: "Preserve field appearance"
        required: false
        default: true
    tags: ["document", "pdf", "form", "flatten", "finalize"]
    test_prompts:
      single:
        - "Flatten PDF form"
        - "Make form non-editable"
        - "Finalize filled form"
        - "Lock form fields"

  - name: compare_documents
    descriptions:
      minimal: "Compare documents"
      short: "Compare two documents"
      medium: "Compare two documents and highlight differences."
      long: "Compare two document versions and show differences. Highlights additions, deletions, and changes. Example: compare_documents(original='v1.pdf', modified='v2.pdf', output='diff.pdf')."
      verbose: "Visual document comparison for review and legal purposes. Comparison types: text (word-by-word), layout (visual differences), metadata. Output: side-by-side, overlay, change list. Example: compare_documents(original='contract_v1.pdf', modified='contract_v2.pdf', comparison_type='text', output_format='overlay', highlight_additions='green', highlight_deletions='red', output='comparison.pdf'). Note: Best results with text-based PDFs. Warning: Scanned documents may require OCR first."
    parameters:
      - name: original
        type: string
        description: "Original document path"
        required: true
      - name: modified
        type: string
        description: "Modified document path"
        required: true
      - name: output
        type: string
        description: "Output comparison path"
        required: true
      - name: comparison_type
        type: string
        description: "Type of comparison"
        required: false
        default: "text"
        enum: ["text", "layout", "both"]
      - name: output_format
        type: string
        description: "Output format"
        required: false
        default: "overlay"
        enum: ["overlay", "side_by_side", "list"]
    tags: ["document", "pdf", "compare", "diff", "review"]
    test_prompts:
      single:
        - "Compare two PDFs"
        - "Show document differences"
        - "Diff the contract versions"
        - "What changed between versions"

  - name: add_page_numbers
    descriptions:
      minimal: "Add page numbers"
      short: "Add page numbers to document"
      medium: "Add page numbers to a PDF document."
      long: "Add page numbers to PDF pages. Customize position, format, and starting number. Example: add_page_numbers(input='book.pdf', position='bottom_center', format='Page {n} of {total}')."
      verbose: "Add page numbering to documents. Positions: top/bottom, left/center/right. Formats: number only, 'Page X of Y', Roman numerals. Options: start page, starting number, skip pages. Example: add_page_numbers(input='thesis.pdf', position='bottom_center', format='Page {n} of {total}', font='Helvetica', font_size=10, start_page=3, starting_number=1, output='numbered.pdf'). Note: Existing page numbers may conflict. Warning: Check margins to ensure numbers are visible."
    parameters:
      - name: input
        type: string
        description: "Input document path"
        required: true
      - name: output
        type: string
        description: "Output document path"
        required: true
      - name: position
        type: string
        description: "Number position"
        required: false
        default: "bottom_center"
        enum: ["top_left", "top_center", "top_right", "bottom_left", "bottom_center", "bottom_right"]
      - name: format
        type: string
        description: "Number format (use {n} for page, {total} for total)"
        required: false
        default: "{n}"
      - name: start_page
        type: integer
        description: "First page to number"
        required: false
        default: 1
      - name: starting_number
        type: integer
        description: "Starting number"
        required: false
        default: 1
    tags: ["document", "pdf", "page_numbers", "format", "pagination"]
    test_prompts:
      single:
        - "Add page numbers"
        - "Number the pages"
        - "Add Page X of Y footer"
        - "Insert page numbering"

  - name: add_header_footer
    descriptions:
      minimal: "Add header/footer"
      short: "Add headers and footers"
      medium: "Add headers and footers to document pages."
      long: "Add custom headers and footers to PDF pages. Include text, dates, or page numbers. Example: add_header_footer(input='doc.pdf', header='Company Name', footer='{date}')."
