category: data_operations

tools:
  - name: query_database
    descriptions:
      minimal: "Query a database"
      short: "Execute a SQL query on a database"
      medium: "Execute a SQL SELECT query on a database and return the results. Specify the database name and the query to run."
      long: "Execute a SQL SELECT query on a database and return the results as a list of records. Supports standard SQL syntax. Use the limit parameter to restrict the number of returned rows. Example: query_database(database='users_db', query='SELECT * FROM users WHERE active=true', limit=100)."
      verbose: "Execute a SQL SELECT query on a database. Returns results as a list of dictionaries, where each dictionary represents a row with column names as keys. Supports parameterized queries to prevent SQL injection. Use limit to cap results. The query should be a valid SELECT statement. Example: query_database(database='analytics', query='SELECT user_id, COUNT(*) as visits FROM page_views GROUP BY user_id', limit=1000). Note: Only SELECT queries are allowed; use other tools for INSERT/UPDATE/DELETE. Warning: Large result sets may impact performance; always use LIMIT for large tables."
    parameters:
      - name: database
        type: string
        description: "The name of the database to query"
        required: true
      - name: query
        type: string
        description: "The SQL SELECT query to execute"
        required: true
      - name: limit
        type: integer
        description: "Maximum number of rows to return"
        required: false
        default: 100
    tags: ["database", "query", "sql", "select", "read"]
    test_prompts:
      single:
        - "Get all users from the database"
        - "Query the orders table for orders from last month"
        - "Find all products with price greater than 100"
        - "Select the top 10 customers by total purchases"
      single_clear:
        - "I need to query the database. Get all users from the database"
        - "I need to query the database. Query the orders table for orders from last month"
        - "I need to query the database. Find all products with price greater than 100"
        - "I need to query the database. Select the top 10 customers by total purchases"
      multi:
        - prompt: "Get all inactive users and then delete them from the database"
          required_tools: ["query_database", "delete_records"]

  - name: insert_record
    descriptions:
      minimal: "Insert a database record"
      short: "Insert a new record into a database table"
      medium: "Insert a new record into a database table. Provide the table name and the data as key-value pairs."
      long: "Insert a new record into a database table. The data should be provided as a JSON object with column names as keys. Returns the ID of the inserted record. Example: insert_record(table='users', data='{\"name\": \"John\", \"email\": \"john@example.com\"}')."
      verbose: "Insert a new record into a database table. Provide data as a JSON object where keys match column names. The database will validate data types and constraints. Returns the auto-generated ID of the new record if applicable. Example: insert_record(database='main', table='customers', data='{\"name\": \"Acme Corp\", \"industry\": \"Technology\", \"employees\": 500}'). Note: Required columns must be provided or have default values. Warning: Inserting duplicate keys will fail if unique constraints exist."
    parameters:
      - name: table
        type: string
        description: "The name of the table to insert into"
        required: true
      - name: data
        type: string
        description: "JSON object with column names and values"
        required: true
      - name: database
        type: string
        description: "The database name (uses default if not specified)"
        required: false
    tags: ["database", "insert", "sql", "create", "write"]
    test_prompts:
      single:
        - "Add a new user named John with email john@test.com to the users table"
        - "Insert a new product called 'Widget' with price 29.99"
        - "Create a new order record for customer ID 123"
        - "Add an entry to the logs table with message 'System started'"
      single_clear:
        - "I need to insert a record into the database. Add a new user named John with email john@test.com to the users table"
        - "I need to insert a record into the database. Insert a new product called 'Widget' with price 29.99"
        - "I need to insert a record into the database. Create a new order record for customer ID 123"
        - "I need to insert a record into the database. Add an entry to the logs table with message 'System started'"

  - name: update_records
    descriptions:
      minimal: "Update database records"
      short: "Update existing records in a database table"
      medium: "Update existing records in a database table that match a condition. Specify the new values and the WHERE condition."
      long: "Update existing records in a database table. Provide the new values as a JSON object and a WHERE condition to select which records to update. Example: update_records(table='users', data='{\"status\": \"active\"}', condition='last_login > 2024-01-01')."
      verbose: "Update existing records in a database table that match a specified condition. The data parameter contains the new values as a JSON object. The condition parameter is a SQL WHERE clause (without the WHERE keyword). Returns the number of affected rows. Example: update_records(table='products', data='{\"price\": 19.99, \"updated_at\": \"2024-01-15\"}', condition='category = \"electronics\" AND stock > 0'). Note: Without a condition, ALL records will be updated. Warning: Always double-check your condition to avoid unintended mass updates."
    parameters:
      - name: table
        type: string
        description: "The name of the table to update"
        required: true
      - name: data
        type: string
        description: "JSON object with columns and new values"
        required: true
      - name: condition
        type: string
        description: "SQL WHERE condition (without WHERE keyword)"
        required: true
      - name: database
        type: string
        description: "The database name (uses default if not specified)"
        required: false
    tags: ["database", "update", "sql", "modify", "write"]
    test_prompts:
      single:
        - "Update the email of user with ID 5 to newemail@test.com"
        - "Set all products in category 'electronics' to have a 10% discount"
        - "Mark all orders from yesterday as processed"
        - "Change the status of user john@test.com to inactive"
      single_clear:
        - "I need to update records in the database. Update the email of user with ID 5 to newemail@test.com"
        - "I need to update records in the database. Set all products in category 'electronics' to have a 10% discount"
        - "I need to update records in the database. Mark all orders from yesterday as processed"
        - "I need to update records in the database. Change the status of user john@test.com to inactive"

  - name: delete_records
    descriptions:
      minimal: "Delete database records"
      short: "Delete records from a database table"
      medium: "Delete records from a database table that match a condition. Use with caution as this is permanent."
      long: "Delete records from a database table that match the specified condition. This operation is permanent and cannot be undone. Returns the number of deleted records. Example: delete_records(table='sessions', condition='expires_at < NOW()')."
      verbose: "Delete records from a database table that match a specified condition. The condition is a SQL WHERE clause (without the WHERE keyword). This operation permanently removes data and cannot be undone. Returns the count of deleted rows. Example: delete_records(table='temp_data', condition='created_at < \"2024-01-01\"', database='analytics'). Note: Consider using soft deletes (updating a deleted flag) for important data. Warning: This operation is irreversible. Always backup data before bulk deletions."
    parameters:
      - name: table
        type: string
        description: "The name of the table to delete from"
        required: true
      - name: condition
        type: string
        description: "SQL WHERE condition (without WHERE keyword)"
        required: true
      - name: database
        type: string
        description: "The database name (uses default if not specified)"
        required: false
    tags: ["database", "delete", "sql", "remove", "write", "destructive"]
    test_prompts:
      single:
        - "Delete all expired sessions from the sessions table"
        - "Remove all users who haven't logged in for a year"
        - "Delete the order with ID 12345"
        - "Remove all test records from the database"
      single_clear:
        - "I need to delete records from the database. Delete all expired sessions from the sessions table"
        - "I need to delete records from the database. Remove all users who haven't logged in for a year"
        - "I need to delete records from the database. Delete the order with ID 12345"
        - "I need to delete records from the database. Remove all test records from the database"

  - name: create_table
    descriptions:
      minimal: "Create a database table"
      short: "Create a new table in the database"
      medium: "Create a new table in the database with the specified columns and data types."
      long: "Create a new table in the database. Define columns with their names, types, and constraints. Supports common SQL types like VARCHAR, INTEGER, BOOLEAN, TIMESTAMP. Example: create_table(table='products', schema='id INTEGER PRIMARY KEY, name VARCHAR(255), price DECIMAL(10,2)')."
      verbose: "Create a new table in the database with a specified schema. The schema defines columns, data types, and constraints using SQL syntax. Supports primary keys, foreign keys, NOT NULL, UNIQUE, and DEFAULT constraints. Example: create_table(table='orders', schema='id SERIAL PRIMARY KEY, user_id INTEGER REFERENCES users(id), total DECIMAL(10,2) NOT NULL, status VARCHAR(50) DEFAULT \"pending\", created_at TIMESTAMP DEFAULT NOW()'). Note: Table creation is idempotent if if_not_exists=true. Warning: Dropping and recreating tables will lose all data."
    parameters:
      - name: table
        type: string
        description: "The name of the table to create"
        required: true
      - name: schema
        type: string
        description: "SQL column definitions"
        required: true
      - name: database
        type: string
        description: "The database name"
        required: false
      - name: if_not_exists
        type: boolean
        description: "If true, don't error if table exists"
        required: false
        default: true
    tags: ["database", "table", "create", "sql", "schema"]
    test_prompts:
      single:
        - "Create a new table called 'customers' with id, name, and email columns"
        - "Make a products table with columns for id, name, price, and stock"
        - "Create an orders table with foreign key to users"
      single_clear:
        - "I need to create a database table. Create a new table called 'customers' with id, name, and email columns"
        - "I need to create a database table. Make a products table with columns for id, name, price, and stock"
        - "I need to create a database table. Create an orders table with foreign key to users"

  - name: list_tables
    descriptions:
      minimal: "List database tables"
      short: "List all tables in a database"
      medium: "List all tables in the specified database. Returns table names and basic information."
      long: "List all tables in a database. Returns a list of table names along with basic metadata like row counts and creation dates. Example: list_tables(database='production')."
      verbose: "List all tables in the specified database. Returns comprehensive information including table names, estimated row counts, creation timestamps, and storage size. Can filter by schema if the database supports multiple schemas. Example: list_tables(database='analytics', schema='public'). Note: Row counts are estimates and may not be exact for large tables. Warning: Access may be restricted based on user permissions."
    parameters:
      - name: database
        type: string
        description: "The database to list tables from"
        required: true
      - name: schema
        type: string
        description: "Filter by schema name"
        required: false
    tags: ["database", "table", "list", "sql", "schema", "metadata"]
    test_prompts:
      single:
        - "Show me all tables in the production database"
        - "List the tables in the analytics database"
        - "What tables exist in the main database?"
      single_clear:
        - "I need to list database tables. Show me all tables in the production database"
        - "I need to list database tables. List the tables in the analytics database"
        - "I need to list database tables. What tables exist in the main database?"

  - name: describe_table
    descriptions:
      minimal: "Describe a table"
      short: "Get the schema of a database table"
      medium: "Get detailed schema information for a database table including column names, types, and constraints."
      long: "Get the complete schema definition of a database table. Returns column names, data types, nullability, default values, and constraints. Example: describe_table(table='users', database='main')."
      verbose: "Get comprehensive schema information for a database table. Returns detailed metadata for each column including: name, data type, maximum length, precision, nullability, default value, and any constraints (PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK). Also includes index information. Example: describe_table(table='orders', database='ecommerce'). Note: Output format may vary slightly between database systems. Warning: Schema information may expose sensitive database structure."
    parameters:
      - name: table
        type: string
        description: "The name of the table to describe"
        required: true
      - name: database
        type: string
        description: "The database containing the table"
        required: false
    tags: ["database", "table", "describe", "sql", "schema", "metadata"]
    test_prompts:
      single:
        - "Describe the structure of the users table"
        - "What columns does the orders table have?"
        - "Show me the schema of the products table"
        - "Get the column definitions for the customers table"
      single_clear:
        - "I need to describe a database table. Describe the structure of the users table"
        - "I need to describe a database table. What columns does the orders table have?"
        - "I need to describe a database table. Show me the schema of the products table"
        - "I need to describe a database table. Get the column definitions for the customers table"

  - name: count_records
    descriptions:
      minimal: "Count records"
      short: "Count records in a database table"
      medium: "Count the number of records in a database table, optionally filtered by a condition."
      long: "Count the number of records in a database table. Can filter results using a WHERE condition. Example: count_records(table='orders', condition='status = \"pending\"')."
      verbose: "Count the number of records in a database table. Optionally provide a condition to count only matching records. This is more efficient than fetching all records when you only need the count. Example: count_records(table='users', condition='created_at > \"2024-01-01\" AND status = \"active\"', database='main'). Note: For large tables, this uses an optimized COUNT query. Warning: Complex conditions may still require full table scans."
    parameters:
      - name: table
        type: string
        description: "The table to count records from"
        required: true
      - name: condition
        type: string
        description: "Optional WHERE condition"
        required: false
      - name: database
        type: string
        description: "The database name"
        required: false
    tags: ["database", "count", "sql", "aggregate", "read"]
    test_prompts:
      single:
        - "How many users are in the database?"
        - "Count the number of pending orders"
        - "How many products have stock greater than zero?"
        - "Count active subscriptions in the subscriptions table"
      single_clear:
        - "I need to count records in the database. How many users are in the database?"
        - "I need to count records in the database. Count the number of pending orders"
        - "I need to count records in the database. How many products have stock greater than zero?"
        - "I need to count records in the database. Count active subscriptions in the subscriptions table"

  - name: export_data
    descriptions:
      minimal: "Export data"
      short: "Export database query results to a file"
      medium: "Export the results of a database query to a file in CSV or JSON format."
      long: "Export database query results to a file. Supports CSV and JSON output formats. Useful for data backups and analysis. Example: export_data(query='SELECT * FROM users', output_file='users_backup.csv', format='csv')."
      verbose: "Export the results of a database query to a file. Supports multiple output formats including CSV, JSON, and Parquet. For large datasets, results are streamed to avoid memory issues. Can include or exclude headers in CSV output. Example: export_data(query='SELECT id, email, created_at FROM users WHERE active=true', output_file='active_users.json', format='json', database='production'). Note: Large exports may take significant time. Warning: Ensure sufficient disk space for the output file."
    parameters:
      - name: query
        type: string
        description: "SQL query to export results from"
        required: true
      - name: output_file
        type: string
        description: "Path to the output file"
        required: true
      - name: format
        type: string
        description: "Output format"
        required: false
        default: "csv"
        enum: ["csv", "json", "parquet"]
      - name: database
        type: string
        description: "The database to query"
        required: false
    tags: ["database", "export", "backup", "csv", "json", "file"]
    test_prompts:
      single:
        - "Export all users to a CSV file"
        - "Save the orders data to orders_backup.json"
        - "Export the products table to a CSV file named products.csv"
      single_clear:
        - "I need to export data from the database. Export all users to a CSV file"
        - "I need to export data from the database. Save the orders data to orders_backup.json"
        - "I need to export data from the database. Export the products table to a CSV file named products.csv"

  - name: import_data
    descriptions:
      minimal: "Import data"
      short: "Import data from a file into a database table"
      medium: "Import data from a CSV or JSON file into a database table. Maps file columns to table columns."
      long: "Import data from a file into a database table. Supports CSV and JSON input formats. Automatically maps file columns/keys to table columns. Example: import_data(input_file='data.csv', table='products', format='csv')."
      verbose: "Import data from a file into a database table. Supports CSV, JSON, and Parquet input formats. Can handle large files through streaming. Options include: truncating the table before import, skipping errors, and specifying column mappings. Example: import_data(input_file='customers.json', table='customers', format='json', truncate_first=false, on_error='skip'). Note: Ensure column types in the file match the table schema. Warning: truncate_first=true will delete all existing data before importing."
    parameters:
      - name: input_file
        type: string
        description: "Path to the input file"
        required: true
      - name: table
        type: string
        description: "Target table name"
        required: true
      - name: format
        type: string
        description: "Input file format"
        required: false
        default: "csv"
        enum: ["csv", "json", "parquet"]
      - name: database
        type: string
        description: "The target database"
        required: false
      - name: truncate_first
        type: boolean
        description: "If true, clear table before importing"
        required: false
        default: false
    tags: ["database", "import", "csv", "json", "file", "load"]
    test_prompts:
      single:
        - "Import users.csv into the users table"
        - "Load data from products.json into the products table"
        - "Import the backup file into the orders table"
      single_clear:
        - "I need to import data into the database. Import users.csv into the users table"
        - "I need to import data into the database. Load data from products.json into the products table"
        - "I need to import data into the database. Import the backup file into the orders table"

  - name: execute_transaction
    descriptions:
      minimal: "Execute transaction"
      short: "Execute multiple queries in a transaction"
      medium: "Execute multiple SQL queries as a single atomic transaction. All succeed or all fail."
      long: "Execute a series of SQL queries as an atomic transaction. If any query fails, all changes are rolled back. Example: execute_transaction(queries='[\"UPDATE accounts SET balance = balance - 100 WHERE id = 1\", \"UPDATE accounts SET balance = balance + 100 WHERE id = 2\"]')."
      verbose: "Execute multiple SQL statements as a single atomic transaction. Uses ACID properties: all queries succeed together or all fail together (rolled back). Useful for maintaining data consistency across related operations. Example: execute_transaction(queries='[\"INSERT INTO orders (...) VALUES (...)\", \"UPDATE inventory SET stock = stock - 1 WHERE product_id = 123\"]', isolation_level='serializable'). Isolation levels: 'read_committed', 'repeatable_read', 'serializable'. Note: Long transactions may lock resources. Warning: Deadlocks are possible with concurrent transactions."
    parameters:
      - name: queries
        type: string
        description: "JSON array of SQL queries to execute"
        required: true
      - name: database
        type: string
        description: "Database name"
        required: false
      - name: isolation_level
        type: string
        description: "Transaction isolation level"
        required: false
        default: "read_committed"
        enum: ["read_committed", "repeatable_read", "serializable"]
    tags: ["database", "transaction", "sql", "atomic", "commit"]
    test_prompts:
      single:
        - "Transfer money between accounts atomically"
        - "Execute these queries as a single transaction"
        - "Run the order creation and inventory update together"
        - "Perform a transactional update on multiple tables"
      single_clear:
        - "I need to execute a database transaction. Transfer money between accounts atomically"
        - "I need to execute a database transaction. Execute these queries as a single transaction"
        - "I need to execute a database transaction. Run the order creation and inventory update together"
        - "I need to execute a database transaction. Perform a transactional update on multiple tables"

  - name: backup_database
    descriptions:
      minimal: "Backup database"
      short: "Create a database backup"
      medium: "Create a backup of a database to a file. Supports full and incremental backups."
      long: "Create a backup of a database. Supports full database dumps or incremental backups. Can compress the output. Example: backup_database(database='production', output_file='backup_2024.sql', compress=true)."
      verbose: "Create a backup of a database for disaster recovery or migration. Backup types: 'full' (complete database dump), 'incremental' (changes since last backup), 'schema_only' (structure without data). Output formats include SQL dump and custom binary format. Example: backup_database(database='myapp', output_file='/backups/myapp_20240115.sql.gz', type='full', compress=true, include_schema=true). Note: Large databases may take significant time to backup. Warning: Ensure sufficient disk space for the backup file."
    parameters:
      - name: database
        type: string
        description: "Database to backup"
        required: true
      - name: output_file
        type: string
        description: "Path for backup file"
        required: true
      - name: type
        type: string
        description: "Backup type"
        required: false
        default: "full"
        enum: ["full", "incremental", "schema_only"]
      - name: compress
        type: boolean
        description: "Compress the backup file"
        required: false
        default: true
      - name: include_schema
        type: boolean
        description: "Include table schemas"
        required: false
        default: true
    tags: ["database", "backup", "dump", "export", "recovery"]
    test_prompts:
      single:
        - "Create a backup of the production database"
        - "Dump the database to a backup file"
        - "Make a compressed backup of the users database"
        - "Create a schema-only backup"
      single_clear:
        - "I need to backup the database. Create a backup of the production database"
        - "I need to backup the database. Dump the database to a backup file"
        - "I need to backup the database. Make a compressed backup of the users database"
        - "I need to backup the database. Create a schema-only backup"

  - name: restore_database
    descriptions:
      minimal: "Restore database"
      short: "Restore a database from backup"
      medium: "Restore a database from a backup file. Can restore to the original or a new database."
      long: "Restore a database from a backup file. Can restore to the same database or a different one. Example: restore_database(backup_file='backup_2024.sql', database='production_restored')."
      verbose: "Restore a database from a previously created backup file. Can restore to the original database (overwriting) or create a new database. Options for partial restore (specific tables only). Example: restore_database(backup_file='/backups/myapp_20240115.sql.gz', database='myapp_staging', drop_existing=false, tables='[\"users\", \"orders\"]'). Note: Compressed backups are automatically decompressed. Warning: drop_existing=true will delete all current data before restoring."
    parameters:
      - name: backup_file
        type: string
        description: "Path to backup file"
        required: true
      - name: database
        type: string
        description: "Target database name"
        required: true
      - name: drop_existing
        type: boolean
        description: "Drop existing database before restore"
        required: false
        default: false
      - name: tables
        type: string
        description: "JSON array of specific tables to restore"
        required: false
    tags: ["database", "restore", "import", "recovery", "backup"]
    test_prompts:
      single:
        - "Restore the database from the backup file"
        - "Load the backup into a new database"
        - "Restore only the users table from backup"
        - "Recover the production database from backup"
      single_clear:
        - "I need to restore a database from backup. Restore the database from the backup file"
        - "I need to restore a database from backup. Load the backup into a new database"
        - "I need to restore a database from backup. Restore only the users table from backup"
        - "I need to restore a database from backup. Recover the production database from backup"

  - name: create_index
    descriptions:
      minimal: "Create index"
      short: "Create a database index"
      medium: "Create an index on a database table to improve query performance."
      long: "Create an index on one or more columns of a table. Indexes speed up SELECT queries but slow down INSERT/UPDATE. Example: create_index(table='users', columns='[\"email\"]', unique=true)."
      verbose: "Create an index on table columns to optimize query performance. Index types: 'btree' (default, good for ranges), 'hash' (exact matches only), 'gin' (full-text search), 'gist' (geometric data). Options for unique constraints and partial indexes. Example: create_index(table='orders', columns='[\"user_id\", \"created_at\"]', name='idx_orders_user_date', type='btree', unique=false). Note: Index creation may lock the table briefly. Warning: Too many indexes slow down write operations."
    parameters:
      - name: table
        type: string
        description: "Table to index"
        required: true
      - name: columns
        type: string
        description: "JSON array of column names"
        required: true
      - name: name
        type: string
        description: "Index name (auto-generated if not provided)"
        required: false
      - name: unique
        type: boolean
        description: "Create unique index"
        required: false
        default: false
      - name: type
        type: string
        description: "Index type"
        required: false
        default: "btree"
        enum: ["btree", "hash", "gin", "gist"]
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["database", "index", "performance", "optimize", "query"]
    test_prompts:
      single:
        - "Create an index on the email column"
        - "Add a unique index to the users table"
        - "Create a composite index on user_id and created_at"
        - "Index the orders table for faster lookups"
      single_clear:
        - "I need to create a database index. Create an index on the email column"
        - "I need to create a database index. Add a unique index to the users table"
        - "I need to create a database index. Create a composite index on user_id and created_at"
        - "I need to create a database index. Index the orders table for faster lookups"

  - name: drop_index
    descriptions:
      minimal: "Drop index"
      short: "Remove a database index"
      medium: "Remove an existing index from a database table."
      long: "Drop an existing index from a table. Removes the index to reduce storage or before recreating it. Example: drop_index(name='idx_users_email', table='users')."
      verbose: "Remove an existing index from a database table. Useful for removing unused indexes that slow down writes or before recreating an index with different settings. Example: drop_index(name='idx_orders_status', table='orders', if_exists=true, database='main'). Note: Dropping an index is typically fast. Warning: Queries relying on the index will become slower."
    parameters:
      - name: name
        type: string
        description: "Name of the index to drop"
        required: true
      - name: table
        type: string
        description: "Table containing the index"
        required: true
      - name: if_exists
        type: boolean
        description: "Don't error if index doesn't exist"
        required: false
        default: true
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["database", "index", "drop", "remove", "schema"]
    test_prompts:
      single:
