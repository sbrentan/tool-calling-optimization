      verbose: "Perform an upsert (INSERT ... ON CONFLICT UPDATE) operation. If a record with the same key exists, it's updated; otherwise, a new record is inserted. Specify which columns to update on conflict. Example: upsert_record(table='products', data='{\"sku\": \"ABC123\", \"price\": 29.99, \"stock\": 100}', conflict_column='sku', update_columns='[\"price\", \"stock\"]'). Note: Conflict column must have a unique constraint. Warning: Without proper conflict handling, duplicate key errors may occur."
