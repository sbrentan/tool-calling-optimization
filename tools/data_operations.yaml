  - name: sample_data
    descriptions:
      minimal: "Sample data"
      short: "Get a random sample of data"
      medium: "Retrieve a random sample of records from a table for testing or analysis."
      long: "Get a random sample of records from a dataset. Specify sample size as count or percentage. Example: sample_data(table='users', size=100)."
      verbose: "Extract a random sample of records from a table for analysis, testing, or preview. Methods: random (simple random), stratified (proportional by category), systematic (every nth row). Example: sample_data(table='transactions', size=1000, method='stratified', stratify_column='region', seed=42) returns 1000 transactions with proportional representation from each region. Note: Using a seed ensures reproducible samples. Warning: Random sampling on very large tables may be slow without proper indexing."
    parameters:
      - name: table
        type: string
        description: "Table to sample from"
        required: true
      - name: size
        type: integer
        description: "Sample size (count)"
        required: false
        default: 100
      - name: percentage
        type: number
        description: "Sample size (percentage)"
        required: false
      - name: method
        type: string
        description: "Sampling method"
        required: false
        default: "random"
        enum: ["random", "stratified", "systematic"]
      - name: stratify_column
        type: string
        description: "Column for stratified sampling"
        required: false
      - name: seed
        type: integer
        description: "Random seed for reproducibility"
        required: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "sample", "random", "subset", "testing"]
    test_prompts:
      single:
