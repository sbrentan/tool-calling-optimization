  - name: archive_data
    descriptions:
      minimal: "Archive data"
      short: "Archive old records to history table"
      medium: "Move old or inactive records from a table to an archive table for data lifecycle management."
      long: "Archive records matching criteria to a separate archive table. Preserves data while cleaning main table. Example: archive_data(table='orders', condition='created_at < \"2023-01-01\"', archive_table='orders_archive')."
      verbose: "Move old, inactive, or completed records to an archive table as part of data lifecycle management. Options: auto-create archive table with same schema, compress archived data, add archive timestamp, delete from source or keep. Example: archive_data(table='logs', condition='created_at < DATE_SUB(NOW(), INTERVAL 90 DAY)', archive_table='logs_archive', delete_source=true, add_archived_at=true, batch_size=10000). Note: Archiving in batches prevents locking issues. Warning: Always verify archive before deleting from source."
    parameters:
      - name: table
        type: string
        description: "Source table"
        required: true
      - name: condition
        type: string
        description: "WHERE condition for records to archive"
        required: true
      - name: archive_table
        type: string
        description: "Destination archive table"
        required: true
      - name: delete_source
        type: boolean
        description: "Delete from source after archiving"
        required: false
        default: true
      - name: add_archived_at
        type: boolean
        description: "Add timestamp column"
        required: false
        default: true
      - name: batch_size
        type: integer
        description: "Records per batch"
        required: false
        default: 1000
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "archive", "cleanup", "lifecycle", "maintenance"]
    test_prompts:
      single:
        - "Archive orders older than one year"
        - "Move old logs to the archive table"
        - "Archive completed records"
        - "Clean up and archive old data"
      single_clear:
        - "I need to archive data. Archive orders older than one year"
        - "I need to archive data. Move old logs to the archive table"
