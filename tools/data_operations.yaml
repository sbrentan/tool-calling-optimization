      verbose: "Remove all rows from a table using TRUNCATE. Much faster than DELETE for removing all data because it doesn't log individual row deletions. Resets auto-increment/serial counters by default. Cannot be used if table is referenced by foreign keys. Example: truncate_table(table='session_cache', reset_identity=true, cascade=false, database='main'). Note: TRUNCATE cannot be rolled back in some databases. Warning: CASCADE option will truncate related tables too."
    parameters:
      - name: table
        type: string
