  - name: join_tables
    descriptions:
      minimal: "Join tables"
      short: "Query data by joining multiple tables"
      medium: "Execute a query joining two or more tables. Supports INNER, LEFT, RIGHT, and FULL joins."
      long: "Join multiple tables in a query. Specify tables, join type, and join conditions. Example: join_tables(tables='[\"orders\", \"customers\"]', join_type='LEFT', on='orders.customer_id = customers.id', select='orders.id, customers.name')."
      verbose: "Execute a query joining multiple tables together. Join types: 'INNER' (matching rows only), 'LEFT' (all from left + matching right), 'RIGHT' (all from right + matching left), 'FULL' (all rows from both). Supports multiple join conditions. Example: join_tables(tables='[\"orders\", \"customers\", \"products\"]', join_type='INNER', on='orders.customer_id = customers.id AND orders.product_id = products.id', select='orders.id, customers.name, products.title', condition='orders.status = \"completed\"'). Note: Complex joins on large tables benefit from proper indexing. Warning: FULL OUTER JOIN may not be supported by all databases."
