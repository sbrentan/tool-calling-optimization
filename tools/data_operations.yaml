  - name: join_tables
    descriptions:
      minimal: "Join tables"
      short: "Join two or more database tables"
      medium: "Combine data from multiple tables using SQL join operations."
      long: "Join multiple tables together on specified columns. Supports INNER, LEFT, RIGHT, and FULL joins. Example: join_tables(tables=['users', 'orders'], on='users.id = orders.user_id', type='left')."
      verbose: "Combine data from multiple tables using various join operations. Join types: INNER (matching only), LEFT (all from first), RIGHT (all from second), FULL (all from both), CROSS (cartesian product). Multiple join conditions supported. Example: join_tables(tables=['orders', 'customers', 'products'], joins=[{\"table\": \"customers\", \"on\": \"orders.customer_id = customers.id\", \"type\": \"inner\"}, {\"table\": \"products\", \"on\": \"orders.product_id = products.id\", \"type\": \"left\"}], select=['orders.*', 'customers.name', 'products.title']). Note: Join order affects performance. Warning: Large table joins without proper indexes can be very slow."
    parameters:
      - name: tables
        type: array
        description: "Tables to join"
        required: true
      - name: "on"
        type: string
        description: "Join condition (for simple join)"
        required: false
      - name: joins
        type: array
        description: "Array of join specifications"
        required: false
      - name: type
        type: string
        description: "Join type (for simple join)"
        required: false
        default: "inner"
        enum: ["inner", "left", "right", "full", "cross"]
      - name: select
        type: array
        description: "Columns to select"
        required: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "join", "combine", "sql", "tables", "merge"]
    test_prompts:
      single:
        - "Join users and orders tables"
        - "Combine customer and sales data"
        - "Left join products with inventory"
        - "Merge the tables on customer ID"
      single_clear:
        - "I need to join tables together. Join users and orders tables"
        - "I need to join tables together. Combine customer and sales data"
        - "I need to join tables together. Left join products with inventory"
        - "I need to join tables together. Merge the tables on customer ID"

  - name: pivot_data
    descriptions:
      minimal: "Pivot data"
      short: "Pivot data rows to columns"
      medium: "Transform data by pivoting rows into columns for cross-tabulation analysis."
      long: "Pivot data to transform rows into columns. Useful for cross-tabulation reports. Example: pivot_data(table='sales', rows='region', columns='quarter', values='SUM(amount)')."
      verbose: "Transform data by pivoting row values into column headers. Essential for cross-tabulation, report generation, and data visualization prep. Supports multiple aggregation functions. Example: pivot_data(table='sales', rows=['region', 'product'], columns='month', values='SUM(amount)', fill_value=0) creates a matrix of region/product combinations vs months with summed sales. Note: Many column values may create wide tables. Warning: Pivot operations on large datasets can be memory-intensive."
    parameters:
      - name: table
        type: string
        description: "Source table or query"
        required: true
      - name: rows
        type: string
        description: "Column(s) for row grouping"
        required: true
      - name: columns
        type: string
        description: "Column to pivot to headers"
        required: true
      - name: values
        type: string
        description: "Aggregation expression for cells"
        required: true
      - name: fill_value
        type: string
        description: "Value for empty cells"
        required: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "pivot", "transform", "crosstab", "reshape"]
    test_prompts:
      single:
        - "Pivot sales data by region and quarter"
        - "Create a cross-tab of products vs months"
        - "Transform rows to columns for the report"
        - "Pivot the data for analysis"
      single_clear:
        - "I need to pivot data. Pivot sales data by region and quarter"
        - "I need to pivot data. Create a cross-tab of products vs months"
        - "I need to pivot data. Transform rows to columns for the report"
        - "I need to pivot data. Pivot the data for analysis"

  - name: deduplicate_data
    descriptions:
      minimal: "Deduplicate data"
      short: "Remove duplicate records"
      medium: "Find and remove duplicate records from a table based on specified columns."
      long: "Identify and remove duplicate records based on key columns. Choose to keep first, last, or none. Example: deduplicate_data(table='contacts', key_columns=['email'], keep='first')."
      verbose: "Find and remove duplicate records from a dataset. Options: specify key columns for uniqueness, choose which duplicate to keep (first, last, or remove all), preview before deleting, log removed records. Example: deduplicate_data(table='email_list', key_columns=['email', 'list_id'], keep='last', preview=true, log_removed=true) shows duplicates before removal. Note: 'first'/'last' depends on table ordering unless ORDER BY specified. Warning: Always preview duplicates before deletion on production data."
    parameters:
      - name: table
        type: string
        description: "Table to deduplicate"
        required: true
      - name: key_columns
        type: array
        description: "Columns defining uniqueness"
        required: true
      - name: keep
        type: string
        description: "Which duplicate to keep"
        required: false
        default: "first"
        enum: ["first", "last", "none"]
      - name: order_by
        type: string
        description: "Order for first/last determination"
        required: false
      - name: preview
        type: boolean
        description: "Preview without deleting"
        required: false
        default: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "dedupe", "duplicate", "clean", "unique"]
    test_prompts:
      single:
        - "Remove duplicate emails from the list"
        - "Find and delete duplicate records"
        - "Deduplicate the contacts table"
        - "Clean up duplicate entries"
      single_clear:
        - "I need to deduplicate data. Remove duplicate emails from the list"
        - "I need to deduplicate data. Find and delete duplicate records"
        - "I need to deduplicate data. Deduplicate the contacts table"
        - "I need to deduplicate data. Clean up duplicate entries"

  - name: transform_data
    descriptions:
      minimal: "Transform data"
      short: "Apply transformations to data columns"
      medium: "Transform data by applying functions to columns like formatting, calculations, or type conversions."
      long: "Apply transformations to data columns. Supports string operations, math, date formatting, and custom expressions. Example: transform_data(table='users', transforms={'full_name': 'CONCAT(first_name, \" \", last_name)'})."
      verbose: "Apply various transformations to data columns. Operations: string functions (UPPER, LOWER, TRIM, SUBSTRING), math (arithmetic, ROUND, ABS), dates (FORMAT, EXTRACT, DATEADD), type casting, conditional (CASE/WHEN), null handling (COALESCE, IFNULL). Example: transform_data(table='orders', transforms={'order_date_formatted': 'DATE_FORMAT(order_date, \"%Y-%m\")', 'total_with_tax': 'amount * 1.08', 'status_label': 'CASE WHEN status=1 THEN \"Active\" ELSE \"Inactive\" END'}, update_in_place=false). Note: update_in_place=false creates new columns. Warning: Data type changes may cause loss of precision."
    parameters:
      - name: table
        type: string
        description: "Table to transform"
        required: true
      - name: transforms
        type: string
        description: "JSON of column transformations"
        required: true
      - name: update_in_place
        type: boolean
        description: "Update existing columns"
        required: false
        default: false
      - name: condition
        type: string
        description: "WHERE condition for rows to transform"
        required: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "transform", "etl", "convert", "process"]
    test_prompts:
      single:
        - "Convert names to uppercase"
        - "Calculate total with tax"
        - "Format the dates in the table"
        - "Transform the data columns"
      single_clear:
        - "I need to transform data. Convert names to uppercase"
        - "I need to transform data. Calculate total with tax"
        - "I need to transform data. Format the dates in the table"
        - "I need to transform data. Transform the data columns"

  - name: validate_data
    descriptions:
      minimal: "Validate data"
      short: "Validate data against rules"
      medium: "Check data quality by validating records against defined rules and constraints."
      long: "Validate data against rules like required fields, data types, ranges, and patterns. Returns validation errors. Example: validate_data(table='users', rules={'email': 'required|email', 'age': 'integer|min:18'})."
      verbose: "Validate data quality by checking records against defined rules. Rule types: required, data type (string, integer, date), format (email, phone, regex), range (min, max, between), uniqueness, foreign key, custom SQL expression. Returns validation report with invalid records. Example: validate_data(table='products', rules={'name': 'required|max:100', 'price': 'required|numeric|min:0', 'sku': 'required|unique', 'category_id': 'exists:categories.id'}, stop_on_first=false) validates all products. Note: Validation is read-only; doesn't modify data. Warning: Validating large tables may be time-consuming."
    parameters:
      - name: table
        type: string
        description: "Table to validate"
        required: true
      - name: rules
        type: string
        description: "JSON of validation rules per column"
        required: true
      - name: stop_on_first
        type: boolean
        description: "Stop on first error per record"
        required: false
        default: false
      - name: limit
        type: integer
        description: "Max records to validate"
        required: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "validate", "quality", "check", "rules"]
    test_prompts:
      single:
        - "Validate the email format in users table"
        - "Check data quality against the rules"
        - "Validate required fields are not null"
        - "Run validation on the imported data"
