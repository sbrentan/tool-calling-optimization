      long: "Aggregate data using grouping and aggregate functions. Supports SUM, COUNT, AVG, MIN, MAX, and more. Example: aggregate_data(table='orders', group_by=['customer_id'], aggregations={'total': 'SUM(amount)'})."
      verbose: "Perform data aggregation with grouping and aggregate functions. Functions: SUM, COUNT, AVG, MIN, MAX, STDDEV, VARIANCE, GROUP_CONCAT. Supports HAVING clause for filtering groups, multiple grouping levels. Example: aggregate_data(table='sales', group_by=['region', 'product_category'], aggregations={'revenue': 'SUM(amount)', 'orders': 'COUNT(*)', 'avg_order': 'AVG(amount)'}, having='SUM(amount) > 10000', order_by='revenue DESC'). Note: NULL values are typically excluded from aggregations. Warning: Large datasets with many groups may be slow."
    parameters:
      - name: table
        type: string
        description: "Source table or query"
        required: true
      - name: group_by
        type: array
        description: "Columns to group by"
        required: true
      - name: aggregations
        type: string
        description: "JSON of aggregation expressions"
        required: true
      - name: having
        type: string
        description: "HAVING clause condition"
        required: false
      - name: order_by
        type: string
        description: "Result ordering"
        required: false
      - name: database
        type: string
        description: "Database name"
        required: false
    tags: ["data", "aggregate", "group", "sum", "count", "analytics"]
    test_prompts:
