      verbose: "Apply ML reranking for improved search relevance. Models: cross-encoder (BERT-based), LTR (learning to rank), custom. Reranking takes initial results and reorders based on deeper semantic understanding. Example: rerank_results(query='comfortable running shoes', results=initial_results, model='cross-encoder-ms-marco', top_n=20, return_scores=true). Note: Reranking adds latency; apply to top-N only. Warning: Model must be loaded/warmed up for fast inference."
