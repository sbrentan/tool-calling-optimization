category: messaging_operations

tools:
  - name: send_email
    descriptions:
      minimal: "Send email"
      short: "Send an email message"
      medium: "Send an email to one or more recipients with subject, body, and optional attachments."
      long: "Send an email message. Supports multiple recipients (to, cc, bcc), HTML content, attachments, and reply-to headers. Example: send_email(to=['user@example.com'], subject='Hello', body='Message content')."
      verbose: "Send an email message with full customization. Supports: multiple recipients (to, cc, bcc), plain text or HTML body, file attachments, inline images, custom headers, reply-to address, priority settings, and read receipts. Example: send_email(to=['john@company.com'], cc=['manager@company.com'], subject='Weekly Report', body='<h1>Report</h1><p>See attached.</p>', body_type='html', attachments=['/reports/weekly.pdf'], priority='high', reply_to='team@company.com'). Note: Large attachments may be rejected by recipient servers. Warning: Avoid sending to large recipient lists to prevent spam classification."
    parameters:
      - name: to
        type: array
        description: "Primary recipients"
        required: true
      - name: subject
        type: string
        description: "Email subject"
        required: true
      - name: body
        type: string
        description: "Email body content"
        required: true
      - name: body_type
        type: string
        description: "Content type"
        required: false
        default: "plain"
        enum: ["plain", "html"]
      - name: cc
        type: array
        description: "Carbon copy recipients"
        required: false
      - name: bcc
        type: array
        description: "Blind carbon copy recipients"
        required: false
      - name: attachments
        type: array
        description: "File paths to attach"
        required: false
      - name: reply_to
        type: string
        description: "Reply-to address"
        required: false
      - name: priority
        type: string
        description: "Message priority"
        required: false
        enum: ["low", "normal", "high"]
    tags: ["email", "send", "message", "communication", "smtp"]
    test_prompts:
      single:
        - "Send an email to john@example.com about the meeting"
        - "Email the report to the team"
        - "Send a message to the client with the proposal attached"
        - "Email the status update to my manager"
      single_clear:
        - "I need to send an email. Send an email to john@example.com about the meeting"
        - "I need to send an email. Email the report to the team"
        - "I need to send an email. Send a message to the client with the proposal attached"
        - "I need to send an email. Email the status update to my manager"

  - name: send_sms
    descriptions:
      minimal: "Send SMS"
      short: "Send a text message via SMS"
      medium: "Send an SMS text message to a phone number. Supports standard SMS and MMS with media."
      long: "Send an SMS or MMS message to a phone number. Messages over 160 characters are sent as multiple segments. MMS supports images. Example: send_sms(to='+1234567890', message='Hello from the app!')."
      verbose: "Send SMS or MMS messages to mobile phones. Standard SMS limited to 160 characters (GSM) or 70 characters (Unicode); longer messages auto-split. MMS supports images, audio, and video. Delivery status tracking available. Example: send_sms(to='+1555123456', message='Your order #12345 has shipped!', sender_id='MYAPP', media_url='https://example.com/receipt.png', track_delivery=true). Note: International SMS may have higher costs and delivery restrictions. Warning: Ensure compliance with SMS marketing regulations (TCPA, GDPR)."
    parameters:
      - name: to
        type: string
        description: "Recipient phone number (E.164 format)"
        required: true
      - name: message
        type: string
        description: "Message content"
        required: true
      - name: sender_id
        type: string
        description: "Sender ID or phone number"
        required: false
      - name: media_url
        type: string
        description: "URL of media for MMS"
        required: false
      - name: track_delivery
        type: boolean
        description: "Request delivery confirmation"
        required: false
        default: false
    tags: ["sms", "message", "text", "mobile", "communication"]
    test_prompts:
      single:
        - "Send a text message to +1234567890"
        - "Text the customer about their order status"
        - "Send an SMS confirmation to the phone number"
        - "Message the client via text"
      single_clear:
        - "I need to send an SMS. Send a text message to +1234567890"
        - "I need to send an SMS. Text the customer about their order status"
        - "I need to send an SMS. Send an SMS confirmation to the phone number"
        - "I need to send an SMS. Message the client via text"

  - name: send_slack_message
    descriptions:
      minimal: "Send Slack message"
      short: "Send a message to a Slack channel or user"
      medium: "Send a message to a Slack workspace, either to a channel or direct message to a user."
      long: "Post a message to Slack. Can send to channels, private groups, or direct messages. Supports rich formatting and attachments. Example: send_slack_message(channel='#general', message='Hello team!')."
      verbose: "Send messages to Slack channels or users. Supports: rich text formatting (markdown), Block Kit for interactive elements, file attachments, thread replies, scheduled messages, and ephemeral messages (visible only to one user). Example: send_slack_message(channel='#engineering', message='Build completed successfully!', username='CI Bot', icon_emoji=':rocket:', thread_ts='1234567890.123456', attachments='[{\"color\": \"good\", \"text\": \"All tests passed\"}]'). Note: Bot must be invited to private channels. Warning: Rate limits apply; batch messages for high-volume use cases."
    parameters:
      - name: channel
        type: string
        description: "Channel name (#channel) or user ID"
        required: true
      - name: message
        type: string
        description: "Message content"
        required: true
      - name: username
        type: string
        description: "Display name for bot"
        required: false
      - name: icon_emoji
        type: string
        description: "Emoji for bot avatar"
        required: false
      - name: thread_ts
        type: string
        description: "Thread timestamp for replies"
        required: false
      - name: attachments
        type: string
        description: "JSON array of attachments"
        required: false
      - name: unfurl_links
        type: boolean
        description: "Unfurl URLs in message"
        required: false
        default: true
    tags: ["slack", "message", "chat", "team", "communication"]
    test_prompts:
      single:
        - "Post a message to the #general channel on Slack"
        - "Send a Slack DM to John"
        - "Notify the team on Slack about the deployment"
        - "Message the engineering channel"
      single_clear:
        - "I need to send a Slack message. Post a message to the #general channel on Slack"
        - "I need to send a Slack message. Send a Slack DM to John"
        - "I need to send a Slack message. Notify the team on Slack about the deployment"
        - "I need to send a Slack message. Message the engineering channel"

  - name: send_teams_message
    descriptions:
      minimal: "Send Teams message"
      short: "Send a message to Microsoft Teams"
      medium: "Send a message to a Microsoft Teams channel or chat with optional card formatting."
      long: "Post a message to Microsoft Teams. Supports channels, group chats, and 1:1 chats. Can include adaptive cards. Example: send_teams_message(channel='Engineering', message='Build completed!')."
      verbose: "Send messages to Microsoft Teams channels or chats. Supports: plain text, HTML formatting, Adaptive Cards for rich interactive content, file attachments, @mentions, and reactions. Example: send_teams_message(team='Engineering', channel='builds', message='Deployment successful!', card='{\"type\": \"AdaptiveCard\", \"body\": [{\"type\": \"TextBlock\", \"text\": \"Success!\"}]}', mentions=['john@company.com'], importance='high'). Note: Webhook URLs can be used for channel-only posting. Warning: Ensure app has required permissions in Teams admin center."
    parameters:
      - name: team
        type: string
        description: "Team name"
        required: false
      - name: channel
        type: string
        description: "Channel name"
        required: false
      - name: chat_id
        type: string
        description: "Chat ID for direct/group chats"
        required: false
      - name: message
        type: string
        description: "Message content"
        required: true
      - name: card
        type: string
        description: "Adaptive Card JSON"
        required: false
      - name: mentions
        type: array
        description: "Users to @mention"
        required: false
      - name: importance
        type: string
        description: "Message importance"
        required: false
        enum: ["normal", "high", "urgent"]
    tags: ["teams", "microsoft", "message", "chat", "communication"]
    test_prompts:
      single:
        - "Send a message to the Teams channel"
        - "Post to the Engineering team on Teams"
        - "Message the project channel on Microsoft Teams"
        - "Notify the team via Teams"
      single_clear:
        - "I need to send a Microsoft Teams message. Send a message to the Teams channel"
        - "I need to send a Microsoft Teams message. Post to the Engineering team on Teams"
        - "I need to send a Microsoft Teams message. Message the project channel on Microsoft Teams"
        - "I need to send a Microsoft Teams message. Notify the team via Teams"

  - name: send_push_notification
    descriptions:
      minimal: "Send push notification"
      short: "Send a push notification to devices"
      medium: "Send a push notification to mobile devices or web browsers with custom title and body."
      long: "Send push notifications to mobile apps or web browsers. Supports targeting by user ID, topic, or device token. Can include custom data. Example: send_push_notification(user_id='user123', title='New Message', body='You have a new message')."
      verbose: "Send push notifications to mobile devices (iOS, Android) or web browsers. Targeting options: user_id, device_token, topic/segment. Supports: custom sounds, badges, action buttons, images, deep links, silent notifications for background updates. Example: send_push_notification(user_id='user123', title='Order Shipped', body='Your order is on the way!', data='{\"order_id\": \"12345\"}', image_url='https://example.com/tracking.png', click_action='OPEN_ORDER', sound='notification.wav'). Note: Users must have granted notification permissions. Warning: Excessive notifications may cause users to disable them."
    parameters:
      - name: user_id
        type: string
        description: "Target user ID"
        required: false
      - name: device_token
        type: string
        description: "Specific device token"
        required: false
      - name: topic
        type: string
        description: "Topic for broadcast"
        required: false
      - name: title
        type: string
        description: "Notification title"
        required: true
      - name: body
        type: string
        description: "Notification body"
        required: true
      - name: data
        type: string
        description: "Custom data payload (JSON)"
        required: false
      - name: image_url
        type: string
        description: "Image URL"
        required: false
      - name: click_action
        type: string
        description: "Action on click"
        required: false
      - name: sound
        type: string
        description: "Notification sound"
        required: false
    tags: ["push", "notification", "mobile", "alert", "communication"]
    test_prompts:
      single:
        - "Send a push notification to the user"
        - "Notify all mobile users about the update"
        - "Send an alert to the customer's phone"
        - "Push a notification about the new feature"
      single_clear:
        - "I need to send a push notification. Send a push notification to the user"
        - "I need to send a push notification. Notify all mobile users about the update"
        - "I need to send a push notification. Send an alert to the customer's phone"
        - "I need to send a push notification. Push a notification about the new feature"

  - name: send_webhook
    descriptions:
      minimal: "Send webhook"
      short: "Send a webhook notification to a URL"
      medium: "Send a webhook HTTP request to notify an external service about an event."
      long: "Send a webhook notification to an external URL. Supports custom payloads and headers for integration with various services. Example: send_webhook(url='https://example.com/webhook', payload='{\"event\": \"user.created\"}')."
      verbose: "Send webhook HTTP requests to external services. Supports: custom JSON payloads, HTTP headers, signature generation (HMAC), retry logic, and timeout configuration. Common uses: Zapier, IFTTT, custom integrations. Example: send_webhook(url='https://example.com/hooks/events', payload='{\"event\": \"order.completed\", \"order_id\": \"12345\"}', headers='{\"X-Api-Key\": \"secret123\"}', signature_secret='webhook_secret', retry_count=3, timeout=30). Note: Include signature for secure webhook validation. Warning: Never include sensitive credentials in webhook payloads."
    parameters:
      - name: url
        type: string
        description: "Webhook destination URL"
        required: true
      - name: payload
        type: string
        description: "JSON payload"
        required: true
      - name: headers
        type: string
        description: "Custom HTTP headers (JSON)"
        required: false
      - name: method
        type: string
        description: "HTTP method"
        required: false
        default: "POST"
        enum: ["POST", "PUT", "PATCH"]
      - name: signature_secret
        type: string
        description: "Secret for HMAC signature"
        required: false
      - name: retry_count
        type: integer
        description: "Number of retries on failure"
        required: false
        default: 0
      - name: timeout
        type: integer
        description: "Timeout in seconds"
        required: false
        default: 30
    tags: ["webhook", "http", "integration", "notification", "api"]
    test_prompts:
      single:
        - "Send a webhook to the integration URL"
        - "Trigger the Zapier webhook"
        - "Notify the external service via webhook"
        - "Post event data to the webhook endpoint"
      single_clear:
        - "I need to send a webhook. Send a webhook to the integration URL"
        - "I need to send a webhook. Trigger the Zapier webhook"
        - "I need to send a webhook. Notify the external service via webhook"
        - "I need to send a webhook. Post event data to the webhook endpoint"

  - name: send_discord_message
    descriptions:
      minimal: "Send Discord message"
      short: "Send a message to a Discord channel"
      medium: "Send a message to a Discord server channel via webhook or bot with optional embeds."
      long: "Post a message to a Discord channel. Supports rich embeds, file attachments, and mentions. Example: send_discord_message(channel_id='123456789', message='Hello Discord!')."
      verbose: "Send messages to Discord channels via bot or webhook. Supports: plain text, rich embeds (with titles, colors, fields, images), file attachments, @mentions (users, roles, everyone), reactions, and message threading. Example: send_discord_message(channel_id='987654321', message='Build Status', embed='{\"title\": \"Deployment Complete\", \"color\": 3066993, \"fields\": [{\"name\": \"Status\", \"value\": \"Success\"}]}', username='Deploy Bot', avatar_url='https://example.com/bot.png'). Note: Webhooks have simpler setup but fewer features than bots. Warning: @everyone and @here mentions should be used sparingly."
    parameters:
      - name: channel_id
        type: string
        description: "Discord channel ID"
        required: false
      - name: webhook_url
        type: string
        description: "Discord webhook URL"
        required: false
      - name: message
        type: string
        description: "Message content"
        required: true
      - name: embed
        type: string
        description: "Rich embed JSON"
        required: false
      - name: username
        type: string
        description: "Override username"
        required: false
      - name: avatar_url
        type: string
        description: "Override avatar URL"
        required: false
      - name: tts
        type: boolean
        description: "Text-to-speech"
        required: false
        default: false
    tags: ["discord", "message", "chat", "gaming", "communication"]
    test_prompts:
      single:
        - "Send a message to the Discord server"
        - "Post an announcement to the Discord channel"
        - "Notify the gaming community on Discord"
        - "Send a Discord message with an embed"
      single_clear:
        - "I need to send a Discord message. Send a message to the Discord server"
        - "I need to send a Discord message. Post an announcement to the Discord channel"
        - "I need to send a Discord message. Notify the gaming community on Discord"
        - "I need to send a Discord message. Send a Discord message with an embed"

  - name: send_telegram_message
    descriptions:
      minimal: "Send Telegram message"
      short: "Send a message via Telegram"
      medium: "Send a message to a Telegram chat, group, or channel via bot API."
      long: "Send a Telegram message using a bot. Can send to individuals, groups, or channels. Supports text, photos, documents, and inline keyboards. Example: send_telegram_message(chat_id='123456789', message='Hello!')."
      verbose: "Send messages via Telegram Bot API. Supports: plain text, HTML/Markdown formatting, photos, documents, videos, location, inline keyboards, reply keyboards. Example: send_telegram_message(chat_id='123456789', message='*Order Confirmed*\\nOrder #12345', parse_mode='Markdown', reply_markup='{\"inline_keyboard\": [[{\"text\": \"Track Order\", \"url\": \"https://example.com/track\"}]]}', disable_notification=false). Note: Chat IDs for groups are negative numbers. Warning: Bots cannot initiate conversations; users must /start first."
    parameters:
      - name: chat_id
        type: string
        description: "Target chat ID"
        required: true
      - name: message
        type: string
        description: "Message text"
        required: true
      - name: parse_mode
        type: string
        description: "Text formatting mode"
        required: false
        enum: ["Markdown", "HTML", "MarkdownV2"]
      - name: reply_markup
        type: string
        description: "Keyboard markup JSON"
        required: false
      - name: disable_notification
        type: boolean
        description: "Send silently"
        required: false
        default: false
      - name: reply_to_message_id
        type: integer
        description: "Reply to specific message"
        required: false
    tags: ["telegram", "message", "chat", "bot", "communication"]
    test_prompts:
      single:
        - "Send a Telegram message to the user"
        - "Post to the Telegram channel"
        - "Message the Telegram group"
        - "Send a notification via Telegram bot"
      single_clear:
        - "I need to send a Telegram message. Send a Telegram message to the user"
        - "I need to send a Telegram message. Post to the Telegram channel"
        - "I need to send a Telegram message. Message the Telegram group"
        - "I need to send a Telegram message. Send a notification via Telegram bot"

  - name: create_message_template
    descriptions:
      minimal: "Create message template"
      short: "Create a reusable message template"
      medium: "Create a message template with variables for sending personalized messages at scale."
      long: "Create a reusable message template with placeholder variables. Useful for notifications, marketing, and transactional messages. Example: create_message_template(name='welcome', content='Hello {{name}}, welcome to {{company}}!')."
      verbose: "Create and store message templates with variable placeholders for personalized messaging. Templates support: Mustache/Handlebars syntax ({{variable}}), conditionals, loops, default values. Can be used across email, SMS, and push channels. Example: create_message_template(name='order_confirmation', channel='email', subject='Order #{{order_id}} Confirmed', content='<h1>Thanks {{customer_name}}!</h1><p>Your order of {{item_count}} items totaling ${{total}} is confirmed.</p>', variables=['order_id', 'customer_name', 'item_count', 'total']). Note: Templates are validated for proper variable syntax. Warning: Test templates thoroughly before using in production."
    parameters:
      - name: name
        type: string
        description: "Template name"
        required: true
      - name: channel
        type: string
        description: "Target channel"
        required: true
        enum: ["email", "sms", "push", "slack", "teams"]
      - name: subject
        type: string
        description: "Subject line (for email)"
        required: false
      - name: content
        type: string
        description: "Template content with {{variables}}"
        required: true
      - name: variables
        type: array
        description: "List of variable names"
        required: false
      - name: description
        type: string
        description: "Template description"
        required: false
    tags: ["template", "message", "personalization", "marketing"]
    test_prompts:
      single:
        - "Create an email template for order confirmations"
        - "Set up a welcome message template"
        - "Create a template for SMS notifications"
        - "Make a reusable message template"
      single_clear:
        - "I need to create a message template. Create an email template for order confirmations"
        - "I need to create a message template. Set up a welcome message template"
        - "I need to create a message template. Create a template for SMS notifications"
        - "I need to create a message template. Make a reusable message template"

  - name: schedule_message
    descriptions:
      minimal: "Schedule message"
      short: "Schedule a message for future delivery"
      medium: "Schedule a message to be sent at a specified future date and time."
      long: "Schedule any message type (email, SMS, push, etc.) for delivery at a future time. Supports timezone specification. Example: schedule_message(type='email', to='user@example.com', content='Reminder!', send_at='2024-01-15T10:00:00Z')."
      verbose: "Schedule messages for future delivery across any channel. Supports: one-time scheduled delivery, recurring schedules, timezone-aware delivery, cancellation before send. Useful for: reminders, drip campaigns, time-sensitive notifications. Example: schedule_message(type='email', to=['user@example.com'], subject='Meeting Reminder', content='Your meeting starts in 1 hour', send_at='2024-01-15T09:00:00', timezone='America/New_York', recurring='weekly', recurrence_count=4). Note: Scheduled time is converted to UTC internally. Warning: Verify timezone to avoid sending at wrong times."
    parameters:
      - name: type
        type: string
        description: "Message type"
        required: true
        enum: ["email", "sms", "push", "slack", "teams"]
      - name: to
        type: string
        description: "Recipient(s)"
        required: true
      - name: subject
        type: string
        description: "Subject (for email)"
        required: false
      - name: content
        type: string
        description: "Message content"
        required: true
      - name: send_at
        type: string
        description: "Scheduled send time (ISO 8601)"
        required: true
      - name: timezone
        type: string
        description: "Timezone for send_at"
        required: false
        default: "UTC"
      - name: recurring
        type: string
        description: "Recurrence pattern"
        required: false
        enum: ["none", "daily", "weekly", "monthly"]
      - name: recurrence_count
        type: integer
        description: "Number of recurrences"
        required: false
    tags: ["schedule", "message", "automation", "future", "timing"]
    test_prompts:
      single:
        - "Schedule an email for tomorrow at 9am"
        - "Send a reminder SMS next Monday"
        - "Schedule the newsletter for next week"
        - "Set up a recurring weekly email"
      single_clear:
        - "I need to schedule a message. Schedule an email for tomorrow at 9am"
        - "I need to schedule a message. Send a reminder SMS next Monday"
        - "I need to schedule a message. Schedule the newsletter for next week"
        - "I need to schedule a message. Set up a recurring weekly email"
  - name: send_whatsapp_message
    descriptions:
      minimal: "Send WhatsApp"
      short: "Send a WhatsApp message"
      medium: "Send a WhatsApp message to a phone number using the Business API."
      long: "Send WhatsApp messages via the Business API. Supports text, media, templates, and interactive messages. Example: send_whatsapp_message(phone='+1234567890', type='text', content='Hello!')."
      verbose: "Send WhatsApp messages through the WhatsApp Business API. Message types: text, image, document, audio, video, location, contacts, interactive (buttons, lists), template (pre-approved). Requirements: verified business account, phone number opted-in for templates. Example: send_whatsapp_message(phone='+14155551234', type='template', template_name='order_update', template_params='[\"John\", \"ORD-123\", \"shipped\"]', language='en_US'). Note: Template messages required for initiating conversations. Warning: Non-template messages only within 24-hour window."
    parameters:
      - name: phone
        type: string
        description: "Phone number with country code"
        required: true
      - name: type
        type: string
        description: "Message type"
        required: true
        enum: ["text", "image", "document", "audio", "video", "location", "template", "interactive"]
      - name: content
        type: string
        description: "Text content (for text type)"
        required: false
      - name: media_url
        type: string
        description: "Media URL (for media types)"
        required: false
      - name: template_name
        type: string
        description: "Template name"
        required: false
      - name: template_params
        type: string
        description: "JSON template parameters"
        required: false
      - name: language
        type: string
        description: "Language code"
        required: false
        default: "en_US"
    tags: ["whatsapp", "message", "mobile", "chat", "business"]
    test_prompts:
      single:
        - "Send a WhatsApp message"
        - "Message customer on WhatsApp"
        - "Send WhatsApp order confirmation"
        - "Send WhatsApp template message"
      single_clear:
        - "I need to send a WhatsApp message. Send a WhatsApp message"
        - "I need to send a WhatsApp message. Message customer on WhatsApp"
        - "I need to send a WhatsApp message. Send WhatsApp order confirmation"
        - "I need to send a WhatsApp message. Send WhatsApp template message"

  - name: broadcast_message
    descriptions:
      minimal: "Broadcast message"
      short: "Broadcast a message to multiple recipients"
      medium: "Send a broadcast message to a list of recipients or a segment."
      long: "Broadcast messages to multiple recipients at once. Supports segmentation and personalization. Example: broadcast_message(channel='email', segment='active_users', template='monthly_update')."
      verbose: "Send broadcast messages to large audiences. Targeting: recipient list, segments, all subscribers. Features: personalization, scheduling, throttling, tracking. Channels: email, SMS, push, in-app. Example: broadcast_message(channel='email', segment='premium_customers', template='new_feature_announcement', personalization='{\"company_name\": \"Acme\"}', send_at='2024-02-01T10:00:00Z', throttle_per_hour=10000). Returns: broadcast_id, estimated_recipients, scheduled_time. Note: Large broadcasts are queued and sent gradually. Warning: Verify segment targeting before sending to avoid unintended recipients."
    parameters:
      - name: channel
        type: string
        description: "Message channel"
        required: true
        enum: ["email", "sms", "push", "in_app"]
      - name: segment
        type: string
        description: "Target segment ID/name"
        required: false
      - name: recipient_list
        type: string
        description: "JSON array of recipients"
        required: false
      - name: template
        type: string
        description: "Message template name"
        required: true
      - name: personalization
        type: string
        description: "JSON personalization data"
        required: false
      - name: send_at
        type: string
        description: "Scheduled send time"
        required: false
      - name: throttle_per_hour
        type: integer
        description: "Messages per hour limit"
        required: false
    tags: ["broadcast", "bulk", "campaign", "mass", "notification"]
    test_prompts:
