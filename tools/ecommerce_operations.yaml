  - name: generate_product_feed
    descriptions:
      minimal: "Generate feed"
      short: "Generate product feed"
      medium: "Generate product feeds for marketplaces and advertising platforms."
      long: "Create product feeds for Google Shopping, Facebook, Amazon, etc. Example: generate_product_feed(platform='google_shopping', format='xml')."
      verbose: "Product feed generation for marketplaces. Platforms: Google Shopping, Facebook/Instagram, Amazon, Pinterest, Bing. Formats: XML, CSV, TSV, JSON. Features: attribute mapping, category mapping, custom labels, feed optimization. Example: generate_product_feed(platform='google_shopping', format='xml', filter='{\"in_stock\": true, \"price_gt\": 10}', optimize_titles=true, include_variants=true, output='google_feed.xml'). Scheduled: generate_product_feed(platform='facebook', schedule='daily', upload_url='ftp://...'). Note: Feed requirements vary by platform. Warning: Incorrect feeds may cause product disapprovals."
    parameters:
      - name: platform
        type: string
        description: "Target platform"
        required: true
        enum: ["google_shopping", "facebook", "amazon", "pinterest", "bing", "custom"]
      - name: format
        type: string
        description: "Feed format"
        required: false
        default: "xml"
        enum: ["xml", "csv", "tsv", "json"]
      - name: filter
        type: string
        description: "JSON product filter"
        required: false
      - name: optimize_titles
        type: boolean
        description: "Optimize product titles"
        required: false
        default: false
      - name: include_variants
        type: boolean
        description: "Include product variants"
        required: false
        default: true
      - name: output
        type: string
        description: "Output file path"
        required: false
      - name: schedule
        type: string
        description: "Generation schedule"
        required: false
