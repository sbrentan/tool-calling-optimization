      verbose: "Loyalty program management. Features: point accrual, tier levels, rewards catalog, referral bonuses, birthday rewards. Actions: configure, add_points, redeem, list_members, create_reward. Tiers: based on spend or points, with multipliers and perks. Example: manage_loyalty_program(action='configure', points_per_dollar=10, redemption_rate=100, tiers='[{\"name\": \"Silver\", \"min_points\": 0}, {\"name\": \"Gold\", \"min_points\": 1000, \"multiplier\": 1.5}, {\"name\": \"Platinum\", \"min_points\": 5000, \"multiplier\": 2}]'). Note: Points expiration encourages engagement. Warning: Program changes may affect existing member expectations."
    parameters:
      - name: action
        type: string
        description: "Loyalty action"
        required: true
        enum: ["configure", "add_points", "deduct_points", "redeem", "list_members", "create_reward", "get_balance"]
