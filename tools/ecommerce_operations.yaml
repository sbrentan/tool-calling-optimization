  - name: manage_subscriptions
    descriptions:
      minimal: "Manage subscriptions"
      short: "Manage product subscriptions"
      medium: "Create and manage recurring product subscriptions."
      long: "Handle subscription products with recurring billing. Example: manage_subscriptions(action='create', customer_id='CUST-123', product_id='PROD-456', frequency='monthly')."
      verbose: "Subscription and recurring order management. Actions: create, update, pause, resume, cancel, list, skip_next. Features: flexible frequencies, discount for subscribers, swap products, prepaid options. Example: manage_subscriptions(action='create', customer_id='CUST-123', products='[{\"id\": \"PROD-456\", \"quantity\": 2}]', frequency='monthly', discount_percent=15, billing_day=1, prepaid_months=3). Management: manage_subscriptions(action='swap', subscription_id='SUB-789', old_product='PROD-456', new_product='PROD-789'). Note: Clear cancellation process improves trust. Warning: Subscription changes should notify customers."
    parameters:
      - name: action
        type: string
        description: "Subscription action"
        required: true
        enum: ["create", "update", "pause", "resume", "cancel", "list", "skip_next", "swap"]
      - name: subscription_id
        type: string
        description: "Subscription ID"
        required: false
      - name: customer_id
        type: string
        description: "Customer ID"
        required: false
      - name: products
        type: string
        description: "JSON array of products"
        required: false
      - name: frequency
        type: string
        description: "Delivery frequency"
        required: false
        enum: ["weekly", "biweekly", "monthly", "quarterly", "annually"]
      - name: discount_percent
        type: number
        description: "Subscriber discount"
        required: false
      - name: billing_day
        type: integer
        description: "Day of month for billing"
        required: false
    tags: ["ecommerce", "subscription", "recurring", "billing", "products"]
    test_prompts:
      single:
        - "Create subscription"
        - "Pause subscription"
        - "Cancel recurring order"
        - "Skip next delivery"
