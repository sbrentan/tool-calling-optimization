category: ecommerce_operations
description: E-commerce and shopping operations
tools:
  - name: create_product
    descriptions:
      minimal: "Create product"
      short: "Create a new product listing"
      medium: "Create a new product in the e-commerce catalog with details and pricing."
      long: "Create a product listing with name, description, price, images, and inventory. Example: create_product(name='T-Shirt', price=29.99, sku='TSH-001', category='Apparel')."
      verbose: "Create a new product in the e-commerce catalog. Fields: name, description, price, compare_at_price (for sales), SKU, barcode, category, tags, images, variants (size/color), inventory, weight, dimensions. Example: create_product(name='Classic T-Shirt', description='100% cotton tee', price=29.99, compare_at_price=39.99, sku='TSH-BLK-M', category='Apparel', variants='[{\"size\": \"M\", \"color\": \"Black\", \"inventory\": 50}]', images='[\"tshirt1.jpg\"]'). Note: SKU must be unique. Warning: Publishing makes product immediately visible to customers."
    parameters:
      - name: name
        type: string
        description: "Product name"
        required: true
      - name: description
        type: string
        description: "Product description"
        required: false
      - name: price
        type: number
        description: "Product price"
        required: true
      - name: sku
        type: string
        description: "Stock keeping unit"
        required: true
      - name: category
        type: string
        description: "Product category"
        required: false
      - name: inventory
        type: integer
        description: "Initial inventory count"
        required: false
        default: 0
      - name: images
        type: string
        description: "JSON array of image URLs"
        required: false
      - name: published
        type: boolean
        description: "Publish immediately"
        required: false
        default: false
    tags: ["ecommerce", "product", "create", "catalog", "listing"]
    test_prompts:
      single:
        - "Create a new product"
        - "Add a product to the catalog"
        - "List a new item for sale"
        - "Create a product listing"
      single_clear:
        - "I need to create a new product. Create a new product"
        - "I need to create a new product. Add a product to the catalog"
        - "I need to create a new product. List a new item for sale"
        - "I need to create a new product. Create a product listing"

  - name: update_inventory
    descriptions:
      minimal: "Update inventory"
      short: "Update product inventory"
      medium: "Update the inventory quantity for a product or variant."
      long: "Update inventory levels for products. Supports absolute set or relative adjustment. Example: update_inventory(sku='TSH-001', quantity=100) or update_inventory(sku='TSH-001', adjustment=-5)."
      verbose: "Update product inventory quantities. Modes: 'set' (absolute value), 'adjust' (relative +/-). Supports: multiple locations, variant-level inventory, reason tracking. Example: update_inventory(sku='TSH-BLK-M', quantity=100, location='warehouse_1', reason='restock') or update_inventory(sku='TSH-BLK-M', adjustment=-1, reason='sale'). Note: Negative inventory allowed if overselling enabled. Warning: Inventory changes affect availability immediately."
    parameters:
      - name: sku
        type: string
        description: "Product SKU"
        required: true
      - name: quantity
        type: integer
        description: "New quantity (for set mode)"
        required: false
      - name: adjustment
        type: integer
        description: "Quantity adjustment (+/-)"
        required: false
      - name: location
        type: string
        description: "Inventory location"
        required: false
        default: "default"
      - name: reason
        type: string
        description: "Reason for change"
        required: false
    tags: ["ecommerce", "inventory", "stock", "update", "quantity"]
    test_prompts:
      single:
        - "Update the inventory count"
        - "Add 50 units to stock"
        - "Reduce inventory by 10"
        - "Set stock level to 100"
      single_clear:
        - "I need to manage product inventory. Update the inventory count"
        - "I need to manage product inventory. Add 50 units to stock"
        - "I need to manage product inventory. Reduce inventory by 10"
        - "I need to manage product inventory. Set stock level to 100"

  - name: create_order
    descriptions:
      minimal: "Create order"
      short: "Create a new order"
      medium: "Create a new customer order with products and shipping details."
      long: "Create an order with line items, customer info, and shipping. Example: create_order(customer_id='cust123', items='[{\"sku\": \"TSH-001\", \"quantity\": 2}]', shipping_address='{...}')."
      verbose: "Create a new e-commerce order. Components: line items (products, quantities, prices), customer, shipping address, billing address, shipping method, payment, discounts. Example: create_order(customer_id='cust_abc', items='[{\"sku\": \"TSH-BLK-M\", \"quantity\": 2, \"price\": 29.99}]', shipping_address='{\"street\": \"123 Main St\", \"city\": \"NYC\", \"zip\": \"10001\"}', shipping_method='standard', discount_code='SAVE10'). Note: Inventory is reserved upon order creation. Warning: Payment must be captured separately or order may expire."
    parameters:
      - name: customer_id
        type: string
        description: "Customer identifier"
        required: true
      - name: items
        type: string
        description: "JSON array of line items"
        required: true
      - name: shipping_address
        type: string
        description: "JSON shipping address"
        required: true
      - name: billing_address
        type: string
        description: "JSON billing address (if different)"
        required: false
      - name: shipping_method
        type: string
        description: "Shipping method"
        required: false
        default: "standard"
      - name: discount_code
        type: string
        description: "Discount/coupon code"
        required: false
      - name: notes
        type: string
        description: "Order notes"
        required: false
    tags: ["ecommerce", "order", "create", "purchase", "checkout"]
    test_prompts:
      single:
        - "Create a new order"
        - "Place an order for this customer"
        - "Process the checkout"
        - "Create a purchase order"
      single_clear:
        - "I need to create a new order. Create a new order"
        - "I need to create a new order. Place an order for this customer"
        - "I need to create a new order. Process the checkout"
        - "I need to create a new order. Create a purchase order"

  - name: update_order_status
    descriptions:
      minimal: "Update order"
      short: "Update order status"
      medium: "Update the status of an existing order."
      long: "Update order status through the fulfillment lifecycle. Example: update_order_status(order_id='ORD-123', status='shipped', tracking='1Z999...')."
      verbose: "Update order status and fulfillment information. Statuses: 'pending', 'confirmed', 'processing', 'shipped', 'delivered', 'cancelled', 'refunded'. Shipping updates: carrier, tracking number, estimated delivery. Example: update_order_status(order_id='ORD-123', status='shipped', carrier='UPS', tracking='1Z999AA10123456784', notify_customer=true). Note: Status changes may trigger customer notifications. Warning: Cancellation after shipment requires return process."
    parameters:
      - name: order_id
        type: string
        description: "Order identifier"
        required: true
      - name: status
        type: string
        description: "New order status"
        required: true
        enum: ["pending", "confirmed", "processing", "shipped", "delivered", "cancelled", "refunded"]
      - name: carrier
        type: string
        description: "Shipping carrier"
        required: false
      - name: tracking
        type: string
        description: "Tracking number"
        required: false
      - name: notify_customer
        type: boolean
        description: "Send notification to customer"
        required: false
        default: true
    tags: ["ecommerce", "order", "status", "update", "fulfillment"]
    test_prompts:
      single:
        - "Mark the order as shipped"
        - "Update order status to delivered"
        - "Cancel the order"
        - "Add tracking to the order"
      single_clear:
        - "I need to update the order status. Mark the order as shipped"
        - "I need to update the order status. Update order status to delivered"
        - "I need to update the order status. Cancel the order"
        - "I need to update the order status. Add tracking to the order"

  - name: apply_discount
    descriptions:
      minimal: "Apply discount"
      short: "Apply a discount code"
      medium: "Apply a discount or coupon code to a cart or order."
      long: "Apply discount codes to carts or orders. Validates code and calculates discount. Example: apply_discount(cart_id='cart123', code='SAVE20')."
      verbose: "Apply discount codes to shopping carts or orders. Discount types: percentage, fixed amount, free shipping, buy X get Y. Validates: code existence, expiration, usage limits, minimum order, eligible products. Example: apply_discount(cart_id='cart_abc', code='SUMMER25') returns {valid: true, discount_type: 'percentage', value: 25, savings: 50.00}. Note: Some discounts cannot stack. Warning: Invalid or expired codes return error."
    parameters:
      - name: cart_id
        type: string
        description: "Cart identifier"
        required: false
      - name: order_id
        type: string
        description: "Order identifier"
        required: false
      - name: code
        type: string
        description: "Discount/coupon code"
        required: true
    tags: ["ecommerce", "discount", "coupon", "promo", "savings"]
    test_prompts:
      single:
        - "Apply discount code SAVE20"
        - "Use this coupon"
        - "Add a promo code"
        - "Apply the discount"
      single_clear:
        - "Please apply a discount to my cart. Apply discount code SAVE20"
        - "Please apply a discount to my cart. Use this coupon"
        - "Please apply a discount to my cart. Add a promo code"
        - "Please apply a discount to my cart. Apply the discount"

  - name: create_discount
    descriptions:
      minimal: "Create discount"
      short: "Create a discount code"
      medium: "Create a new discount or coupon code with rules and limits."
      long: "Create discount codes for promotions. Define type, value, conditions, and usage limits. Example: create_discount(code='SUMMER25', type='percentage', value=25, min_order=50)."
      verbose: "Create promotional discount codes. Types: 'percentage', 'fixed', 'free_shipping', 'bogo' (buy one get one). Conditions: minimum order, eligible products/categories, customer segments, first order only. Limits: total uses, per-customer uses, date range. Example: create_discount(code='VIP30', type='percentage', value=30, min_order=100, eligible_categories='[\"premium\"]', max_uses=100, starts_at='2024-01-01', ends_at='2024-01-31'). Note: Codes are case-insensitive by default. Warning: Generous discounts may impact margins."
    parameters:
      - name: code
        type: string
        description: "Discount code"
        required: true
      - name: type
        type: string
        description: "Discount type"
        required: true
        enum: ["percentage", "fixed", "free_shipping", "bogo"]
      - name: value
        type: number
        description: "Discount value (percent or amount)"
        required: true
      - name: min_order
        type: number
        description: "Minimum order amount"
        required: false
      - name: max_uses
        type: integer
        description: "Maximum total uses"
        required: false
      - name: starts_at
        type: string
        description: "Start date (ISO format)"
        required: false
      - name: ends_at
        type: string
        description: "End date (ISO format)"
        required: false
    tags: ["ecommerce", "discount", "create", "coupon", "promotion"]
    test_prompts:
      single:
        - "Create a 20% off coupon"
        - "Make a discount code"
        - "Set up a free shipping promo"
        - "Create a buy-one-get-one deal"
      single_clear:
        - "I need to create a new discount code. Create a 20% off coupon"
        - "I need to create a new discount code. Make a discount code"
        - "I need to create a new discount code. Set up a free shipping promo"
        - "I need to create a new discount code. Create a buy-one-get-one deal"

  - name: manage_cart
    descriptions:
      minimal: "Manage cart"
      short: "Manage shopping cart"
      medium: "Add, remove, or update items in a shopping cart."
      long: "Manage shopping cart contents. Add items, update quantities, remove items, or clear cart. Example: manage_cart(cart_id='cart123', action='add', sku='TSH-001', quantity=2)."
      verbose: "Manage shopping cart operations. Actions: 'add' (add item), 'update' (change quantity), 'remove' (remove item), 'clear' (empty cart), 'get' (retrieve cart). Supports: product variants, quantity limits, saved for later. Example: manage_cart(cart_id='cart_abc', action='add', sku='TSH-BLK-M', quantity=2) returns updated cart with totals. Note: Cart persists across sessions. Warning: Out-of-stock items may be removed during checkout."
    parameters:
      - name: cart_id
        type: string
        description: "Cart identifier"
        required: true
      - name: action
        type: string
        description: "Cart action"
        required: true
        enum: ["add", "update", "remove", "clear", "get"]
      - name: sku
        type: string
        description: "Product SKU"
        required: false
      - name: quantity
        type: integer
        description: "Quantity"
        required: false
    tags: ["ecommerce", "cart", "shopping", "add", "remove"]
    test_prompts:
      single:
        - "Add this item to cart"
        - "Update cart quantity"
        - "Remove item from cart"
        - "Clear the shopping cart"
      single_clear:
        - "I need to manage my shopping cart. Add this item to cart"
        - "I need to manage my shopping cart. Update cart quantity"
        - "I need to manage my shopping cart. Remove item from cart"
        - "I need to manage my shopping cart. Clear the shopping cart"

  - name: calculate_shipping
    descriptions:
      minimal: "Calculate shipping"
      short: "Calculate shipping rates"
      medium: "Calculate available shipping options and rates for an order."
      long: "Calculate shipping rates based on destination, weight, and carrier options. Example: calculate_shipping(cart_id='cart123', destination='{\"zip\": \"10001\", \"country\": \"US\"}')."
      verbose: "Calculate shipping rates and delivery estimates. Inputs: cart/order items, destination address, weight, dimensions. Returns: available carriers, service levels, rates, estimated delivery dates. Example: calculate_shipping(cart_id='cart_abc', destination='{\"zip\": \"10001\", \"country\": \"US\"}') returns [{carrier: 'USPS', service: 'Priority', rate: 7.99, days: '2-3'}, {carrier: 'UPS', service: 'Ground', rate: 5.99, days: '5-7'}]. Note: Rates may vary by time and carrier availability. Warning: Actual rates charged may differ from estimates."
    parameters:
      - name: cart_id
        type: string
        description: "Cart identifier"
        required: false
      - name: items
        type: string
        description: "JSON array of items with weights"
        required: false
      - name: destination
        type: string
        description: "JSON destination address"
        required: true
      - name: origin
        type: string
        description: "JSON origin address"
        required: false
    tags: ["ecommerce", "shipping", "rates", "calculate", "delivery"]
    test_prompts:
      single:
        - "Calculate shipping costs"
        - "What are the shipping options?"
        - "Get shipping rates for this order"
        - "How much is delivery?"
      single_clear:
        - "I need to calculate shipping rates. Calculate shipping costs"
        - "I need to calculate shipping rates. What are the shipping options?"
        - "I need to calculate shipping rates. Get shipping rates for this order"
        - "I need to calculate shipping rates. How much is delivery?"

  - name: process_return
    descriptions:
      minimal: "Process return"
      short: "Process a product return"
      medium: "Initiate or process a product return and refund."
      long: "Process customer returns. Create return authorization, track return shipment, and issue refunds. Example: process_return(order_id='ORD-123', items='[{\"sku\": \"TSH-001\", \"quantity\": 1, \"reason\": \"wrong_size\"}]')."
      verbose: "Process product returns and refunds. Steps: create RMA (return authorization), generate return label, receive items, inspect, process refund. Return types: refund, exchange, store credit. Example: process_return(order_id='ORD-123', items='[{\"sku\": \"TSH-BLK-M\", \"quantity\": 1, \"reason\": \"wrong_size\"}]', refund_method='original_payment', restock=true). Note: Return policies may restrict eligible items. Warning: Refunds to original payment may take 5-10 business days."
    parameters:
      - name: order_id
        type: string
        description: "Original order ID"
        required: true
      - name: items
        type: string
        description: "JSON array of items to return"
        required: true
      - name: reason
        type: string
        description: "Return reason"
        required: false
      - name: refund_method
        type: string
        description: "Refund method"
        required: false
        default: "original_payment"
        enum: ["original_payment", "store_credit", "exchange"]
      - name: restock
        type: boolean
        description: "Restock returned items"
        required: false
        default: true
    tags: ["ecommerce", "return", "refund", "rma", "exchange"]
    test_prompts:
      single:
        - "Process a return for this order"
        - "Initiate a refund"
        - "Start a return request"
        - "Exchange this item"
      single_clear:
        - "I need to process a product return. Process a return for this order"
        - "I need to process a product return. Initiate a refund"
        - "I need to process a product return. Start a return request"
        - "I need to process a product return. Exchange this item"

  - name: search_products
    descriptions:
      minimal: "Search products"
      short: "Search the product catalog"
      medium: "Search for products by keyword, category, or filters."
      long: "Search the product catalog with filters and sorting. Returns matching products with pagination. Example: search_products(query='t-shirt', category='apparel', max_price=50)."
      verbose: "Search and filter the product catalog. Filters: keyword, category, price range, attributes, availability, ratings. Sorting: relevance, price (asc/desc), newest, best-selling, rating. Features: faceted search, autocomplete, spell correction. Example: search_products(query='wireless headphones', category='electronics', min_price=50, max_price=200, in_stock=true, sort='rating', limit=20). Note: Full-text search supports stemming and synonyms. Warning: Large result sets should use pagination."
    parameters:
      - name: query
        type: string
        description: "Search query"
        required: false
      - name: category
        type: string
        description: "Product category"
        required: false
      - name: min_price
        type: number
        description: "Minimum price"
        required: false
      - name: max_price
        type: number
        description: "Maximum price"
        required: false
      - name: in_stock
        type: boolean
        description: "Only show in-stock items"
        required: false
        default: true
      - name: sort
        type: string
        description: "Sort order"
        required: false
        default: "relevance"
        enum: ["relevance", "price_asc", "price_desc", "newest", "rating"]
      - name: limit
        type: integer
        description: "Results per page"
        required: false
        default: 20
    tags: ["ecommerce", "search", "products", "catalog", "filter"]
    test_prompts:
      single:
        - "Search for t-shirts under $30"
        - "Find products in electronics"
        - "Show me wireless headphones"
        - "Search the catalog"
      single_clear:
        - "I need to search for products. Search for t-shirts under $30"
        - "I need to search for products. Find products in electronics"
        - "I need to search for products. Show me wireless headphones"
        - "I need to search for products. Search the catalog"
  - name: create_discount_code
    descriptions:
      minimal: "Create discount"
      short: "Create a discount code or coupon"
      medium: "Create a discount code with percentage or fixed amount off for customers."
      long: "Create a promotional discount code. Configure discount type, amount, conditions, and expiration. Example: create_discount_code(code='SAVE20', type='percentage', value=20, expires='2024-12-31')."
      verbose: "Create discount codes for promotions. Types: 'percentage' (% off), 'fixed_amount' ($ off), 'free_shipping', 'buy_x_get_y'. Conditions: minimum purchase, specific products/categories, customer segments, first-order only, single/multi-use. Example: create_discount_code(code='WELCOME15', type='percentage', value=15, min_purchase=50, first_order_only=true, usage_limit=1000, expires='2024-03-31', applies_to='[\"category:apparel\"]'). Note: Codes are case-insensitive by default. Warning: No usage limit means unlimited redemptions."
    parameters:
      - name: code
        type: string
        description: "Discount code string"
        required: true
      - name: type
        type: string
        description: "Discount type"
        required: true
        enum: ["percentage", "fixed_amount", "free_shipping", "buy_x_get_y"]
      - name: value
        type: number
        description: "Discount value (% or amount)"
        required: true
      - name: min_purchase
        type: number
        description: "Minimum order amount"
        required: false
      - name: usage_limit
        type: integer
        description: "Total redemption limit"
        required: false
      - name: per_customer_limit
        type: integer
        description: "Uses per customer"
        required: false
        default: 1
      - name: expires
        type: string
        description: "Expiration date"
        required: false
      - name: applies_to
        type: string
        description: "JSON array of applicable items"
        required: false
    tags: ["ecommerce", "discount", "coupon", "promotion", "code"]
    test_prompts:
      single:
        - "Create a 20% off discount code"
        - "Make a coupon for free shipping"
        - "Create a promo code for new customers"
        - "Set up a $10 off coupon"
      single_clear:
        - "I need to create a discount code. Create a 20% off discount code"
        - "I need to create a discount code. Make a coupon for free shipping"
        - "I need to create a discount code. Create a promo code for new customers"
        - "I need to create a discount code. Set up a $10 off coupon"

  - name: process_return
    descriptions:
      minimal: "Process return"
      short: "Process a product return"
      medium: "Process a return or exchange for an order item."
      long: "Process a return request. Approve, create shipping label, and handle refund or exchange. Example: process_return(order_id='ORD-123', items='[{\"sku\": \"TSH-001\", \"quantity\": 1}]', reason='wrong_size')."
      verbose: "Handle product returns and exchanges. Actions: initiate return, approve/reject, generate return label, receive item, process refund/exchange. Return reasons: defective, wrong_size, not_as_described, changed_mind, damaged, other. Example: process_return(order_id='ORD-456', items='[{\"sku\": \"TSH-BLK-M\", \"quantity\": 1, \"reason\": \"wrong_size\"}]', action='approve', generate_label=true, refund_method='original_payment', restock=true). Note: Return window typically 30 days. Warning: Refunds may take 5-10 business days to process."
    parameters:
      - name: order_id
        type: string
        description: "Original order ID"
        required: true
      - name: items
        type: string
        description: "JSON array of items to return"
        required: true
      - name: reason
        type: string
        description: "Return reason"
        required: true
        enum: ["defective", "wrong_size", "not_as_described", "changed_mind", "damaged", "other"]
      - name: action
        type: string
        description: "Return action"
        required: false
        default: "initiate"
        enum: ["initiate", "approve", "reject", "receive", "complete"]
      - name: generate_label
        type: boolean
        description: "Generate return shipping label"
        required: false
        default: true
      - name: refund_method
        type: string
        description: "Refund method"
        required: false
        enum: ["original_payment", "store_credit", "exchange"]
      - name: restock
        type: boolean
        description: "Add returned items back to inventory"
        required: false
        default: true
    tags: ["ecommerce", "return", "refund", "exchange", "rma"]
    test_prompts:
      single:
        - "Process a return for order 12345"
        - "Initiate a refund for wrong size"
        - "Generate return label for customer"
        - "Handle product return request"
      single_clear:
        - "I need to process a product return. Process a return for order 12345"
        - "I need to process a product return. Initiate a refund for wrong size"
        - "I need to process a product return. Generate return label for customer"
        - "I need to process a product return. Handle product return request"

  - name: calculate_shipping
    descriptions:
      minimal: "Calculate shipping"
      short: "Calculate shipping costs and options"
      medium: "Calculate shipping rates for an order based on destination and items."
      long: "Calculate available shipping options and rates. Returns carriers, methods, costs, and delivery estimates. Example: calculate_shipping(items='[{\"sku\": \"TSH-001\", \"quantity\": 2}]', destination='{\"zip\": \"10001\", \"country\": \"US\"}')."
      verbose: "Calculate shipping rates and delivery options. Inputs: items (with weights/dimensions), origin, destination, preferences. Returns: available carriers, service levels, costs, estimated delivery dates. Features: real-time carrier rates, insurance options, signature requirements. Example: calculate_shipping(items='[{\"sku\": \"LAPTOP-1\", \"quantity\": 1, \"weight\": 5, \"value\": 999}]', destination='{\"street\": \"123 Main St\", \"city\": \"NYC\", \"state\": \"NY\", \"zip\": \"10001\", \"country\": \"US\"}', insurance=true, signature_required=true). Note: Rates may vary by carrier availability. Warning: Displayed rates are estimates; final rates calculated at fulfillment."
    parameters:
      - name: items
        type: string
        description: "JSON array of items with quantities"
        required: true
      - name: destination
        type: string
        description: "JSON shipping destination"
        required: true
      - name: origin
        type: string
        description: "JSON shipping origin"
        required: false
      - name: insurance
        type: boolean
        description: "Include shipping insurance"
        required: false
        default: false
      - name: signature_required
        type: boolean
        description: "Require delivery signature"
        required: false
        default: false
    tags: ["ecommerce", "shipping", "rates", "delivery", "calculate"]
    test_prompts:
      single:
        - "Calculate shipping to New York"
        - "Get shipping rates for my order"
        - "How much is shipping to California?"
        - "Show shipping options and costs"
      single_clear:
        - "I need to calculate shipping rates. Calculate shipping to New York"
        - "I need to calculate shipping rates. Get shipping rates for my order"
        - "I need to calculate shipping rates. How much is shipping to California?"
        - "I need to calculate shipping rates. Show shipping options and costs"

  - name: manage_wishlist
    descriptions:
      minimal: "Manage wishlist"
      short: "Add or remove items from wishlist"
      medium: "Manage a customer's wishlist by adding, removing, or retrieving saved items."
      long: "Manage customer wishlists. Add or remove products, view wishlist, check availability, move to cart. Example: manage_wishlist(customer_id='cust123', action='add', product_id='PROD-456')."
