        - "Initialize Terraform"
        - "Destroy test environment"

  - name: configure_auto_scaling
    descriptions:
      minimal: "Configure auto scaling"
      short: "Configure auto scaling"
      medium: "Set up auto scaling policies for compute resources."
      long: "Configure auto scaling based on metrics and schedules. Example: configure_auto_scaling(group='web-asg', min=2, max=10, target_cpu=70)."
      verbose: "Auto scaling configuration for compute resources. Scaling types: target tracking, step scaling, scheduled. Metrics: CPU, memory, request count, custom. Features: cooldown periods, warm-up time, predictive scaling. Example: configure_auto_scaling(group='api-servers', min_capacity=2, max_capacity=20, target_tracking='{\"metric\": \"cpu\", \"target\": 60}', scale_in_cooldown=300, scale_out_cooldown=60, warmup=120). Scheduled: configure_auto_scaling(group='batch-workers', scheduled='{\"scale_up\": \"0 8 * * 1-5\", \"scale_down\": \"0 20 * * 1-5\"}'). Note: Set appropriate cooldown to avoid thrashing. Warning: Max capacity limits unexpected cost spikes."
    parameters:
      - name: group
        type: string
        description: "Auto scaling group name"
        required: true
      - name: min_capacity
        type: integer
        description: "Minimum instances"
        required: false
      - name: max_capacity
        type: integer
        description: "Maximum instances"
        required: false
      - name: desired_capacity
        type: integer
        description: "Desired instances"
        required: false
      - name: target_tracking
        type: string
        description: "JSON target tracking config"
        required: false
      - name: scheduled
        type: string
        description: "JSON scheduled scaling"
        required: false
      - name: scale_in_cooldown
        type: integer
        description: "Scale-in cooldown seconds"
        required: false
        default: 300
      - name: scale_out_cooldown
        type: integer
        description: "Scale-out cooldown seconds"
        required: false
        default: 60
    tags: ["devops", "autoscaling", "scaling", "capacity", "compute"]
    test_prompts:
      single:
        - "Set up auto scaling"
        - "Configure scale based on CPU"
        - "Set min and max instances"
        - "Schedule scaling for business hours"

  - name: manage_secrets
    descriptions:
      minimal: "Manage secrets"
      short: "Manage secrets and credentials"
      medium: "Store and retrieve secrets securely using a secrets manager."
      long: "Manage application secrets with encryption and access control. Example: manage_secrets(action='create', name='db-password', value='secret123', path='/prod/database')."
      verbose: "Secrets management for applications. Stores: AWS Secrets Manager, HashiCorp Vault, Azure Key Vault, GCP Secret Manager. Actions: create, read, update, delete, rotate, list. Features: versioning, automatic rotation, access policies, audit logging. Example: manage_secrets(action='create', store='vault', path='secret/prod/api-keys', data='{\"stripe_key\": \"sk_live_...\", \"sendgrid_key\": \"SG...\"}', ttl='90d', auto_rotate=true). Rotation: manage_secrets(action='rotate', path='secret/prod/db-password', rotation_lambda='rotate-db-creds'). Note: Use least-privilege access policies. Warning: Deleted secrets may affect running applications."
    parameters:
      - name: action
        type: string
        description: "Secrets action"
        required: true
        enum: ["create", "read", "update", "delete", "rotate", "list", "history"]
      - name: store
        type: string
        description: "Secrets store"
        required: false
        default: "vault"
        enum: ["vault", "aws", "azure", "gcp"]
      - name: path
        type: string
        description: "Secret path"
        required: true
      - name: data
        type: string
        description: "JSON secret data"
        required: false
      - name: ttl
        type: string
        description: "Time to live"
        required: false
      - name: auto_rotate
        type: boolean
        description: "Enable auto rotation"
        required: false
        default: false
      - name: version
        type: integer
        description: "Secret version"
        required: false
    tags: ["devops", "secrets", "vault", "credentials", "security"]
    test_prompts:
      single:
        - "Store API key securely"
        - "Retrieve database password"
        - "Rotate secret"
        - "List all secrets"

  - name: configure_service_mesh
    descriptions:
      minimal: "Configure service mesh"
      short: "Configure service mesh"
      medium: "Configure service mesh for microservices communication."
      long: "Set up service mesh with traffic management and observability. Example: configure_service_mesh(action='create_route', service='api', route='{\"canary\": 10}')."
      verbose: "Service mesh configuration for microservices. Tools: Istio, Linkerd, Consul Connect. Features: traffic routing, load balancing, mTLS, observability. Actions: create_route, configure_retry, set_timeout, enable_mtls, create_circuit_breaker. Example: configure_service_mesh(mesh='istio', action='create_route', service='frontend', destination='{\"stable\": 90, \"canary\": 10}', match='{\"headers\": {\"x-canary\": \"true\"}}'). Circuit breaker: configure_service_mesh(action='create_circuit_breaker', service='payment', max_connections=100, consecutive_errors=5). Note: Service mesh adds latency overhead. Warning: Misconfigured routes can cause service outages."
    parameters:
      - name: mesh
        type: string
        description: "Service mesh platform"
        required: false
        default: "istio"
        enum: ["istio", "linkerd", "consul"]
      - name: action
        type: string
        description: "Mesh action"
        required: true
        enum: ["create_route", "configure_retry", "set_timeout", "enable_mtls", "create_circuit_breaker", "status"]
      - name: service
        type: string
        description: "Service name"
        required: true
      - name: destination
        type: string
        description: "JSON routing destination"
        required: false
      - name: match
        type: string
        description: "JSON match conditions"
        required: false
      - name: max_connections
        type: integer
        description: "Max connections for circuit breaker"
        required: false
      - name: timeout
        type: string
        description: "Request timeout"
        required: false
    tags: ["devops", "service_mesh", "istio", "microservices", "networking"]
    test_prompts:
      single:
        - "Set up canary routing"
        - "Configure circuit breaker"
        - "Enable mTLS for service"
        - "Create retry policy"

