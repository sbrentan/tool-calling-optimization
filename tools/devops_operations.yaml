      medium: "Provision and manage SSL/TLS certificates."
      long: "Create, renew, and manage SSL certificates for domains. Example: manage_ssl_certificates(action='create', domains='[\"example.com\", \"*.example.com\"]', provider='letsencrypt')."
      verbose: "SSL/TLS certificate management. Providers: Let's Encrypt, AWS ACM, Cloudflare, DigiCert. Actions: create, renew, revoke, list, install, verify. Features: wildcard certs, auto-renewal, multi-domain (SAN). Example: manage_ssl_certificates(action='create', domains='[\"api.example.com\", \"www.example.com\"]', provider='letsencrypt', challenge='dns', auto_renew=true, notify_before=30). Installation: manage_ssl_certificates(action='install', cert_id='cert-123', target='{\"type\": \"nginx\", \"path\": \"/etc/nginx/ssl\"}'). Note: Set up auto-renewal to avoid expiration. Warning: Certificate expiration causes service outages."
