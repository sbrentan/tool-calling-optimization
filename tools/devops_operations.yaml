        - "Alert when service is down"

  - name: run_database_migration
    descriptions:
      minimal: "Run migration"
      short: "Run database migrations"
      medium: "Execute database schema migrations for version control."
      long: "Run database migrations to update schema. Supports Flyway, Liquibase, Django, Rails, and raw SQL. Example: run_database_migration(database='production', direction='up', version='V2024.01.15')."
      verbose: "Database migration management. Tools: Flyway, Liquibase, Alembic, Django migrations, Rails migrations, Knex, Prisma. Actions: 'up' (apply pending), 'down' (rollback), 'status' (check state), 'repair' (fix checksums), 'validate'. Example: run_database_migration(tool='flyway', database='jdbc:postgresql://prod-db/myapp', direction='up', target='V2024.01.15__add_users_table.sql', dry_run=true). Note: Always backup before production migrations. Warning: Down migrations may cause data loss."
    parameters:
      - name: tool
        type: string
        description: "Migration tool"
        required: false
        default: "flyway"
        enum: ["flyway", "liquibase", "alembic", "django", "rails", "prisma"]
      - name: database
        type: string
        description: "Database connection string"
        required: true
      - name: direction
        type: string
        description: "Migration direction"
        required: true
        enum: ["up", "down", "status", "repair", "validate"]
      - name: target
        type: string
        description: "Target version"
        required: false
      - name: dry_run
        type: boolean
        description: "Preview without executing"
        required: false
        default: false
    tags: ["devops", "database", "migration", "schema", "versioning"]
    test_prompts:
      single:
        - "Run pending database migrations"
        - "Rollback last migration"
        - "Check migration status"
        - "Apply schema changes"

  - name: manage_ssl_certificate
    descriptions:
      minimal: "Manage SSL"
      short: "Manage SSL certificates"
      medium: "Generate, renew, or manage SSL/TLS certificates."
      long: "Manage SSL certificates for domains. Generate with Let's Encrypt, import existing, or request from CA. Example: manage_ssl_certificate(action='generate', domain='api.example.com', provider='letsencrypt')."
      verbose: "SSL/TLS certificate lifecycle management. Actions: 'generate' (new cert), 'renew' (extend expiry), 'import' (upload existing), 'revoke', 'list', 'check' (expiry status). Providers: Let's Encrypt, ACM, DigiCert, Comodo, self-signed. Example: manage_ssl_certificate(action='generate', domains='[\"example.com\", \"www.example.com\"]', provider='letsencrypt', challenge='dns', auto_renew=true). Note: Let's Encrypt certs expire in 90 days. Warning: Expired certificates cause browser security warnings."
    parameters:
      - name: action
        type: string
        description: "Certificate action"
        required: true
        enum: ["generate", "renew", "import", "revoke", "list", "check"]
      - name: domains
        type: string
        description: "JSON array of domain names"
        required: false
      - name: provider
        type: string
        description: "Certificate provider"
        required: false
        default: "letsencrypt"
        enum: ["letsencrypt", "acm", "digicert", "selfsigned"]
      - name: challenge
        type: string
        description: "Verification challenge type"
        required: false
        default: "http"
        enum: ["http", "dns", "tls-alpn"]
      - name: auto_renew
        type: boolean
        description: "Enable auto-renewal"
        required: false
        default: true
    tags: ["devops", "ssl", "certificate", "https", "security"]
    test_prompts:
      single:
        - "Generate SSL certificate for domain"
        - "Renew expiring certificates"
        - "Check certificate expiration"
        - "Import SSL certificate"

  - name: backup_service
    descriptions:
      minimal: "Backup service"
      short: "Create service backups"
      medium: "Create backups of databases, filesystems, or application data."
      long: "Create and manage backups. Supports databases, file systems, and cloud resources. Configure schedule and retention. Example: backup_service(type='database', source='production-db', destination='s3://backups/')."
      verbose: "Comprehensive backup management. Types: database (full, incremental, WAL), filesystem, volume snapshots, application data. Targets: S3, GCS, Azure Blob, local, NFS. Features: encryption, compression, scheduling, retention policies, verification. Example: backup_service(type='database', source='postgresql://prod-db/myapp', destination='s3://backups/db/', encryption_key='alias/backup-key', compression='gzip', retention_days=30, schedule='0 2 * * *'). Note: Regularly test restore procedures. Warning: Unencrypted backups pose security risks."
    parameters:
      - name: type
        type: string
        description: "Backup type"
        required: true
        enum: ["database", "filesystem", "volume", "application"]
      - name: source
        type: string
        description: "Source to backup"
        required: true
      - name: destination
        type: string
        description: "Backup destination"
        required: true
      - name: encryption_key
        type: string
        description: "Encryption key ID"
        required: false
      - name: compression
        type: string
        description: "Compression type"
        required: false
        enum: ["none", "gzip", "zstd", "lz4"]
      - name: retention_days
        type: integer
        description: "Days to retain backup"
        required: false
        default: 30
    tags: ["devops", "backup", "disaster recovery", "database", "storage"]
    test_prompts:
      single:
        - "Backup the production database"
        - "Create filesystem backup"
        - "Schedule daily backups"
        - "Backup to S3"

  - name: manage_kubernetes_deployment
    descriptions:
      minimal: "Manage k8s deployment"
      short: "Manage Kubernetes deployment"
      medium: "Deploy, scale, and manage applications on Kubernetes clusters."
      long: "Manage Kubernetes deployments with scaling, rolling updates, and rollbacks. Example: manage_kubernetes_deployment(action='deploy', name='web-app', image='app:v2.0', replicas=3)."
      verbose: "Kubernetes deployment management. Actions: deploy, scale, rollback, restart, delete, status. Features: rolling updates, blue-green, canary, resource limits, health checks. Example: manage_kubernetes_deployment(action='deploy', namespace='production', name='api-server', image='gcr.io/project/api:v2.0.1', replicas=5, cpu_limit='500m', memory_limit='512Mi', strategy='rolling', max_surge=1, max_unavailable=0). Rollback: manage_kubernetes_deployment(action='rollback', name='api-server', revision=3). Note: Always test in staging first. Warning: Deployment changes affect live traffic."
    parameters:
      - name: action
        type: string
        description: "Deployment action"
        required: true
        enum: ["deploy", "scale", "rollback", "restart", "delete", "status"]
      - name: namespace
        type: string
        description: "Kubernetes namespace"
        required: false
        default: "default"
      - name: name
        type: string
        description: "Deployment name"
        required: true
      - name: image
        type: string
        description: "Container image"
        required: false
      - name: replicas
        type: integer
        description: "Number of replicas"
        required: false
      - name: cpu_limit
        type: string
        description: "CPU limit"
        required: false
      - name: memory_limit
        type: string
        description: "Memory limit"
        required: false
      - name: strategy
        type: string
        description: "Deployment strategy"
        required: false
        default: "rolling"
        enum: ["rolling", "recreate"]
      - name: revision
        type: integer
        description: "Revision for rollback"
        required: false
    tags: ["devops", "kubernetes", "k8s", "deployment", "container"]
    test_prompts:
      single:
        - "Deploy to Kubernetes"
        - "Scale up the deployment"
        - "Rollback to previous version"
        - "Check deployment status"

  - name: configure_load_balancer
    descriptions:
      minimal: "Configure load balancer"
      short: "Configure load balancer"
      medium: "Configure load balancer settings for traffic distribution."
      long: "Set up and manage load balancers for high availability. Example: configure_load_balancer(action='create', name='web-lb', targets='[\"server1\", \"server2\"]', algorithm='round_robin')."
      verbose: "Load balancer configuration and management. Types: Application (L7), Network (L4), Classic. Algorithms: round robin, least connections, IP hash, weighted. Features: health checks, sticky sessions, SSL termination. Example: configure_load_balancer(action='create', name='api-lb', type='application', targets='[{\"id\": \"i-123\", \"port\": 8080}, {\"id\": \"i-456\", \"port\": 8080}]', health_check='{\"path\": \"/health\", \"interval\": 30}', ssl_cert='arn:aws:acm:...', sticky_sessions=true). Note: Allow time for health checks before traffic routing. Warning: Misconfigured health checks can cause outages."
    parameters:
      - name: action
        type: string
        description: "Load balancer action"
        required: true
        enum: ["create", "update", "delete", "add_target", "remove_target", "status"]
      - name: name
        type: string
        description: "Load balancer name"
        required: true
      - name: type
        type: string
        description: "Load balancer type"
        required: false
        default: "application"
        enum: ["application", "network", "classic"]
      - name: targets
        type: string
        description: "JSON array of targets"
        required: false
      - name: algorithm
        type: string
        description: "Load balancing algorithm"
        required: false
        default: "round_robin"
        enum: ["round_robin", "least_connections", "ip_hash", "weighted"]
      - name: health_check
        type: string
        description: "JSON health check config"
        required: false
      - name: ssl_cert
        type: string
        description: "SSL certificate ARN"
        required: false
