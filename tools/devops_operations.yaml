category: devops_operations
description: DevOps and CI/CD operations
tools:
  - name: deploy_application
    descriptions:
      minimal: "Deploy app"
      short: "Deploy an application"
      medium: "Deploy an application to a specified environment."
      long: "Deploy application to staging, production, or custom environments. Supports various deployment strategies. Example: deploy_application(app='my-api', environment='production', version='1.2.3')."
      verbose: "Deploy applications to target environments. Strategies: 'rolling' (gradual replacement), 'blue_green' (instant switchover), 'canary' (partial traffic), 'recreate' (stop then start). Options: version, replicas, health checks, rollback on failure. Example: deploy_application(app='user-service', environment='production', version='v2.1.0', strategy='canary', canary_percent=10, health_check='/health', timeout=300). Note: Blue-green requires double resources temporarily. Warning: Production deployments should be tested in staging first."
    parameters:
      - name: app
        type: string
        description: "Application name"
        required: true
      - name: environment
        type: string
        description: "Target environment"
        required: true
        enum: ["development", "staging", "production"]
      - name: version
        type: string
        description: "Version to deploy"
        required: true
      - name: strategy
        type: string
        description: "Deployment strategy"
        required: false
        default: "rolling"
        enum: ["rolling", "blue_green", "canary", "recreate"]
      - name: replicas
        type: integer
        description: "Number of replicas"
        required: false
        default: 2
      - name: health_check
        type: string
        description: "Health check endpoint"
        required: false
        default: "/health"
      - name: timeout
        type: integer
        description: "Deployment timeout (seconds)"
        required: false
        default: 600
    tags: ["devops", "deploy", "application", "release", "environment"]
    test_prompts:
      single:
        - "Deploy the app to production"
        - "Release version 2.0 to staging"
        - "Deploy with blue-green strategy"
        - "Roll out the new version"

  - name: rollback_deployment
    descriptions:
      minimal: "Rollback"
      short: "Rollback a deployment"
      medium: "Rollback an application to a previous version."
      long: "Rollback to a previous deployment version. Can target specific version or auto-rollback to last stable. Example: rollback_deployment(app='my-api', environment='production')."
      verbose: "Rollback application deployments to previous versions. Modes: 'previous' (last version), 'specific' (target version), 'last_stable' (last healthy). Options: reason tracking, notification, automatic on failure. Example: rollback_deployment(app='user-service', environment='production', target='v1.9.0', reason='Memory leak in v2.0', notify='[\"oncall\"]'). Note: Rollback uses same strategy as deployment. Warning: Database migrations may not be reversible."
    parameters:
      - name: app
        type: string
        description: "Application name"
        required: true
      - name: environment
        type: string
        description: "Environment"
        required: true
      - name: target
        type: string
        description: "Target version (or 'previous')"
        required: false
        default: "previous"
      - name: reason
        type: string
        description: "Rollback reason"
        required: false
      - name: notify
        type: string
        description: "JSON array of notification targets"
        required: false
    tags: ["devops", "rollback", "deployment", "revert", "recovery"]
    test_prompts:
      single:
        - "Rollback the deployment"
        - "Revert to the previous version"
        - "Rollback production to v1.5"
        - "Undo the last deployment"

  - name: run_pipeline
    descriptions:
      minimal: "Run pipeline"
      short: "Run a CI/CD pipeline"
      medium: "Trigger a CI/CD pipeline run with specified parameters."
      long: "Trigger CI/CD pipeline execution. Supports GitHub Actions, GitLab CI, Jenkins, etc. Example: run_pipeline(pipeline='build-and-test', branch='main')."
      verbose: "Trigger CI/CD pipeline runs. Platforms: GitHub Actions, GitLab CI, Jenkins, CircleCI, Azure DevOps. Options: branch, tag, environment variables, pipeline parameters, wait for completion. Example: run_pipeline(pipeline='deploy-prod', branch='main', variables='{\"DEPLOY_ENV\": \"production\"}', wait=true, timeout=1800). Note: Some pipelines require approval for protected environments. Warning: Concurrent pipeline runs may cause resource contention."
    parameters:
      - name: pipeline
        type: string
        description: "Pipeline name/ID"
        required: true
      - name: branch
        type: string
        description: "Git branch"
        required: false
        default: "main"
      - name: tag
        type: string
        description: "Git tag"
        required: false
      - name: variables
        type: string
        description: "JSON object of pipeline variables"
        required: false
      - name: wait
        type: boolean
        description: "Wait for completion"
        required: false
        default: false
      - name: timeout
        type: integer
        description: "Timeout in seconds (if waiting)"
        required: false
        default: 3600
    tags: ["devops", "pipeline", "ci", "cd", "build"]
    test_prompts:
      single:
        - "Run the build pipeline"
        - "Trigger CI for main branch"
        - "Start the deployment pipeline"
        - "Run the test pipeline"

  - name: get_pipeline_status
    descriptions:
      minimal: "Pipeline status"
      short: "Get pipeline run status"
      medium: "Check the status of a CI/CD pipeline run."
      long: "Get the status and details of a pipeline run. Returns stage status, logs, and artifacts. Example: get_pipeline_status(run_id='12345')."
      verbose: "Retrieve CI/CD pipeline run status and details. Returns: overall status, stage/job statuses, duration, logs, test results, artifacts, failure reasons. Statuses: 'pending', 'running', 'success', 'failed', 'cancelled'. Example: get_pipeline_status(run_id='12345', include_logs=true, include_artifacts=true). Note: Logs may be truncated for large outputs. Warning: Accessing logs requires appropriate permissions."
    parameters:
      - name: run_id
        type: string
        description: "Pipeline run ID"
        required: true
      - name: include_logs
        type: boolean
        description: "Include job logs"
        required: false
        default: false
      - name: include_artifacts
        type: boolean
        description: "Include artifact list"
        required: false
        default: false
    tags: ["devops", "pipeline", "status", "check", "ci"]
    test_prompts:
      single:
        - "Check the pipeline status"
        - "Is the build finished?"
        - "Get the CI run status"
        - "Show pipeline logs"

  - name: manage_container
    descriptions:
      minimal: "Manage container"
      short: "Manage Docker containers"
      medium: "Start, stop, restart, or manage Docker containers."
      long: "Manage Docker containers. Perform lifecycle operations like start, stop, restart, logs, exec. Example: manage_container(container='my-app', action='restart')."
      verbose: "Manage Docker container lifecycle and operations. Actions: 'start', 'stop', 'restart', 'pause', 'unpause', 'logs', 'exec', 'inspect', 'remove'. Options: force (for stop/remove), tail (for logs), command (for exec). Example: manage_container(container='redis-cache', action='logs', tail=100) or manage_container(container='web-app', action='exec', command='sh -c \"printenv\"'). Note: Some actions require the container to be running. Warning: Removing containers destroys their data unless using volumes."
    parameters:
      - name: container
        type: string
        description: "Container name or ID"
        required: true
      - name: action
        type: string
        description: "Action to perform"
        required: true
        enum: ["start", "stop", "restart", "pause", "unpause", "logs", "exec", "inspect", "remove"]
      - name: force
        type: boolean
        description: "Force action"
        required: false
        default: false
      - name: tail
        type: integer
        description: "Number of log lines"
        required: false
        default: 100
      - name: command
        type: string
        description: "Command for exec action"
        required: false
    tags: ["devops", "container", "docker", "manage", "lifecycle"]
    test_prompts:
      single:
        - "Restart the container"
        - "Stop the Docker container"
        - "Get container logs"
        - "Remove the container"

  - name: scale_service
    descriptions:
      minimal: "Scale service"
      short: "Scale a service up or down"
      medium: "Scale the number of replicas for a service or deployment."
      long: "Scale service replicas up or down. Supports Kubernetes, Docker Swarm, ECS, etc. Example: scale_service(service='web-app', replicas=5)."
      verbose: "Scale service replicas for horizontal scaling. Platforms: Kubernetes Deployments, Docker Swarm services, ECS services, Cloud Run. Modes: 'absolute' (set exact count), 'relative' (add/remove replicas), 'auto' (based on metrics). Example: scale_service(service='api-gateway', replicas=10, namespace='production', wait=true, timeout=300). Note: Scaling up requires available resources. Warning: Scaling to zero stops all traffic to the service."
    parameters:
      - name: service
        type: string
        description: "Service name"
        required: true
      - name: replicas
        type: integer
        description: "Target replica count"
        required: true
      - name: namespace
        type: string
        description: "Kubernetes namespace"
        required: false
        default: "default"
      - name: wait
        type: boolean
        description: "Wait for scaling to complete"
        required: false
        default: true
      - name: timeout
        type: integer
        description: "Timeout in seconds"
        required: false
        default: 300
    tags: ["devops", "scale", "replicas", "kubernetes", "horizontal"]
    test_prompts:
      single:
        - "Scale the service to 5 replicas"
        - "Add more instances"
        - "Scale down to 2 pods"
        - "Increase capacity"

  - name: create_infrastructure
    descriptions:
      minimal: "Create infra"
      short: "Create infrastructure resources"
      medium: "Provision infrastructure resources using Infrastructure as Code."
      long: "Create infrastructure using Terraform, CloudFormation, or Pulumi. Example: create_infrastructure(template='main.tf', action='apply', environment='production')."
      verbose: "Provision infrastructure using IaC tools. Platforms: Terraform, AWS CloudFormation, Azure ARM, Google Deployment Manager, Pulumi. Actions: 'plan' (preview changes), 'apply' (create resources), 'destroy' (remove resources). Example: create_infrastructure(template='./terraform', action='apply', variables='{\"region\": \"us-east-1\", \"instance_type\": \"t3.medium\"}', auto_approve=false). Note: Plan should always precede apply. Warning: Apply creates real resources with cost implications."
    parameters:
      - name: template
        type: string
        description: "Path to IaC template"
        required: true
      - name: action
        type: string
        description: "IaC action"
        required: true
        enum: ["plan", "apply", "destroy"]
      - name: variables
        type: string
        description: "JSON object of variables"
        required: false
      - name: environment
        type: string
        description: "Target environment"
        required: false
        default: "development"
      - name: auto_approve
        type: boolean
        description: "Skip confirmation"
        required: false
        default: false
    tags: ["devops", "infrastructure", "iac", "terraform", "provision"]
    test_prompts:
      single:
        - "Apply the Terraform changes"
        - "Create the infrastructure"
        - "Run terraform plan"
        - "Provision the environment"

  - name: manage_secrets
    descriptions:
      minimal: "Manage secrets"
      short: "Manage application secrets"
      medium: "Create, update, or retrieve secrets from a secrets manager."
      long: "Manage secrets in HashiCorp Vault, AWS Secrets Manager, or Kubernetes Secrets. Example: manage_secrets(action='get', key='database/credentials', vault='production')."
      verbose: "Manage application secrets securely. Platforms: HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager, Kubernetes Secrets. Actions: 'get', 'set', 'delete', 'list', 'rotate'. Example: manage_secrets(action='set', key='api/stripe_key', value='sk_live_xxx', vault='production', expire='90d'). Note: Secrets are encrypted at rest. Warning: Deleting secrets may break dependent applications."
    parameters:
      - name: action
        type: string
        description: "Secret action"
        required: true
        enum: ["get", "set", "delete", "list", "rotate"]
      - name: key
        type: string
        description: "Secret key/path"
        required: true
      - name: value
        type: string
        description: "Secret value (for set)"
        required: false
      - name: vault
        type: string
        description: "Vault/store name"
        required: false
        default: "default"
      - name: expire
        type: string
        description: "Expiration period"
        required: false
    tags: ["devops", "secrets", "vault", "credentials", "security"]
    test_prompts:
      single:
        - "Get the database password"
        - "Store this API key"
        - "Rotate the secrets"
        - "List all secrets"

  - name: monitor_metrics
    descriptions:
      minimal: "Monitor metrics"
      short: "Monitor application metrics"
      medium: "Query and monitor application and infrastructure metrics."
      long: "Query metrics from Prometheus, CloudWatch, Datadog, etc. Example: monitor_metrics(metric='cpu_usage', service='api-server', period='1h')."
      verbose: "Query and analyze metrics from monitoring systems. Platforms: Prometheus, AWS CloudWatch, Datadog, New Relic, Grafana. Query types: instant, range, aggregations. Metrics: CPU, memory, latency, error rate, throughput, custom. Example: monitor_metrics(metric='http_request_duration_seconds', labels='{\"service\": \"api\"}', aggregation='p99', period='1h', step='1m'). Note: High-cardinality queries may be slow. Warning: Long periods with small steps generate large datasets."
    parameters:
      - name: metric
        type: string
        description: "Metric name"
        required: true
      - name: labels
        type: string
        description: "JSON object of label filters"
        required: false
      - name: aggregation
        type: string
        description: "Aggregation function"
        required: false
        default: "avg"
        enum: ["avg", "sum", "min", "max", "p50", "p95", "p99"]
      - name: period
        type: string
        description: "Time period (e.g., '1h', '24h')"
        required: false
        default: "1h"
      - name: step
        type: string
        description: "Query step interval"
        required: false
        default: "1m"
    tags: ["devops", "metrics", "monitor", "prometheus", "observability"]
    test_prompts:
      single:
        - "Show CPU usage for the last hour"
        - "Get the p99 latency"
        - "Monitor error rates"
        - "Check memory metrics"

  - name: manage_logs
    descriptions:
      minimal: "Manage logs"
      short: "Query and manage logs"
      medium: "Query, search, and manage application logs."
      long: "Query logs from centralized logging systems. Search, filter, and analyze log entries. Example: manage_logs(service='api-server', level='error', period='1h')."
      verbose: "Query and manage centralized logs. Platforms: Elasticsearch/ELK, Loki, CloudWatch Logs, Splunk, Datadog Logs. Features: full-text search, structured queries, log tailing, export. Filters: service, level, time range, text pattern, JSON fields. Example: manage_logs(service='payment-api', level='error', pattern='timeout', period='24h', limit=1000, format='json'). Note: Log retention may limit available history. Warning: Large queries may timeout; use specific filters."
    parameters:
      - name: service
        type: string
        description: "Service/application name"
        required: false
      - name: level
        type: string
        description: "Log level filter"
        required: false
        enum: ["debug", "info", "warn", "error", "fatal"]
      - name: pattern
        type: string
        description: "Search pattern"
        required: false
      - name: period
        type: string
        description: "Time period"
        required: false
        default: "1h"
      - name: limit
        type: integer
        description: "Maximum entries"
        required: false
        default: 100
      - name: format
        type: string
        description: "Output format"
        required: false
        default: "text"
        enum: ["text", "json", "csv"]
    tags: ["devops", "logs", "search", "elk", "observability"]
    test_prompts:
      single:
        - "Show error logs from the last hour"
        - "Search logs for 'connection refused'"
        - "Get logs for the payment service"
        - "Tail the application logs"
  - name: create_kubernetes_resource
    descriptions:
      minimal: "Create K8s resource"
      short: "Create a Kubernetes resource"
      medium: "Create Kubernetes resources like deployments, services, or configmaps."
      long: "Create Kubernetes resources from manifest or parameters. Supports deployments, services, configmaps, secrets. Example: create_kubernetes_resource(type='deployment', name='my-app', namespace='production', manifest='...')."
      verbose: "Create Kubernetes cluster resources. Types: Deployment, Service, ConfigMap, Secret, Ingress, PersistentVolumeClaim, CronJob, HorizontalPodAutoscaler. Methods: from YAML manifest, from template, from parameters. Example: create_kubernetes_resource(type='deployment', name='api-server', namespace='production', image='myapp:v1.0', replicas=3, resources='{\"cpu\": \"500m\", \"memory\": \"512Mi\"}', env_from_secret='api-secrets'). Note: Namespace must exist. Warning: Secrets should be encrypted at rest."
    parameters:
      - name: type
        type: string
        description: "Resource type"
        required: true
        enum: ["deployment", "service", "configmap", "secret", "ingress", "pvc", "cronjob", "hpa"]
      - name: name
        type: string
        description: "Resource name"
        required: true
      - name: namespace
        type: string
        description: "Kubernetes namespace"
        required: false
        default: "default"
      - name: manifest
        type: string
        description: "YAML manifest content"
        required: false
      - name: image
        type: string
        description: "Container image (for deployments)"
        required: false
      - name: replicas
        type: integer
        description: "Replica count"
        required: false
        default: 1
    tags: ["devops", "kubernetes", "k8s", "create", "resource"]
    test_prompts:
      single:
        - "Create a Kubernetes deployment"
        - "Add a new service to the cluster"
        - "Create a configmap in Kubernetes"
        - "Deploy a new pod to production namespace"

  - name: manage_infrastructure
    descriptions:
      minimal: "Manage infrastructure"
      short: "Provision or manage infrastructure"
      medium: "Create, update, or destroy infrastructure resources using Infrastructure as Code."
      long: "Manage infrastructure with Terraform, CloudFormation, or Pulumi. Plan, apply, or destroy resources. Example: manage_infrastructure(action='apply', stack='production-vpc', tool='terraform')."
      verbose: "Infrastructure as Code management. Tools: Terraform, CloudFormation, Pulumi, Ansible, CDK. Actions: 'plan' (preview changes), 'apply' (execute changes), 'destroy' (tear down), 'refresh' (sync state), 'import' (adopt existing). Example: manage_infrastructure(tool='terraform', action='apply', stack='production', working_dir='/infra/prod', var_file='prod.tfvars', auto_approve=false). Note: Always run plan before apply. Warning: Destroy operations are irreversible; ensure backups exist."
    parameters:
      - name: tool
        type: string
        description: "IaC tool to use"
        required: true
        enum: ["terraform", "cloudformation", "pulumi", "ansible", "cdk"]
      - name: action
        type: string
        description: "Infrastructure action"
        required: true
        enum: ["plan", "apply", "destroy", "refresh", "import", "validate"]
      - name: stack
        type: string
        description: "Stack/workspace name"
        required: true
      - name: working_dir
        type: string
        description: "Working directory path"
        required: false
      - name: var_file
        type: string
        description: "Variables file"
        required: false
      - name: auto_approve
        type: boolean
        description: "Skip confirmation"
        required: false
        default: false
    tags: ["devops", "infrastructure", "terraform", "iac", "provision"]
    test_prompts:
      single:
        - "Apply Terraform changes"
        - "Plan infrastructure updates"
        - "Provision new resources"
        - "Destroy the staging environment"

  - name: manage_container_registry
    descriptions:
      minimal: "Manage registry"
      short: "Manage container registry"
      medium: "Push, pull, or manage container images in a registry."
      long: "Manage container images in registries like Docker Hub, ECR, GCR, or ACR. Push, tag, or delete images. Example: manage_container_registry(action='push', image='myapp:latest', registry='docker.io/myorg')."
      verbose: "Container registry operations. Registries: Docker Hub, AWS ECR, Google GCR, Azure ACR, GitHub Container Registry, private registries. Actions: 'push', 'pull', 'tag', 'delete', 'list', 'scan' (vulnerabilities). Example: manage_container_registry(action='push', registry='123456789.dkr.ecr.us-east-1.amazonaws.com', image='myapp', tag='v1.2.3', scan=true). Note: Registry authentication may be required. Warning: Deleting images may break deployments referencing them."
    parameters:
      - name: action
        type: string
        description: "Registry action"
        required: true
        enum: ["push", "pull", "tag", "delete", "list", "scan"]
      - name: registry
        type: string
        description: "Registry URL"
        required: true
      - name: image
        type: string
        description: "Image name"
        required: true
      - name: tag
        type: string
        description: "Image tag"
        required: false
        default: "latest"
      - name: scan
        type: boolean
        description: "Run vulnerability scan"
        required: false
        default: false
    tags: ["devops", "container", "registry", "docker", "image"]
    test_prompts:
      single:
        - "Push Docker image to registry"
        - "Scan container for vulnerabilities"
        - "List images in the registry"
        - "Tag and push new version"

  - name: configure_load_balancer
    descriptions:
      minimal: "Configure load balancer"
      short: "Configure a load balancer"
      medium: "Create or update load balancer configuration for traffic distribution."
      long: "Configure load balancers for application traffic. Set up listeners, target groups, health checks, and SSL. Example: configure_load_balancer(name='api-lb', type='application', targets='[\"instance-1\", \"instance-2\"]')."
      verbose: "Load balancer configuration and management. Types: Application (L7), Network (L4), Classic, Gateway. Configuration: listeners (ports, protocols), target groups, health checks, SSL certificates, routing rules, sticky sessions. Example: configure_load_balancer(name='web-alb', type='application', listeners='[{\"port\": 443, \"protocol\": \"HTTPS\", \"certificate\": \"arn:aws:...\"}]', targets='[\"i-abc123\", \"i-def456\"]', health_check='{\"path\": \"/health\", \"interval\": 30}'). Note: SSL termination at LB reduces backend load. Warning: Misconfiguration can cause outages."
    parameters:
      - name: name
        type: string
        description: "Load balancer name"
        required: true
      - name: type
        type: string
        description: "Load balancer type"
        required: true
        enum: ["application", "network", "classic", "gateway"]
      - name: listeners
        type: string
        description: "JSON listener configurations"
        required: true
      - name: targets
        type: string
        description: "JSON array of target instances"
        required: true
      - name: health_check
        type: string
        description: "JSON health check config"
        required: false
      - name: ssl_certificate
        type: string
        description: "SSL certificate ARN"
        required: false
    tags: ["devops", "loadbalancer", "traffic", "networking", "alb"]
    test_prompts:
      single:
        - "Set up a load balancer"
        - "Configure HTTPS listener"
        - "Add servers to load balancer"
        - "Update load balancer health checks"

  - name: manage_dns
    descriptions:
      minimal: "Manage DNS"
      short: "Manage DNS records"
      medium: "Create, update, or delete DNS records for domains."
      long: "Manage DNS records in Route53, Cloudflare, or other DNS providers. Add A, CNAME, MX, TXT records. Example: manage_dns(action='create', domain='example.com', type='A', name='api', value='1.2.3.4')."
      verbose: "DNS record management across providers. Providers: Route53, Cloudflare, Google Cloud DNS, Azure DNS, GoDaddy, Namecheap. Record types: A, AAAA, CNAME, MX, TXT, NS, SRV, CAA. Actions: create, update, delete, list. Example: manage_dns(provider='cloudflare', action='create', zone='example.com', type='CNAME', name='www', value='example.com', ttl=300, proxied=true). Note: DNS propagation may take minutes to hours. Warning: Incorrect MX/NS records can break email or domain."
    parameters:
      - name: provider
        type: string
        description: "DNS provider"
        required: false
        enum: ["route53", "cloudflare", "google", "azure", "godaddy"]
      - name: action
        type: string
        description: "DNS action"
        required: true
        enum: ["create", "update", "delete", "list"]
      - name: zone
        type: string
        description: "DNS zone (domain)"
        required: true
      - name: type
        type: string
        description: "Record type"
        required: false
        enum: ["A", "AAAA", "CNAME", "MX", "TXT", "NS", "SRV"]
      - name: name
        type: string
        description: "Record name"
        required: false
      - name: value
        type: string
        description: "Record value"
        required: false
      - name: ttl
        type: integer
        description: "Time to live (seconds)"
        required: false
        default: 300
    tags: ["devops", "dns", "domain", "routing", "records"]
    test_prompts:
      single:
        - "Add DNS record for subdomain"
        - "Update A record to new IP"
        - "Create CNAME for www"
        - "Set up MX records for email"

  - name: setup_monitoring_alert
    descriptions:
      minimal: "Setup alert"
      short: "Configure monitoring alerts"
      medium: "Set up alerts for metrics, logs, or service health."
      long: "Configure alerting rules for monitoring. Define thresholds, conditions, and notification channels. Example: setup_monitoring_alert(name='High CPU', metric='cpu_usage', threshold=90, operator='greater_than')."
      verbose: "Configure monitoring and alerting rules. Platforms: Prometheus/Alertmanager, CloudWatch, Datadog, PagerDuty, Grafana, New Relic. Alert types: metric threshold, anomaly detection, log pattern, uptime, SLO breach. Notifications: email, Slack, PagerDuty, SMS, webhook. Example: setup_monitoring_alert(name='API Error Rate', metric='http_5xx_count', threshold=100, window='5m', operator='greater_than', severity='critical', channels='[\"pagerduty\", \"slack-oncall\"]'). Note: Set appropriate severity to avoid alert fatigue. Warning: Too many alerts can cause important ones to be ignored."
    parameters:
      - name: name
        type: string
        description: "Alert name"
        required: true
      - name: metric
        type: string
        description: "Metric to monitor"
        required: true
      - name: threshold
        type: number
        description: "Alert threshold"
        required: true
      - name: operator
        type: string
