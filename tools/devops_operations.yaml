        description: "IaC tool"
        required: true
        enum: ["terraform", "cloudformation", "pulumi", "ansible"]
      - name: directory
        type: string
        description: "Configuration directory"
        required: true
      - name: variables
        type: string
        description: "JSON variables"
        required: false
      - name: auto_approve
        type: boolean
        description: "Auto-approve changes"
        required: false
        default: false
      - name: target
        type: string
        description: "Specific resource to target"
        required: false
      - name: output
        type: string
        description: "Output file for plan"
        required: false
