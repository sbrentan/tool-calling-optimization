    test_prompts:
      single:
        - "Create load balancer"
        - "Add server to load balancer"
        - "Configure health checks"
        - "Set up SSL termination"

  - name: manage_infrastructure_as_code
    descriptions:
      minimal: "Manage IaC"
      short: "Manage infrastructure as code"
      medium: "Apply, plan, and manage infrastructure using Terraform or CloudFormation."
      long: "Execute IaC operations for infrastructure provisioning. Example: manage_infrastructure_as_code(action='apply', tool='terraform', directory='./infra')."
      verbose: "Infrastructure as Code management. Tools: Terraform, CloudFormation, Pulumi, Ansible. Actions: init, plan, apply, destroy, import, state. Features: state management, drift detection, cost estimation. Example: manage_infrastructure_as_code(action='plan', tool='terraform', directory='./infrastructure/production', variables='{\"instance_type\": \"t3.large\", \"region\": \"us-west-2\"}', auto_approve=false, output='plan.out'). State operations: manage_infrastructure_as_code(action='import', resource='aws_instance.web', id='i-1234567890'). Note: Always review plan before apply. Warning: Destroy operations are irreversible."
    parameters:
      - name: action
        type: string
        description: "IaC action"
        required: true
        enum: ["init", "plan", "apply", "destroy", "import", "output", "state"]
      - name: tool
