        - "Post the document to the API"
        - "Upload the image to the storage endpoint"
        - "Send the file to the upload URL"

  - name: get_ssl_info
    descriptions:
      minimal: "Get SSL info"
      short: "Get SSL certificate information"
      medium: "Retrieve SSL/TLS certificate details for a domain including expiry and issuer."
      long: "Get SSL certificate information for a domain. Returns issuer, validity dates, and certificate chain. Example: get_ssl_info(domain='example.com')."
      verbose: "Retrieve comprehensive SSL/TLS certificate information. Returns: common name, issuer, validity period, signature algorithm, public key info, SAN (Subject Alternative Names), certificate chain, OCSP status. Example: get_ssl_info(domain='api.example.com', port=443, check_revocation=true) returns {\"valid\": true, \"expires_at\": \"2025-01-01\", \"days_until_expiry\": 180, \"issuer\": \"Let's Encrypt\", ...}. Note: Port 443 is used by default. Warning: Some certificate details may be unavailable for certain configurations."
    parameters:
      - name: domain
        type: string
        description: "Domain to check"
        required: true
      - name: port
        type: integer
        description: "SSL port"
        required: false
        default: 443
      - name: check_revocation
        type: boolean
        description: "Check certificate revocation"
        required: false
        default: false
      - name: get_chain
        type: boolean
        description: "Include full certificate chain"
        required: false
        default: false
    tags: ["web", "ssl", "tls", "certificate", "security", "https"]
    test_prompts:
      single:
        - "Check when the SSL certificate expires"
        - "Get SSL certificate details for the domain"
        - "Is the SSL certificate valid?"
        - "Show certificate information for example.com"
