  - name: download_file
    descriptions:
      minimal: "Download file"
      short: "Download a file from URL"
      medium: "Download a file from a URL to the local filesystem with progress tracking."
      long: "Download a file from a URL and save it locally. Supports resume, progress callbacks, and authentication. Example: download_file(url='https://example.com/file.zip', destination='./downloads/file.zip')."
      verbose: "Download files from URLs with advanced options. Features: resume interrupted downloads, progress tracking, parallel chunk download, authentication, custom headers. Example: download_file(url='https://releases.example.com/app-v2.0.tar.gz', destination='/opt/downloads/', filename='app.tar.gz', resume=true, verify_checksum='sha256:abc123...', max_retries=3, timeout=300). Note: Large files may take significant time; use resume for reliability. Warning: Verify checksums for security-critical downloads."
    parameters:
      - name: url
        type: string
        description: "URL of file to download"
        required: true
      - name: destination
        type: string
        description: "Local destination path"
        required: true
      - name: filename
        type: string
        description: "Override filename"
        required: false
      - name: resume
        type: boolean
        description: "Resume partial download"
        required: false
        default: true
      - name: verify_checksum
        type: string
        description: "Expected checksum (algorithm:hash)"
        required: false
      - name: headers
        type: string
        description: "Custom headers (JSON)"
        required: false
      - name: timeout
        type: integer
        description: "Timeout in seconds"
        required: false
        default: 300
    tags: ["web", "download", "file", "http", "fetch"]
    test_prompts:
      single:
        - "Download the file from this URL"
        - "Fetch the ZIP file and save it locally"
        - "Download the release package"
        - "Get the file from the server"

  - name: upload_file
    descriptions:
      minimal: "Upload file"
      short: "Upload a file to a URL"
      medium: "Upload a file to a web server via HTTP POST with multipart form data."
      long: "Upload a file to a server using HTTP POST multipart/form-data. Example: upload_file(url='https://api.example.com/upload', file='/path/to/document.pdf', field_name='file')."
      verbose: "Upload files to web servers via HTTP. Methods: multipart form-data (standard), raw binary, chunked upload for large files. Can include additional form fields. Example: upload_file(url='https://api.example.com/documents', file='/reports/q4.pdf', field_name='document', form_data='{\"title\": \"Q4 Report\", \"public\": false}', headers='{\"Authorization\": \"Bearer token123\"}', chunked=true). Note: Server must support the chosen upload method. Warning: Large uploads may timeout; use chunked for reliability."
    parameters:
      - name: url
        type: string
        description: "Upload endpoint URL"
        required: true
      - name: file
        type: string
        description: "Local file path"
        required: true
      - name: field_name
        type: string
        description: "Form field name for file"
        required: false
        default: "file"
      - name: form_data
        type: string
        description: "Additional form fields (JSON)"
        required: false
      - name: headers
        type: string
        description: "Custom headers (JSON)"
        required: false
      - name: chunked
        type: boolean
        description: "Use chunked upload"
        required: false
        default: false
    tags: ["web", "upload", "file", "http", "post"]
    test_prompts:
