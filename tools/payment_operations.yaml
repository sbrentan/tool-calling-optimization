category: payment_operations

tools:
  - name: create_payment_intent
    descriptions:
      minimal: "Create payment intent"
      short: "Create a payment intent for processing a charge"
      medium: "Create a payment intent to initiate a card payment with amount, currency, and customer info."
      long: "Create a payment intent for processing a payment. Returns a client secret for frontend confirmation. Supports various payment methods. Example: create_payment_intent(amount=2999, currency='usd', customer_id='cus_123')."
      verbose: "Create a payment intent to initiate the payment flow. Payment intents track the lifecycle of a payment from creation to completion. Supports: multiple payment methods (card, bank, wallet), saved payment methods, 3D Secure authentication, metadata, statement descriptors. Example: create_payment_intent(amount=5000, currency='usd', customer_id='cus_ABC123', payment_method_types=['card', 'sepa_debit'], metadata='{\"order_id\": \"ord_123\"}', statement_descriptor='MYCOMPANY', capture_method='automatic'). Note: Amount is in smallest currency unit (cents for USD). Warning: Handle the client_secret securely; never log it."
    parameters:
      - name: amount
        type: integer
        description: "Amount in smallest currency unit"
        required: true
      - name: currency
        type: string
        description: "Three-letter currency code"
        required: true
      - name: customer_id
        type: string
        description: "Customer identifier"
        required: false
      - name: payment_method_types
        type: array
        description: "Allowed payment methods"
        required: false
      - name: metadata
        type: string
        description: "Custom metadata JSON"
        required: false
      - name: statement_descriptor
        type: string
        description: "Statement descriptor"
        required: false
      - name: capture_method
        type: string
        description: "When to capture funds"
        required: false
        default: "automatic"
        enum: ["automatic", "manual"]
    tags: ["payment", "charge", "stripe", "intent", "card"]
    test_prompts:
      single:
        - "Create a payment for $29.99"
        - "Process a credit card charge"
        - "Set up a payment intent for the order"
        - "Initialize a card payment for the customer"
      single_clear:
        - "I need to process a payment transaction. Create a payment for $29.99"
        - "I need to process a payment transaction. Process a credit card charge"
        - "I need to process a payment transaction. Set up a payment intent for the order"
        - "I need to process a payment transaction. Initialize a card payment for the customer"

  - name: process_refund
    descriptions:
      minimal: "Process refund"
      short: "Refund a payment"
      medium: "Process a full or partial refund for a previous payment or charge."
      long: "Refund a payment partially or fully. Specify the payment ID and optionally the amount. Example: process_refund(payment_id='pi_123', amount=1500, reason='customer_request')."
      verbose: "Process a refund for a completed payment. Supports full or partial refunds, multiple partial refunds per payment, and refund reasons for analytics. Refunds are processed to the original payment method. Example: process_refund(payment_id='pi_ABC123', amount=2500, reason='duplicate', metadata='{\"ticket_id\": \"SUP-456\"}', refund_application_fee=false, reverse_transfer=true). Note: Refunds may take 5-10 business days to appear on customer statements. Warning: Some payment methods (bank transfers) may have refund limitations."
    parameters:
      - name: payment_id
        type: string
        description: "Original payment or charge ID"
        required: true
      - name: amount
        type: integer
        description: "Refund amount (omit for full refund)"
        required: false
      - name: reason
        type: string
        description: "Refund reason"
        required: false
        enum: ["duplicate", "fraudulent", "customer_request", "other"]
      - name: metadata
        type: string
        description: "Custom metadata JSON"
        required: false
      - name: refund_application_fee
        type: boolean
        description: "Refund application fee"
        required: false
        default: false
      - name: reverse_transfer
        type: boolean
        description: "Reverse connected account transfer"
        required: false
        default: false
    tags: ["payment", "refund", "return", "chargeback", "cancel"]
    test_prompts:
      single:
        - "Refund the customer's payment"
        - "Process a partial refund of $15"
        - "Give the customer their money back"
        - "Refund the order due to cancellation"
      single_clear:
        - "I need to process a refund. Refund the customer's payment"
        - "I need to process a refund. Process a partial refund of $15"
        - "I need to process a refund. Give the customer their money back"
        - "I need to process a refund. Refund the order due to cancellation"

  - name: create_subscription
    descriptions:
      minimal: "Create subscription"
      short: "Create a recurring subscription"
      medium: "Create a recurring subscription for a customer with specified pricing and billing cycle."
      long: "Create a subscription to charge a customer on a recurring basis. Specify the price/plan and billing settings. Example: create_subscription(customer_id='cus_123', price_id='price_456')."
      verbose: "Create a recurring subscription for a customer. Supports: multiple pricing items, trial periods, proration, billing anchors, usage-based billing, and add-ons. Example: create_subscription(customer_id='cus_ABC', items=[{\"price\": \"price_monthly_pro\", \"quantity\": 1}], trial_period_days=14, billing_cycle_anchor='2024-02-01', payment_behavior='default_incomplete', collection_method='charge_automatically'). Note: Trial periods do not charge the customer. Warning: Ensure customer has a valid payment method before creating subscriptions without trials."
    parameters:
      - name: customer_id
        type: string
        description: "Customer identifier"
        required: true
      - name: price_id
        type: string
        description: "Price/plan identifier"
        required: false
      - name: items
        type: array
        description: "Subscription items array"
        required: false
      - name: trial_period_days
        type: integer
        description: "Trial period length"
        required: false
      - name: billing_cycle_anchor
        type: string
        description: "Anchor date for billing"
        required: false
      - name: payment_behavior
        type: string
        description: "Payment behavior"
        required: false
        enum: ["allow_incomplete", "default_incomplete", "error_if_incomplete", "pending_if_incomplete"]
      - name: collection_method
        type: string
        description: "How to collect payment"
        required: false
        default: "charge_automatically"
        enum: ["charge_automatically", "send_invoice"]
    tags: ["subscription", "recurring", "billing", "saas", "payment"]
    test_prompts:
      single:
        - "Subscribe the customer to the monthly plan"
        - "Create a subscription for the Pro tier"
        - "Set up recurring billing for the user"
        - "Start a subscription with a 14-day trial"
      single_clear:
        - "I need to create a subscription. Subscribe the customer to the monthly plan"
        - "I need to create a subscription. Create a subscription for the Pro tier"
        - "I need to create a subscription. Set up recurring billing for the user"
        - "I need to create a subscription. Start a subscription with a 14-day trial"

  - name: cancel_subscription
    descriptions:
      minimal: "Cancel subscription"
      short: "Cancel an active subscription"
      medium: "Cancel a customer's subscription immediately or at the end of the current billing period."
      long: "Cancel an active subscription. Can cancel immediately or schedule cancellation at period end. Example: cancel_subscription(subscription_id='sub_123', at_period_end=true)."
      verbose: "Cancel a customer's subscription. Options: immediate cancellation (prorated refund possible), cancel at period end (access until period expires), or pause instead of cancel. Can provide cancellation reason for analytics. Example: cancel_subscription(subscription_id='sub_ABC123', at_period_end=true, cancellation_reason='too_expensive', feedback='Price is too high for my usage', prorate=true, invoice_now=false). Note: Canceling at period end maintains access until the paid period expires. Warning: Immediate cancellation may trigger prorated charges or refunds based on configuration."
    parameters:
      - name: subscription_id
        type: string
        description: "Subscription identifier"
        required: true
      - name: at_period_end
        type: boolean
        description: "Cancel at end of period"
        required: false
        default: false
      - name: cancellation_reason
        type: string
        description: "Reason for cancellation"
        required: false
        enum: ["too_expensive", "missing_features", "switched_service", "unused", "other"]
      - name: feedback
        type: string
        description: "Customer feedback"
        required: false
      - name: prorate
        type: boolean
        description: "Prorate final invoice"
        required: false
        default: true
    tags: ["subscription", "cancel", "billing", "churn"]
    test_prompts:
      single:
        - "Cancel the customer's subscription"
        - "End the subscription at the end of the month"
        - "Stop the recurring billing"
        - "Cancel the Pro plan subscription"
      single_clear:
        - "I need to cancel a subscription. Cancel the customer's subscription"
        - "I need to cancel a subscription. End the subscription at the end of the month"
        - "I need to cancel a subscription. Stop the recurring billing"
        - "I need to cancel a subscription. Cancel the Pro plan subscription"

  - name: create_invoice
    descriptions:
      minimal: "Create invoice"
      short: "Create an invoice for a customer"
      medium: "Create an invoice with line items for a customer with optional payment terms and due date."
      long: "Create an invoice for a customer. Add line items with descriptions and amounts. Set payment terms and due date. Example: create_invoice(customer_id='cus_123', items=[{\"description\": \"Consulting\", \"amount\": 50000}])."
      verbose: "Create a professional invoice for a customer. Supports: multiple line items, tax calculation, discounts, payment terms, automatic collection, memo/notes, and custom fields. Example: create_invoice(customer_id='cus_ABC', items=[{\"description\": \"Web Development\", \"amount\": 250000, \"quantity\": 1}, {\"description\": \"Hosting (1 year)\", \"amount\": 12000, \"quantity\": 1}], due_days=30, tax_rate=8.25, memo='Payment due within 30 days', auto_advance=true, collection_method='send_invoice'). Note: auto_advance=true automatically finalizes and sends the invoice. Warning: Finalized invoices cannot be modified; void and recreate if needed."
    parameters:
      - name: customer_id
        type: string
        description: "Customer identifier"
        required: true
      - name: items
        type: array
        description: "Invoice line items"
        required: true
      - name: due_days
        type: integer
        description: "Days until due"
        required: false
        default: 30
      - name: tax_rate
        type: number
        description: "Tax rate percentage"
        required: false
      - name: discount_amount
        type: integer
        description: "Discount amount"
        required: false
      - name: memo
        type: string
        description: "Invoice memo/notes"
        required: false
      - name: auto_advance
        type: boolean
        description: "Auto-finalize invoice"
        required: false
        default: false
      - name: collection_method
        type: string
        description: "Collection method"
        required: false
        enum: ["charge_automatically", "send_invoice"]
    tags: ["invoice", "billing", "payment", "accounts"]
    test_prompts:
      single:
        - "Create an invoice for $500"
        - "Bill the customer for the consulting work"
        - "Generate an invoice with multiple line items"
        - "Create a due invoice for the project"
      single_clear:
        - "Please create an invoice. Create an invoice for $500"
        - "Please create an invoice. Bill the customer for the consulting work"
        - "Please create an invoice. Generate an invoice with multiple line items"
        - "Please create an invoice. Create a due invoice for the project"

  - name: get_payment_status
    descriptions:
      minimal: "Get payment status"
      short: "Check the status of a payment"
      medium: "Retrieve the current status and details of a payment or charge."
      long: "Get detailed status information for a payment including state, amount, fees, and timeline. Example: get_payment_status(payment_id='pi_123')."
      verbose: "Retrieve comprehensive status and details for a payment. Returns: status (pending, succeeded, failed, canceled), amount, fees, net amount, payment method details, risk evaluation, receipt URL, refunds, disputes, and timeline of events. Example: get_payment_status(payment_id='pi_ABC123', expand=['customer', 'payment_method', 'latest_charge.balance_transaction']). Note: Status updates may be delayed for bank transfers. Warning: Contains sensitive payment details; ensure proper access controls."
    parameters:
      - name: payment_id
        type: string
        description: "Payment intent or charge ID"
        required: true
      - name: expand
        type: array
        description: "Related objects to expand"
        required: false
    tags: ["payment", "status", "check", "lookup"]
    test_prompts:
      single:
        - "What's the status of payment pi_123?"
        - "Check if the payment went through"
        - "Get details on the customer's payment"
        - "Has the charge been processed?"
      single_clear:
        - "I need to check a payment status. What's the status of payment pi_123?"
        - "I need to check a payment status. Check if the payment went through"
        - "I need to check a payment status. Get details on the customer's payment"
        - "I need to check a payment status. Has the charge been processed?"

  - name: create_customer
    descriptions:
      minimal: "Create customer"
      short: "Create a customer record for payments"
      medium: "Create a customer record to store payment methods and track transactions."
      long: "Create a customer record in the payment system. Store email, name, and attach payment methods for future use. Example: create_customer(email='user@example.com', name='John Doe')."
      verbose: "Create a customer record for payment processing. Stores: contact information, payment methods, billing address, default payment settings, and metadata. Customers can have multiple saved payment methods. Example: create_customer(email='john@company.com', name='John Doe', phone='+1555123456', address='{\"city\": \"San Francisco\", \"state\": \"CA\", \"country\": \"US\"}', metadata='{\"user_id\": \"usr_123\", \"plan\": \"enterprise\"}', tax_id='{\"type\": \"us_ein\", \"value\": \"12-3456789\"}'). Note: Customer records persist across payments. Warning: Ensure PCI compliance when handling customer payment data."
    parameters:
      - name: email
        type: string
        description: "Customer email"
        required: true
      - name: name
        type: string
        description: "Customer name"
        required: false
      - name: phone
        type: string
        description: "Phone number"
        required: false
      - name: address
        type: string
        description: "Address JSON"
        required: false
      - name: metadata
        type: string
        description: "Custom metadata JSON"
        required: false
      - name: payment_method
        type: string
        description: "Default payment method ID"
        required: false
      - name: tax_id
        type: string
        description: "Tax ID information"
        required: false
    tags: ["customer", "payment", "billing", "account"]
    test_prompts:
      single:
        - "Create a new customer for payments"
        - "Add a customer record for john@example.com"
        - "Set up a billing customer"
        - "Register the user for payment processing"
      single_clear:
        - "I need to create a customer record. Create a new customer for payments"
        - "I need to create a customer record. Add a customer record for john@example.com"
        - "I need to create a customer record. Set up a billing customer"
        - "I need to create a customer record. Register the user for payment processing"

  - name: add_payment_method
    descriptions:
      minimal: "Add payment method"
      short: "Add a payment method to a customer"
      medium: "Attach a payment method (card, bank account) to a customer for future payments."
      long: "Add a payment method to a customer's account. Supports cards, bank accounts, and digital wallets. Example: add_payment_method(customer_id='cus_123', payment_method_id='pm_456')."
      verbose: "Attach a payment method to a customer for reuse. Supported methods: credit/debit cards, bank accounts (ACH, SEPA), digital wallets (Apple Pay, Google Pay), and Buy Now Pay Later options. Can set as default for future payments. Example: add_payment_method(customer_id='cus_ABC', payment_method_id='pm_card_123', set_default=true, billing_details='{\"name\": \"John Doe\", \"email\": \"john@example.com\"}'). Note: Payment method tokens are created client-side for security. Warning: Validate payment method ownership before attaching to prevent fraud."
    parameters:
      - name: customer_id
        type: string
        description: "Customer identifier"
        required: true
      - name: payment_method_id
        type: string
        description: "Payment method token"
        required: true
      - name: set_default
        type: boolean
        description: "Set as default method"
        required: false
        default: false
      - name: billing_details
        type: string
        description: "Billing details JSON"
        required: false
    tags: ["payment", "method", "card", "customer", "billing"]
    test_prompts:
      single:
        - "Add the customer's credit card"
        - "Save the payment method to the customer"
        - "Attach the card to the account"
        - "Store the customer's bank account"
      single_clear:
        - "I need to add a payment method. Add the customer's credit card"
        - "I need to add a payment method. Save the payment method to the customer"
        - "I need to add a payment method. Attach the card to the account"
        - "I need to add a payment method. Store the customer's bank account"

  - name: create_payout
    descriptions:
      minimal: "Create payout"
      short: "Create a payout to a bank account"
      medium: "Transfer funds from your account balance to an external bank account or debit card."
      long: "Create a payout to transfer funds to a connected bank account. Specify amount and destination. Example: create_payout(amount=100000, destination='ba_123')."
      verbose: "Transfer funds from your platform balance to a bank account or debit card. Supports: standard payouts (1-3 days), instant payouts (minutes), and scheduled payouts. Example: create_payout(amount=500000, currency='usd', destination='ba_ABC123', method='standard', description='Monthly earnings', statement_descriptor='MYCOMPANY PAYOUT', metadata='{\"month\": \"2024-01\"}'). Note: Instant payouts have higher fees but arrive within minutes. Warning: Ensure sufficient available balance; pending balance cannot be paid out."
    parameters:
      - name: amount
        type: integer
        description: "Amount in smallest currency unit"
        required: true
      - name: currency
        type: string
        description: "Three-letter currency code"
        required: false
        default: "usd"
      - name: destination
        type: string
        description: "Bank account or card ID"
        required: false
      - name: method
        type: string
        description: "Payout method"
        required: false
        default: "standard"
        enum: ["standard", "instant"]
      - name: description
        type: string
        description: "Internal description"
        required: false
      - name: statement_descriptor
        type: string
        description: "Bank statement text"
        required: false
      - name: metadata
        type: string
        description: "Custom metadata JSON"
        required: false
    tags: ["payout", "transfer", "bank", "withdraw", "payment"]
    test_prompts:
      single:
        - "Transfer $1000 to my bank account"
        - "Create a payout of the available balance"
        - "Withdraw funds to the connected bank"
        - "Send an instant payout"
      single_clear:
        - "I need to create a payout. Transfer $1000 to my bank account"
        - "I need to create a payout. Create a payout of the available balance"
        - "I need to create a payout. Withdraw funds to the connected bank"
        - "I need to create a payout. Send an instant payout"

  - name: verify_payment_method
    descriptions:
      minimal: "Verify payment method"
      short: "Verify a payment method is valid"
      medium: "Verify that a payment method is valid and can be charged before processing a payment."
      long: "Verify a payment method by performing a zero-dollar authorization or micro-deposit verification. Example: verify_payment_method(payment_method_id='pm_123', type='card')."
      verbose: "Verify payment method validity before use. Methods: cards (zero-dollar auth, checks validity without charging), bank accounts (micro-deposits, two small deposits customer verifies). Returns verification status and any issues. Example: verify_payment_method(payment_method_id='pm_card_123', type='card', verification_method='instant', return_url='https://example.com/verify-complete'). Note: Bank account verification takes 1-2 business days for micro-deposits. Warning: Failed verifications may indicate fraud; handle accordingly."
    parameters:
      - name: payment_method_id
        type: string
        description: "Payment method to verify"
        required: true
      - name: type
        type: string
        description: "Payment method type"
        required: true
        enum: ["card", "bank_account"]
      - name: verification_method
        type: string
        description: "Verification method"
        required: false
        enum: ["instant", "micro_deposits"]
      - name: amounts
        type: array
        description: "Micro-deposit amounts (for bank)"
        required: false
      - name: return_url
        type: string
        description: "Return URL after verification"
        required: false
    tags: ["payment", "verify", "validation", "card", "bank"]
    test_prompts:
      single:
        - "Verify the customer's credit card"
        - "Check if the payment method is valid"
        - "Verify the bank account with micro-deposits"
        - "Validate the card before charging"
      single_clear:
        - "I need to verify a payment method. Verify the customer's credit card"
        - "I need to verify a payment method. Check if the payment method is valid"
        - "I need to verify a payment method. Verify the bank account with micro-deposits"
        - "I need to verify a payment method. Validate the card before charging"
  - name: create_invoice
    descriptions:
      minimal: "Create invoice"
      short: "Create a payment invoice"
      medium: "Create an invoice for a customer with line items and payment terms."
      long: "Create an invoice with itemized charges, due date, and payment options. Automatically sends to customer. Example: create_invoice(customer_id='cus_123', items='[{\"description\": \"Consulting\", \"amount\": 5000}]')."
      verbose: "Create professional invoices for customers. Features: line items, taxes, discounts, custom due dates, auto-send, payment links, recurring invoices. Supports: multiple currencies, custom branding, memo/notes, attachments. Example: create_invoice(customer_id='cus_ABC', items='[{\"description\": \"Web Development\", \"quantity\": 10, \"unit_price\": 15000}]', due_days=30, tax_percent=8.25, send_automatically=true, payment_methods='[\"card\", \"bank_transfer\"]'). Note: Invoices can be finalized and sent or kept as drafts. Warning: Finalized invoices cannot be edited."
    parameters:
      - name: customer_id
        type: string
        description: "Customer ID"
        required: true
      - name: items
        type: string
        description: "JSON array of line items"
        required: true
      - name: due_days
        type: integer
        description: "Days until due"
        required: false
        default: 30
      - name: tax_percent
        type: number
        description: "Tax percentage"
        required: false
      - name: discount_percent
        type: number
        description: "Discount percentage"
        required: false
      - name: memo
        type: string
        description: "Invoice memo/notes"
        required: false
      - name: send_automatically
        type: boolean
        description: "Send upon finalization"
        required: false
        default: true
    tags: ["payment", "invoice", "billing", "accounts", "receivable"]
    test_prompts:
      single:
        - "Create an invoice for the client"
        - "Generate invoice for consulting services"
        - "Bill the customer for the project"
        - "Send an invoice with net-30 terms"
      single_clear:
        - "Please create an invoice. Create an invoice for the client"
        - "Please create an invoice. Generate invoice for consulting services"
        - "Please create an invoice. Bill the customer for the project"
        - "Please create an invoice. Send an invoice with net-30 terms"

  - name: manage_subscription_billing
    descriptions:
      minimal: "Manage subscription"
      short: "Manage subscription billing"
      medium: "Create, update, or cancel recurring subscription billing for customers."
      long: "Manage subscription lifecycles including creation, upgrades, downgrades, and cancellation. Example: manage_subscription_billing(action='create', customer_id='cus_123', plan_id='plan_pro')."
      verbose: "Complete subscription billing management. Actions: create, update (change plan), cancel, pause, resume, preview_proration. Features: trial periods, proration, billing anchors, quantity changes, addons. Example: manage_subscription_billing(action='create', customer_id='cus_ABC', plan_id='plan_enterprise', quantity=5, trial_days=14, billing_cycle_anchor='month_start', cancel_at_period_end=false). Note: Proration is automatic on plan changes. Warning: Immediate cancellation stops access; use cancel_at_period_end for grace period."
    parameters:
      - name: action
        type: string
        description: "Subscription action"
        required: true
        enum: ["create", "update", "cancel", "pause", "resume", "preview"]
      - name: customer_id
        type: string
        description: "Customer ID"
        required: false
      - name: subscription_id
        type: string
        description: "Existing subscription ID"
        required: false
      - name: plan_id
        type: string
        description: "Plan/price ID"
        required: false
      - name: quantity
        type: integer
        description: "Subscription quantity"
        required: false
        default: 1
      - name: trial_days
        type: integer
        description: "Trial period days"
        required: false
      - name: cancel_at_period_end
        type: boolean
        description: "Cancel at period end vs immediately"
        required: false
        default: true
    tags: ["payment", "subscription", "recurring", "billing", "plan"]
    test_prompts:
      single:
        - "Create a monthly subscription"
        - "Upgrade customer to premium plan"
        - "Cancel the subscription at period end"
        - "Start a free trial subscription"
      single_clear:
        - "I need to manage subscription billing. Create a monthly subscription"
        - "I need to manage subscription billing. Upgrade customer to premium plan"
        - "I need to manage subscription billing. Cancel the subscription at period end"
        - "I need to manage subscription billing. Start a free trial subscription"

  - name: calculate_tax
    descriptions:
      minimal: "Calculate tax"
      short: "Calculate sales tax for a transaction"
      medium: "Calculate applicable sales tax or VAT for a transaction based on location and items."
      long: "Calculate sales tax, VAT, or GST based on customer location and product types. Returns tax breakdown. Example: calculate_tax(amount=10000, country='US', state='CA', product_type='digital_goods')."
      verbose: "Calculate transaction taxes with jurisdiction awareness. Supports: US sales tax (state/county/city), EU VAT, UK VAT, Canadian GST/HST/PST, Australian GST, international taxes. Features: tax exemptions, product categorization, B2B reverse charge, tax-inclusive pricing. Example: calculate_tax(amount=15000, country='US', state='NY', city='New York', product_type='saas', customer_tax_exempt=false, inclusive=false). Returns: tax_amount, rate, jurisdiction breakdown. Note: Rates are updated automatically. Warning: Consult tax advisor for complex scenarios."
    parameters:
      - name: amount
        type: integer
        description: "Transaction amount"
        required: true
      - name: country
        type: string
        description: "Two-letter country code"
        required: true
      - name: state
        type: string
        description: "State/province code"
        required: false
      - name: city
        type: string
        description: "City name"
        required: false
      - name: postal_code
        type: string
        description: "Postal/ZIP code"
        required: false
      - name: product_type
        type: string
        description: "Product category"
        required: false
        enum: ["physical_goods", "digital_goods", "saas", "services", "food", "clothing"]
      - name: customer_tax_exempt
        type: boolean
        description: "Customer is tax exempt"
