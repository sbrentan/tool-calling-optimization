  - name: void_payment
    descriptions:
      minimal: "Void payment"
      short: "Void a pending payment"
      medium: "Cancel a payment before it has been captured or settled."
      long: "Void an authorized but uncaptured payment. Example: void_payment(payment_id='pi_123', reason='customer_request')."
      verbose: "Cancel payments before settlement. Only works on: authorized but uncaptured payments, pending ACH transfers. Example: void_payment(payment_id='pi_ABC', reason='duplicate', notify_customer=true). Reasons: 'duplicate', 'fraudulent', 'customer_request', 'order_cancelled'. Note: Voiding is faster than refunding and incurs no fees. Warning: Cannot void captured/settled payments; use refund instead."
    parameters:
      - name: payment_id
        type: string
        description: "Payment or authorization ID"
        required: true
      - name: reason
        type: string
        description: "Void reason"
        required: true
        enum: ["duplicate", "fraudulent", "customer_request", "order_cancelled"]
      - name: notify_customer
        type: boolean
        description: "Send cancellation notice"
        required: false
        default: true
    tags: ["payment", "void", "cancel", "authorization", "pending"]
    test_prompts:
      single:
        - "Void the payment"
        - "Cancel pending authorization"
        - "Void uncaptured payment"
        - "Cancel the transaction"
      single_clear:
        - "I need to void a payment. Void the payment"
        - "I need to void a payment. Cancel pending authorization"
        - "I need to void a payment. Void uncaptured payment"
        - "I need to void a payment. Cancel the transaction"