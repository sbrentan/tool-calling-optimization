      verbose: "Retrieve detailed account balance information. Balances: available (can withdraw), pending (processing), reserved (held for disputes). Breakdown by source type and currency. Example: get_payment_balance(currency='usd', include_pending=true, breakdown_by_source=true). Returns: {\"available\": [{\"amount\": 150000, \"currency\": \"usd\"}], \"pending\": [{\"amount\": 25000, \"currency\": \"usd\"}], \"reserved\": 5000}. Note: Pending balance typically clears in 2-7 days. Warning: Reserved funds are not available for payout."
    parameters:
      - name: currency
        type: string
        description: "Filter by currency"
        required: false
      - name: include_pending
        type: boolean
        description: "Include pending balance"
        required: false
        default: true
      - name: breakdown_by_source
        type: boolean
        description: "Show source breakdown"
        required: false
        default: false
