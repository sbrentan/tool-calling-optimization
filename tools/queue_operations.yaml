category: queue_operations
description: Message queue and job processing operations
tools:
  - name: enqueue_job
    descriptions:
      minimal: "Enqueue job"
      short: "Add a job to queue"
      medium: "Add a job to the message queue for processing."
      long: "Enqueue a job for background processing. Set priority and delay. Example: enqueue_job(queue='emails', job='{\"type\": \"welcome\", \"to\": \"...\"}'."
      verbose: "Add jobs to message queue for asynchronous processing. Features: priority levels, delayed execution, job metadata, retry configuration. Example: enqueue_job(queue='notifications', job='{\"type\": \"push\", \"user_id\": \"123\", \"message\": \"...\"}', priority='high', delay=0, max_retries=3, metadata='{\"source\": \"api\"}'). Note: Jobs should be idempotent. Warning: Queue backlog may cause delays."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: job
        type: string
        description: "Job payload (JSON)"
        required: true
      - name: priority
        type: string
        description: "Job priority"
        required: false
        default: "normal"
        enum: ["low", "normal", "high", "critical"]
      - name: delay
        type: integer
        description: "Delay before processing (seconds)"
        required: false
        default: 0
      - name: max_retries
        type: integer
        description: "Maximum retry attempts"
        required: false
        default: 3
      - name: metadata
        type: string
        description: "Job metadata (JSON)"
        required: false
    tags: ["queue", "job", "enqueue", "async", "background"]
    test_prompts:
      single:
        - "Add job to queue"
        - "Queue the email"
        - "Enqueue background task"
        - "Schedule async job"
      single_clear:
        - "I need to add a job to the queue for processing. Add job to queue"
        - "I need to add a job to the queue for processing. Queue the email"
        - "I need to add a job to the queue for processing. Enqueue background task"
        - "I need to add a job to the queue for processing. Schedule async job"

  - name: process_jobs
    descriptions:
      minimal: "Process jobs"
      short: "Process queued jobs"
      medium: "Start processing jobs from a queue."
      long: "Process jobs from queue. Start worker to consume and execute jobs. Example: process_jobs(queue='emails', concurrency=5)."
      verbose: "Job processing/consumption from queue. Options: concurrency (parallel jobs), batch size, timeout, graceful shutdown. Features: automatic retries, dead-letter queue, job acknowledgment. Example: process_jobs(queue='image-processing', concurrency=3, timeout=300, batch_size=10, dead_letter='failed-images'). Note: Ensure handlers are idempotent. Warning: High concurrency may overwhelm resources."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: concurrency
        type: integer
        description: "Concurrent workers"
        required: false
        default: 1
      - name: timeout
        type: integer
        description: "Job timeout (seconds)"
        required: false
        default: 60
      - name: batch_size
        type: integer
        description: "Jobs per batch"
        required: false
        default: 1
      - name: dead_letter
        type: string
        description: "Dead-letter queue name"
        required: false
    tags: ["queue", "process", "worker", "consume", "jobs"]
    test_prompts:
      single:
        - "Start processing jobs"
        - "Run the worker"
        - "Process queue messages"
        - "Consume from queue"
      single_clear:
        - "I want to start processing jobs from the queue. Start processing jobs"
        - "I want to start processing jobs from the queue. Run the worker"
        - "I want to start processing jobs from the queue. Process queue messages"
        - "I want to start processing jobs from the queue. Consume from queue"

  - name: get_queue_stats
    descriptions:
      minimal: "Queue stats"
      short: "Get queue statistics"
      medium: "Retrieve statistics about queue status and performance."
      long: "Get queue statistics. View pending, processing, and failed job counts. Example: get_queue_stats(queue='emails')."
      verbose: "Queue performance and status statistics. Metrics: pending count, processing count, completed count, failed count, throughput, latency percentiles. Example: get_queue_stats(queue='orders', period='1h', include_failed=true). Note: Monitor queue depth to detect backlogs. Warning: Large queues may indicate processing issues."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: false
      - name: period
        type: string
        description: "Stats period"
        required: false
        default: "1h"
      - name: include_failed
        type: boolean
        description: "Include failed job stats"
        required: false
        default: true
    tags: ["queue", "stats", "metrics", "monitoring", "status"]
    test_prompts:
      single:
        - "Get queue statistics"
        - "How many jobs are pending?"
        - "Check queue status"
        - "Show queue metrics"
      single_clear:
        - "I need to retrieve statistics about the queue. Get queue statistics"
        - "I need to retrieve statistics about the queue. How many jobs are pending?"
        - "I need to retrieve statistics about the queue. Check queue status"
        - "I need to retrieve statistics about the queue. Show queue metrics"

  - name: retry_failed_jobs
    descriptions:
      minimal: "Retry failed"
      short: "Retry failed jobs"
      medium: "Retry jobs that have failed processing."
      long: "Retry failed jobs. Move from dead-letter queue back to main queue. Example: retry_failed_jobs(queue='emails', filter='type:welcome')."
      verbose: "Retry failed jobs from dead-letter queue. Options: filter by job type, error type, time range; single or batch retry. Example: retry_failed_jobs(queue='payments', filter='{\"error\": \"timeout\", \"since\": \"2024-01-01\"}', limit=100, reset_attempts=true). Note: Fix root cause before retrying. Warning: Retrying may cause duplicate processing."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: filter
        type: string
        description: "Job filter (JSON)"
        required: false
      - name: job_ids
        type: string
        description: "JSON array of specific job IDs"
        required: false
      - name: limit
        type: integer
        description: "Maximum jobs to retry"
        required: false
        default: 10
      - name: reset_attempts
        type: boolean
        description: "Reset retry counter"
        required: false
        default: false
    tags: ["queue", "retry", "failed", "dead-letter", "recover"]
    test_prompts:
      single:
        - "Retry failed jobs"
        - "Reprocess failed emails"
        - "Move from dead-letter queue"
        - "Retry the timeout failures"
      single_clear:
        - "I want to retry jobs that have failed processing. Retry failed jobs"
        - "I want to retry jobs that have failed processing. Reprocess failed emails"
        - "I want to retry jobs that have failed processing. Move from dead-letter queue"
        - "I want to retry jobs that have failed processing. Retry the timeout failures"

  - name: purge_queue
    descriptions:
      minimal: "Purge queue"
      short: "Purge queue messages"
      medium: "Delete all or filtered messages from a queue."
      long: "Purge messages from queue. Clear pending jobs by filter or all. Example: purge_queue(queue='test-queue', confirm=true)."
      verbose: "Queue purge/cleanup operations. Targets: 'pending' (unprocessed), 'completed' (finished), 'failed' (dead-letter), 'all'. Filters: job type, age, metadata. Example: purge_queue(queue='notifications', target='completed', older_than='7d', confirm=true). Note: Purging is irreversible. Warning: Pending jobs will not be processed."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: target
        type: string
        description: "What to purge"
        required: false
        default: "pending"
        enum: ["pending", "completed", "failed", "all"]
      - name: older_than
        type: string
        description: "Age filter (e.g., '7d')"
        required: false
      - name: filter
        type: string
        description: "Job filter (JSON)"
        required: false
      - name: confirm
        type: boolean
        description: "Confirm destructive action"
        required: true
    tags: ["queue", "purge", "delete", "clear", "cleanup"]
    test_prompts:
      single:
        - "Purge the queue"
        - "Clear all pending jobs"
        - "Delete old completed jobs"
        - "Clean up failed jobs"
      single_clear:
        - "I need to delete messages from the queue. Purge the queue"
        - "I need to delete messages from the queue. Clear all pending jobs"
        - "I need to delete messages from the queue. Delete old completed jobs"
        - "I need to delete messages from the queue. Clean up failed jobs"

  - name: pause_queue
    descriptions:
      minimal: "Pause queue"
      short: "Pause queue processing"
      medium: "Pause or resume queue processing."
      long: "Pause or resume queue processing. Stop workers without losing jobs. Example: pause_queue(queue='emails', action='pause')."
      verbose: "Queue pause/resume operations. Actions: 'pause' (stop processing), 'resume' (restart processing). Use cases: maintenance, debugging, rate limiting. Example: pause_queue(queue='bulk-emails', action='pause', drain=true, timeout=60). Note: Pausing doesn't delete jobs. Warning: Long pauses may cause queue backlog."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: action
        type: string
        description: "Pause or resume"
        required: true
        enum: ["pause", "resume"]
      - name: drain
        type: boolean
        description: "Wait for current jobs to complete"
        required: false
        default: true
      - name: timeout
        type: integer
        description: "Drain timeout (seconds)"
        required: false
        default: 30
    tags: ["queue", "pause", "resume", "stop", "maintenance"]
    test_prompts:
      single:
        - "Pause the queue"
        - "Stop processing jobs"
        - "Resume the email queue"
        - "Pause for maintenance"
      single_clear:
        - "I want to pause or resume queue processing. Pause the queue"
        - "I want to pause or resume queue processing. Stop processing jobs"
        - "I want to pause or resume queue processing. Resume the email queue"
        - "I want to pause or resume queue processing. Pause for maintenance"

  - name: schedule_recurring
    descriptions:
      minimal: "Schedule recurring"
      short: "Schedule recurring job"
      medium: "Create a recurring/scheduled job with cron expression."
      long: "Schedule recurring jobs. Use cron expressions for periodic tasks. Example: schedule_recurring(name='daily-cleanup', queue='maintenance', cron='0 2 * * *', job='{...}')."
      verbose: "Create scheduled/recurring jobs. Scheduling: cron expression or interval. Features: timezone support, overlap prevention, job payload. Example: schedule_recurring(name='hourly-sync', queue='sync', cron='0 * * * *', job='{\"type\": \"full_sync\"}', timezone='America/New_York', prevent_overlap=true). Note: Cron uses 5-field format. Warning: Overlapping jobs may cause issues."
    parameters:
      - name: name
        type: string
        description: "Schedule name"
        required: true
      - name: queue
        type: string
        description: "Target queue"
        required: true
      - name: cron
        type: string
        description: "Cron expression"
        required: true
      - name: job
        type: string
        description: "Job payload (JSON)"
        required: true
      - name: timezone
        type: string
        description: "Timezone for schedule"
        required: false
        default: "UTC"
      - name: prevent_overlap
        type: boolean
        description: "Prevent overlapping runs"
        required: false
        default: true
    tags: ["queue", "schedule", "cron", "recurring", "periodic"]
    test_prompts:
      single:
        - "Schedule a daily job"
        - "Create recurring task"
        - "Set up cron job"
        - "Schedule hourly cleanup"
      single_clear:
        - "I need to create a recurring scheduled job. Schedule a daily job"
        - "I need to create a recurring scheduled job. Create recurring task"
        - "I need to create a recurring scheduled job. Set up cron job"
        - "I need to create a recurring scheduled job. Schedule hourly cleanup"

  - name: get_job_status
    descriptions:
      minimal: "Job status"
      short: "Get job status"
      medium: "Check the status of a specific job."
      long: "Get job status by ID. Check if pending, processing, completed, or failed. Example: get_job_status(job_id='abc-123')."
      verbose: "Query job status and details. Information: status, progress, result, error, timing, attempts. Example: get_job_status(job_id='job-abc-123', include_logs=true). Returns: {\"status\": \"completed\", \"progress\": 100, \"result\": {...}, \"started_at\": \"...\", \"completed_at\": \"...\"}. Note: Job history may be pruned. Warning: Not all job details are retained long-term."
    parameters:
      - name: job_id
        type: string
        description: "Job identifier"
        required: true
      - name: include_logs
        type: boolean
        description: "Include processing logs"
        required: false
        default: false
      - name: include_result
        type: boolean
        description: "Include job result data"
        required: false
        default: true
    tags: ["queue", "job", "status", "check", "track"]
    test_prompts:
      single:
        - "Check job status"
        - "Is the job done?"
        - "Get job progress"
        - "Track job completion"
      single_clear:
        - "I want to check the status of a specific job. Check job status"
        - "I want to check the status of a specific job. Is the job done?"
        - "I want to check the status of a specific job. Get job progress"
        - "I want to check the status of a specific job. Track job completion"

  - name: create_queue
    descriptions:
      minimal: "Create queue"
      short: "Create a message queue"
      medium: "Create a new message queue with configuration."
      long: "Create a new message queue. Set retention, visibility timeout, and other settings. Example: create_queue(name='orders', visibility_timeout=30)."
      verbose: "Create message queue with configuration. Settings: visibility timeout (reprocessing window), message retention, delay default, dead-letter policy, encryption. Example: create_queue(name='high-priority-orders', visibility_timeout=60, retention='7d', dead_letter='{\"queue\": \"failed-orders\", \"max_receives\": 3}', encryption=true). Note: Queue names should follow naming conventions. Warning: Changing queue settings may require recreation."
    parameters:
      - name: name
        type: string
        description: "Queue name"
        required: true
      - name: visibility_timeout
        type: integer
        description: "Visibility timeout (seconds)"
        required: false
        default: 30
      - name: retention
        type: string
        description: "Message retention period"
        required: false
        default: "4d"
      - name: delay
        type: integer
        description: "Default delay (seconds)"
        required: false
        default: 0
      - name: dead_letter
        type: string
        description: "Dead-letter queue config (JSON)"
        required: false
    tags: ["queue", "create", "setup", "configure", "new"]
    test_prompts:
      single:
        - "Create a new queue"
        - "Set up message queue"
        - "Create orders queue"
        - "Configure new queue"
      single_clear:
        - "I need to create a new message queue. Create a new queue"
        - "I need to create a new message queue. Set up message queue"
        - "I need to create a new message queue. Create orders queue"
        - "I need to create a new message queue. Configure new queue"

  - name: delete_queue
    descriptions:
      minimal: "Delete queue"
      short: "Delete a message queue"
      medium: "Delete a message queue and all its messages."
      long: "Delete a message queue. Removes queue and all pending messages. Example: delete_queue(name='old-queue', confirm=true)."
      verbose: "Delete message queue permanently. Effects: queue deleted, all messages lost, consumers disconnected. Checks: queue must be empty or force flag used. Example: delete_queue(name='deprecated-notifications', force=true, confirm=true). Note: This action is irreversible. Warning: Ensure no active producers or consumers."
    parameters:
      - name: name
        type: string
        description: "Queue name"
        required: true
      - name: force
        type: boolean
        description: "Delete even if not empty"
        required: false
        default: false
      - name: confirm
        type: boolean
        description: "Confirm deletion"
        required: true
    tags: ["queue", "delete", "remove", "cleanup", "destroy"]
    test_prompts:
      single:
        - "Delete the queue"
        - "Remove old queue"
        - "Clean up unused queue"
        - "Delete deprecated queue"
      single_clear:
        - "I want to delete a message queue and its messages. Delete the queue"
        - "I want to delete a message queue and its messages. Remove old queue"
        - "I want to delete a message queue and its messages. Clean up unused queue"
        - "I want to delete a message queue and its messages. Delete deprecated queue"
  - name: schedule_message
    descriptions:
      minimal: "Schedule message"
      short: "Schedule delayed message"
      medium: "Schedule a message for future delivery to a queue."
      long: "Schedule message delivery for a future time. Useful for delayed processing. Example: schedule_message(queue='reminders', message='check status', delay_seconds=3600)."
      verbose: "Schedule messages for delayed delivery. Use cases: reminders, scheduled tasks, rate limiting, workflow delays. Example: schedule_message(queue='order_followup', message='{\"order_id\": \"123\", \"action\": \"send_review_request\"}', delay_seconds=86400, attributes='{\"type\": \"followup\"}'). Returns: message ID, scheduled time. Note: Maximum delay varies by provider (typically 15 min to 7 days). Warning: Scheduled messages still count against queue limits."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: message
        type: string
        description: "Message content"
        required: true
      - name: delay_seconds
        type: integer
        description: "Delay in seconds"
        required: true
      - name: attributes
        type: string
        description: "JSON message attributes"
        required: false
    tags: ["queue", "schedule", "delay", "future", "timer"]
    test_prompts:
      single:
        - "Schedule message for later"
        - "Send delayed message"
        - "Queue message in 1 hour"
        - "Schedule reminder message"
      single_clear:
        - "I need to schedule a message for future delivery. Schedule message for later"
        - "I need to schedule a message for future delivery. Send delayed message"
        - "I need to schedule a message for future delivery. Queue message in 1 hour"
        - "I need to schedule a message for future delivery. Schedule reminder message"

  - name: configure_dead_letter_queue
    descriptions:
      minimal: "Configure DLQ"
      short: "Configure dead letter queue"
      medium: "Set up a dead letter queue for failed message handling."
      long: "Configure dead letter queue for messages that fail processing. Example: configure_dead_letter_queue(source='orders', dlq='orders-failed', max_retries=3)."
      verbose: "Set up dead letter queues (DLQ) for failed message handling. Purpose: capture messages that can't be processed for debugging and reprocessing. Example: configure_dead_letter_queue(source='payment-processing', dlq='payment-failures', max_retries=3, alert_threshold=10, alert_email='ops@company.com'). Note: Messages move to DLQ after max_retries. Warning: Monitor DLQ regularly to prevent message loss."
    parameters:
      - name: source
        type: string
        description: "Source queue name"
        required: true
      - name: dlq
        type: string
        description: "Dead letter queue name"
        required: true
      - name: max_retries
        type: integer
        description: "Max processing attempts"
        required: true
      - name: create_dlq
        type: boolean
        description: "Create DLQ if not exists"
        required: false
        default: true
      - name: alert_threshold
        type: integer
        description: "Alert when DLQ reaches count"
        required: false
      - name: alert_email
        type: string
        description: "Alert notification email"
        required: false
    tags: ["queue", "dlq", "dead_letter", "failures", "error"]
    test_prompts:
      single:
        - "Set up dead letter queue"
        - "Configure DLQ for failures"
        - "Handle failed messages"
        - "Create failure queue"
      single_clear:
        - "I want to configure a dead letter queue for failed messages. Set up dead letter queue"
        - "I want to configure a dead letter queue for failed messages. Configure DLQ for failures"
        - "I want to configure a dead letter queue for failed messages. Handle failed messages"
        - "I want to configure a dead letter queue for failed messages. Create failure queue"

  - name: batch_send_messages
    descriptions:
      minimal: "Batch send"
      short: "Send messages in batch"
      medium: "Send multiple messages to a queue in a single batch operation."
      long: "Send multiple messages in one request. More efficient than individual sends. Example: batch_send_messages(queue='notifications', messages='[{\"body\": \"msg1\"}, {\"body\": \"msg2\"}]')."
      verbose: "Efficient batch message sending. Benefits: reduced API calls, better throughput, atomic operations. Example: batch_send_messages(queue='events', messages='[{\"body\": \"{\\\"event\\\": \\\"click\\\"}\", \"delay\": 0}, {\"body\": \"{\\\"event\\\": \\\"purchase\\\"}\", \"priority\": \"high\"}]', fail_on_error=false). Returns: success/failure status per message. Note: Maximum batch size typically 10-100 messages. Warning: Partial failures possible; check individual statuses."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: messages
        type: string
        description: "JSON array of messages"
        required: true
      - name: fail_on_error
        type: boolean
        description: "Fail entire batch on any error"
        required: false
        default: false
    tags: ["queue", "batch", "send", "bulk", "messages"]
    test_prompts:
      single:
        - "Send batch of messages"
        - "Queue multiple messages"
        - "Bulk send to queue"
        - "Batch enqueue messages"
      single_clear:
        - "I need to send multiple messages to the queue at once. Send batch of messages"
        - "I need to send multiple messages to the queue at once. Queue multiple messages"
        - "I need to send multiple messages to the queue at once. Bulk send to queue"
        - "I need to send multiple messages to the queue at once. Batch enqueue messages"

  - name: redrive_messages
    descriptions:
      minimal: "Redrive messages"
      short: "Redrive failed messages"
      medium: "Move messages from dead letter queue back to source queue for reprocessing."
      long: "Redrive messages from DLQ back to source queue. Retry failed messages after fixing issues. Example: redrive_messages(dlq='orders-failed', destination='orders', count=100)."
      verbose: "Redrive (replay) messages from dead letter queue to source queue. Use after fixing the processing issue. Example: redrive_messages(dlq='payment-failures', destination='payment-processing', count=50, filter='{\"age_hours\": 24}', velocity=10). Returns: messages redriven, remaining in DLQ. Note: Process slowly to avoid overwhelming consumers. Warning: Redriven messages may fail again if root cause not resolved."
    parameters:
      - name: dlq
        type: string
        description: "Dead letter queue name"
        required: true
      - name: destination
        type: string
        description: "Destination queue name"
        required: true
      - name: count
        type: integer
        description: "Number of messages to redrive"
        required: false
        default: 100
      - name: filter
        type: string
        description: "JSON filter for messages"
        required: false
      - name: velocity
        type: integer
        description: "Messages per second"
        required: false
        default: 10
    tags: ["queue", "redrive", "dlq", "retry", "replay"]
    test_prompts:
      single:
        - "Redrive failed messages"
        - "Retry DLQ messages"
        - "Move messages back to queue"
        - "Reprocess failed items"
      single_clear:
        - "I want to move messages from the dead letter queue back to the source. Redrive failed messages"
        - "I want to move messages from the dead letter queue back to the source. Retry DLQ messages"
        - "I want to move messages from the dead letter queue back to the source. Move messages back to queue"
        - "I want to move messages from the dead letter queue back to the source. Reprocess failed items"

  - name: set_queue_attributes
    descriptions:
      minimal: "Set attributes"
      short: "Set queue attributes"
      medium: "Configure queue settings like retention, visibility, and limits."
      long: "Update queue configuration settings. Adjust retention, timeouts, and limits. Example: set_queue_attributes(queue='orders', visibility_timeout=60, retention_days=14)."
      verbose: "Configure queue behavior and limits. Attributes: visibility_timeout (processing time), retention (message TTL), max_size (bytes), delay (default delay), encryption. Example: set_queue_attributes(queue='high-priority', visibility_timeout=120, retention_days=7, max_message_size=262144, encryption='kms', kms_key='alias/my-key'). Note: Changes apply to new messages immediately. Warning: Reducing retention may cause message loss."
    parameters:
      - name: queue
        type: string
        description: "Queue name"
        required: true
      - name: visibility_timeout
        type: integer
        description: "Visibility timeout (seconds)"
        required: false
      - name: retention_days
        type: integer
        description: "Message retention (days)"
        required: false
      - name: max_message_size
        type: integer
        description: "Max message size (bytes)"
        required: false
      - name: delay_seconds
        type: integer
        description: "Default message delay"
        required: false
      - name: encryption
        type: string
        description: "Encryption type"
        required: false
        enum: ["none", "sse", "kms"]
    tags: ["queue", "attributes", "configuration", "settings", "update"]
    test_prompts:
      single:
        - "Change queue timeout"
        - "Update retention period"
        - "Configure queue settings"
        - "Set message size limit"
      single_clear:
        - "I need to configure queue settings like retention and visibility. Change queue timeout"
        - "I need to configure queue settings like retention and visibility. Update retention period"
        - "I need to configure queue settings like retention and visibility. Configure queue settings"
        - "I need to configure queue settings like retention and visibility. Set message size limit"

  - name: subscribe_to_queue
    descriptions:
      minimal: "Subscribe to queue"
      short: "Subscribe endpoint to queue"
      medium: "Subscribe an endpoint to receive messages from a queue."
      long: "Create subscription for push-based message delivery. Messages sent to endpoint. Example: subscribe_to_queue(queue='events', endpoint='https://api.example.com/webhook')."
      verbose: "Subscribe endpoints for push-based delivery. Endpoint types: HTTP/HTTPS, Lambda, email, SMS. Example: subscribe_to_queue(queue='notifications', endpoint='https://api.example.com/hooks/notifications', protocol='https', filter='{\"event_type\": [\"order_created\", \"order_shipped\"]}', retry_policy='{\"max_retries\": 3, \"backoff\": \"exponential\"}'). Note: Endpoint must confirm subscription. Warning: Secure endpoints with signature verification."
    parameters:
      - name: queue
        type: string
        description: "Queue or topic name"
        required: true
      - name: endpoint
        type: string
        description: "Subscriber endpoint"
        required: true
      - name: protocol
        type: string
        description: "Endpoint protocol"
        required: true
        enum: ["https", "http", "lambda", "email", "sms"]
      - name: filter
        type: string
        description: "JSON message filter"
        required: false
      - name: retry_policy
        type: string
