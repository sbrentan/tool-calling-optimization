category: testing_operations
description: Software testing and quality assurance operations
tools:
  - name: run_tests
    descriptions:
      minimal: "Run tests"
      short: "Run test suites"
      medium: "Execute automated test suites and return results."
      long: "Run automated tests. Execute unit, integration, or E2E tests. Example: run_tests(suite='unit', path='tests/', pattern='test_*.py')."
      verbose: "Execute automated test suites. Types: 'unit', 'integration', 'e2e', 'regression', 'smoke'. Options: test path, pattern matching, parallel execution, coverage. Example: run_tests(suite='unit', path='tests/unit/', pattern='test_*.py', parallel=4, coverage=true, fail_fast=true). Output: passed/failed counts, duration, failures, coverage report. Note: Run in isolated environment. Warning: E2E tests may require external services."
    parameters:
      - name: suite
        type: string
        description: "Test suite type"
        required: false
        default: "all"
        enum: ["unit", "integration", "e2e", "regression", "smoke", "all"]
      - name: path
        type: string
        description: "Test directory or file path"
        required: false
      - name: pattern
        type: string
        description: "Test file pattern"
        required: false
      - name: parallel
        type: integer
        description: "Parallel test runners"
        required: false
        default: 1
      - name: coverage
        type: boolean
        description: "Collect code coverage"
        required: false
        default: false
      - name: fail_fast
        type: boolean
        description: "Stop on first failure"
        required: false
        default: false
    tags: ["testing", "test", "run", "suite", "automated"]
    test_prompts:
      single:
        - "Run the unit tests"
        - "Execute the test suite"
        - "Run tests with coverage"
        - "Run integration tests"
      single_clear:
        - "I need to run tests. Run the unit tests"
        - "I need to run tests. Execute the test suite"
        - "I need to run tests. Run tests with coverage"
        - "I need to run tests. Run integration tests"

  - name: generate_test
    descriptions:
      minimal: "Generate test"
      short: "Generate test cases"
      medium: "Auto-generate test cases for a function or module."
      long: "Generate test cases automatically. Create unit tests based on function signatures. Example: generate_test(file='src/utils.py', function='calculate_total', framework='pytest')."
      verbose: "Auto-generate test cases using AI/static analysis. Features: infer inputs from types, generate edge cases, mock dependencies, setup fixtures. Frameworks: pytest, jest, junit, mocha, rspec. Example: generate_test(file='src/services/payment.py', function='process_payment', framework='pytest', include_mocks=true, edge_cases=true, docstring=true). Note: Generated tests should be reviewed and customized. Warning: Complex logic may need manual test design."
    parameters:
      - name: file
        type: string
        description: "Source file path"
        required: true
      - name: function
        type: string
        description: "Function/method name"
        required: false
      - name: framework
        type: string
        description: "Test framework"
        required: false
        default: "pytest"
        enum: ["pytest", "jest", "junit", "mocha", "rspec", "unittest"]
      - name: include_mocks
        type: boolean
        description: "Generate mock objects"
        required: false
        default: true
      - name: edge_cases
        type: boolean
        description: "Include edge cases"
        required: false
        default: true
    tags: ["testing", "generate", "unit", "cases", "automated"]
    test_prompts:
      single:
        - "Generate tests for this function"
        - "Create unit tests"
        - "Auto-generate test cases"
        - "Write tests for the module"
      single_clear:
        - "I need to generate test cases. Generate tests for this function"
        - "I need to generate test cases. Create unit tests"
        - "I need to generate test cases. Auto-generate test cases"
        - "I need to generate test cases. Write tests for the module"

  - name: run_load_test
    descriptions:
      minimal: "Load test"
      short: "Run a load test"
      medium: "Execute performance and load testing against an endpoint."
      long: "Run load/performance tests. Simulate concurrent users and measure response times. Example: run_load_test(url='https://api.example.com/users', users=100, duration=60)."
      verbose: "Performance and load testing execution. Metrics: response time, throughput, error rate, percentiles. Patterns: constant load, ramp-up, spike, stress. Example: run_load_test(url='https://api.example.com/users', method='GET', users=100, duration=300, ramp_up=60, headers='{\"Authorization\": \"Bearer ...\"}', assertions='{\"p95_response_time\": 500, \"error_rate\": 0.01}'). Note: Coordinate with ops before load testing production. Warning: May affect system performance."
    parameters:
      - name: url
        type: string
        description: "Target URL"
        required: true
      - name: method
        type: string
        description: "HTTP method"
        required: false
        default: "GET"
      - name: users
        type: integer
        description: "Concurrent virtual users"
        required: false
        default: 10
      - name: duration
        type: integer
        description: "Test duration (seconds)"
        required: false
        default: 60
      - name: ramp_up
        type: integer
        description: "Ramp-up time (seconds)"
        required: false
        default: 10
      - name: headers
        type: string
        description: "JSON request headers"
        required: false
      - name: body
        type: string
        description: "Request body"
        required: false
    tags: ["testing", "load", "performance", "stress", "benchmark"]
    test_prompts:
      single:
        - "Run a load test"
        - "Performance test the API"
        - "Stress test with 100 users"
        - "Benchmark the endpoint"
      single_clear:
        - "I need to run a load test. Run a load test"
        - "I need to run a load test. Performance test the API"
        - "I need to run a load test. Stress test with 100 users"
        - "I need to run a load test. Benchmark the endpoint"

  - name: create_mock
    descriptions:
      minimal: "Create mock"
      short: "Create a mock service"
      medium: "Create a mock API or service for testing."
      long: "Create mock APIs for testing. Define endpoints and responses. Example: create_mock(name='payment-api', endpoints='[{\"path\": \"/charge\", \"response\": {...}}]')."
      verbose: "Create mock services for integration testing. Features: define endpoints, static/dynamic responses, response delays, conditional responses. Example: create_mock(name='payment-api', base_url='/mock/payment', endpoints='[{\"path\": \"/charge\", \"method\": \"POST\", \"response\": {\"status\": \"success\", \"id\": \"{{uuid}}\"}, \"delay\": 100}]', persist=true). Note: Mocks should match real API contracts. Warning: Remove mocks before production deployment."
    parameters:
      - name: name
        type: string
        description: "Mock service name"
        required: true
      - name: base_url
        type: string
        description: "Base URL path"
        required: false
        default: "/mock"
      - name: endpoints
        type: string
        description: "JSON array of endpoint definitions"
        required: true
      - name: persist
        type: boolean
        description: "Persist mock configuration"
        required: false
        default: false
      - name: port
        type: integer
        description: "Server port"
        required: false
        default: 8080
    tags: ["testing", "mock", "stub", "api", "service"]
    test_prompts:
      single:
        - "Create a mock API"
        - "Mock the payment service"
        - "Set up stub endpoints"
        - "Create test doubles"
      single_clear:
        - "I need to create a mock service. Create a mock API"
        - "I need to create a mock service. Mock the payment service"
        - "I need to create a mock service. Set up stub endpoints"
        - "I need to create a mock service. Create test doubles"

  - name: get_coverage
    descriptions:
      minimal: "Get coverage"
      short: "Get code coverage report"
      medium: "Retrieve code coverage metrics and reports."
      long: "Get code coverage reports. View line, branch, and function coverage. Example: get_coverage(path='src/', format='html')."
      verbose: "Code coverage analysis and reporting. Metrics: line coverage, branch coverage, function coverage, statement coverage. Reports: summary, per-file, uncovered lines. Example: get_coverage(path='src/', format='json', thresholds='{\"line\": 80, \"branch\": 70}', exclude='[\"**/tests/**\", \"**/__mocks__/**\"]'). Note: Coverage doesn't guarantee test quality. Warning: 100% coverage doesn't mean bug-free code."
    parameters:
      - name: path
        type: string
        description: "Source code path"
        required: false
        default: "src/"
      - name: format
        type: string
        description: "Report format"
        required: false
        default: "summary"
        enum: ["summary", "html", "json", "xml", "lcov"]
      - name: thresholds
        type: string
        description: "JSON coverage thresholds"
        required: false
      - name: exclude
        type: string
        description: "JSON array of exclusion patterns"
        required: false
    tags: ["testing", "coverage", "report", "metrics", "quality"]
    test_prompts:
      single:
        - "Get code coverage"
        - "Show coverage report"
        - "Check test coverage"
        - "Generate coverage report"
      single_clear:
        - "I need to get code coverage. Get code coverage"
        - "I need to get code coverage. Show coverage report"
        - "I need to get code coverage. Check test coverage"
        - "I need to get code coverage. Generate coverage report"

  - name: run_security_scan
    descriptions:
      minimal: "Security scan"
      short: "Run security scan"
      medium: "Scan code or application for security vulnerabilities."
      long: "Run security scans. Detect vulnerabilities in code, dependencies, or runtime. Example: run_security_scan(type='sast', path='src/')."
      verbose: "Application security scanning. Types: 'sast' (static code), 'dast' (dynamic), 'dependency' (CVE scan), 'container' (image scan), 'secrets' (credential detection). Example: run_security_scan(type='dependency', path='.', severity='high', fail_on_vuln=true, ignore='[\"CVE-2021-12345\"]'). Note: Regular scanning should be part of CI/CD. Warning: DAST scanning should only target test environments."
    parameters:
      - name: type
        type: string
        description: "Scan type"
        required: true
        enum: ["sast", "dast", "dependency", "container", "secrets"]
      - name: path
        type: string
        description: "Path to scan"
        required: false
        default: "."
      - name: severity
        type: string
        description: "Minimum severity to report"
        required: false
        default: "medium"
        enum: ["low", "medium", "high", "critical"]
      - name: fail_on_vuln
        type: boolean
        description: "Fail if vulnerabilities found"
        required: false
        default: false
      - name: ignore
        type: string
        description: "JSON array of CVEs to ignore"
        required: false
    tags: ["testing", "security", "scan", "vulnerability", "sast"]
    test_prompts:
      single:
        - "Scan for vulnerabilities"
        - "Run security scan"
        - "Check for CVEs"
        - "Scan dependencies for security issues"
      single_clear:
        - "I need to run a security scan. Scan for vulnerabilities"
        - "I need to run a security scan. Run security scan"
        - "I need to run a security scan. Check for CVEs"
        - "I need to run a security scan. Scan dependencies for security issues"

  - name: run_mutation_test
    descriptions:
      minimal: "Mutation test"
      short: "Run mutation testing"
      medium: "Run mutation testing to evaluate test suite quality."
      long: "Run mutation testing. Introduce code mutations to test if tests catch them. Example: run_mutation_test(path='src/', test_path='tests/')."
      verbose: "Mutation testing for test suite quality assessment. Process: inject code mutations (mutants), run tests, calculate mutation score. Metrics: mutation score, survived mutants, killed mutants. Example: run_mutation_test(path='src/calculator.py', test_path='tests/', mutators='[\"arithmetic\", \"boolean\", \"boundary\"]', timeout=30). Note: Mutation testing can be time-intensive. Warning: High mutation scores don't guarantee comprehensive testing."
    parameters:
      - name: path
        type: string
        description: "Source code path"
        required: true
      - name: test_path
        type: string
        description: "Test code path"
        required: true
      - name: mutators
        type: string
        description: "JSON array of mutator types"
        required: false
      - name: timeout
        type: integer
        description: "Per-mutant timeout (seconds)"
        required: false
        default: 10
      - name: sample_size
        type: integer
        description: "Number of mutants to test"
        required: false
    tags: ["testing", "mutation", "quality", "suite", "mutants"]
    test_prompts:
      single:
        - "Run mutation testing"
        - "Evaluate test quality"
        - "Find weak tests"
        - "Calculate mutation score"
      single_clear:
        - "I need to run mutation testing. Run mutation testing"
        - "I need to run mutation testing. Evaluate test quality"
        - "I need to run mutation testing. Find weak tests"
        - "I need to run mutation testing. Calculate mutation score"

  - name: run_accessibility_test
    descriptions:
      minimal: "A11y test"
      short: "Run accessibility testing"
      medium: "Test web pages for accessibility compliance."
      long: "Run accessibility tests. Check WCAG compliance and accessibility issues. Example: run_accessibility_test(url='https://example.com', standard='WCAG21_AA')."
      verbose: "Web accessibility testing. Standards: WCAG 2.0 A/AA/AAA, WCAG 2.1, Section 508. Checks: color contrast, alt text, keyboard navigation, ARIA labels, heading structure. Example: run_accessibility_test(url='https://example.com', standard='WCAG21_AA', include='[\"contrast\", \"images\", \"forms\", \"keyboard\"]', viewport='mobile'). Note: Automated tests catch ~30-40% of issues. Warning: Manual testing is also required for full compliance."
    parameters:
      - name: url
        type: string
        description: "Page URL to test"
        required: true
      - name: standard
        type: string
        description: "Accessibility standard"
        required: false
        default: "WCAG21_AA"
        enum: ["WCAG20_A", "WCAG20_AA", "WCAG20_AAA", "WCAG21_A", "WCAG21_AA", "WCAG21_AAA"]
      - name: include
        type: string
        description: "JSON array of check categories"
        required: false
      - name: viewport
        type: string
        description: "Viewport size"
        required: false
        default: "desktop"
        enum: ["desktop", "tablet", "mobile"]
    tags: ["testing", "accessibility", "a11y", "wcag", "compliance"]
    test_prompts:
      single:
        - "Run accessibility tests"
        - "Check WCAG compliance"
        - "Test for accessibility issues"
        - "Audit page accessibility"
      single_clear:
        - "I need to run accessibility tests. Run accessibility tests"
        - "I need to run accessibility tests. Check WCAG compliance"
        - "I need to run accessibility tests. Test for accessibility issues"
        - "I need to run accessibility tests. Audit page accessibility"

  - name: run_visual_regression
    descriptions:
      minimal: "Visual test"
      short: "Run visual regression test"
      medium: "Compare screenshots to detect visual regressions."
      long: "Visual regression testing. Compare screenshots against baselines. Example: run_visual_regression(url='https://example.com', baseline='baseline-001')."
      verbose: "Visual regression testing with screenshot comparison. Process: capture screenshots, compare to baselines, detect pixel differences. Options: viewport sizes, page elements, threshold. Example: run_visual_regression(url='https://example.com/dashboard', baseline='dashboard-v2', viewports='[{\"width\": 1920, \"height\": 1080}, {\"width\": 375, \"height\": 667}]', threshold=0.01, mask='[\"#dynamic-content\"]'). Note: Dynamic content should be masked or mocked. Warning: Baseline updates require review."
    parameters:
      - name: url
        type: string
        description: "Page URL to test"
        required: true
      - name: baseline
        type: string
        description: "Baseline identifier"
        required: true
      - name: viewports
        type: string
        description: "JSON array of viewport sizes"
        required: false
      - name: threshold
        type: number
        description: "Difference threshold (0-1)"
        required: false
        default: 0.01
      - name: mask
        type: string
        description: "JSON array of selectors to mask"
        required: false
      - name: update_baseline
        type: boolean
        description: "Update baseline if different"
        required: false
        default: false
    tags: ["testing", "visual", "regression", "screenshot", "ui"]
    test_prompts:
      single:
        - "Run visual regression test"
        - "Compare screenshots"
        - "Check for visual changes"
        - "Detect UI regressions"
      single_clear:
        - "I need to run visual regression testing. Run visual regression test"
        - "I need to run visual regression testing. Compare screenshots"
        - "I need to run visual regression testing. Check for visual changes"
        - "I need to run visual regression testing. Detect UI regressions"

  - name: manage_test_data
    descriptions:
      minimal: "Test data"
      short: "Manage test data"
      medium: "Generate, seed, or reset test data."
      long: "Manage test data. Generate fixtures, seed databases, or reset state. Example: manage_test_data(action='seed', database='test_db', fixtures='users,orders')."
      verbose: "Test data management operations. Actions: 'generate' (create fake data), 'seed' (populate database), 'reset' (clear test data), 'snapshot' (capture state), 'restore' (restore snapshot). Example: manage_test_data(action='generate', schema='user', count=100, output='fixtures/users.json', locale='en_US'). Note: Test data should be realistic but not contain real PII. Warning: Reset operations are destructive."
    parameters:
      - name: action
        type: string
        description: "Test data action"
        required: true
        enum: ["generate", "seed", "reset", "snapshot", "restore"]
      - name: database
        type: string
        description: "Database name (for seed/reset)"
        required: false
      - name: fixtures
        type: string
        description: "Fixture names (comma-separated)"
        required: false
      - name: schema
        type: string
        description: "Data schema (for generate)"
        required: false
      - name: count
        type: integer
        description: "Number of records to generate"
        required: false
        default: 10
      - name: output
        type: string
        description: "Output file path"
        required: false
    tags: ["testing", "data", "fixtures", "seed", "generate"]
    test_prompts:
      single:
        - "Generate test data"
        - "Seed the test database"
        - "Reset test data"
        - "Create test fixtures"
      single_clear:
        - "I need to manage test data. Generate test data"
        - "I need to manage test data. Seed the test database"
        - "I need to manage test data. Reset test data"
        - "I need to manage test data. Create test fixtures"
  - name: run_mutation_testing
    descriptions:
      minimal: "Mutation test"
      short: "Run mutation testing"
      medium: "Run mutation testing to evaluate test suite quality."
      long: "Perform mutation testing to measure test effectiveness. Injects bugs to test detection. Example: run_mutation_testing(source='src/', tests='tests/', mutators='[\"arithmetic\", \"conditional\"]')."
      verbose: "Mutation testing for test quality assessment. Mutators: arithmetic, conditional, boundary, return_values, null_injection. Example: run_mutation_testing(source='src/utils/', tests='tests/unit/', mutators='[\"arithmetic\", \"conditional\", \"boundary\"]', timeout=10, exclude='[\"*.config.js\"]', parallel=4). Returns: mutation score, surviving mutants, killed mutants. Note: Mutation testing is slow; run on critical code. Warning: High timeout values can make tests very slow."
    parameters:
      - name: source
        type: string
        description: "Source code directory"
        required: true
      - name: tests
        type: string
        description: "Test directory"
        required: true
      - name: mutators
        type: string
        description: "JSON array of mutator types"
        required: false
      - name: timeout
        type: integer
        description: "Timeout per mutation (seconds)"
        required: false
        default: 5
      - name: exclude
        type: string
        description: "JSON patterns to exclude"
        required: false
      - name: parallel
        type: integer
        description: "Parallel mutation jobs"
        required: false
        default: 2
    tags: ["testing", "mutation", "quality", "coverage", "effectiveness"]
    test_prompts:
      single:
        - "Run mutation tests"
        - "Test the test suite"
        - "Check test effectiveness"
        - "Measure test quality"
      single_clear:
        - "I need to run mutation testing. Run mutation tests"
        - "I need to run mutation testing. Test the test suite"
        - "I need to run mutation testing. Check test effectiveness"
        - "I need to run mutation testing. Measure test quality"

  - name: run_fuzz_testing
    descriptions:
      minimal: "Fuzz test"
      short: "Run fuzz testing"
      medium: "Perform fuzz testing to find edge cases and vulnerabilities."
      long: "Run fuzz testing with random inputs to find bugs. Tests edge cases automatically. Example: run_fuzz_testing(target='parse_input', corpus='fuzz_inputs/', iterations=10000)."
      verbose: "Fuzz testing for security and robustness. Types: coverage-guided, generation-based, mutation-based. Example: run_fuzz_testing(target='api/v1/parse', corpus='fuzz_corpus/', iterations=50000, timeout=300, seeds='[\"valid_input\", \"edge_case\"]', crash_dir='crashes/', sanitizers='[\"address\", \"undefined\"]'). Returns: crashes found, coverage increase, interesting inputs. Note: Fuzz testing can find subtle bugs. Warning: May generate harmful inputs; use in isolated environment."
    parameters:
      - name: target
        type: string
        description: "Target function or endpoint"
        required: true
      - name: corpus
        type: string
        description: "Input corpus directory"
        required: false
      - name: iterations
        type: integer
        description: "Number of iterations"
        required: false
        default: 10000
      - name: timeout
        type: integer
        description: "Total timeout (seconds)"
        required: false
        default: 60
      - name: seeds
        type: string
        description: "JSON array of seed inputs"
        required: false
      - name: crash_dir
        type: string
        description: "Directory for crash inputs"
        required: false
    tags: ["testing", "fuzz", "security", "edge_cases", "robustness"]
    test_prompts:
      single:
        - "Fuzz test the parser"
        - "Run fuzzing on API"
        - "Find edge case bugs"
        - "Fuzz test for crashes"
      single_clear:
        - "I need to run fuzz testing. Fuzz test the parser"
        - "I need to run fuzz testing. Run fuzzing on API"
        - "I need to run fuzz testing. Find edge case bugs"
        - "I need to run fuzz testing. Fuzz test for crashes"

  - name: run_contract_testing
    descriptions:
      minimal: "Contract test"
      short: "Run contract testing"
      medium: "Verify API contracts between services using consumer-driven testing."
      long: "Run contract tests to verify API compatibility. Consumer-driven contract testing. Example: run_contract_testing(provider='user-service', consumer='order-service', pact_file='pacts/user-order.json')."
      verbose: "Contract testing for microservices. Frameworks: Pact, Spring Cloud Contract. Actions: generate (create from consumer), verify (test provider), publish (to broker). Example: run_contract_testing(action='verify', provider='user-service', broker='https://pact-broker.example.com', provider_version='1.2.3', publish_results=true). Returns: verification results, failed interactions. Note: Contract tests ensure API compatibility. Warning: Breaking contracts may affect dependent services."
    parameters:
      - name: action
        type: string
        description: "Contract action"
        required: true
        enum: ["generate", "verify", "publish"]
      - name: provider
        type: string
        description: "Provider service name"
        required: false
      - name: consumer
        type: string
        description: "Consumer service name"
        required: false
      - name: pact_file
        type: string
        description: "Pact file path"
        required: false
      - name: broker
        type: string
        description: "Pact broker URL"
        required: false
      - name: publish_results
        type: boolean
        description: "Publish verification results"
        required: false
        default: false
    tags: ["testing", "contract", "api", "microservices", "pact"]
    test_prompts:
      single:
        - "Verify API contract"
        - "Run contract tests"
        - "Check service compatibility"
        - "Publish contract to broker"
      single_clear:
        - "I need to run contract testing. Verify API contract"
        - "I need to run contract testing. Run contract tests"
        - "I need to run contract testing. Check service compatibility"
        - "I need to run contract testing. Publish contract to broker"

  - name: run_accessibility_test
    descriptions:
      minimal: "A11y test"
      short: "Run accessibility testing"
      medium: "Test web pages for accessibility compliance (WCAG)."
      long: "Run accessibility tests against WCAG guidelines. Check for a11y violations. Example: run_accessibility_test(url='https://example.com', standard='WCAG2AA')."
      verbose: "Automated accessibility testing. Standards: WCAG2A, WCAG2AA, WCAG2AAA, Section508. Tools: axe-core, Pa11y, Lighthouse. Example: run_accessibility_test(url='https://example.com/checkout', standard='WCAG2AA', include='[\"keyboard\", \"color-contrast\", \"aria\"]', viewport='{\"width\": 1280, \"height\": 720}'). Returns: violations, passes, incomplete checks. Note: Automated tests catch ~30-40% of issues; manual testing needed. Warning: Some violations may be false positives."
    parameters:
      - name: url
        type: string
        description: "URL to test"
        required: true
      - name: standard
        type: string
        description: "Accessibility standard"
        required: false
        default: "WCAG2AA"
        enum: ["WCAG2A", "WCAG2AA", "WCAG2AAA", "Section508"]
      - name: include
        type: string
        description: "JSON array of rule categories"
        required: false
      - name: exclude
        type: string
        description: "JSON array of rules to skip"
        required: false
      - name: viewport
        type: string
        description: "JSON viewport configuration"
        required: false
    tags: ["testing", "accessibility", "a11y", "wcag", "compliance"]
    test_prompts:
      single:
        - "Test page accessibility"
        - "Check WCAG compliance"
        - "Run a11y audit"
        - "Find accessibility issues"
      single_clear:
        - "I need to run accessibility testing. Test page accessibility"
        - "I need to run accessibility testing. Check WCAG compliance"
        - "I need to run accessibility testing. Run a11y audit"
        - "I need to run accessibility testing. Find accessibility issues"

  - name: run_chaos_testing
    descriptions:
      minimal: "Chaos test"
      short: "Run chaos testing"
      medium: "Inject failures to test system resilience and recovery."
