category: iot_operations
description: IoT device management and sensor operations
tools:
  - name: register_device
    descriptions:
      minimal: "Register device"
      short: "Register an IoT device"
      medium: "Register a new IoT device with the platform."
      long: "Register a new IoT device. Provision credentials and configure settings. Example: register_device(device_id='sensor-001', type='temperature', location='warehouse-a')."
      verbose: "Register and provision IoT devices. Registration includes: device ID, device type, credentials (certificates/keys), metadata, initial configuration. Security: X.509 certificates, SAS tokens, or TPM attestation. Example: register_device(device_id='temp-sensor-001', type='temperature_humidity', location='building-1-floor-2', tags='{\"zone\": \"hvac\", \"priority\": \"high\"}', provisioning='certificate'). Note: Devices must be registered before sending data. Warning: Secure credential storage is critical."
    parameters:
      - name: device_id
        type: string
        description: "Unique device identifier"
        required: true
      - name: type
        type: string
        description: "Device type"
        required: true
      - name: location
        type: string
        description: "Physical location"
        required: false
      - name: tags
        type: string
        description: "JSON metadata tags"
        required: false
      - name: provisioning
        type: string
        description: "Provisioning method"
        required: false
        default: "key"
        enum: ["key", "certificate", "tpm"]
    tags: ["iot", "device", "register", "provision", "setup"]
    test_prompts:
      single:
        - "Register a new sensor"
        - "Add an IoT device"
        - "Provision the temperature sensor"
        - "Set up the new device"
      single_clear:
        - "I need to register a new IoT device. Register a new sensor"
        - "I need to register a new IoT device. Add an IoT device"
        - "I need to register a new IoT device. Provision the temperature sensor"
        - "I need to register a new IoT device. Set up the new device"

  - name: send_command
    descriptions:
      minimal: "Send command"
      short: "Send command to IoT device"
      medium: "Send a command or message to an IoT device."
      long: "Send commands to IoT devices. Control device behavior, request data, or trigger actions. Example: send_command(device_id='actuator-001', command='turn_on', params='{\"duration\": 60}')."
      verbose: "Send commands to IoT devices for remote control. Command types: direct methods (synchronous), cloud-to-device messages (async), desired properties (twin). Options: timeout, acknowledgment, retry policy. Example: send_command(device_id='valve-001', command='set_position', params='{\"position\": 75, \"speed\": \"slow\"}', timeout=30, wait_response=true). Note: Commands require device to be online. Warning: Critical commands should have confirmation mechanisms."
    parameters:
      - name: device_id
        type: string
        description: "Target device ID"
        required: true
      - name: command
        type: string
        description: "Command name"
        required: true
      - name: params
        type: string
        description: "JSON command parameters"
        required: false
      - name: timeout
        type: integer
        description: "Command timeout (seconds)"
        required: false
        default: 30
      - name: wait_response
        type: boolean
        description: "Wait for device response"
        required: false
        default: true
    tags: ["iot", "command", "control", "device", "actuator"]
    test_prompts:
      single:
        - "Turn on the device"
        - "Send command to the sensor"
        - "Control the actuator"
        - "Set the device parameter"
      single_clear:
        - "Please send a command to an IoT device. Turn on the device"
        - "Please send a command to an IoT device. Send command to the sensor"
        - "Please send a command to an IoT device. Control the actuator"
        - "Please send a command to an IoT device. Set the device parameter"

  - name: get_telemetry
    descriptions:
      minimal: "Get telemetry"
      short: "Get device telemetry data"
      medium: "Retrieve telemetry data from IoT devices."
      long: "Get telemetry/sensor data from devices. Query historical or real-time data. Example: get_telemetry(device_id='sensor-001', metrics='[\"temperature\", \"humidity\"]', period='1h')."
      verbose: "Retrieve IoT device telemetry data. Data types: sensor readings, status, events, diagnostics. Query options: time range, aggregation, sampling. Output: time series data, statistics. Example: get_telemetry(device_id='weather-station-01', metrics='[\"temperature\", \"humidity\", \"pressure\"]', period='24h', aggregation='1h', stats='[\"avg\", \"min\", \"max\"]'). Note: Data retention limits apply. Warning: High-frequency queries may impact performance."
    parameters:
      - name: device_id
        type: string
        description: "Device identifier"
        required: true
      - name: metrics
        type: string
        description: "JSON array of metric names"
        required: false
      - name: period
        type: string
        description: "Time period (e.g., '1h', '24h')"
        required: false
        default: "1h"
      - name: aggregation
        type: string
        description: "Aggregation interval"
        required: false
      - name: stats
        type: string
        description: "Statistics to calculate"
        required: false
    tags: ["iot", "telemetry", "sensor", "data", "monitoring"]
    test_prompts:
      single:
        - "Get temperature readings"
        - "Show sensor data for last hour"
        - "Retrieve device telemetry"
        - "Get the humidity data"
      single_clear:
        - "I need to retrieve telemetry data from an IoT device. Get temperature readings"
        - "I need to retrieve telemetry data from an IoT device. Show sensor data for last hour"
        - "I need to retrieve telemetry data from an IoT device. Retrieve device telemetry"
        - "I need to retrieve telemetry data from an IoT device. Get the humidity data"

  - name: update_device_twin
    descriptions:
      minimal: "Update twin"
      short: "Update device twin properties"
      medium: "Update the desired properties of a device twin."
      long: "Update device twin desired properties. Configure device settings without direct command. Example: update_device_twin(device_id='thermostat-001', properties='{\"target_temp\": 72}')."
      verbose: "Update IoT device twin desired properties. Device twins store: desired properties (cloud-set), reported properties (device-set), tags (metadata). Use cases: configuration changes, feature flags, thresholds. Example: update_device_twin(device_id='thermostat-001', desired='{\"target_temp\": 72, \"mode\": \"auto\", \"schedule\": {...}}', tags='{\"building\": \"HQ\", \"floor\": 3}'). Note: Devices sync twins when connected. Warning: Large twin updates may timeout."
    parameters:
      - name: device_id
        type: string
        description: "Device identifier"
        required: true
      - name: desired
        type: string
        description: "JSON desired properties"
        required: false
      - name: tags
        type: string
        description: "JSON device tags"
        required: false
    tags: ["iot", "twin", "device", "properties", "config"]
    test_prompts:
      single:
        - "Update the device settings"
        - "Set desired temperature"
        - "Change device configuration"
        - "Update the device twin"
      single_clear:
        - "I need to update device twin properties. Update the device settings"
        - "I need to update device twin properties. Set desired temperature"
        - "I need to update device twin properties. Change device configuration"
        - "I need to update device twin properties. Update the device twin"

  - name: create_alert_rule
    descriptions:
      minimal: "Create alert"
      short: "Create IoT alert rule"
      medium: "Create an alert rule for IoT device conditions."
      long: "Create alerting rules for IoT conditions. Trigger alerts on sensor thresholds or device status. Example: create_alert_rule(name='high_temp', condition='temperature > 100', devices='[\"sensor-*\"]', action='notify')."
      verbose: "Create IoT alerting rules for condition monitoring. Conditions: metric thresholds, rate of change, anomaly detection, device offline. Actions: notification, command execution, webhook, escalation. Example: create_alert_rule(name='freezer_temp_alert', condition='temperature > -10 OR temperature < -25', devices='[\"freezer-*\"]', severity='critical', actions='[{\"type\": \"sms\", \"to\": \"+1234567890\"}, {\"type\": \"command\", \"command\": \"activate_backup\"}]'). Note: Multiple conditions can be combined with AND/OR. Warning: Set appropriate cooldown to prevent alert storms."
    parameters:
      - name: name
        type: string
        description: "Alert rule name"
        required: true
      - name: condition
        type: string
        description: "Alert condition expression"
        required: true
      - name: devices
        type: string
        description: "JSON array of device patterns"
        required: true
      - name: severity
        type: string
        description: "Alert severity"
        required: false
        default: "warning"
        enum: ["info", "warning", "error", "critical"]
      - name: actions
        type: string
        description: "JSON array of alert actions"
        required: true
      - name: cooldown
        type: integer
        description: "Cooldown period (seconds)"
        required: false
        default: 300
    tags: ["iot", "alert", "rule", "threshold", "monitor"]
    test_prompts:
      single:
        - "Alert when temperature exceeds 100"
        - "Create a low battery alert"
        - "Set up device offline alert"
        - "Create sensor threshold alert"
      single_clear:
        - "I need to create an IoT alert rule. Alert when temperature exceeds 100"
        - "I need to create an IoT alert rule. Create a low battery alert"
        - "I need to create an IoT alert rule. Set up device offline alert"
        - "I need to create an IoT alert rule. Create sensor threshold alert"

  - name: manage_firmware
    descriptions:
      minimal: "Manage firmware"
      short: "Manage device firmware"
      medium: "Upload, deploy, or manage firmware updates for IoT devices."
      long: "Manage IoT device firmware. Upload new versions and deploy updates. Example: manage_firmware(action='deploy', firmware_id='v2.1.0', devices='[\"device-group-a\"]')."
      verbose: "Manage IoT device firmware lifecycle. Actions: 'upload' (add new version), 'deploy' (push to devices), 'rollback' (revert), 'status' (check deployment). Deployment strategies: immediate, scheduled, staged rollout. Example: manage_firmware(action='deploy', firmware_id='v2.1.0', devices='[\"production-sensors\"]', strategy='staged', batch_size=10, batch_interval=300). Note: Devices must support OTA updates. Warning: Failed updates may brick devices; ensure rollback capability."
    parameters:
      - name: action
        type: string
        description: "Firmware action"
        required: true
        enum: ["upload", "deploy", "rollback", "status"]
      - name: firmware_id
        type: string
        description: "Firmware version ID"
        required: true
      - name: devices
        type: string
        description: "JSON array of device groups"
        required: false
      - name: file
        type: string
        description: "Firmware file path (for upload)"
        required: false
      - name: strategy
        type: string
        description: "Deployment strategy"
        required: false
        default: "immediate"
        enum: ["immediate", "scheduled", "staged"]
    tags: ["iot", "firmware", "update", "ota", "deploy"]
    test_prompts:
      single:
        - "Deploy firmware update"
        - "Upload new firmware"
        - "Check firmware status"
        - "Rollback to previous version"
      single_clear:
        - "I need to manage device firmware. Deploy firmware update"
        - "I need to manage device firmware. Upload new firmware"
        - "I need to manage device firmware. Check firmware status"
        - "I need to manage device firmware. Rollback to previous version"

  - name: query_devices
    descriptions:
      minimal: "Query devices"
      short: "Query IoT devices"
      medium: "Query devices based on properties, status, or telemetry."
      long: "Query IoT devices using filters on properties, tags, status, or telemetry. Example: query_devices(filter='type=\"temperature\" AND status=\"online\"')."
      verbose: "Query IoT device registry. Filter by: device properties, tags, connection status, twin properties, telemetry values. Returns: device list with metadata. Example: query_devices(filter='tags.building=\"HQ\" AND properties.firmware_version < \"2.0\" AND connectionState=\"Connected\"', select='[\"deviceId\", \"lastActivityTime\", \"properties.firmware_version\"]'). Note: Complex queries may be slow on large device fleets. Warning: Query results may be paginated."
    parameters:
      - name: filter
        type: string
        description: "Query filter expression"
        required: true
      - name: select
        type: string
        description: "JSON array of fields to return"
        required: false
      - name: limit
        type: integer
        description: "Maximum devices to return"
        required: false
        default: 100
    tags: ["iot", "query", "devices", "search", "filter"]
    test_prompts:
      single:
        - "Find all offline devices"
        - "Query devices in building A"
        - "List temperature sensors"
        - "Find devices needing update"
      single_clear:
        - "I need to query IoT devices. Find all offline devices"
        - "I need to query IoT devices. Query devices in building A"
        - "I need to query IoT devices. List temperature sensors"
        - "I need to query IoT devices. Find devices needing update"

  - name: create_device_group
    descriptions:
      minimal: "Create group"
      short: "Create a device group"
      medium: "Create a group of IoT devices for bulk operations."
      long: "Create device groups for bulk management. Group by location, type, or custom criteria. Example: create_device_group(name='floor-1-sensors', query='location=\"floor-1\"')."
      verbose: "Create IoT device groups for bulk operations. Group types: 'static' (manual membership), 'dynamic' (query-based auto-membership). Use cases: bulk commands, firmware deployment, monitoring. Example: create_device_group(name='critical-sensors', type='dynamic', query='tags.priority=\"critical\" AND connectionState=\"Connected\"', auto_update=true). Note: Dynamic groups update automatically. Warning: Large groups may slow bulk operations."
    parameters:
      - name: name
        type: string
        description: "Group name"
        required: true
      - name: type
        type: string
        description: "Group type"
        required: false
        default: "static"
        enum: ["static", "dynamic"]
      - name: query
        type: string
        description: "Membership query (for dynamic)"
        required: false
      - name: devices
        type: string
        description: "JSON array of device IDs (for static)"
        required: false
      - name: auto_update
        type: boolean
        description: "Auto-update membership"
        required: false
        default: true
    tags: ["iot", "group", "devices", "organize", "bulk"]
    test_prompts:
      single:
        - "Create a sensor group"
        - "Group devices by location"
        - "Create a device collection"
        - "Organize devices into groups"
      single_clear:
        - "I need to create an IoT device group. Create a sensor group"
        - "I need to create an IoT device group. Group devices by location"
        - "I need to create an IoT device group. Create a device collection"
        - "I need to create an IoT device group. Organize devices into groups"

  - name: get_device_status
    descriptions:
      minimal: "Get status"
      short: "Get device status"
      medium: "Get the current status and health of an IoT device."
      long: "Get device status including connection state, health, and diagnostics. Example: get_device_status(device_id='sensor-001')."
      verbose: "Get comprehensive IoT device status. Information: connection state, last activity, health metrics, error logs, firmware version, twin sync status. Example: get_device_status(device_id='gateway-001', include_diagnostics=true, include_telemetry=true). Note: Real-time status requires active connection. Warning: Offline devices show last known state."
    parameters:
      - name: device_id
        type: string
        description: "Device identifier"
        required: true
      - name: include_diagnostics
        type: boolean
        description: "Include diagnostic info"
        required: false
        default: false
      - name: include_telemetry
        type: boolean
        description: "Include latest telemetry"
        required: false
        default: false
    tags: ["iot", "status", "device", "health", "diagnostics"]
    test_prompts:
      single:
        - "Check if the sensor is online"
        - "Get device health status"
        - "Is the device connected?"
        - "Show device diagnostics"
      single_clear:
        - "I need to get the status of an IoT device. Check if the sensor is online"
        - "I need to get the status of an IoT device. Get device health status"
        - "I need to get the status of an IoT device. Is the device connected?"
        - "I need to get the status of an IoT device. Show device diagnostics"

  - name: simulate_device
    descriptions:
      minimal: "Simulate device"
      short: "Simulate an IoT device"
      medium: "Simulate an IoT device for testing without physical hardware."
      long: "Simulate IoT device telemetry and behavior for testing. Example: simulate_device(device_id='test-sensor', type='temperature', interval=5)."
      verbose: "Simulate IoT devices for development and testing. Features: realistic telemetry patterns, configurable intervals, anomaly injection, failure scenarios. Example: simulate_device(device_id='simulated-temp-01', type='temperature', interval=10, pattern='sinusoidal', range='[18, 28]', noise=0.5, duration=3600). Note: Simulated devices use same APIs as real devices. Warning: Clean up simulated devices after testing."
    parameters:
      - name: device_id
        type: string
        description: "Simulated device ID"
        required: true
      - name: type
        type: string
        description: "Device type to simulate"
        required: true
      - name: interval
        type: integer
        description: "Telemetry interval (seconds)"
        required: false
        default: 10
      - name: pattern
        type: string
        description: "Data pattern"
        required: false
        default: "random"
        enum: ["random", "sinusoidal", "linear", "step"]
      - name: duration
        type: integer
        description: "Simulation duration (seconds)"
        required: false
        default: 3600
    tags: ["iot", "simulate", "test", "development", "mock"]
    test_prompts:
      single:
        - "Simulate a temperature sensor"
        - "Create a test device"
        - "Run device simulation"
        - "Mock IoT telemetry"
      single_clear:
        - "I need to simulate an IoT device for testing. Simulate a temperature sensor"
        - "I need to simulate an IoT device for testing. Create a test device"
        - "I need to simulate an IoT device for testing. Run device simulation"
        - "I need to simulate an IoT device for testing. Mock IoT telemetry"
  - name: create_device_group
    descriptions:
      minimal: "Create device group"
      short: "Create a group of IoT devices"
      medium: "Create a logical group of IoT devices for bulk management and monitoring."
      long: "Create device groups for organizing and managing multiple devices together. Apply bulk operations and policies. Example: create_device_group(name='floor-1-sensors', query='tags.floor = 1', description='All sensors on floor 1')."
      verbose: "Create logical device groups for bulk management. Grouping methods: static (explicit list), dynamic (query-based), hierarchical (nested groups). Features: bulk commands, group policies, aggregate telemetry, shared configurations. Example: create_device_group(name='critical-hvac', type='dynamic', query='type = \"thermostat\" AND tags.priority = \"critical\"', parent_group='hvac-devices', policies='{\"update_window\": \"02:00-04:00\", \"alert_threshold\": \"high\"}'). Note: Dynamic groups auto-update membership. Warning: Large groups may impact performance of bulk operations."
    parameters:
      - name: name
        type: string
        description: "Group name"
        required: true
      - name: description
        type: string
        description: "Group description"
        required: false
      - name: type
        type: string
        description: "Group type"
        required: false
        default: "static"
        enum: ["static", "dynamic"]
      - name: query
        type: string
        description: "Query for dynamic membership"
        required: false
      - name: device_ids
        type: string
        description: "JSON array of device IDs (for static)"
        required: false
      - name: parent_group
        type: string
        description: "Parent group for hierarchy"
        required: false
    tags: ["iot", "device", "group", "organize", "manage"]
    test_prompts:
      single:
        - "Create a group of temperature sensors"
        - "Group all devices on floor 2"
        - "Organize devices by building"
        - "Create a device collection"
      single_clear:
        - "I need to create an IoT device group. Create a group of temperature sensors"
        - "I need to create an IoT device group. Group all devices on floor 2"
        - "I need to create an IoT device group. Organize devices by building"
        - "I need to create an IoT device group. Create a device collection"

  - name: schedule_device_job
    descriptions:
      minimal: "Schedule job"
      short: "Schedule a job for IoT devices"
      medium: "Schedule a job to run on one or more IoT devices at a specific time."
      long: "Schedule batch jobs for device operations like updates, restarts, or configuration changes. Example: schedule_device_job(name='nightly-restart', target='group:sensors', action='restart', schedule='0 2 * * *')."
      verbose: "Schedule jobs for bulk device operations. Job types: firmware update, configuration change, restart, command execution, data collection. Targeting: single device, device group, query-based selection. Scheduling: immediate, one-time, recurring (cron). Example: schedule_device_job(name='weekly-calibration', target_query='type = \"pressure_sensor\"', action='run_method', params='{\"method\": \"calibrate\"}', schedule='0 3 * * 0', max_concurrency=10, retry_policy='{\"attempts\": 3, \"backoff\": \"exponential\"}'). Note: Jobs track progress per device. Warning: Schedule maintenance during low-activity periods."
    parameters:
      - name: name
        type: string
        description: "Job name"
        required: true
      - name: target
        type: string
        description: "Target devices/group"
        required: false
      - name: target_query
        type: string
        description: "Query for target devices"
        required: false
      - name: action
        type: string
        description: "Job action"
        required: true
        enum: ["restart", "update_firmware", "configure", "run_method", "collect_diagnostics"]
      - name: params
        type: string
        description: "JSON action parameters"
        required: false
      - name: schedule
        type: string
        description: "Cron schedule or 'immediate'"
        required: false
        default: "immediate"
      - name: max_concurrency
        type: integer
        description: "Max parallel executions"
        required: false
        default: 100
    tags: ["iot", "job", "schedule", "batch", "automation"]
    test_prompts:
      single:
        - "Schedule device restart"
        - "Plan firmware update for all sensors"
        - "Create a scheduled configuration job"
        - "Set up nightly device maintenance"
      single_clear:
        - "I need to schedule a job for IoT devices. Schedule device restart"
        - "I need to schedule a job for IoT devices. Plan firmware update for all sensors"
        - "I need to schedule a job for IoT devices. Create a scheduled configuration job"
        - "I need to schedule a job for IoT devices. Set up nightly device maintenance"

  - name: manage_device_twin
    descriptions:
      minimal: "Manage device twin"
      short: "Manage IoT device twin"
      medium: "Read or update the device twin for configuration and state management."
      long: "Manage device twins for configuration synchronization. Update desired properties or read reported state. Example: manage_device_twin(device_id='sensor-001', action='update', desired='{\"threshold\": 25}')."
      verbose: "Manage IoT device twins for state synchronization. Components: desired properties (cloud-set), reported properties (device-set), tags (metadata). Operations: get (read full twin), update_desired (set config), update_tags, query (search twins). Example: manage_device_twin(device_id='hvac-unit-12', action='update', desired='{\"target_temp\": 22, \"mode\": \"cooling\"}', tags='{\"maintenance_due\": \"2024-06-01\"}'). Note: Device receives desired properties when online. Warning: Large twin documents impact sync performance."
    parameters:
      - name: device_id
        type: string
        description: "Device ID"
        required: true
      - name: action
        type: string
        description: "Twin action"
        required: true
        enum: ["get", "update_desired", "update_tags", "query"]
      - name: desired
        type: string
        description: "JSON desired properties"
        required: false
      - name: tags
        type: string
        description: "JSON tags"
        required: false
    tags: ["iot", "device", "twin", "state", "configuration"]
    test_prompts:
      single:
        - "Update device configuration"
        - "Set desired temperature threshold"
        - "Get device twin state"
        - "Sync device settings"
      single_clear:
        - "I need to manage an IoT device twin. Update device configuration"
        - "I need to manage an IoT device twin. Set desired temperature threshold"
        - "I need to manage an IoT device twin. Get device twin state"
        - "I need to manage an IoT device twin. Sync device settings"

  - name: configure_data_route
    descriptions:
      minimal: "Configure data route"
      short: "Configure IoT data routing"
      medium: "Set up routing rules for IoT telemetry data to different endpoints."
      long: "Configure message routing for IoT telemetry. Route data to storage, analytics, or external systems. Example: configure_data_route(name='hot-alerts', source='telemetry', condition='temperature > 80', endpoint='event-hub')."
      verbose: "Configure IoT data routing and message enrichment. Endpoints: Event Hub, Service Bus, Storage, Functions, custom webhooks. Features: condition-based routing, message enrichment, format transformation. Example: configure_data_route(name='anomaly-route', source='telemetry', condition='anomaly_score > 0.9', endpoint='event-hub-anomalies', enrichments='{\"device_location\": \"$twin.tags.location\", \"processed_at\": \"$system.time\"}', format='json'). Note: Multiple routes can match same message. Warning: Route conditions impact message processing latency."
    parameters:
      - name: name
        type: string
        description: "Route name"
        required: true
      - name: source
        type: string
        description: "Message source"
        required: true
        enum: ["telemetry", "twin_changes", "device_lifecycle", "device_connection"]
      - name: condition
        type: string
        description: "Routing condition"
        required: false
      - name: endpoint
        type: string
        description: "Destination endpoint"
        required: true
      - name: enrichments
        type: string
        description: "JSON message enrichments"
        required: false
      - name: enabled
        type: boolean
        description: "Enable route"
        required: false
        default: true
    tags: ["iot", "routing", "data", "pipeline", "integration"]
    test_prompts:
      single:
        - "Route sensor data to storage"
        - "Set up telemetry routing"
        - "Configure alert routing"
        - "Send data to Event Hub"
      single_clear:
        - "I need to configure IoT data routing. Route sensor data to storage"
        - "I need to configure IoT data routing. Set up telemetry routing"
        - "I need to configure IoT data routing. Configure alert routing"
        - "I need to configure IoT data routing. Send data to Event Hub"

  - name: create_edge_deployment
    descriptions:
      minimal: "Deploy to edge"
      short: "Deploy modules to IoT Edge"
      medium: "Deploy container modules to IoT Edge devices for local processing."
      long: "Deploy edge modules to IoT Edge devices. Configure containers, routes, and settings. Example: create_edge_deployment(device_id='edge-gateway-01', modules='[{\"name\": \"filter\", \"image\": \"myfilter:1.0\"}]')."
