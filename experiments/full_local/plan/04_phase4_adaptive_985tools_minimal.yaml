# ============================================================
# PHASE 4: Adaptive RAG - 985 Tools (Minimal Docs)
# ============================================================
# Purpose: Test doc_length impact on adaptive retrieval
# Hypothesis: Minimal docs affect embedding quality
# Rubric: Experiments - doc_length exploration
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase4_adaptive_985tools_minimal
description: "Adaptive RAG with 985 tools, minimal documentation"

# --- Tool Configuration ---
num_tools: 985
doc_length: minimal
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_local/results
