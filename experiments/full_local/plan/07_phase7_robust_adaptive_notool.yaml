# ============================================================
# PHASE 7: Robustness - Adaptive RAG No-Tool Handling
# ============================================================
# Purpose: Test adaptive RAG handling of no-tool scenarios
# Hypothesis: Dynamic K may help or hurt no-tool detection
# Rubric: Experiments - adaptive false positive analysis
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase7_robust_adaptive_notool
description: "Adaptive RAG with no-tool test scenarios"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null
include_no_tool: true

# --- Methodology ---
methodology: adaptive_rag
allow_no_tool_call: true
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_local/results
