# ============================================================
# PHASE 7: Robustness - Adaptive RAG with 10 Similar Tools
# ============================================================
# Purpose: Test adaptive RAG resistance to distractors
# Hypothesis: Adaptive K may help or hurt with distractors
# Rubric: Experiments - adaptive robustness
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase7_robust_adaptive_similar10
description: "Adaptive RAG with 500 tools + 10 similar distractors"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 10
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_local/results
