# ============================================================
# PHASE 3: RAG - 100 Tools (top_k=15, Increased)
# ============================================================
# Purpose: Test RAG with increased retrieval
# Hypothesis: More context may improve accuracy
# Rubric: Experiments - k parameter exploration
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_100tools_k15
description: "RAG with 100 tools and top_k=15"

# --- Tool Configuration ---
num_tools: 100
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 15
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_local/results
