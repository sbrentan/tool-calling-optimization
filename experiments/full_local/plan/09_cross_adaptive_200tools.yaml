# ============================================================
# Cross-Methodology Comparison: Adaptive RAG at 200 tools
# ============================================================
# Purpose: Direct comparison with MCP, RAG, Hybrid at 200 tools
# Uses default adaptive parameters for fair comparison
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: cross_adaptive_200tools
description: "Adaptive RAG at 200 tools for cross-methodology comparison"

# --- Tool Configuration ---
num_tools: 200
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_local/results
