# ============================================================
# PHASE 4: Adaptive RAG - 985 Tools (Default Settings)
# ============================================================
# Purpose: Test adaptive K at full scale
# Hypothesis: Should provide good accuracy with optimized context
# Rubric: Design - proving adaptive approach viability
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase4_adaptive_985tools_default
description: "Adaptive RAG with all 985 tools, default parameters"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/simple
