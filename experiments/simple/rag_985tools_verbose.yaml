# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_985tools_k10_verbose
description: "RAG with all 985 tools and top_k=10"

# --- Tool Configuration ---
num_tools: 985
doc_length: verbose
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/simple
