- name: t3ma
  descriptions:
    minimal: Fetches the Triple Exponential Moving Average...
    short: Fetches the Triple Exponential Moving Average (T3MA) for a given financial instrument.
    medium: Fetches the Triple Exponential Moving Average (T3MA) for a given financial instrument.
    long: Fetches the Triple Exponential Moving Average (T3MA) for a given financial instrument.
    verbose: Fetches the Triple Exponential Moving Average (T3MA) for a given financial instrument.
  parameters:
  - name: symbol
    type: string
    description: Instrument symbol, which can be any equity, index, ETF, forex, or cryptocurrency (e.g., 'AAPL', 'EUR/USD',
      'ETH/BTC').
    required: true
    default: AAPL
  - name: interval
    type: string
    description: Interval between two consecutive points in the time series. Supported intervals include '1min', '5min', '15min',
      '30min', '45min', '1h', '2h', '4h', '1day', '1week', and '1month'.
    required: true
    default: 1min
  - name: format
    type: string
    description: Format of the response data, either 'CSV' or 'JSON'. Default is 'json'.
    required: false
    default: json
  - name: v_factor
    type: integer
    description: Volume factor used in the calculation of the T3MA.
    required: false
    default: 0.7
  - name: series_type
    type: string
    description: Type of series to use in the calculation. Supported values are 'open', 'high', 'low', and 'close'. Default
      is 'close'.
    required: false
    default: close
  - name: outputsize
    type: integer
    description: Number of data points to return. Default is 30.
    required: false
    default: 30
  - name: time_period
    type: integer
    description: Number of periods over which to calculate the T3MA. Default is 9.
    required: false
    default: 9
  tags:
  - t3ma
  test_prompts:
    single:
    - What is the T3MA for 'ETH/BTC' using a 1h interval and a time period of 14?
    - Calculate the T3MA for Bitcoin (BTC/USD) using a 1-hour interval and a volume factor of 2.
    - Fetch the T3MA for 'AAPL' on a daily interval for the last 60 days using the 'close' series type and a volume factor
      of 2.
    - Fetch the Triple Exponential Moving Average (T3MA) for Apple Inc. (AAPL) using the closing prices over the last 30 days
      with a 1-hour interval.
    single_clear:
    - What is the T3MA for 'ETH/BTC' using a 1h interval and a time period of 14?
    - Calculate the T3MA for Bitcoin (BTC/USD) using a 1-hour interval and a volume factor of 2.
    - Fetch the T3MA for 'AAPL' on a daily interval for the last 60 days using the 'close' series type and a volume factor
      of 2.
    - Fetch the Triple Exponential Moving Average (T3MA) for Apple Inc. (AAPL) using the closing prices over the last 30 days
      with a 1-hour interval.
- name: list_titles
  descriptions:
    minimal: Fetches a listing of titles that match specified...
    short: Fetches a listing of titles that match specified parameters from the Watchmode API.
    medium: Fetches a listing of titles that match specified parameters from the Watchmode API.
    long: Fetches a listing of titles that match specified parameters from the Watchmode API.
    verbose: Fetches a listing of titles that match specified parameters from the Watchmode API.
  parameters:
  - name: genres
    type: string
    description: Filter results to only include certain genre(s). Pass in a single genre ID or multiple comma-separated IDs.
      Default is '4,9'.
    required: true
    default: 4,9
  - name: limit
    type: integer
    description: Set how many titles to return per page. Default and maximum is 250.
    required: true
    default: '250'
  - name: source_ids
    type: string
    description: 'Filter the results to titles available on specific sources by passing individual IDs or multiple comma-separated
      IDs. Default is ''23,206''. Note: Only a single region can be set if this is populated.'
    required: true
    default: 23,206
  - name: source_types
    type: string
    description: 'Filter results to only include titles available on specific types of sources (e.g., subscription, free).
      Default is ''sub,free''. Note: Only a single region can be set if this is populated.'
    required: true
    default: sub,free
  - name: types
    type: string
    description: 'Filter results to only include titles available on specific types of sources (e.g., subscription, free).
      Default is ''sub,free''. Note: Only a single region can be set if this is populated.'
    required: true
    default: movie,tv_series
  - name: regions
    type: string
    description: 'Filter results to only include sources active in specific regions. Currently supported regions: US, GB,
      CA, AU. Default is ''US''. Note: Only a single region can be set if source_ids or source_types are populated.'
    required: true
    default: US
  - name: sort_by
    type: string
    description: 'Sort order of results. Possible values include: relevance_desc, relevance_asc, popularity_desc, popularity_asc,
      release_date_desc, release_date_asc, title_desc, title_asc. Default is ''relevance_desc''.'
    required: true
    default: relevance_desc
  - name: page
    type: integer
    description: Set the page of results to return. Default is 1.
    required: true
    default: '1'
  - name: network_ids
    type: string
    description: Filter results to titles that originally aired on specific TV networks by passing individual IDs or multiple
      comma-separated IDs. Default is '1,8,12'.
    required: true
    default: 1,8,12
  - name: release_date_start
    type: integer
    description: 'Filter results to only include titles released on or after a specific date. Format: YYYYMMDD. Default is
      20010101.'
    required: true
    default: '20010101'
  - name: release_date_end
    type: integer
    description: 'Filter results to only include titles released on or before a specific date. Format: YYYYMMDD. Default is
      20201211.'
    required: true
    default: '20201211'
  tags:
  - list
  - titles
  test_prompts:
    single:
    - List titles originally aired on networks '1' and '8', released after 2010, sorted by release date in descending order.
    - List all titles available on 'Netflix' and 'Hulu' from the 'Horror' genre released between 2000 and 2010.
    single_clear:
    - List titles originally aired on networks '1' and '8', released after 2010, sorted by release date in descending order.
    - List all titles available on 'Netflix' and 'Hulu' from the 'Horror' genre released between 2000 and 2010.
