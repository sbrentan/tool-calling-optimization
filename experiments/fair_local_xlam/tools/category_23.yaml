- name: countries
  descriptions:
    minimal: List or search for countries of the world in...
    short: List or search for countries of the world in different languages.
    medium: List or search for countries of the world in different languages. This function allows filtering and specifying
      the fields to return for each country, such as ISO codes, currency details, and dial codes.
    long: List or search for countries of the world in different languages. This function allows filtering and specifying
      the fields to return for each country, such as ISO codes, currency details, and dial codes.
    verbose: List or search for countries of the world in different languages. This function allows filtering and specifying
      the fields to return for each country, such as ISO codes, currency details, and dial codes.
  parameters:
  - name: currency
    type: string
    description: Filter by the currency name in the chosen language.
    required: false
  - name: dial_code
    type: integer
    description: Filter by the country's dial code.
    required: false
  - name: currency_code
    type: string
    description: Filter by the 3-letter currency code (ISO).
    required: false
  - name: fields
    type: string
    description: Specify which fields to return for each country. Defaults to 'currency,currency_num_code,currency_code,continent_code,currency,iso_a3,dial_code'.
    required: false
    default: currency,currency_num_code,currency_code,continent_code,currency,iso_a3,dial_code
  - name: iso_a2
    type: string
    description: Filter by the 2-letter ISO country code.
    required: false
  - name: name
    type: string
    description: Search string for the country name, can be partial.
    required: false
  - name: limit
    type: integer
    description: Limit the number of results returned. Defaults to 250.
    required: false
    default: '250'
  - name: continent_code
    type: string
    description: Filter by the 2-letter region/continent code (e.g., 'eu', 'na', 'sa', 'as', 'af', 'oc', 'an').
    required: false
  - name: iso_a3
    type: string
    description: Filter by the 3-letter ISO country code.
    required: false
  - name: currency_num_code
    type: string
    description: Filter by the 3-digit numeric currency code (ISO).
    required: false
  - name: lang
    type: string
    description: Language selection ISO 639-1 code. Overrides the Accept-Language header. Defaults to 'en'.
    required: false
  tags:
  - countries
  test_prompts:
    single:
    - What are the countries that use the currency code 'USD' and are located in the continent code 'NA'?
    single_clear:
    - What are the countries that use the currency code 'USD' and are located in the continent code 'NA'?
