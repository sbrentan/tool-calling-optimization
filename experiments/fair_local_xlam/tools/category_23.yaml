- name: email_qr_code
  descriptions:
    minimal: Creates and returns a static QR code encoded with...
    short: Creates and returns a static QR code encoded with the provided email address.
    medium: Creates and returns a static QR code encoded with the provided email address. The QR code can be customized with
      various design parameters such as background color, eye pattern, error correction level, size, data gradient colors,
      and data patterns. When scanned, the QR code will prompt the user to send an email to the specified address.
    long: Creates and returns a static QR code encoded with the provided email address. The QR code can be customized with
      various design parameters such as background color, eye pattern, error correction level, size, data gradient colors,
      and data patterns. When scanned, the QR code will prompt the user to send an email to the specified address.
    verbose: Creates and returns a static QR code encoded with the provided email address. The QR code can be customized with
      various design parameters such as background color, eye pattern, error correction level, size, data gradient colors,
      and data patterns. When scanned, the QR code will prompt the user to send an email to the specified address.
  parameters:
  - name: address
    type: string
    description: The email address to encode in the QR code.
    required: true
    default: marketing@scanova.io
  - name: background_color
    type: string
    description: The background color of the QR code. Defaults to '#FFFFFF'.
    required: false
    default: '#FFFFFF'
  - name: eye_pattern
    type: string
    description: The pattern of the QR code eyes. Defaults to 'RECT_RECT'.
    required: false
    default: RECT_RECT
  - name: error_correction
    type: string
    description: The error correction level of the QR code. Defaults to 'M'.
    required: false
    default: M
  - name: size
    type: string
    description: The size of the QR code. Defaults to 'm'.
    required: false
    default: m
  - name: data_gradient_start_color
    type: string
    description: The starting color for the data gradient. Defaults to '#000000'.
    required: false
    default: '#000000'
  - name: data_gradient_style
    type: string
    description: The style of the data gradient. Defaults to 'None'.
    required: false
    default: None
  - name: data_pattern
    type: string
    description: The pattern for the QR code data. Defaults to 'RECT'.
    required: false
    default: RECT
  - name: eye_color_outer
    type: string
    description: The outer color of the QR code eyes. Defaults to '#000000'.
    required: false
    default: '#000000'
  - name: data_gradient_end_color
    type: string
    description: The ending color for the data gradient. Defaults to '#000000'.
    required: false
    default: '#000000'
  - name: eye_color_inner
    type: string
    description: The inner color of the QR code eyes. Defaults to '#000000'.
    required: false
    default: '#000000'
  tags:
  - email
  - qr
  - code
  test_prompts:
    single:
    - Create a QR code for 'support@techhelp.com' with a gradient from green to yellow and a circular eye pattern.
    - Create a QR code for 'feedback@shop.com' with a striped data pattern and a gradient from blue to green.
    single_clear:
    - Create a QR code for 'support@techhelp.com' with a gradient from green to yellow and a circular eye pattern.
    - Create a QR code for 'feedback@shop.com' with a striped data pattern and a gradient from blue to green.
