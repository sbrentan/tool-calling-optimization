- name: v1_covid19
  descriptions:
    minimal: Fetches COVID-19 data from the API Ninjas...
    short: Fetches COVID-19 data from the API Ninjas COVID-19 endpoint based on the provided parameters.
    medium: Fetches COVID-19 data from the API Ninjas COVID-19 endpoint based on the provided parameters. Either `date` or
      `country` must be set.
    long: Fetches COVID-19 data from the API Ninjas COVID-19 endpoint based on the provided parameters. Either `date` or `country`
      must be set.
    verbose: Fetches COVID-19 data from the API Ninjas COVID-19 endpoint based on the provided parameters. Either `date` or
      `country` must be set.
  parameters:
  - name: type
    type: string
    description: Type of data to retrieve. Must be either "cases" or "deaths". If not set, "cases" will be used by default.
    required: false
  - name: country
    type: string
    description: Country name (case insensitive).
    required: false
  - name: date
    type: string
    description: Date to retrieve single-day snapshot. Must be in the form of YYYY-MM-DD (e.g., 2022-01-01). Defaults to '2022-01-01'.
    required: false
    default: '2022-01-01'
  - name: county
    type: string
    description: County name for US states (case insensitive). For United States data only. Must be used in conjunction with
      `country` (United States) and `region` (e.g., California).
    required: false
  - name: region
    type: string
    description: Administrative region (also known as state or province in many countries) name (case insensitive). Must be
      used in conjunction with `country`. If not set, countries with data broken down by administrative regions will return
      separate data for each region.
    required: false
  tags:
  - v1
  - covid19
  test_prompts:
    single:
    - What was the COVID-19 death toll in California on April 1, 2020?
    - What are the COVID-19 cases in New York County, New York on May 10, 2020?
    single_clear:
    - What was the COVID-19 death toll in California on April 1, 2020?
    - What are the COVID-19 cases in New York County, New York on May 10, 2020?
