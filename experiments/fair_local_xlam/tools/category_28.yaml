- name: rocr
  descriptions:
    minimal: Calculates the Rate of Change Ratio (ROCR) for a...
    short: Calculates the Rate of Change Ratio (ROCR) for a given financial instrument over a specified time period.
    medium: Calculates the Rate of Change Ratio (ROCR) for a given financial instrument over a specified time period.
    long: Calculates the Rate of Change Ratio (ROCR) for a given financial instrument over a specified time period.
    verbose: Calculates the Rate of Change Ratio (ROCR) for a given financial instrument over a specified time period.
  parameters:
  - name: interval
    type: string
    description: 'Interval between two consecutive points in the time series. Supported values include: `1min`, `5min`, `15min`,
      `30min`, `45min`, `1h`, `2h`, `4h`, `1day`, `1week`, `1month`.'
    required: true
    default: 1min
  - name: symbol
    type: string
    description: Instrument symbol, which can be any equity, index, ETF, forex, or cryptocurrency (e.g., `AAPL`, `EUR/USD`,
      `ETH/BTC`).
    required: true
    default: AAPL
  - name: format
    type: string
    description: The format of the output, which can either be `csv` or `json`. Default is `json`.
    required: false
    default: json
  - name: time_period
    type: integer
    description: Number of periods to go back for calculating the ROCR. Default is 9.
    required: false
    default: 9
  - name: series_type
    type: string
    description: 'The type of price series to use in the calculation. Supported values include: `open`, `high`, `low`, `close`.
      Default is `close`.'
    required: false
    default: close
  - name: outputsize
    type: integer
    description: Number of data points to retrieve. Default is 30.
    required: false
    default: 30
  tags:
  - rocr
  test_prompts:
    single:
    - Please provide the ROCR for the EUR/USD currency pair using 15-minute intervals and close prices for the last 20 periods.
    - What is the ROCR for the S&P 500 index (SPY) using monthly intervals and high prices for the last 6 months?
    - Calculate the ROCR for Apple Inc. (AAPL) over the last 9 periods using 15-minute intervals and close prices.
    single_clear:
    - Please provide the ROCR for the EUR/USD currency pair using 15-minute intervals and close prices for the last 20 periods.
    - What is the ROCR for the S&P 500 index (SPY) using monthly intervals and high prices for the last 6 months?
    - Calculate the ROCR for Apple Inc. (AAPL) over the last 9 periods using 15-minute intervals and close prices.
