- name: newlyregistereddomains
  descriptions:
    minimal: Fetch a list of newly registered domains from a...
    short: Fetch a list of newly registered domains from a REST API.
    medium: Fetch a list of newly registered domains from a REST API.
    long: Fetch a list of newly registered domains from a REST API.
    verbose: Fetch a list of newly registered domains from a REST API.
  parameters:
  - name: page
    type: integer
    description: The page number of domains to retrieve. Default is 1.
    required: false
    default: 1
  - name: exclude
    type: string
    description: Keywords to exclude from the domain search. Default is None.
    required: false
  - name: date
    type: string
    description: The registration date of the domains to be searched in 'YYYY-MM-DD' format. Default is '2023-06-12'.
    required: false
    default: '2023-06-12'
  - name: keywords
    type: string
    description: Keywords that must be included in the domain search. Default is None.
    required: false
  tags:
  - newlyregistereddomains
  test_prompts:
    single:
    - Fetch the list of newly registered domains on June 15, 2023, excluding those with 'shop' in the name.
    - Fetch newly registered domains on page 2 excluding 'tech' and including 'finance'.
    - Get domains from page 3, excluding 'shop' and including 'online'.
    - Get domains from page 3, excluding 'crypto' and including 'banking'.
    single_clear:
    - Fetch the list of newly registered domains on June 15, 2023, excluding those with 'shop' in the name.
    - Fetch newly registered domains on page 2 excluding 'tech' and including 'finance'.
    - Get domains from page 3, excluding 'shop' and including 'online'.
    - Get domains from page 3, excluding 'crypto' and including 'banking'.
