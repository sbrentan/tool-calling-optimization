- name: geogrid_seach_with_ranking
  descriptions:
    minimal: Perform a full grid search and retrieve the...
    short: Perform a full grid search and retrieve the ranking of a business at every coordinate point in the grid.
    medium: Perform a full grid search and retrieve the ranking of a business at every coordinate point in the grid. The grid
      cells in the results are ordered left-to-right, then top-to-bottom. Additional ranking data for the business is provided
      based on either place ID or business name.
    long: Perform a full grid search and retrieve the ranking of a business at every coordinate point in the grid. The grid
      cells in the results are ordered left-to-right, then top-to-bottom. Additional ranking data for the business is provided
      based on either place ID or business name.
    verbose: Perform a full grid search and retrieve the ranking of a business at every coordinate point in the grid. The
      grid cells in the results are ordered left-to-right, then top-to-bottom. Additional ranking data for the business is
      provided based on either place ID or business name.
  parameters:
  - name: match_value
    type: string
    description: The search query or keyword.
    required: true
    default: ChIJoejvAr3Mj4ARtHrbKxtAHXI
  - name: query
    type: string
    description: The Google Place ID of the business or the business name to match in results. Use the `match_type` parameter
      to specify the choice.
    required: true
    default: web design
  - name: lng
    type: integer
    description: Longitude value of the grid center coordinate point.
    required: true
    default: '-121.938314'
  - name: lat
    type: integer
    description: Latitude value of the grid center coordinate point.
    required: true
    default: '37.341759'
  - name: zoom
    type: integer
    description: Google Maps zoom level to use for searching each grid point. Default is 13.
    required: false
    default: '13'
  - name: match_type
    type: string
    description: The type of match to perform for ranking. Either 'place_id' or 'name'. Default is 'place_id'.
    required: false
    default: place_id
  - name: distance_unit
    type: string
    description: The unit of measurement for distance. Default is 'km'.
    required: false
    default: km
  - name: width
    type: integer
    description: The width of the grid in location points for non-square grid searches. Default is 5.
    required: false
    default: '5'
  - name: height
    type: integer
    description: The height of the grid in location points for non-square grid searches. Default is 5.
    required: false
    default: '5'
  - name: grid_size
    type: integer
    description: The size of the grid (e.g., 3x3, 5x5). Default is 5.
    required: false
    default: '5'
  - name: distance
    type: integer
    description: The distance between coordinate points on the same row/column in the grid. Default is 1.
    required: false
    default: '1'
  tags:
  - geogrid
  - seach
  - with
  test_prompts:
    single:
    - Analyze the ranking of a hotel named 'Grand Plaza' in Chicago, using a 6x6 grid with a distance of 3 units between points
      and a zoom level of 16.
    single_clear:
    - Analyze the ranking of a hotel named 'Grand Plaza' in Chicago, using a 6x6 grid with a distance of 3 units between points
      and a zoom level of 16.
