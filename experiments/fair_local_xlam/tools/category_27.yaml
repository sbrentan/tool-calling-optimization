- name: minmax
  descriptions:
    minimal: Retrieve the lowest and highest values over a...
    short: Retrieve the lowest and highest values over a specified period (MINMAX) for a given financial instrument.
    medium: Retrieve the lowest and highest values over a specified period (MINMAX) for a given financial instrument.
