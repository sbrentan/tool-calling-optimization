    short: Generates a CAPTCHA image with optional customizations and returns the resulting data.
    medium: Generates a CAPTCHA image with optional customizations and returns the resulting data.
    long: Generates a CAPTCHA image with optional customizations and returns the resulting data.
    verbose: Generates a CAPTCHA image with optional customizations and returns the resulting data.
  parameters:
  - name: fontname
    type: string
    description: The font to be used for the CAPTCHA text. Supported font names are 'sora', 'noto-sans', and 'ubuntu'. Default
      is 'sora'.
    required: false
    default: sora
  - name: noise_number
    type: integer
    description: The amount of noise to include in the CAPTCHA image. Default is 10.
    required: false
    default: '10'
  - name: text
    type: string
    description: Custom text to be used as the CAPTCHA solution. If not provided, a random text solution will be generated.
    required: false
  tags:
  - captcha
  - generator
  test_prompts:
    single:
    - I want to create a CAPTCHA with the text 'secure' and a bit more noise than usual. Can you set the font to 'noto-sans'?
    single_clear:
    - I want to create a CAPTCHA with the text 'secure' and a bit more noise than usual. Can you set the font to 'noto-sans'?
- name: getmediumquestion
  descriptions:
    minimal: Fetches the number of medium-level questions...
    short: Fetches the number of medium-level questions solved by the given user from the LeetCode API.
    medium: Fetches the number of medium-level questions solved by the given user from the LeetCode API.
    long: Fetches the number of medium-level questions solved by the given user from the LeetCode API.
    verbose: Fetches the number of medium-level questions solved by the given user from the LeetCode API.
  parameters:
  - name: username
    type: string
    description: The username of the LeetCode user whose medium-level questions solved count is to be fetched.
