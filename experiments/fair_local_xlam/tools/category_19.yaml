    - Calculate the neuronal activity rate for a neuron with a synaptic input rate of 100 inputs per second, a synaptic weight
      of 0.8, and a decay constant of 0.05.
    - If the synaptic input rate is 200 inputs per second and the decay constant is 0.2, what would be the neuronal activity
