- name: get_ip_data
  descriptions:
    minimal: Fetch location-related data for a given IP...
    short: Fetch location-related data for a given IP address using the APIIP.
    medium: Fetch location-related data for a given IP address using the APIIP.net service.
    long: Fetch location-related data for a given IP address using the APIIP.net service.
    verbose: Fetch location-related data for a given IP address using the APIIP.net service.
  parameters:
  - name: callback
    type: string
    description: JSONP callback function name as per the APIIP.net documentation. Default is 'FUNCTION_NAME'.
    required: true
    default: FUNCTION_NAME
  - name: ip
    type: string
    description: 'IPv4 or IPv6 address, or a comma-separated list of such addresses (limit: 50). Default is ''67.250.186.196''.'
    required: true
    default: 67.250.186.196
  - name: language
    type: string
    description: 2-letter language code to customize the response language. Default is 'es'.
    required: true
    default: es
  - name: fields
    type: string
    description: Comma-separated list of response fields to retrieve specific data according to the APIIP.net documentation.
      Default is 'city,capital'.
    required: true
    default: city,capital
  - name: output
    type: string
    description: Format of the API response, either 'json' or 'xml'. Default is 'xml'.
    required: true
    default: xml
  tags:
  - get
  - ip
  - data
  test_prompts:
    single:
    - What is the location data for IP '8.8.8.8'?
    single_clear:
    - What is the location data for IP '8.8.8.8'?
