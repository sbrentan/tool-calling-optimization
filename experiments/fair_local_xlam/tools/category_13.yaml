- name: titles_with_changed_sources
  descriptions:
    minimal: Fetches a listing of titles that have changed...
    short: Fetches a listing of titles that have changed their streaming sources within a specified date range.
    medium: Fetches a listing of titles that have changed their streaming sources within a specified date range.
    long: Fetches a listing of titles that have changed their streaming sources within a specified date range.
    verbose: Fetches a listing of titles that have changed their streaming sources within a specified date range.
  parameters:
  - name: start_date
    type: integer
    description: Start date to include changes from a specific date range. Format is YYYYMMDD (e.g., 20210101 for January
      1st, 2021), or YYYYMMDDHHMMSS for more granular results (e.g., 20210101123459 for January 1st, 2021 12:24pm and 59 seconds).
      Hours are in 24-hour format and in Eastern Standard Time. Defaults to None.
    required: false
  - name: limit
    type: integer
    description: Number of titles to return per page. Default is 50, maximum is 250.
    required: false
    default: '50'
  - name: end_date
    type: integer
    description: End date to include changes from a specific date range. Format is YYYYMMDD (e.g., 20210101 for January 1st,
      2021), or YYYYMMDDHHMMSS for more granular results (e.g., 20210101123459 for January 1st, 2021 12:24pm and 59 seconds).
      Hours are in 24-hour format and in Eastern Standard Time. Defaults to None.
    required: false
  - name: regions
    type: string
    description: 2-character region code (e.g., US) for the country to get titles with changed sources from. Defaults to 'US,CA'.
    required: false
    default: US,CA
  - name: types
    type: string
    description: 'Filter result to include only certain types of titles. Pass a single type or multiple types comma delimited.
      Possible values: ''movie'', ''tv_series'', ''tv_special'', ''tv_miniseries'', ''short_film''. Defaults to ''movie,tv_series''.'
    required: false
    default: movie,tv_series
  - name: page
    type: integer
    description: Page of results to return. Defaults to 1.
    required: false
    default: '1'
  tags:
  - titles
  - with
  - changed
  test_prompts:
    single:
    - What are the titles that changed their streaming sources in the last week in the US?
    single_clear:
    - What are the titles that changed their streaming sources in the last week in the US?
