# ============================================================
# PHASE 8: Model Comparison - llama3.1-8b + Confidence
# ============================================================
# Purpose: Test if confidence helps smaller models
# Hypothesis: Fallback may compensate for model limitations
# Rubric: Experiments - methodology-model interaction
# NOTE: This config has HARDCODED model for comparison purposes
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: llama3.1-8b  # HARDCODED for comparison

# --- Experiment Identification ---
name: phase8_model_llama8b_confidence
description: "Model comparison: llama3.1-8b with Confidence fallback"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
