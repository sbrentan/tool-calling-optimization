# ============================================================
# PHASE 6: Confidence - 500 Tools (Medium Thresholds)
# ============================================================
# Purpose: Test confidence at smaller scale for comparison
# Hypothesis: May need different thresholds at smaller scale
# Rubric: Experiments - scale comparison
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase6_confidence_500tools_med
description: "Confidence fallback with 500 tools, medium thresholds"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
