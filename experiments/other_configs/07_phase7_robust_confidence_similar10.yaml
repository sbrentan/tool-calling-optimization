# ============================================================
# PHASE 7: Robustness - Confidence with 10 Similar Tools
# ============================================================
# Purpose: Test confidence fallback with distractors
# Hypothesis: Fallback chain may help recover from confusion
# Rubric: Experiments - production reliability under stress
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase7_robust_confidence_similar10
description: "Confidence fallback with 500 tools + 10 similar distractors"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 10
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
