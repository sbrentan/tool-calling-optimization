# ============================================================
# PHASE 6: Confidence - 985 Tools (k=20, Medium Thresholds)
# ============================================================
# Purpose: Test with high RAG retrieval count
# Hypothesis: Even more tools for complex queries
# Rubric: Experiments - RAG config optimization
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase6_confidence_985tools_k20_med
description: "Confidence fallback with 985 tools, top_k=20, medium thresholds"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 20
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
