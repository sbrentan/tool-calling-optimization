# ============================================================
# PHASE 8: Model Comparison - llama3.1-8b + Adaptive RAG
# ============================================================
# Purpose: Test smaller model with adaptive RAG
# Hypothesis: 8B model may struggle with complex queries
# Rubric: Experiments - cost-accuracy tradeoff analysis
# NOTE: This config has HARDCODED model for comparison purposes
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: llama3.1-8b  # HARDCODED for comparison

# --- Experiment Identification ---
name: phase8_model_llama8b_adaptive
description: "Model comparison: llama3.1-8b with Adaptive RAG"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
