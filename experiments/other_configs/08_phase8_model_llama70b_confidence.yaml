# ============================================================
# PHASE 8: Model Comparison - llama-3.3-70b + Confidence
# ============================================================
# Purpose: Baseline model comparison with confidence fallback
# Hypothesis: 70B + confidence = highest reliability
# Rubric: Experiments - production configuration
# NOTE: This config has HARDCODED model for comparison purposes
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: llama-3.3-70b  # HARDCODED for comparison

# --- Experiment Identification ---
name: phase8_model_llama70b_confidence
description: "Model comparison: llama-3.3-70b with Confidence fallback"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
