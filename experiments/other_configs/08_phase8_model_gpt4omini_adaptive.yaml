# ============================================================
# PHASE 8: Model Comparison - gpt-4o-mini + Adaptive RAG
# ============================================================
# Purpose: Test OpenAI model with adaptive RAG
# Hypothesis: GPT-4o-mini balances cost and capability
# Rubric: Experiments - OpenAI provider comparison
# NOTE: This config has HARDCODED model for comparison purposes
# NOTE: Requires OPENAI_API_KEY environment variable
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: gpt-4o-mini  # HARDCODED for comparison
provider: openai

# --- Experiment Identification ---
name: phase8_model_gpt4omini_adaptive
description: "Model comparison: gpt-4o-mini with Adaptive RAG"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
