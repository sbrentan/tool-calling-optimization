# ============================================================
# PHASE 7: Robustness - RAG No-Tool Handling
# ============================================================
# Purpose: Test RAG handling of no-tool scenarios
# Hypothesis: RAG may retrieve tools even when none needed
# Rubric: Experiments - false positive analysis
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase7_robust_rag_notool
description: "RAG with no-tool test scenarios"

# --- Tool Configuration ---
num_tools: 200
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null
include_no_tool: true

# --- Methodology ---
methodology: rag
allow_no_tool_call: true
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
