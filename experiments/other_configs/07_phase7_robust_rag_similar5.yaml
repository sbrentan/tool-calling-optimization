# ============================================================
# PHASE 7: Robustness - RAG with 5 Similar Tools
# ============================================================
# Purpose: Test RAG resistance to semantic distractors
# Hypothesis: RAG may be more vulnerable to similar embeddings
# Rubric: Experiments - methodology comparison under stress
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase7_robust_rag_similar5
description: "RAG with 200 tools + 5 similar distractors"

# --- Tool Configuration ---
num_tools: 200
doc_length: medium
prompt_type: concise
num_similar_tools: 5
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
