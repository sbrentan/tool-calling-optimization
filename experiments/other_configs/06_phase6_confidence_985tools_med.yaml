# ============================================================
# PHASE 6: Confidence - 985 Tools (Medium Thresholds)
# ============================================================
# Purpose: Test balanced confidence requirements
# Hypothesis: Medium thresholds = balanced fallbacks
# Rubric: Experiments - threshold optimization
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase6_confidence_985tools_med
description: "Confidence fallback with 985 tools, medium thresholds (0.8/0.7)"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
