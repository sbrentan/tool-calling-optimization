tools:
- name: title_seasons
  descriptions:
    minimal: Fetch the seasons of the specified Netflix titles.
    short: Fetch the seasons of the specified Netflix titles.
    medium: Fetch the seasons of the specified Netflix titles.
    long: Fetch the seasons of the specified Netflix titles.
    verbose: Fetch the seasons of the specified Netflix titles.
  parameters:
  - name: ids
    type: string
    description: Comma-separated string of Netflix title IDs for which seasons are to be fetched.
    required: true
    default: '80057281'
  - name: lang
    type: string
    description: Language code for the fetched data, default is 'en'.
    required: false
    default: en
  - name: offset
    type: integer
    description: Offset for the seasons data, default is 0.
    required: false
    default: '0'
  - name: limit
    type: integer
    description: Limit for the number of seasons to fetch, default is 25.
    required: false
    default: '25'
  tags:
  - title
  - seasons
  test_prompts:
    single:
    - I need the seasons of the Netflix titles with IDs 's1', 's2', and 's3' in French, starting from offset 10 with a limit
      of 30.
    - Fetch the seasons for the Netflix titles 's1_9876' and 's4_6543' with an offset of 10 and limit of 30.
    - Please retrieve the seasons of Netflix titles with IDs 's1', 's2', and 's3' in French language, starting from offset
      10 with a limit of 30.
    single_clear:
    - I need the seasons of the Netflix titles with IDs 's1', 's2', and 's3' in French, starting from offset 10 with a limit
      of 30.
    - Fetch the seasons for the Netflix titles 's1_9876' and 's4_6543' with an offset of 10 and limit of 30.
    - Please retrieve the seasons of Netflix titles with IDs 's1', 's2', and 's3' in French language, starting from offset
      10 with a limit of 30.
