- name: advanced_search
  descriptions:
    minimal: Performs an advanced search for movies or TV...
    short: Performs an advanced search for movies or TV shows based on multiple filtering parameters such as release year,
      IMDb rating, genre, language, etc.
    medium: Performs an advanced search for movies or TV shows based on multiple filtering parameters such as release year,
      IMDb rating, genre, language, etc.
    long: Performs an advanced search for movies or TV shows based on multiple filtering parameters such as release year,
      IMDb rating, genre, language, etc.
    verbose: Performs an advanced search for movies or TV shows based on multiple filtering parameters such as release year,
      IMDb rating, genre, language, etc.
  parameters:
  - name: start_year
    type: integer
    description: The starting year for the search range. Valid values range from 1970 to 2020. Defaults to 1970.
    required: false
    default: '1970'
  - name: page
    type: integer
    description: The page number of the search results. Defaults to 1.
    required: false
    default: '1'
  - name: max_imdb
    type: integer
    description: The maximum IMDb rating for the search results. Defaults to 7.
    required: false
    default: '7.8'
  - name: type
    type: string
    description: The type of content to search for, either 'movie' or 'show'. Defaults to 'movie'.
    required: false
    default: movie
  - name: sort
    type: string
    description: The sorting order of the results. Valid values are 'highestrated', 'lowestrated', 'latest', 'oldest'. Defaults
      to 'latest'.
    required: false
    default: latest
  - name: min_imdb
    type: integer
    description: The minimum IMDb rating for the search results. Defaults to 6.
    required: false
    default: '6'
  - name: genre
    type: string
    description: The genre(s) of the content. Use comma-separated values for multiple genres (e.g., 'action,horror'). Defaults
      to 'action'.
    required: false
    default: action
  - name: language
    type: string
    description: The language(s) of the content. Use comma-separated values for multiple languages (e.g., 'english,german').
      Defaults to 'english'.
    required: false
    default: english
  - name: end_year
    type: integer
    description: The ending year for the search range. Valid values range from 1970 to 2020. Defaults to 2020.
    required: false
    default: '2020'
  tags:
  - advanced
  - search
  test_prompts:
    single:
    - Can you find movies released between 2000 and 2010 with IMDb ratings between 7 and 9, sorted by highest rating, in the
      genres of sci-fi and drama?
    - I'm interested in watching a French sci-fi movie from the 2000s. Can you help me find one?
    single_clear:
    - Can you find movies released between 2000 and 2010 with IMDb ratings between 7 and 9, sorted by highest rating, in the
      genres of sci-fi and drama?
    - I'm interested in watching a French sci-fi movie from the 2000s. Can you help me find one?
