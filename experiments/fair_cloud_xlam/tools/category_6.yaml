- name: independent_samples_t_test
  descriptions:
    minimal: Conducts a two-sample independent t-test and...
    short: Conducts a two-sample independent t-test and returns the t-statistic, p-value, and conclusion.
    medium: Conducts a two-sample independent t-test and returns the t-statistic, p-value, and conclusion.
    long: Conducts a two-sample independent t-test and returns the t-statistic, p-value, and conclusion.
    verbose: Conducts a two-sample independent t-test and returns the t-statistic, p-value, and conclusion.
  parameters:
  - name: sample1
    type: string
    description: The first sample of observations.
    required: true
    default: 0.05
  - name: sample2
    type: string
    description: The second sample of observations.
    required: true
    default: 0.05
  - name: alpha
    type: number
    description: The significance level of the test. Defaults to 0.05.
    required: false
  tags:
  - independent
  - samples
  - t
  test_prompts:
    single:
    - 'Conduct a t-test on two samples: [10, 15, 20, 25, 30] and [12, 17, 22, 27, 32] with a significance level of 0.01.'
    - Evaluate if two sets of test scores, [85, 88, 90, 92, 95] and [80, 82, 84, 86, 88], show a significant difference at
      a 0.10 significance level.
    - I'm conducting a study on the effectiveness of two different teaching methods. The first method has test scores [85,
      88, 90, 87, 92] and the second method has scores [80, 82, 85, 84, 87]. I want to know if there's a significant difference
      in the effectiveness of these methods using an independent samples t-test at a significance level of 0.01.
    - 'Conduct a t-test to compare the average scores of two groups in a test: Group C [80, 85, 90, 82, 88] and Group D [75,
      80, 85, 77, 82] with a significance level of 0.05.'
    - Perform an independent samples t-test to determine if there is a significant difference in the recovery times of patients
      given two different medications. The data for Medication X is [3, 4, 5, 4, 3] days and for Medication Y is [2, 3, 2,
      3, 2] days. Assume a standard significance level of 0.05.
    - 'Perform a t-test to compare the average salaries of two departments: Department A [50000, 55000, 60000, 52000, 58000]
      dollars and Department B [45000, 48000, 50000, 47000, 52000] dollars with a significance level of 0.05.'
    - 'Perform an independent samples t-test on two groups of test scores: [85, 90, 92, 88, 91] and [80, 82, 84, 86, 88] at
      a significance level of 0.01.'
    - Analyze the effectiveness of two manufacturing processes by comparing their defect rates. Process 1 has defect rates
