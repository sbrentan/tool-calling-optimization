    type: string
    description: The name of the label manufacturer. Default is 'avery'. Possible values include 'Avery', 'Herma', 'Onlinelabels',
      'Uline', 'Megastar', 'Sheetlabels'.
    required: false
    default: avery
  - name: height
    type: string
    description: The height of the label.
    required: false
  - name: code
    type: string
    description: A string representing approximate label sizes in the format [width]x[height]. Default is '2x2'.
    required: false
    default: 2x2
  - name: width
    type: string
    description: The width of the label.
    required: false
  - name: shape
    type: string
