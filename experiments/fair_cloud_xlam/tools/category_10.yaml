- name: places_list_by_radius_nearby_search
  descriptions:
    minimal: Fetches objects closest to a selected point...
    short: Fetches objects closest to a selected point filtered by optional parameters.
    medium: Fetches objects closest to a selected point filtered by optional parameters.
    long: Fetches objects closest to a selected point filtered by optional parameters.
    verbose: Fetches objects closest to a selected point filtered by optional parameters.
  parameters:
  - name: lang
    type: string
    description: Language code (2 characters, ISO639-1). Available values include 'en' (English) and 'ru' (Russian).
    required: true
  - name: radius
    type: integer
    description: Maximum distance from the selected point in meters.
    required: true
    default: '500'
  - name: lon
    type: integer
    description: Longitude of the selected point.
    required: true
    default: '38.364285'
  - name: lat
    type: integer
    description: Latitude of the selected point.
    required: true
    default: '59.855685'
  - name: src_attr
    type: string
    description: Source of the object attributes, multiple sources can be separated by commas. Defaults to None. Available
      values include 'osm', 'wikidata', 'snow', 'cultura.ru', 'rosnedra', 'user'.
    required: false
  - name: format
    type: string
    description: The output format. Defaults to GeoJSON. Values can be 'json', 'geojson', or 'count'.
    required: false
  - name: kinds
    type: string
    description: Object category, multiple categories can be separated by commas. Defaults to None. See object category hierarchy
      at 'https://dev.opentripmap.com/doc/en/'.
    required: false
  - name: src_geom
    type: string
    description: Source of the object geometry. Defaults to None. Available values include 'osm', 'wikidata', 'snow', 'cultura.ru',
      'rosnedra'.
    required: false
  - name: rate
    type: string
    description: Minimum rating of the object popularity. Defaults to None. Available values are '1', '2', '3', '1h', '2h',
      '3h'.
    required: false
  - name: limit
    type: integer
    description: Maximum number of returned objects. Defaults to None, with a maximum limit of 500.
    required: false
  - name: name
    type: string
    description: Text string to search at the beginning of the object name (minimum 3 characters). Defaults to None.
    required: false
  tags:
  - places
  - list
  - by
  test_prompts:
    single:
    - What are the top-rated attractions within 2000 meters of the Statue of Liberty?
    single_clear:
    - What are the top-rated attractions within 2000 meters of the Statue of Liberty?
