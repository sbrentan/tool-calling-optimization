- name: label_templates
  descriptions:
    minimal: Fetches a list of label templates filtered by...
    short: Fetches a list of label templates filtered by various parameters such as paper format, brand, label size, and shape.
    medium: Fetches a list of label templates filtered by various parameters such as paper format, brand, label size, and
      shape.
    long: Fetches a list of label templates filtered by various parameters such as paper format, brand, label size, and shape.
    verbose: Fetches a list of label templates filtered by various parameters such as paper format, brand, label size, and
      shape.
  parameters:
  - name: format
    type: string
    description: The paper format, either 'Letter' (8.5 inch by 11 inch) or 'A4' (210 mm by 297 mm).
    required: true
    default: letter
