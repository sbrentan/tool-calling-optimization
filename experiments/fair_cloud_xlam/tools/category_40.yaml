category: category_40
tools:
- name: calculate_grid_coordinate_points
  descriptions:
    minimal: Calculate all grid coordinate points based on a...
    short: Calculate all grid coordinate points based on a center geocoordinate point and distance arguments.
    medium: Calculate all grid coordinate points based on a center geocoordinate point and distance arguments.
    long: Calculate all grid coordinate points based on a center geocoordinate point and distance arguments.
    verbose: Calculate all grid coordinate points based on a center geocoordinate point and distance arguments.
  parameters:
  - name: radius
    type: string
    description: The distance between coordinate points (on the same row/column in the grid). The units of the radius are
      determined by the `radius_units` parameter. Allowed values are 0.1-100. Default is 1.
    required: true
    default: '1'
  - name: lng
    type: string
    description: Grid center coordinate point longitude value.
    required: true
    default: '-121.938314'
  - name: grid_size
    type: string
    description: The size of the grid (e.g., 3x3, 5x5, 7x7, etc). Allowed values are 3, 5, 7, 9, 11, 13, 15.
    required: true
    default: '3'
  - name: lat
    type: string
    description: Grid center coordinate point latitude value.
    required: true
    default: '37.341759'
  - name: radius_units
    type: string
    description: Distance measurement units for the radius parameter. Allowed values are 'km' for kilometers and 'mi' for
      miles. Default is 'km'.
    required: false
  tags:
  - calculate
  - grid
  - coordinate
  test_prompts:
    single:
    - Compute grid points for a 7x7 grid around (34.0522° N, 118.2437° W) with a radius of 3 miles.
    single_clear:
    - Compute grid points for a 7x7 grid around (34.0522° N, 118.2437° W) with a radius of 3 miles.
