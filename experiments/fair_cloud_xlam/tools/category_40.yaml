- name: estimated_salary
  descriptions:
    minimal: Fetch the estimated salary for a given job title...
    short: Fetch the estimated salary for a given job title within a specified radius around a particular location.
    medium: Fetch the estimated salary for a given job title within a specified radius around a particular location.
    long: Fetch the estimated salary for a given job title within a specified radius around a particular location.
