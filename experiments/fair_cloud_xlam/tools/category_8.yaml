- name: stochrsi
  descriptions:
    minimal: Fetches the Stochastic Relative Strength Index...
    short: Fetches the Stochastic Relative Strength Index (STOCHRSI) for a given financial instrument using the Twelve Data
      API.
    medium: Fetches the Stochastic Relative Strength Index (STOCHRSI) for a given financial instrument using the Twelve Data
      API.
    long: Fetches the Stochastic Relative Strength Index (STOCHRSI) for a given financial instrument using the Twelve Data
      API.
    verbose: Fetches the Stochastic Relative Strength Index (STOCHRSI) for a given financial instrument using the Twelve Data
      API.
  parameters:
  - name: symbol
    type: string
    description: The instrument symbol, which can be an equity, index, ETF, forex, or cryptocurrency (e.g., `AAPL`, `EUR/USD`,
      `ETH/BTC`).
    required: true
    default: AAPL
  - name: interval
    type: string
    description: The interval between two consecutive points in the time series. Supported values include `1min`, `5min`,
      `15min`, `30min`, `45min`, `1h`, `2h`, `4h`, `1day`, `1week`, `1month`.
    required: true
    default: 1min
  - name: fast_dma_type
    type: string
    description: The type of moving average used for smoothing. Supported values are `SMA`, `EMA`, `WMA`, `DEMA`, `TEMA`,
      `TRIMA`, `KAMA`, `MAMA`, `T3MA`. Defaults to `SMA`.
    required: true
    default: SMA
  - name: series_type
    type: string
    description: The type of series data. Supported values are `open`, `high`, `low`, `close`. Defaults to `close`.
    required: true
    default: close
  - name: fast_d_period
    type: integer
    description: The period for the fast D moving average. Defaults to 3.
    required: true
    default: 3
  - name: outputsize
    type: integer
    description: The number of data points to return. Defaults to 30.
    required: true
    default: 30
  - name: fast_k_period
    type: integer
    description: The period for the fast K moving average. Defaults to 3.
    required: true
    default: 3
  - name: format
    type: string
    description: The output format of the API response. Supported values are `json` and `csv`. Defaults to `json`.
    required: true
    default: json
  - name: time_period
    type: integer
    description: The period for the RSI calculation. Defaults to 14.
    required: true
    default: 14
  tags:
  - stochrsi
  test_prompts:
    single:
    - Can you fetch the Stochastic RSI for Apple Inc. (AAPL) using daily intervals and a fast D period of 5?
    - Compute the Stochastic RSI for Ethereum (ETH/USD) with a time period of 20 and a fast DMA type of EMA.
    single_clear:
    - Can you fetch the Stochastic RSI for Apple Inc. (AAPL) using daily intervals and a fast D period of 5?
    - Compute the Stochastic RSI for Ethereum (ETH/USD) with a time period of 20 and a fast DMA type of EMA.
