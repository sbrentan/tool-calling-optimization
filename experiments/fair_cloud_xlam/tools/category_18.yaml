    type: string
    description: Product ASIN to get offers for. Supports batching up to 10 ASINs in a single request, separated by a comma
      (e.g., 'B08PPDJWC8,B07ZPKBL9V,B08BHXG144').
    required: true
    default: B07ZPKBL9V
