    type: string
    description: 'Filter products by condition, specified as a comma-delimited list. Valid values: ''NEW'', ''USED_LIKE_NEW'',
      ''USED_VERY_GOOD'', ''USED_GOOD'', ''USED_ACCEPTABLE''. Default is None.'
    required: false
  - name: country
    type: string
    description: 'Sets the marketplace country, language, and currency. Allowed values: ''US'', ''AU'', ''BR'', ''CA'', ''CN'',
      ''FR'', ''DE'', ''IN'', ''IT'', ''MX'', ''NL'', ''SG'', ''ES'', ''TR'', ''AE'', ''GB'', ''JP''. Default is ''US''.'
