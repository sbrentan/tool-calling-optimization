- name: search_places
  descriptions:
    minimal: Fetches a list of places (either countries...
    short: Fetches a list of places (either countries, cities, or administrative divisions) that match a query and can be
      filtered by various properties.
    medium: Fetches a list of places (either countries, cities, or administrative divisions) that match a query and can be
      filtered by various properties.
    long: Fetches a list of places (either countries, cities, or administrative divisions) that match a query and can be filtered
      by various properties.
    verbose: Fetches a list of places (either countries, cities, or administrative divisions) that match a query and can be
      filtered by various properties.
  parameters:
  - name: type
    type: string
    description: Filters places by `type`. Specifiable values are 'CITY', 'ADMIN_DIVISION_1', 'ADMIN_DIVISION_2', and 'COUNTRY'.
      Default is 'CITY'.
    required: true
    default: CITY
  - name: language
    type: string
    description: Specifies the language (ISO 639-1) to get the localized name of the place. If translation is unavailable,
      the "localizedName" property will be null.
    required: true
  - name: skip
    type: integer
    description: Number of places to ignore before beginning to return results. Used with `limit` to paginate results. Defaults
      to 0.
    required: true
    default: '0'
  - name: country
    type: string
    description: Filters places by their country `id`. Multiple values can be specified, separated by commas (e.g., 'US,CA').
      Default is 'US,CA'.
    required: true
    default: US,CA
  - name: limit
    type: integer
    description: Maximum number of places to return. Used with `skip` to paginate results. Default is 10, maximum is 100.
    required: true
    default: '10'
  - name: admindivision1
    type: string
    description: Filters places by their adminDivision1 `id`. Multiple values can be specified, separated by commas (e.g.,
      'US.CA,US.DE').
    required: true
  - name: admindivision2
    type: string
    description: Filters places by their adminDivision2 `id`. Multiple values can be specified, separated by commas.
    required: true
  - name: accuracyradiuskm
    type: integer
    description: Maximum radius (in kilometers) from the point specified by `latitude` and `longitude` to filter places located
      within the area. Default is 100 km.
    required: true
  - name: latitude
    type: integer
    description: Latitude coordinate to filter places by location. Ignored if `longitude` is not specified.
    required: true
  - name: q
    type: string
    description: Query string to find places with a similar name. Default is 'New York'.
    required: true
    default: New York
  - name: longitude
    type: integer
    description: Longitude coordinate to filter places by location. Ignored if `latitude` is not specified.
    required: true
  tags:
  - search
  - places
  test_prompts:
    single:
    - I'm looking for cities near a specific location (latitude 40.7128, longitude -74.0060). Can you find them?
    single_clear:
    - I'm looking for cities near a specific location (latitude 40.7128, longitude -74.0060). Can you find them?
