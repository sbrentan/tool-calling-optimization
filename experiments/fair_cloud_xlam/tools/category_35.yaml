  descriptions:
    minimal: Fetches a list of hotel reviews based on the...
    short: Fetches a list of hotel reviews based on the provided parameters using the Priceline API.
    medium: Fetches a list of hotel reviews based on the provided parameters using the Priceline API.
    long: Fetches a list of hotel reviews based on the provided parameters using the Priceline API.
