- name: rocp
  descriptions:
    minimal: Calculates the Rate of Change Percentage (ROCP)...
    short: Calculates the Rate of Change Percentage (ROCP) for a given financial instrument over a specified time period.
    medium: Calculates the Rate of Change Percentage (ROCP) for a given financial instrument over a specified time period.
    long: Calculates the Rate of Change Percentage (ROCP) for a given financial instrument over a specified time period.
    verbose: Calculates the Rate of Change Percentage (ROCP) for a given financial instrument over a specified time period.
  parameters:
  - name: interval
    type: string
    description: Interval between two consecutive points in the time series. Supports `1min`, `5min`, `15min`, `30min`, `45min`,
      `1h`, `2h`, `4h`, `1day`, `1week`, `1month`.
    required: true
    default: 1min
  - name: symbol
    type: string
    description: Financial instrument symbol, can be any equity, index, ETF, forex, or cryptocurrency (e.g., `AAPL`, `EUR/USD`,
      `ETH/BTC`).
    required: true
    default: AAPL
  - name: outputsize
    type: integer
    description: Number of data points to be retrieved. Default is `30` if no date parameters are set.
    required: false
    default: 30
  - name: time_period
    type: integer
    description: Number of intervals used to calculate the ROCP. Default is `9`.
    required: false
    default: 9
  - name: format
    type: string
    description: Format of the output data. Can be `csv` or `json`. Default is `json`.
    required: false
    default: json
  - name: series_type
    type: string
    description: The type of price series to use. Supports `open`, `high`, `low`, or `close`. Default is `close`.
    required: false
    default: close
  tags:
  - rocp
  test_prompts:
    single:
    - Calculate the ROCP for Apple Inc. stock over the last 9 days using daily intervals and the closing prices.
    single_clear:
    - Calculate the ROCP for Apple Inc. stock over the last 9 days using daily intervals and the closing prices.
