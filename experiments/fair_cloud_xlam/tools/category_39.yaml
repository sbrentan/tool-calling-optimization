- name: autocomplete_places
  descriptions:
    minimal: Returns a list of places that match a given...
    short: Returns a list of places that match a given prefix and specified filter properties, useful for creating "search
      as you type" inputs.
    medium: Returns a list of places that match a given prefix and specified filter properties, useful for creating "search
      as you type" inputs.
    long: Returns a list of places that match a given prefix and specified filter properties, useful for creating "search
      as you type" inputs.
    verbose: Returns a list of places that match a given prefix and specified filter properties, useful for creating "search
      as you type" inputs.
  parameters:
  - name: limit
    type: integer
    description: Maximum number of places to return. Used with `skip` to paginate results. Defaults to 10, maximum is 100.
    required: false
    default: '10'
  - name: skip
    type: integer
    description: Number of places to ignore before beginning to return results. Used with `limit` to paginate results. Defaults
      to 0.
    required: false
    default: '0'
  - name: language
    type: string
    description: Specifies a language (ISO 639-1) for the localized name of the place. If unavailable, `localizedName` property
      will be null.
    required: false
  - name: country
    type: string
    description: Filters places by their country ID. Multiple values can be specified, separated by commas (e.g., 'US,CA,MX').
      Defaults to 'US,CA'.
    required: false
    default: US,CA
  - name: admindivision1
    type: string
    description: Filters places by their adminDivision1 ID. Multiple values can be specified, separated by commas (e.g., 'US.CA,US.DE').
    required: false
  - name: accuracyradiuskm
    type: integer
    description: Maximum radius in kilometers from the specified coordinates (`latitude` and `longitude`) to filter places.
      Defaults to 100km.
    required: false
  - name: latitude
    type: integer
    description: Latitude to filter places by their location. Ignored if `longitude` is not specified.
    required: false
  - name: admindivision2
    type: string
    description: Filters places by their adminDivision2 ID. Multiple values can be specified, separated by commas.
    required: false
  - name: q
    type: string
    description: Query string to find places whose names start with this prefix. Defaults to 'Sea'.
    required: false
    default: Sea
  - name: longitude
    type: integer
    description: Longitude to filter places by their location. Ignored if `latitude` is not specified.
    required: false
  - name: type
    type: string
    description: Filters places by their type. Multiple values can be specified, separated by commas. Valid types are 'CITY',
      'ADMIN_DIVISION_1', 'ADMIN_DIVISION_2', and 'COUNTRY'. Defaults to 'CITY'.
    required: false
    default: CITY
  tags:
  - autocomplete
  - places
  test_prompts:
