# ============================================================
# PHASE 3: RAG - 100 Tools (top_k=10, Default)
# ============================================================
# Purpose: Test RAG with default retrieval set
# Hypothesis: k=10 is reasonable starting point
# Rubric: Experiments - baseline for parameter comparison
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_100tools_k10
description: "RAG with 100 tools and top_k=10"

# --- Tool Configuration ---
tools_dir: experiments/fair_cloud_xlam/tools
num_tools: 100
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/fair_cloud_xlam/results
