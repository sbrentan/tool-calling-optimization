# ============================================================
# PHASE 4: Adaptive RAG - 500 Tools (Default Settings)
# ============================================================
# Purpose: Test adaptive K at larger scale
# Hypothesis: Should scale well with more tools
# Rubric: Experiments - scaling behavior validation
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase4_adaptive_500tools_default
description: "Adaptive RAG with 500 tools, default parameters"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/fair_cloud_xlam/results
