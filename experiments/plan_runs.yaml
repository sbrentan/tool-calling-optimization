# Example Plan Configuration for Multi-Run Experiments
#
# This file defines multiple runs for the experiment plan.
# Each run uses different seeds/models to enable statistical analysis.
#
# Usage:
#   python scripts/run_plan.py --plan-config experiments/plan_runs.yaml
#
# The runs below will execute each experiment config 3 times:
# - Once with seed 42 using llama-3.3-70b
# - Once with seed 123 using llama-3.3-70b  
# - Once with seed 456 using llama-3.3-70b
#
# Results will be aggregated in analyze_results.py to compute
# mean accuracy and standard deviation across runs.

runs:
  - name: run_1
    model: llama-3.3-70b
    seed: 42
    num_samples: 10
    
  - name: run_2
    model: llama-3.3-70b
    seed: 123
    num_samples: 10
    
  - name: run_3
    model: llama-3.3-70b
    seed: 456
    num_samples: 10

# Optional: Default values applied to any run that doesn't specify them
defaults:
  num_samples: 10
