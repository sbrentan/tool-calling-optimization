# ============================================================
# Doc Length Impact: Adaptive RAG with Minimal Docs
# ============================================================
# Purpose: Measure impact of documentation length on adaptive RAG
# Paired with: adaptive_200tools_default, adaptive_200tools_verbose
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: doclength_adaptive_200tools_minimal
description: "Adaptive RAG at 200 tools with minimal documentation"

# --- Tool Configuration ---
num_tools: 200
doc_length: minimal
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan_2
