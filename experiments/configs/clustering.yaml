# Clustering Methodology Experiment
# Tests the two-step cluster to tool selection approach

name: clustering_baseline
description: "Baseline test for clustering methodology - LLM first selects category, then tool"

# Tool configuration
num_tools: 20
doc_length: medium
prompt_type: clear  # concise or clear
num_similar_tools: 0
categories: null  # Use all categories

# Model configuration
model: llama-3.3-70b
provider: cerebras
temperature: 0.0

# Test configuration
num_test_samples: 5  # Test all generated tools
seed: 42

# Output configuration
output_dir: experiments/results
save_raw_responses: false

# Methodology configuration
methodology: clustering
max_steps: 4  # Maximum steps before forcing termination
allow_backtrack: true  # Allow LLM to go back and select different category
allow_no_tool_call: false  # Don't allow declining tool calls for this test
