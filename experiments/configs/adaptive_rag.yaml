# Adaptive RAG Methodology Experiment
# Dynamic top-k selection based on similarity score distribution

name: adaptive_rag_baseline
description: "Adaptive RAG methodology - dynamically determines k using elbow detection on similarity scores"

# Tool configuration
num_tools: 985
doc_length: verbose
prompt_type: concise  # concise or clear
num_similar_tools: 0
categories: null  # Use all categories

# Model configuration
model: llama-3.3-70b
provider: cerebras
temperature: 0.0

# Test configuration
num_test_samples: 10
seed: 30

# Output configuration
output_dir: experiments/results
save_raw_responses: false

# Methodology configuration
methodology: adaptive_rag
allow_no_tool_call: false

# Adaptive RAG-specific configuration
adaptive_rag_config:
  # Embedding model from sentence-transformers
  embedding_model: all-MiniLM-L6-v2
  
  # Minimum number of tools to retrieve (floor)
  min_k: 3
  
  # Maximum number of tools to retrieve (ceiling)
  max_k: 20
  
  # Threshold for detecting significant drop in similarity scores
  # Used for elbow detection - lower = more sensitive
  similarity_drop_threshold: 0.1
  
  # Minimum similarity score for a tool to be considered
  # Tools below this threshold won't be included
  min_similarity: 0.3
  
  # Cache embeddings for speed
  cache_embeddings: true
  
  # Include parameter descriptions in tool embedding text
  include_params_in_embedding: false
