# Breaking Point Test Configuration
# Tests with many tools to find where accuracy drops

name: breaking_point
description: "Test with increasing number of tools to find breaking point"

# Tool configuration
num_tools: 20
doc_length: medium
prompt_type: concise  # concise or clear
num_similar_tools: 0
categories: null

# Model configuration  
model: llama-3.3-70b
provider: cerebras
temperature: 0.0

# Test configuration
num_test_samples: 5
seed: 42

# Output configuration
output_dir: experiments/results
save_raw_responses: false

# Methodology
methodology: mcp
