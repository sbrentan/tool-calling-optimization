# Full Methodology Comparison Experiment
# 
# This configuration runs ALL methodologies on the same test set
# for fair comparison. Use with: python scripts/run_experiment.py run --config experiments/configs/full_comparison.yaml
#
# After running all experiments, analyze with:
#   python scripts/analyze_results.py compare --results-dir experiments/results
#   python scripts/analyze_results.py report --results-dir experiments/results

# ============================================================================
# Shared Settings (apply to all methodology runs)
# ============================================================================

# Base configuration - override per methodology
base: &base_config
  num_tools: 50
  doc_length: medium
  prompt_type: clear
  num_similar_tools: 0
  categories: null
  model: llama-3.3-70b
  provider: cerebras
  temperature: 0.0
  num_test_samples: 50  # Enough samples for statistical significance
  seed: 42
  include_multi_tool: true
  include_no_tool: true
  output_dir: experiments/results
  save_raw_responses: false
  max_steps: 10
  allow_backtrack: true
  allow_no_tool_call: true

# ============================================================================
# Individual Methodology Experiments
# ============================================================================
# Run each of these separately for comparison

experiments:
  # 1. MCP Baseline (Simple - all tools in context)
  - name: comparison_mcp_50tools
    description: "MCP baseline - all 50 tools in context"
    <<: *base_config
    methodology: mcp

  # 2. Clustering (Two-step hierarchical)
  - name: comparison_clustering_50tools
    description: "Clustering - category then tool selection"
    <<: *base_config
    methodology: clustering

  # 3. RAG (Retrieval-based, fixed K=10)
  - name: comparison_rag_50tools
    description: "RAG with top-10 retrieval"
    <<: *base_config
    methodology: rag
    rag_config:
      embedding_model: all-MiniLM-L6-v2
      top_k: 10
      similarity_threshold: 0.0
      cache_embeddings: true
      include_params_in_embedding: false

  # 4. Hybrid (RAG + Clustering)
  - name: comparison_hybrid_50tools
    description: "Hybrid - semantic category retrieval + tool selection"
    <<: *base_config
    methodology: hybrid
    hybrid_config:
      embedding_model: all-MiniLM-L6-v2
      top_k_categories: 3
      cache_embeddings: true

  # 5. Adaptive RAG (Dynamic K)
  - name: comparison_adaptive_rag_50tools
    description: "Adaptive RAG - dynamic K based on similarity distribution"
    <<: *base_config
    methodology: adaptive_rag
    adaptive_rag_config:
      embedding_model: all-MiniLM-L6-v2
      min_k: 3
      max_k: 20
      similarity_drop_threshold: 0.1
      min_similarity: 0.3
      cache_embeddings: true
      include_params_in_embedding: false

  # 6. Confidence-based Fallback
  - name: comparison_confidence_50tools
    description: "Confidence - fallback chain RAG->Clustering->MCP"
    <<: *base_config
    methodology: confidence
    confidence_config:
      rag_threshold: 0.8
      cluster_threshold: 0.7
      rag_config:
        embedding_model: all-MiniLM-L6-v2
        top_k: 10
        cache_embeddings: true
      hybrid_config:
        embedding_model: all-MiniLM-L6-v2
        top_k_categories: 3
        cache_embeddings: true

# ============================================================================
# How to Run Full Comparison
# ============================================================================
#
# Option 1: Run each experiment separately (recommended for API limits)
#
#   for method in mcp clustering rag hybrid adaptive_rag confidence; do
#     python scripts/run_experiment.py run \
#       --methodology $method \
#       --num-tools 50 \
#       --num-test-samples 50 \
#       --include-multi-tool \
#       --include-no-tool \
#       --name "comparison_${method}_50tools"
#   done
#
# Option 2: Use Python script to iterate
#
#   See scripts/run_full_comparison.py for automated execution
#
# After all experiments complete:
#
#   python scripts/analyze_results.py compare --results-dir experiments/results
#   python scripts/analyze_results.py visualize --results-dir experiments/results
#   python scripts/analyze_results.py report --results-dir experiments/results

# ============================================================================
# Scaling Experiments (Optional)
# ============================================================================
# To test how methodologies scale, run with different tool counts:

scaling_experiments:
  tool_counts: [10, 25, 50, 100, 150, 200]
  
  # Run each methodology at each tool count for scaling analysis
  # This generates accuracy vs. tool count curves
