# ============================================================
# PHASE 5: Hybrid - 500 Tools (top_k_categories=3)
# ============================================================
# Purpose: Test hybrid at larger scale
# Hypothesis: Should scale well with more tools per category
# Rubric: Experiments - scaling behavior
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase5_hybrid_500tools_cat3
description: "Hybrid with 500 tools, top_k_categories=3"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: hybrid
hybrid_config:
  embedding_model: all-MiniLM-L6-v2
  top_k_categories: 3
  cache_embeddings: true
  category_embedding_strategy: mean

# --- Output ---
output_dir: experiments/full_cloud/results
