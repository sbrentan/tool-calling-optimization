# ============================================================
# PHASE 3: RAG - 500 Tools (Clear Prompts)
# ============================================================
# Purpose: Test prompt_type impact on RAG retrieval
# Hypothesis: Clear prompts may improve embedding matching
# Rubric: Experiments - prompt_type exploration
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_500tools_k10_clear
description: "RAG with 500 tools, top_k=10, clear prompts"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: clear
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_cloud/results
