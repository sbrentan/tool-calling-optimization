# ============================================================
# PHASE 3: RAG - 200 Tools (top_k=10, threshold=0.2)
# ============================================================
# Purpose: Test higher similarity threshold
# Hypothesis: Higher threshold may exclude correct tool
# Rubric: Experiments - threshold sensitivity analysis
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_200tools_k10_t02
description: "RAG with 200 tools, top_k=10, similarity_threshold=0.2"

# --- Tool Configuration ---
num_tools: 200
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.2
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_cloud/results
