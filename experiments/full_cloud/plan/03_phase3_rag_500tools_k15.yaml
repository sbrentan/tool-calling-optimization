# ============================================================
# PHASE 3: RAG - 500 Tools (top_k=15)
# ============================================================
# Purpose: Test if more k helps at large scale
# Hypothesis: Larger pool may need more retrieval
# Rubric: Experiments - scale-k interaction
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_500tools_k15
description: "RAG with 500 tools and top_k=15"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 15
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_cloud/results
