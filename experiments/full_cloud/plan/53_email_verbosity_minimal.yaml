# Email category verbosity analysis - minimal description
# Tests how minimal descriptions affect email tool selection accuracy
# (email tools use JSON string parameters which may confuse LLMs)

num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

name: email_verbosity_minimal_200tools

# Tool configuration
num_tools: 200
doc_length: minimal
prompt_type: concise
categories:
  - email_operations  # Ensure email tools are included
num_similar_tools: 0
include_no_tool: false

# Test configuration - limit to email category only
test_categories:
  - email_operations

# Methodology configuration
methodology: rag
rag_config:
  top_k: 10
  similarity_threshold: 0.0

output_dir: experiments/full_cloud/results
