# ============================================================
# Clear Prompt: Adaptive RAG at 100 tools
# ============================================================
# Purpose: Test impact of clear prompts on adaptive RAG accuracy
# Hypothesis: Clear prompts improve accuracy by providing more context
# ============================================================

num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

name: clearprompt_adaptive_100tools
description: "Adaptive RAG with clear prompts at 100 tools for prompt clarity analysis"

num_tools: 100
doc_length: medium
prompt_type: clear
num_similar_tools: 0
categories: null

methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

output_dir: experiments/full_cloud/results
