# ============================================================
# PHASE 3: RAG - 100 Tools (top_k=20, High)
# ============================================================
# Purpose: Test RAG with high retrieval count
# Hypothesis: Diminishing returns at higher k
# Rubric: Experiments - finding optimal k ceiling
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_100tools_k20
description: "RAG with 100 tools and top_k=20"

# --- Tool Configuration ---
num_tools: 100
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 20
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_cloud/results
