# ============================================================
# PHASE 3: RAG - 500 Tools (top_k=10, Large Scale)
# ============================================================
# Purpose: Test RAG at large scale
# Hypothesis: Embedding search scales well
# Rubric: Experiments - scalability validation
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_500tools_k10
description: "RAG with 500 tools and top_k=10"

# --- Tool Configuration ---
num_tools: 500
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 10
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/full_cloud/results
