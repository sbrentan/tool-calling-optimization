# ============================================================
# PHASE 8: Model Comparison - llama-3.3-70b + Adaptive RAG
# ============================================================
# Purpose: Baseline model comparison with adaptive RAG
# Hypothesis: 70B model should perform best
# Rubric: Experiments - model alternatives comparison
# NOTE: This config has HARDCODED model for comparison purposes
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: llama-3.3-70b  # HARDCODED for comparison

# --- Experiment Identification ---
name: phase8_model_llama70b_adaptive
description: "Model comparison: llama-3.3-70b with Adaptive RAG"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
