# ============================================================
# PHASE 8: Model Comparison - gemini-2.0-flash + Adaptive RAG
# ============================================================
# Purpose: Test Gemini model with adaptive RAG
# Hypothesis: Gemini may have different strengths
# Rubric: Experiments - cross-provider comparison
# NOTE: This config has HARDCODED model for comparison purposes
# NOTE: Requires GEMINI_API_KEY environment variable
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: gemini-2.0-flash  # HARDCODED for comparison
provider: gemini

# --- Experiment Identification ---
name: phase8_model_gemini_adaptive
description: "Model comparison: gemini-2.0-flash with Adaptive RAG"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.1
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
