# ============================================================
# PHASE 8: Model Comparison - gemini-2.0-flash + Confidence
# ============================================================
# Purpose: Test Gemini with confidence fallback
# Hypothesis: Different providers may benefit differently
# Rubric: Experiments - cross-provider methodology comparison
# NOTE: This config has HARDCODED model for comparison purposes
# NOTE: Requires GEMINI_API_KEY environment variable
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: gemini-2.0-flash  # HARDCODED for comparison
provider: gemini

# --- Experiment Identification ---
name: phase8_model_gemini_confidence
description: "Model comparison: gemini-2.0-flash with Confidence fallback"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
