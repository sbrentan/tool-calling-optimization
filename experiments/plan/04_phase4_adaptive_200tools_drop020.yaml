# ============================================================
# PHASE 4: Adaptive RAG - 200 Tools (drop_threshold=0.20)
# ============================================================
# Purpose: Test aggressive elbow cutoff
# Hypothesis: May cut too aggressively, missing tools
# Rubric: Experiments - finding threshold ceiling
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase4_adaptive_200tools_drop020
description: "Adaptive RAG with 200 tools, drop_threshold=0.20"

# --- Tool Configuration ---
num_tools: 200
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: adaptive_rag
adaptive_rag_config:
  embedding_model: all-MiniLM-L6-v2
  min_k: 3
  max_k: 20
  similarity_drop_threshold: 0.20
  min_similarity: 0.3
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
