# ============================================================
# PHASE 8: Model Comparison - gpt-4o-mini + Confidence
# ============================================================
# Purpose: Test OpenAI with confidence fallback
# Hypothesis: GPT-4o-mini may have different fallback patterns
# Rubric: Experiments - complete cross-provider comparison
# NOTE: This config has HARDCODED model for comparison purposes
# NOTE: Requires OPENAI_API_KEY environment variable
# ============================================================

# --- Fixed Parameters for Model Comparison ---
num_test_samples: "__env__"
seed: "__env__"
model: gpt-4o-mini  # HARDCODED for comparison
provider: openai

# --- Experiment Identification ---
name: phase8_model_gpt4omini_confidence
description: "Model comparison: gpt-4o-mini with Confidence fallback"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
