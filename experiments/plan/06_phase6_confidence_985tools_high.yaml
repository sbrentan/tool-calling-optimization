# ============================================================
# PHASE 6: Confidence - 985 Tools (High Thresholds)
# ============================================================
# Purpose: Test strict confidence requirements for fallback
# Hypothesis: High thresholds = more fallbacks, higher accuracy
# Rubric: Design - production reliability architecture
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase6_confidence_985tools_high
description: "Confidence fallback with 985 tools, high thresholds (0.9/0.8)"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.9
  clustering_confidence_threshold: 0.8
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
