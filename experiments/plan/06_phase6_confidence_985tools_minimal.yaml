# ============================================================
# PHASE 6: Confidence - 985 Tools (Minimal Docs)
# ============================================================
# Purpose: Test doc_length impact on confidence fallback
# Hypothesis: May affect both RAG and clustering components
# Rubric: Experiments - doc_length exploration
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase6_confidence_985tools_minimal
description: "Confidence fallback with 985 tools, minimal documentation"

# --- Tool Configuration ---
num_tools: 985
doc_length: minimal
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: confidence
confidence_config:
  rag_confidence_threshold: 0.8
  clustering_confidence_threshold: 0.7
  rag_config:
    top_k: 10
    similarity_threshold: 0.0
    cache_embeddings: true
  clustering_config:
    allow_backtrack: true
    max_steps: 10

# --- Output ---
output_dir: experiments/results/plan
