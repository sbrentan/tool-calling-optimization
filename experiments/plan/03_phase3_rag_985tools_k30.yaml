# ============================================================
# PHASE 3: RAG - 985 Tools (top_k=30, Very High)
# ============================================================
# Purpose: Test very high retrieval count
# Hypothesis: Diminishing returns expected
# Rubric: Experiments - finding upper bound
# ============================================================

# --- Environment-Configurable Parameters ---
num_test_samples: "__env__"
model: "__env__"
seed: "__env__"

# --- Experiment Identification ---
name: phase3_rag_985tools_k30
description: "RAG with all 985 tools and top_k=30"

# --- Tool Configuration ---
num_tools: 985
doc_length: medium
prompt_type: concise
num_similar_tools: 0
categories: null

# --- Methodology ---
methodology: rag
rag_config:
  embedding_model: all-MiniLM-L6-v2
  top_k: 30
  similarity_threshold: 0.0
  cache_embeddings: true
  include_params_in_embedding: false

# --- Output ---
output_dir: experiments/results/plan
