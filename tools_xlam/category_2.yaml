- name: getlistings
  descriptions:
    minimal: Retrieve a list of condominiums and townhouses in...
    short: Retrieve a list of condominiums and townhouses in specified cities of Southwest Florida and the East Coast.
    medium: Retrieve a list of condominiums and townhouses in specified cities of Southwest Florida and the East Coast.
    long: Retrieve a list of condominiums and townhouses in specified cities of Southwest Florida and the East Coast.
    verbose: Retrieve a list of condominiums and townhouses in specified cities of Southwest Florida and the East Coast.
  parameters:
  - name: sort
    type: string
    description: Defines how the listings should be sorted. Supported values are 'RELEVANCE' (best match), 'NEWEST' (newest
      first), 'PRICE_LOW' (cheapest first), and 'PRICE_HIGH' (most expensive first). Default is 'RELEVANCE'.
    required: true
    default: RELEVANCE
  - name: offset
    type: integer
    description: For pagination. Specifies the starting point in the collection of listings. For example, to get the first
      set of items, set offset to 0. Default is 0.
    required: true
    default: '0'
  - name: price_max
    type: integer
    description: The maximum price in US dollars for the condos and townhouses. Default is 250,000.
    required: true
    default: '250000'
  - name: city
    type: string
    description: The name of the city to search within. Supported cities include Cape Coral, Fort Myers, West Palm Beach,
      Lake Worth, Lantana, Boynton Beach, Delray Beach, Boca Raton, Pompano Beach, Fort Lauderdale, Naples, Tampa, and Saint
      Petersburg. Default is 'Cape Coral'.
    required: true
    default: Cape Coral
  - name: limit
    type: integer
    description: The maximum number of items to return. Default is 50.
    required: true
    default: '50'
  tags:
  - getlistings
  test_prompts:
    single:
    - Retrieve the cheapest 15 townhouses in Delray Beach starting from the 5th listing.
    - What are the cheapest condos available in Naples, sorted by price, with a maximum price of $200,000?
    - How can I get the newest listings of condos in Fort Myers, starting from the 51st result, with a maximum price of $300,000?
    single_clear:
    - Retrieve the cheapest 15 townhouses in Delray Beach starting from the 5th listing.
