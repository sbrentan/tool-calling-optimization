- name: mama
  descriptions:
    minimal: Fetches the MESA Adaptive Moving Average (MAMA)...
    short: Fetches the MESA Adaptive Moving Average (MAMA) for a given instrument symbol and time interval from the Twelve
      Data API.
    medium: Fetches the MESA Adaptive Moving Average (MAMA) for a given instrument symbol and time interval from the Twelve
      Data API.
    long: Fetches the MESA Adaptive Moving Average (MAMA) for a given instrument symbol and time interval from the Twelve
      Data API.
    verbose: Fetches the MESA Adaptive Moving Average (MAMA) for a given instrument symbol and time interval from the Twelve
      Data API.
  parameters:
  - name: interval
    type: string
    description: 'Interval between two consecutive points in the time series. Supports: `1min`, `5min`, `15min`, `30min`,
      `45min`, `1h`, `2h`, `4h`, `1day`, `1week`, `1month`.'
    required: true
    default: 1min
  - name: symbol
    type: string
    description: Instrument symbol, can be any equity, index, ETF, forex, or cryptocurrency (e.g., `AAPL`, `EUR/USD`, `ETH/BTC`).
    required: true
    default: AAPL
  - name: format
    type: string
    description: Response format. Supports `csv` or `json`. Default is `json`.
    required: false
    default: json
  - name: slow_limit
    type: integer
    description: Slow limit parameter for MAMA calculation.
    required: false
    default: 0.05
  - name: series_type
    type: string
    description: 'Type of series data. Supports: `open`, `high`, `low`, `close`. Default is `close`.'
    required: false
    default: close
  - name: fast_limit
    type: integer
    description: Fast limit parameter for MAMA calculation.
    required: false
    default: 0.5
  - name: outputsize
    type: integer
    description: Number of data points to return. Default is `30` if no date parameters are set, otherwise set to maximum.
    required: false
    default: 30
  tags:
  - mama
  test_prompts:
    single:
    - Can you provide the MAMA data for the S&P 500 index (SPX) for the last 6 months with a 1-day interval?
    - Retrieve the MESA Adaptive Moving Average for AAPL stock over a 15-minute interval, using the close price series.
    single_clear:
    - Can you provide the MAMA data for the S&P 500 index (SPX) for the last 6 months with a 1-day interval?
    - Retrieve the MESA Adaptive Moving Average for AAPL stock over a 15-minute interval, using the close price series.
